# flint-s3-csi — an S3 prefix, or a lean workspace, as a CSI ephemeral
# inline volume. One privileged node DaemonSet, one unprivileged worker
# pod per mounted volume, one broker. This replaces the flint-passthrough
# and flint-lean sidecar-injection webhooks.
#
#   helm install flint-s3-csi ./flint-s3-csi-chart \
#     -n flint-system --create-namespace \
#     --set broker.static.secretRef=<Secret with AWS_* keys>
#
# Then a pod mounts a FlintPassthroughMount from ITS OWN namespace with
#
#   volumes:
#     - name: data
#       csi:
#         driver: s3.csi.chert.us
#         volumeAttributes: { chert.us/mount: datasets }
#
# and needs no label, no sidecar, no credential and no privilege — it is
# admissible under PodSecurity `restricted`.
#
# For a dataset MANY pods read, one mounter per node instead of one per
# pod — the CR opts its read-only consumers in. The block cache comes
# with it only where workers.cacheHostPath places it on a fast device;
# otherwise name spec.cache for a working set that fits in it (see
# workers.scratchSize below for why):
#
#   apiVersion: chert.us/v1alpha1
#   kind: FlintPassthroughMount
#   metadata: { name: datasets, namespace: team-a }
#   spec:
#     bucket: my-bucket
#     keyPrefix: datasets/imagenet
#     readOnly: true                      # or list the SAs in consumers.readOnlyServiceAccounts
#     sharing: { readOnly: true }
#     consumers: { serviceAccounts: [trainer] }
#
# Pods on one node that mount it read-only with the same uid/gid share
# the worker (`kubectl -n flint-workers get pods -o
# custom-columns=NAME:.metadata.name,CLASS:.metadata.annotations.chert\.us/shared-mount`).
# Needs identity.mode broker on an sts or static backend, or ambient.
# Helm applies crds/ on install only: after an upgrade that added the
# field, `kubectl apply -f flint-passthrough-chart/crds/flintpassthroughmounts.yaml`.
#
# Design of record: docs/plans/csi-node-mount-design.md (§3.1 components,
# §3.6 privilege accounting, §4 the identity chain, §10.1 coexistence
# with the webhooks).
#
# ─────────────────────────────────────────────────────────────────────
# READ THIS BEFORE INSTALLING: WHERE THE PRIVILEGE WENT
#
# The webhooks put a privileged (passthrough) or credential-holding
# (lean) container into every tenant pod. This chart moves that to
# exactly three places, none of them a tenant namespace:
#
#   · flint-s3-csi-node — one pod per node, `privileged: true`. It
#     performs the mount(2) itself and needs /dev/fuse and a
#     Bidirectional mount of /var/lib/kubelet; the API server allows
#     that mode on privileged containers only. It holds NO S3
#     credential and has NO Secrets RBAC anywhere. It may create and
#     delete pods in ONE namespace (workers.namespace) and, with the
#     admission policy below, only on its own node.
#
#   · worker pods — one per mounted volume, in workers.namespace.
#     Non-root, every capability dropped, seccomp RuntimeDefault,
#     read-only rootfs, no ServiceAccount token, no hostPath
#     (passthrough) or exactly one (the lean tree). A passthrough worker
#     receives the already-mounted FUSE fd over a socket and runs an
#     unchanged mount-s3 on it; the mounter needs no privilege because
#     the mount(2) already happened. The namespace carries the
#     PodSecurity `privileged` label ONLY because hostPath is
#     baseline-forbidden; the ValidatingAdmissionPolicy is the real
#     guard (workers.admissionPolicy).
#
#   · flint-s3-broker — a `restricted` Deployment and the only component
#     with a standing credential. It verifies every pod-bound
#     ServiceAccount token with TokenReview, checks the CR's `consumers`
#     list, and hands back a short-lived credential for that one pod.
#
# The tenant pod gets nothing. Two things do NOT change from the
# webhook world: a mounter crash is still ENOTCONN for containers that
# already opened the mount (recreate the pod), and the mount presents as
# ONE uid, because NodePublish never sees the pod's securityContext and
# so has nothing to default from. The order is the VOLUME ATTRIBUTE
# FIRST: chert.us/uid if set, else the CR's spec.uid, else 65534 (gid
# the same, defaulting to whatever uid resolved to). A lean workspace
# has no default at all — it refuses to publish without a uid, and
# refuses uid 0.
# ─────────────────────────────────────────────────────────────────────

# ── The node plugin ──────────────────────────────────────────────────

# global.imageRegistry, when set, is prepended to every image below (overriding
# each image's own `registry`). Consumers that mirror images to a private
# registry (e.g. awc-core) set this once instead of editing `repository` — no
# registry host is hardcoded in this chart.
global:
  imageRegistry: ""

node:
  # The plugin image, {registry}/{repository}:{tag|appVersion}. Carries BOTH
  # binaries: /usr/local/bin/flint-s3-csi-node (this DaemonSet) and
  # /usr/local/bin/flint-s3-broker (the broker Deployment below). Built
  # from spdk-csi-driver/docker/Dockerfile.s3csi.prebuilt.
  image:
    registry: ""
    repository: dilipdalton/flint-s3-csi
    tag: ""
    pullPolicy: IfNotPresent

  # RUST_LOG for the plugin. `volume_context` is never logged wholesale
  # at any level — it carries the pod-bound token.
  logLevel: info

  # Lifetime the plugin asks of the broker per exchange, in seconds
  # (FLINT_S3CSI_CREDS_LIFETIME_SECS). Capped server-side by
  # broker.maxLifetimeSecs. Republish rewrites the credential every
  # ~60-90 s, so 900 leaves ~10 refresh opportunities before expiry.
  credsLifetimeSecs: 900

  # AWS_REGION handed to the mounter when the CR names none
  # (FLINT_S3CSI_REGION).
  region: us-east-1

  # The identity.mode values a CR may select on this cluster
  # (FLINT_S3CSI_IDENTITY_MODES; space- or comma-separated). The default
  # leaves `ambient` out: it is the worker's OWN chain — on EC2 the node's
  # instance role, read-write to whatever that role reaches — and a CR
  # author naming it would be choosing the node's identity for a tenant
  # pod (s3csi/SECURITY.md §4.15). Add it for a cluster whose workers'
  # ambient identity is meant for every tenant. A CR naming a mode off
  # this list fails its publish with a message naming this knob, before
  # any worker is made.
  identityModes: "broker webIdentity static stsSecret"

  # The hosts a CR's spec.endpoint may name (FLINT_S3CSI_ENDPOINT_ALLOW;
  # space- or comma-separated; a host, or `*.suffix`). Empty ⇒ any: the
  # endpoint is the CR author's own choice and the credential a worker
  # carries is already bounded to its CR. Set it to confine worker egress
  # to known stores, e.g. "*.amazonaws.com minio.flint-system.svc".
  endpointAllow: ""

  # Above every tenant workload: a kubelet DiskPressure eviction of this
  # pod would strand every mounted pod on the node with nobody to
  # unpublish it (§6.2). Same class the block CSI node uses.
  priorityClassName: system-node-critical

  # RollingUpdate is safe here, unlike the block CSI node: the mounts
  # are held by the worker pods and the kernel, not by this process,
  # and a restarted plugin adopts its on-disk state at startup. One
  # node at a time keeps a bad image from taking publishes down
  # cluster-wide before the first pod fails its probe.
  updateStrategy:
    maxUnavailable: 1

  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

  # Every node that can run a tenant pod needs the plugin, taints
  # included — the tenant already scheduled there.
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - operator: Exists
  affinity: {}

# The sig-storage sidecars. Pinned; a moving sidecar next to a
# privileged container is a change nobody chose.
csiSidecars:
  registry: registry.k8s.io
  repository: sig-storage
  nodeDriverRegistrar:
    name: csi-node-driver-registrar
    tag: v2.18.0
  livenessprobe:
    name: livenessprobe
    tag: v2.20.0

# ── The CSIDriver object ─────────────────────────────────────────────

driver:
  # Kubernetes >= 1.35 only: kubelet delivers the pod-bound token in
  # NodePublishVolumeRequest.secrets instead of volume_context, so a
  # driver that logs volume_context cannot leak it. Off by default
  # because an older API server silently DROPS the unknown field, which
  # would look like a no-op rather than an error.
  serviceAccountTokenInSecrets: false

# ── Worker pods ──────────────────────────────────────────────────────

workers:
  # The system namespace every worker lives in. Changing it after
  # install strands the workers already running: the plugin adopts by
  # (namespace, volume) at startup and would create duplicates.
  namespace: flint-workers

  # Create the namespace with its PodSecurity labels. Set false if you
  # manage namespaces elsewhere — then label it yourself:
  #   pod-security.kubernetes.io/enforce: privileged
  # (hostPath, which the lean tree needs, is forbidden under baseline).
  createNamespace: true

  # The image EVERY passthrough worker runs — chart-pinned, never from
  # a CR or a pod (FLINT_S3CSI_PASSTHROUGH_IMAGE). FROM the
  # flint-passthrough-mounter image, so the mount-s3 pin is that
  # image's; built from spdk-csi-driver/docker/Dockerfile.s3worker.
  passthroughImage:
    registry: ""
    repository: dilipdalton/flint-s3-worker
    tag: ""

  # The lean worker image (FLINT_S3CSI_LEAN_IMAGE): FROM flint-sync,
  # plus the worker as PID 1 to forward SIGTERM and serve the loopback
  # credential door. Built from Dockerfile.s3worker-lean. The lean arm
  # is design milestone M5; the plugin in this release refuses lean
  # volumes with a message that says so.
  leanImage:
    registry: ""
    repository: dilipdalton/flint-s3-worker-lean
    tag: ""

  # Resources for EVERY worker (FLINT_S3CSI_WORKER_RESOURCES). No
  # per-mount override: the CR is tenant-writable. `{}` ⇒ no requests or
  # limits.
  #
  # THE MEMORY LIMIT IS THE KNOB THAT MATTERS, and the mounter is told
  # about it: the plugin passes mount-s3 `--memory-target` at two thirds
  # of limits.memory (682 MiB at 1Gi). Left alone, Mountpoint 1.24 sizes
  # its read and write buffers to 95% of the cgroup limit and calls that
  # target "not a guaranteed limit" — at 1Gi that leaves ~50 MiB for its
  # heap, cache index and TLS buffers, and an OOM-killed mounter takes
  # the MOUNT with it (ENOTCONN in the tenant pod, which must then be
  # recreated). The binary refuses a target below 512 MiB, so the chart
  # refuses a limit below 512Mi at render time. A CR that names its own
  # `--memory-target` in mountOptions keeps it. Raise the limit before
  # blaming the bucket.
  #
  # REQUESTS ARE FOR ADMISSION, AND ADMISSION CAN FAIL. The plugin
  # creates a worker with spec.nodeName set, so the scheduler never
  # reserved room for it; kubelet admits it against the node's
  # allocatable, and on a node with no room the worker is refused
  # (OutOfmemory, OutOfcpu, OutOfpods) while the tenant pod — already
  # bound there — is never rescheduled. The plugin raises a
  # WorkerNotAdmitted event on the tenant and kubelet keeps retrying the
  # mount until capacity frees. Requests are therefore small: mount-s3
  # idles well under 64Mi, and the limit is what bounds it. ONE WORKER PER
  # MOUNTED POD also counts against the node's maxPods (110 by default):
  # a node full of S3-mounted pods holds half as many tenants as its
  # maxPods says; raise it on the kubelet, or share read-only mounters
  # (spec.sharing.readOnly, one worker per node per dataset).
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 1Gi }

  # Resources for a SHARED read-only mounter
  # (FLINT_S3CSI_SHARED_WORKER_RESOURCES): one worker serves every
  # read-only member of a class on the node, so one memory limit, one
  # `--memory-target` and one prefetch budget serve them all. Empty ⇒
  # the same as `resources`. A class of many concurrent readers wants
  # more than one pod's worth, e.g.
  #   sharedResources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 4Gi } }
  sharedResources: {}

  # Pull the worker images on every node when the plugin starts, so the
  # first mount on a fresh node does not pay for the pull inside
  # NodePublishVolume (45 s per attempt, then kubelet's backoff toward
  # two minutes). Init containers on the node DaemonSet; a missing image
  # blocks the plugin on that node, which is why the lean image is opt-in
  # on a cluster that runs no lean workspaces.
  prepull:
    passthrough: true
    lean: false

  # The worker's PriorityClass (FLINT_S3CSI_WORKER_PRIORITY_CLASS).
  # This is the ORDERING mechanism for node shutdown and spot
  # reclamation: kubelet terminates by priority, lowest first, so a
  # worker ranked above its tenant is torn down after the tenant has
  # stopped writing — and the lean syncer's final publish carries
  # everything the app produced. There is deliberately no
  # PodDisruptionBudget for workers; see templates/workers-policy.yaml
  # for why that covered the wrong path.
  #
  # THAT ORDERING IS KUBELET'S GRACEFUL NODE SHUTDOWN, AND IT IS OFF BY
  # DEFAULT. `shutdownGracePeriod` is 0s on a stock kubeadm node (checked
  # on Amazon Linux 2023, 2026-09-04), and with it at zero kubelet does
  # not terminate pods on shutdown at all — systemd does, by signalling
  # every remaining process at once. A lean workspace still drains
  # then, because the syncer drains on SIGTERM whoever sends it (that
  # much is measured: a reboot published the unpublished write 5 s
  # later, marked boundary_source=drain). What is lost is the ORDER and
  # the BUDGET: the tenant may still be writing while its syncer
  # drains, and the drain has systemd's kill window rather than the
  # terminationGracePeriodSeconds this chart sets. On a big workspace
  # that window is the difference between a complete final publish and
  # a truncated one. Set both of these on your kubelet if node shutdown
  # is a path you care about:
  #
  #   shutdownGracePeriod: 120s
  #   shutdownGracePeriodByPodPriority:      # ordering, by this class
  #     - priority: 0
  #       shutdownGracePeriodSeconds: 60
  #     - priority: 1000000
  #       shutdownGracePeriodSeconds: 60
  #
  # None of this reaches a machine that simply stops. A power cut, a
  # kernel panic or an instance failure runs no drain at all, and
  # everything written since the last publish is gone; `floorSecs` on
  # the workspace is what bounds that window. A cloud instance
  # TERMINATION is not that case — it is a graceful shutdown, and it
  # does drain.
  #
  # Set create: false and point priorityClassName at your own class if
  # your tenants already rank above 0 — the only requirement is that a
  # worker outranks the pods it serves. Empty ⇒ no class, priority 0,
  # and the shutdown order between a worker and its tenant is a coin
  # flip.
  priorityClassName: flint-s3-worker

  # How long a worker's preStop hook holds it open waiting for its volume
  # to be released (FLINT_S3CSI_PRESTOP_SECS). This is the ordering
  # mechanism for `kubectl drain` and for eviction: kubelet runs the hook
  # before the SIGTERM, so a worker evicted out from under a live tenant
  # keeps serving until NodeUnpublish releases it. On the ordinary path
  # the marker is already there and the hook costs one stat.
  #
  # It is ADDED to the worker's terminationGracePeriodSeconds, not carved
  # out of it, so a lean syncer's final publish keeps its full budget.
  # It never blocks a shutdown: the hook exits 0 when the budget runs out.
  prestopSecs: 60

  # How long NodeUnpublish waits for a passthrough mounter to EXIT ON ITS
  # OWN after its source mount is detached, before it disarms the preStop
  # hook and deletes the pod (FLINT_S3CSI_QUIESCE_SECS). Detaching the
  # source aborts the FUSE connection; mount-s3 then finishes any RELEASE
  # it is still serving — a file whose last close came from a process
  # other than the one that opened it (a parent that opened the output
  # and a child that wrote it) has its upload completed THERE, after the
  # container is gone — and exits by itself. A SIGTERM makes it exit at
  # once instead, mid-upload, leaving an incomplete multipart upload in
  # the bucket and no object (F72). The wait is bounded and logged; at
  # the ceiling the old order applies. 0 disables the wait.
  quiesceSecs: 30

  # Enforce a lean workspace's `sizeLimitGib` (FLINT_S3CSI_QUOTA).
  # OFF by default: the tree is a plain directory on the NODE's root
  # filesystem, at native speed, and `sizeLimitGib` is enforced by
  # nothing. A runaway agent can fill the disk the kubelet runs on, and
  # kubelet's ephemeral-storage accounting does not count the tree (it is
  # a hostPath in the worker, not an emptyDir).
  #
  # true ⇒ the tree is a sparse ext4 image loop-mounted at that path, and
  # an overrun is ENOSPC in the tenant's own write. It costs speed
  # (docs/plans/flint-lean-loop-image-perf-2026-09-15.md, i4i.large, n=5):
  # buffered sequential writes 0.57x a plain directory on local NVMe
  # (0.90x on an EBS root), small files 0.84x, and 4 KiB writes with an
  # fsync each 0.58-0.60x on both, which is how git and databases write.
  # Reads are unaffected. The image is sparse, so the ceilings on a node
  # may sum to more than its disk; it bounds one tenant's blast radius
  # and is not a reservation. Needs mkfs.ext4 and loop devices on the
  # node; with it on, a workspace whose ceiling cannot be built is REFUSED
  # rather than published unbounded.
  quota: false
  priorityClass:
    create: true
    name: flint-s3-worker
    # Far below system-cluster-critical (2000000000) so the plugin, CNI
    # and kube-proxy all outrank it; far above the 0 a tenant carries.
    value: 100000

  # Size limits for the two emptyDirs every worker carries: `comm`
  # (memory-backed; the launch socket, the token and the credential
  # file) and `scratch` (mount-s3's block cache, at /tmp, when the CR's
  # spec.cache asks for one). Empty ⇒ the binary's defaults, 16Mi and
  # 1Gi (FLINT_S3CSI_COMM_SIZE, FLINT_S3CSI_SCRATCH_SIZE). No CR gets a
  # cache it did not ask for, a sharing CR included (2026-09-30): the
  # emptyDir is on the node's root disk, and a working set larger than
  # the cache pays every fetched block to that disk and warms nothing —
  # 6 GiB through a 768Mi cache read 5× slower than S3 on a gp3 root,
  # cold and warm alike. Ask for a cache (spec.cache.maxSizeMib, under
  # scratchSize) for a set that fits; a bigger scratchSize on the same
  # disk buys a bigger cache at the same 125 MiB/s. Put the cache on a
  # faster device with cacheHostPath, below.
  commSize: ""
  scratchSize: ""

  # WHERE THE BLOCK CACHE LIVES (FLINT_S3CSI_CACHE_HOST_PATH). Empty ⇒ the
  # scratch emptyDir, i.e. the node's root disk (above). Set to a directory
  # on a device you have MEASURED against the node's S3 path — the
  # instance store, e.g. /mnt/nvme/flint-s3-cache; `dd … oflag=direct` on
  # the node says what it writes — and every worker that runs with
  # a cache gets a PRIVATE subdirectory of it (<path>/<worker-name>, 0700,
  # the worker's uid) as a hostPath at /tmp in place of the emptyDir: the
  # plugin makes it before the worker and removes it after the mounter's
  # own exit, and one left by a worker that died with its plugin is
  # emptied before the next create (s3w-* directories no record names are
  # removed when the plugin starts; anything else in the directory is
  # left alone). The directory must EXIST on every node: the plugin
  # mounts it as a hostPath of type Directory, so a node without the
  # device FAILS the plugin pod loudly instead of kubelet creating the
  # directory on the root disk and the cache landing exactly where the
  # note above says it must not. Mounting the device is the platform's
  # job (on trove nodes, nvme1n1), not the chart's. The mounter's argv is
  # the same either way (--cache /tmp), so a class key does not depend on
  # where the cache lives. With a placement set, a sharing CR that names
  # no spec.cache gets one of cacheSizeMib; without one, nothing gets a
  # cache it did not ask for. Either way the plugin says where a cache
  # landed: "block cache device" in its log (the cache directory's
  # major:minor beside the kubelet root's), and a CacheOnRootDisk event
  # on the tenant pod when the two are the same disk — always for an
  # emptyDir cache, and for a placement whose root is on the node's own
  # disk (docs/plans/passthrough-read-only-mount-sharing.md §11).
  cacheHostPath: ""
  # The cache a sharing CR that names no spec.cache gets when the cache is
  # placed (FLINT_S3CSI_CACHE_SIZE_MIB), as mount-s3's --max-cache-size in
  # MiB. A hostPath has no sizeLimit, so this is the only bound: size it
  # for the working set (a set larger than the cache warms nothing) and
  # for the device every worker on the node shares. A CR's own
  # spec.cache.maxSizeMib wins. Placing the cache makes a miss CHEAPER,
  # not free: a set larger than the cache still pays every fetched block
  # to the device's write rate. Measured 2026-10-01 on an i4i.large,
  # whose one instance-store slice writes ~270 MiB/s and reads ~360 while
  # the node pulls S3 at ~420: 6 GiB through a 768Mi cache took 23 s
  # there against 49 s on the gp3 root and 13–15 s with no cache — half
  # the penalty, still 1.7× slower than none; the 512Mi set that fit
  # warmed 2× faster on either disk (the page cache). Larger instance
  # sizes carry proportionally faster slices; measure yours. The rule is
  # the same placed or not: a cache for a working set that fits
  # (s3csi/e2e/results/2026-10-01-ec2-step4/).
  cacheSizeMib: 4096

  # A HARD CEILING on the workers one node runs
  # (FLINT_S3CSI_MAX_WORKERS_PER_NODE). 0 = none: kubelet's own admission
  # (maxPods, allocatable) is then the only limit, and a publish it cannot
  # fit is retried as WorkerNotAdmitted. Set, a publish that would CREATE
  # a worker past the ceiling — a per-pod mounter, a shared class's first
  # mounter, a lean syncer — is refused ResourceExhausted with a
  # WorkerCapacity Warning on the tenant pod naming the count and this
  # knob, and kubelet retries it until a worker on the node exits. A pod
  # joining a shared mounter creates no worker and is not counted against
  # it. The AWC fuse-node spec (awc-docs PR #136, N5) asks for 16.
  maxPerNode: 0

  # THE REAL GUARD on workers.namespace (§3.6). A ValidatingAdmissionPolicy
  # that admits a pod there only if the creator is the node
  # ServiceAccount, the pod is pinned to the node whose kubelet minted
  # the caller's token, every image is one of the two above, nothing is
  # privileged / hostNetwork / hostPID, the only hostPath allowed is
  # under the plugin's own volumes dir (or, with cacheHostPath set, a
  # subdirectory of that root), and no ServiceAccount token is
  # mounted; and a DELETE only for a pod on the caller's own node.
  # Without the node rule, one compromised node could delete every
  # worker in the cluster and strand every S3-mounted pod on ENOTCONN.
  #
  # Needs ValidatingAdmissionPolicy (GA in Kubernetes 1.30) and the
  # pod-bound token metadata it keys on
  # (authentication.kubernetes.io/node-name: beta 1.30, stable 1.32).
  # On an older cluster the policy fails CLOSED — no worker can be
  # created — so disable it there and accept the wider blast radius
  # knowingly.
  admissionPolicy:
    enabled: true
    # Principals other than the node ServiceAccount that may DELETE a
    # worker. Workers carry a Node ownerReference so a vanished node
    # garbage-collects them, terminated ones are reaped by the pod GC,
    # and deleting the namespace must be able to finish — all three run
    # as kube-system controllers, and none of them holds a node-bound
    # token. Nothing here may CREATE. Add a human principal only to
    # debug; the plugin recreates a deleted worker on the next publish
    # retry, not before, and the tenant pod is ENOTCONN meanwhile.
    deleteExemptPrincipals:
      - system:serviceaccount:kube-system:generic-garbage-collector
      - system:serviceaccount:kube-system:pod-garbage-collector
      - system:serviceaccount:kube-system:namespace-controller

  # Egress from workers, off by default because a NetworkPolicy needs a
  # CNI that enforces one and a wrong CIDR list is every mount failing
  # at first read. When on, a worker may reach the broker, DNS, and the
  # CIDRs below (your S3 endpoint or proxy) and nothing else. The
  # credential door is loopback and needs no rule.
  networkPolicy:
    enabled: false
    # IP ranges the mounters may talk to. Empty with enabled: true ⇒
    # no S3 egress at all, which is a config error, not a healthy idle.
    egressCIDRs: []
    # Allow UDP/TCP 53 to kube-dns; without it the S3 endpoint's name
    # never resolves and the failure reads as a network partition.
    allowDNS: true

# ── The broker ───────────────────────────────────────────────────────

# The STS-shaped identity exchange (§4). Off only for clusters where
# every CR uses identity.mode `static` (nodePublishSecretRef) or
# `ambient`; with it off, the plugin refuses `broker` and `webIdentity`
# modes with a message naming this knob.
broker:
  enabled: true

  # Two: every publish and every republish of a broker-mode volume goes
  # through it. The broker keeps its publish registrations in memory,
  # per replica; the plugin's exchange carries its registration in the
  # same request (2026-10-05 — before that a register and an exchange
  # could land on two replicas, and the second refused the refresh:
  # s3csi/SECURITY.md §4.13), so replicas do not need to agree. The one
  # arm that cannot carry it, identity.mode webIdentity (the worker's
  # own STS client), needs 1 here and the plugin refuses it otherwise.
  replicas: 2

  # Where the broker gets the credential it hands out
  # (FLINT_S3B_BACKEND):
  #   static — one fixed key set from a Secret, re-issued to every
  #            entitled pod with a synthetic Expiration so clients keep
  #            refreshing. The interim arm (§4.5): the pod is still
  #            authenticated and authorized per publish, but every
  #            project shares one key.
  #   sts    — forward AssumeRoleWithWebIdentity, with the POD's token,
  #            to a real STS that trusts this cluster's issuer.
  #   rest   — POST the pod's token to your own credential service and
  #            expect JSON keys back.
  #
  # A read-only pod (an SA in a CR's consumers.readOnlyServiceAccounts,
  # or a volume with csi.readOnly: true) gets a READ grant, held to reads
  # by the bucket as far as the backend allows: sts attaches a session
  # policy of reads on the CR's bucket and prefix; rest sends
  # "access": "read" and your service scopes the keys; static hands out
  # static.readSecretRef's keys, and without one hands out the one key
  # and reports readEnforcement: cooperative on /v1/status — the pod's
  # mount and syncer keep it read-only, the bucket does not.
  # A read-write pod is bounded to its CR's bucket and prefix the same
  # way where the backend can: sts attaches a session policy of the
  # reads and the writes mount-s3 and the syncer make, on that prefix
  # (2026-10-05; before that a write grant's scope was the whole
  # role's); rest sends "access": "readWrite"; static cannot — its one
  # key reaches whatever the key reaches, and /v1/status says
  # writeEnforcement: none.
  backend: static

  # backend: static. A Secret in the RELEASE namespace with keys
  # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY VERBATIM (optionally
  # AWS_SESSION_TOKEN). Delivered to the broker by kubelet as env, so
  # the broker needs no Secrets RBAC. Empty is refused at render time —
  # a broker with nothing to hand out is not a healthy idle.
  static:
    secretRef: ""
    # Optional: a Secret (same key names) whose keys the store's own IAM
    # limits to reads. Handed to read-only pods instead of secretRef's.
    readSecretRef: ""

  # backend: sts.
  sts:
    url: ""            # FLINT_S3B_STS_URL, e.g. https://sts.amazonaws.com
    roleArn: ""        # FLINT_S3B_STS_ROLE_ARN, optional
    # The ARN partition of a pod's session policy
    # (FLINT_S3B_ARN_PARTITION): aws (default), aws-cn, aws-us-gov.
    arnPartition: ""

  # backend: rest.
  rest:
    url: ""            # FLINT_S3B_REST_URL
    headers: ""        # FLINT_S3B_REST_HEADERS, "K=V;K2=V2"

  # Lifetimes in seconds. The plugin asks for node.credsLifetimeSecs;
  # the broker issues that or maxLifetimeSecs, whichever is smaller,
  # and defaultLifetimeSecs when the request names none.
  defaultLifetimeSecs: 900
  maxLifetimeSecs: 3600

  # How long a publish registration lives in a replica's table without
  # being renewed (FLINT_S3B_REGISTRATION_TTL_SECS). Empty ⇒ twice
  # maxLifetimeSecs, never under 7200. The plugin's exchange renews its
  # registration on every refresh; a deregister reaches one replica and
  # the other forgets within this (s3csi/SECURITY.md §4.13).
  registrationTtlSecs: ""

  # TokenReviews in flight at once (FLINT_S3B_MAX_INFLIGHT_REVIEWS). The
  # exchange is unauthenticated until the review; past this an exchange is
  # answered 503 — an outage the plugin keeps its key through — and the
  # API server is not asked.
  maxInflightReviews: 64

  # The broker mints only for publishes the node plugin registered
  # first (FLINT_S3B_REQUIRE_REGISTRATION). `false` exists for rigs that
  # exercise the exchange without a plugin; never in production.
  requireRegistration: true

  logLevel: info

  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

  nodeSelector: {}
  tolerations: []
  affinity: {}
