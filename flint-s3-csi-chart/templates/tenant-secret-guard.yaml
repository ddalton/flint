{{- if .Values.tenantSecretGuard.enabled }}
{{- $g := .Values.tenantSecretGuard }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?-$" $g.secretNamePrefix) }}
{{- fail "tenantSecretGuard.secretNamePrefix must be the start of a Secret name ending in '-', e.g. s3-mount-" }}
{{- end }}
# THE GUARD on a TENANT namespace's mount Secrets: the credential a pod
# hands this driver through nodePublishSecretRef (identity.mode static or
# stsSecret). Kubelet gives a pod any Secret in its namespace, whatever
# the pod's creator may `get`, and a pod may name any ServiceAccount in
# its namespace. So anyone who can create a pod there can read a mount
# credential through a `secret` volume or an env var, or mount it under
# the victim's ServiceAccount. Denying Secret reads alone does not
# close that (Kubernetes' own warning). The Secret's envelope fields
# (namespace, serviceAccount, mount; stsSecret) stop a pod under ANOTHER
# ServiceAccount, not one that claims the same.
#
# What closes it is WHO CREATED THE POD, which only admission sees. In a
# namespace that opts in (label <namespaceLabel>: enforce), this policy
# admits:
#
#   · a pod with an s3.csi.chert.us volume, or a debug container added
#     to one, only from a principal the namespace's <deployersAnnotation>
#     annotation lists. No annotation means nobody: fail closed;
#   · an s3.csi.chert.us nodePublishSecretRef only to a Secret named
#     <secretNamePrefix>*, so every mount credential is one this policy
#     protects;
#   · a <secretNamePrefix>* Secret only as such a nodePublishSecretRef:
#     never as a `secret` or projected volume, another CSI driver's
#     secret, or env / envFrom in any container;
#   · a CREATE or UPDATE of a <secretNamePrefix>* Secret only from a
#     listed principal.
#
# It assumes the platform owns the namespace object (labels and
# annotations), and that RBAC gives the application's own identities no
# pod or workload create, Secret, token, impersonation or exec rights.
# Listing a kube-system workload controller as a deployer (for
# Deployments or Jobs) widens the creator to whoever may create that
# workload, so do it only where RBAC keeps that to the deployer.
#
# ValidatingAdmissionPolicy, failurePolicy Fail: evaluated in the API
# server, so there is no webhook to lose. The policy is installed on
# every cluster but matches only namespaces that opt in.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "flint-s3-csi.name" . }}-tenant-secret-guard
  labels: {{- include "flint-s3-csi.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        {{ $g.namespaceLabel }}: enforce
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets"]
  variables:
    - name: prefix
      expression: {{ printf "'%s'" $g.secretNamePrefix | quote }}
    - name: deployers
      expression: {{ printf "has(namespaceObject.metadata.annotations) && '%s' in namespaceObject.metadata.annotations ? namespaceObject.metadata.annotations['%s'].split(',').map(s, s.trim()).filter(s, s != '') : []" $g.deployersAnnotation $g.deployersAnnotation | quote }}
    - name: byDeployer
      expression: "request.userInfo.username in variables.deployers"
    - name: isSecret
      expression: "request.resource.resource == 'secrets'"
    # request.subResource is absent, not '', on a plain pod CREATE.
    - name: isDebug
      expression: "has(request.subResource) && request.subResource == 'ephemeralcontainers'"
    - name: volumes
      expression: "!variables.isSecret && has(object.spec.volumes) ? object.spec.volumes : []"
    - name: s3Volumes
      expression: "variables.volumes.filter(v, has(v.csi) && v.csi.driver == 's3.csi.chert.us')"
    - name: mounts
      expression: "size(variables.s3Volumes) > 0"
    - name: containers
      expression: "variables.isSecret ? [] : object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])"
  validations:
    - expression: "variables.isSecret || variables.isDebug || !variables.mounts || variables.byDeployer"
      messageExpression: {{ printf "'only a principal listed in the namespace annotation %s may create a pod that mounts an s3.csi.chert.us volume; ' + request.userInfo.username + ' is not'" $g.deployersAnnotation | quote }}
    - expression: "!variables.isDebug || !variables.mounts || variables.byDeployer"
      messageExpression: {{ printf "'only a principal listed in the namespace annotation %s may add a debug container to a pod that mounts an s3.csi.chert.us volume; ' + request.userInfo.username + ' is not'" $g.deployersAnnotation | quote }}
    - expression: "variables.s3Volumes.all(v, !has(v.csi.nodePublishSecretRef) || v.csi.nodePublishSecretRef.name.startsWith(variables.prefix))"
      message: {{ printf "an s3.csi.chert.us volume's nodePublishSecretRef must name a Secret whose name starts with %s, so that this guard protects it" $g.secretNamePrefix | quote }}
    - expression: "variables.volumes.all(v, (!has(v.secret) || !has(v.secret.secretName) || !v.secret.secretName.startsWith(variables.prefix)) && (!has(v.projected) || !has(v.projected.sources) || v.projected.sources.all(s, !has(s.secret) || !has(s.secret.name) || !s.secret.name.startsWith(variables.prefix))) && (!has(v.csi) || v.csi.driver == 's3.csi.chert.us' || !has(v.csi.nodePublishSecretRef) || !v.csi.nodePublishSecretRef.name.startsWith(variables.prefix)))"
      message: {{ printf "a mount Secret (%s*) may reach a pod only as an s3.csi.chert.us nodePublishSecretRef: not as a secret or projected volume, and not through another CSI driver" $g.secretNamePrefix | quote }}
    - expression: "variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || !has(e.valueFrom.secretKeyRef.name) || !e.valueFrom.secretKeyRef.name.startsWith(variables.prefix))) && (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef) || !has(f.secretRef.name) || !f.secretRef.name.startsWith(variables.prefix))))"
      message: {{ printf "a mount Secret (%s*) may not be read into a container's environment (env valueFrom.secretKeyRef or envFrom.secretRef)" $g.secretNamePrefix | quote }}
    - expression: "!variables.isSecret || !has(object.metadata.name) || !object.metadata.name.startsWith(variables.prefix) || variables.byDeployer"
      messageExpression: {{ printf "'only a principal listed in the namespace annotation %s may create or change a mount Secret (%s*); ' + request.userInfo.username + ' is not'" $g.deployersAnnotation $g.secretNamePrefix | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "flint-s3-csi.name" . }}-tenant-secret-guard
  labels: {{- include "flint-s3-csi.labels" . | nindent 4 }}
spec:
  policyName: {{ include "flint-s3-csi.name" . }}-tenant-secret-guard
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        {{ $g.namespaceLabel }}: enforce
{{- end }}
