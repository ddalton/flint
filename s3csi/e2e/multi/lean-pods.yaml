# Lean pods for the cross-cluster workspace legs. `lean-seeder` writes
# 200 files and declares a publish; `lean-agent` records what its FIRST
# instruction saw (gate, count, bytes) and then waits, so the drill can
# read the record and later delete it to observe the drain.
---
apiVersion: v1
kind: Pod
metadata: { name: lean-seeder, namespace: s3-tenants }
spec:
  serviceAccountName: trainer
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
  volumes:
    - { name: ws, csi: { driver: s3.flint.io, volumeAttributes: { flint.io/workspace: proj } } }
  containers:
    - name: agent
      image: busybox:1.36
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumeMounts: [{ name: ws, mountPath: /workspace }]
      command:
        - /bin/sh
        - -c
        - |
          test -f /workspace/.flint-sync/checkout-complete || { echo "GATE BROKEN"; exit 1; }
          mkdir -p /workspace/src || exit 1
          i=1
          while [ $i -le 200 ]; do
            printf 'unit %04d of the seeded project\n' $i > "$(printf '/workspace/src/f%04d.txt' $i)" || exit 1
            i=$((i + 1))
          done
          mkdir -p /workspace/.flint
          printf '{"nonce":"seed-1"}' > /workspace/.flint/publish.tmp
          mv /workspace/.flint/publish.tmp /workspace/.flint/publish
          n=0
          while [ $n -lt 120 ]; do
            if grep -c seed-1 /workspace/.flint/publish.ack > /dev/null 2>&1; then
              echo "SEED PUBLISHED"; trap 'exit 0' TERM INT; sleep 86400 & wait
            fi
            n=$((n + 1)); sleep 1
          done
          echo "SEED NEVER ACKED"; exit 1
---
apiVersion: v1
kind: Pod
metadata: { name: lean-agent, namespace: s3-tenants }
spec:
  serviceAccountName: trainer
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
  volumes:
    - { name: ws, csi: { driver: s3.flint.io, volumeAttributes: { flint.io/workspace: proj } } }
  containers:
    - name: agent
      image: busybox:1.36
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumeMounts: [{ name: ws, mountPath: /workspace }]
      command:
        - /bin/sh
        - -c
        - |
          if [ -f /workspace/.flint-sync/checkout-complete ]; then echo GATE-OK > /tmp/gate; else echo GATE-BROKEN > /tmp/gate; fi
          ls /workspace/src 2>/dev/null | wc -l > /tmp/seen-count
          cat /workspace/src/f0042.txt > /tmp/seen-sample 2>/dev/null || echo MISSING > /tmp/seen-sample
          trap 'exit 0' TERM INT
          sleep 86400 &
          wait
