# The lean arm of the s3.chert.us drill (design §3.5, §5, §10.2 S11/S13):
# one FlintLeanWorkspace, a seeder that publishes, an agent created
# after the seeder is gone. The pods carry ONE csi: volume and nothing
# else — no label, no sidecar, no Secret, no env.
#
# floorSecs is an HOUR: nothing in this rig can be published by the
# cadence timer, so every publish a leg observes was DECLARED by an
# agent or DRAINED at its delete. Without this the drain leg would pass
# on a tick.
---
apiVersion: chert.us/v1alpha1
kind: FlintLeanWorkspace
metadata:
  name: proj
  namespace: s3-tenants
spec:
  projectId: team-a/proj
  bucket: s3bucket
  keyPrefix: tenants/proj
  endpoint: http://minio.flint-system.svc:9000
  floorSecs: 3600
  expectedBytes: 8388608
  expectedFiles: 500
  maxFiles: 5000
  uid: 1001
  gid: 1001
  consumers:
    serviceAccounts: [trainer]
---
# Control for the consumers gate on the lean CRD: no consumers ⇒ deny.
apiVersion: chert.us/v1alpha1
kind: FlintLeanWorkspace
metadata:
  name: proj-noconsumers
  namespace: s3-tenants
spec:
  projectId: team-a/proj-noconsumers
  bucket: s3bucket
  keyPrefix: tenants/proj-noconsumers
  endpoint: http://minio.flint-system.svc:9000
  floorSecs: 3600
  expectedBytes: 1048576
  expectedFiles: 100
  uid: 1001
---
apiVersion: v1
kind: Pod
metadata:
  name: lean-seeder
  namespace: s3-tenants
spec:
  serviceAccountName: trainer
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: ws
      csi:
        driver: s3.chert.us
        volumeAttributes:
          chert.us/workspace: proj
  containers:
    - name: agent
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: ws, mountPath: /workspace }
      command:
        - /bin/sh
        - -c
        - |
          test -f /workspace/.flint-sync/checkout-complete || { echo "GATE BROKEN"; exit 1; }
          mkdir -p /workspace/src || exit 1
          i=1
          while [ $i -le 200 ]; do
            printf 'unit %04d of the seeded project\n' $i > "$(printf '/workspace/src/f%04d.txt' $i)" || exit 1
            i=$((i + 1))
          done
          mkdir -p /workspace/.flint
          printf '{"nonce":"seed-1"}' > /workspace/.flint/publish.tmp
          mv /workspace/.flint/publish.tmp /workspace/.flint/publish
          n=0
          while [ $n -lt 120 ]; do
            if grep -c seed-1 /workspace/.flint/publish.ack > /dev/null 2>&1; then
              echo "SEED PUBLISHED"; cat /workspace/.flint/publish.ack
              trap 'exit 0' TERM INT; sleep 86400 & wait
            fi
            n=$((n + 1)); sleep 1
          done
          echo "SEED NEVER ACKED"; exit 1
---
# Refused control: SA trainer against a CR with no consumers.
apiVersion: v1
kind: Pod
metadata:
  name: lean-refused
  namespace: s3-tenants
spec:
  serviceAccountName: trainer
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: ws
      csi:
        driver: s3.chert.us
        volumeAttributes:
          chert.us/workspace: proj-noconsumers
  containers:
    - name: agent
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: ws, mountPath: /workspace }
      command: ["/bin/sh", "-c", "trap 'exit 0' TERM INT; sleep 86400 & wait"]
