# S31: the stsSecret arm's reader. The POD names the Secret (kubelet
# fetches it; the node SA has no Secrets RBAC); the leg writes that Secret
# — generation, expiry, envelope — before applying this, and rewrites it
# to drive every rule. Same shape as tenants.yaml's reader-static.
apiVersion: v1
kind: Pod
metadata:
  name: reader-sts
  namespace: s3-tenants
spec:
  serviceAccountName: trainer
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: data
      csi:
        driver: s3.csi.chert.us
        volumeAttributes:
          chert.us/mount: datasets-sts
        nodePublishSecretRef:
          name: sts-session
  containers:
    - name: agent
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args: ["trap 'exit 0' TERM INT; sleep 86400 & wait"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: data, mountPath: /mnt/s3 }
