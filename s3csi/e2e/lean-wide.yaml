# A WIDE-window fixture for S17: its own project (never `proj`, whose
# entry count S11/S13/S14 assert), seeded with 4000 files so a fanout-1
# checkout runs for minutes, not the ~10 s the 200-file project gives —
# which is less than a plugin roll takes, so the standard S17 fixture
# cannot put the new plugin in front of a checkout in progress.
---
apiVersion: chert.us/v1alpha1
kind: FlintLeanWorkspace
metadata:
  name: proj-wide
  namespace: s3-tenants
spec:
  projectId: team-a/proj-wide
  bucket: s3bucket
  keyPrefix: tenants/proj-wide
  endpoint: http://minio.flint-system.svc:9000
  fanout: 1
  floorSecs: 3600
  expectedBytes: 8388608
  expectedFiles: 5000
  maxFiles: 20000
  uid: 1001
  gid: 1001
  consumers:
    serviceAccounts: [trainer]
---
apiVersion: v1
kind: Pod
metadata:
  name: wide-seeder
  namespace: s3-tenants
spec:
  serviceAccountName: trainer
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile: { type: RuntimeDefault }
  volumes:
    - name: ws
      csi:
        driver: s3.csi.chert.us
        volumeAttributes:
          chert.us/workspace: proj-wide
  containers:
    - name: agent
      image: busybox:1.36
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      volumeMounts:
        - { name: ws, mountPath: /workspace }
      command:
        - /bin/sh
        - -c
        - |
          test -f /workspace/.flint-sync/checkout-complete || { echo "GATE BROKEN"; exit 1; }
          mkdir -p /workspace/src || exit 1
          i=1
          while [ $i -le 4000 ]; do
            printf 'unit %05d of the wide project\n' $i > "$(printf '/workspace/src/w%05d.txt' $i)" || exit 1
            i=$((i + 1))
          done
          echo "seeded 4000"
