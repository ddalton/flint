# flint-forge — a git server per repository, with S3 behind it.
#
#   helm install flint-forge ./flint-forge-chart -n flint-system --create-namespace
#
# Then a repository is one `kubectl apply` of a FlintRepo, and an agent
# clones it through the door with its own ServiceAccount token as the
# password.
#
# Design of record: docs/plans/flint-forge-design.md

# The operator image, which carries the FlintRepo controller AND the
# git door (flint-hub-gateway built from a tree that has the Door::Git
# arm). It is its OWN image rather than another name for
# flint-lite-operator: that one COPYs each binary unconditionally, so
# adding forge's would make every lite and lean release depend on a
# pre-release component.
image:
  repository: dilipdalton
  name: flint-forge-operator
  tag: "1.46.0-forge.6"
  ref: ""
  pullPolicy: IfNotPresent

# The two images a SERVER pod runs. The operator renders them into every
# repository's Deployment, so changing them here and rolling the
# operator re-renders the fleet.
server:
  # nginx + fcgiwrap + git http-backend + the two hooks.
  gitImage: dilipdalton/flint-forge-git:1.46.0-forge.6
  # The one writer of the repository's S3 state; the pod's main
  # container, so its exit restarts the pod. It also carries flint-sync,
  # because the legible export runs the shipped lean binary.
  syncerImage: dilipdalton/flint-forge-syncer:1.46.0-forge.6
  logLevel: info

# One replica. The reconcile is idempotent and the arbitration is a
# pure function of the CR set, so N replicas are safe; they duplicate
# apiserver work for no gain.
replicaCount: 1

# Restrict the watch to one namespace. Empty = every namespace.
namespace: ""

# WHERE THE DOOR RUNS.
#
# Set this and every repository gets a NetworkPolicy admitting only the
# gateway's pods to its git port. That policy is what makes
# `X-Remote-User` mean anything: the door sets it from a verified
# TokenReview, but anything that can reach the port directly can set it
# too, and both `pre-receive` and the syncer would believe it.
#
# Leave `namespace` empty and no policy is rendered — a real posture for
# a single-tenant cluster or one whose CNI does not enforce
# NetworkPolicy, but then REACHING THE PORT IS THE AUTHORIZATION.
door:
  namespace: ""
  podLabel: "app.kubernetes.io/name=flint-hub-gateway"

  # RENDER THE DOOR ITSELF (flint-hub-gateway with `--git-only`).
  #
  # Off by default, because on a cluster that already runs flint-lite
  # the right door is the shared gateway from that chart — one process
  # serving both route tables. Turn this on for a forge-only cluster,
  # which has no hubs, no root key and no inbound token and therefore
  # cannot run the lite chart's gateway at all.
  #
  # When you enable this, set `namespace` (above) to this release's
  # namespace as well, so every repository gets the NetworkPolicy that
  # makes `X-Remote-User` mean something.
  deploy: false
  replicas: 1
  # The audience an agent's projected token must carry. A token minted
  # for the apiserver's own audience is refused, and that separation is
  # the whole reason any pod token in the cluster is not a forge
  # credential. Must match the agent's `serviceAccountToken.audience`.
  audience: "forge.chert.us"
  # How long a git request is HELD for a parked repository. Long,
  # deliberately: git clients do not retry a 503, and a wake after an
  # unclean death is a lease wait plus a restore from the bucket.
  wakeWaitSecs: 180
  reviewTtlSecs: 60
  readOnly: false
  # For a push or a fetch this is the longest SILENCE allowed in either
  # direction, never a bound on the transfer: a pack is as large as the
  # repository, and the hook that must acknowledge it uploads the whole
  # pack to the bucket first (git keeps the connection alive meanwhile).
  upstreamTimeoutSecs: 300
  logLevel: ""
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 96Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
