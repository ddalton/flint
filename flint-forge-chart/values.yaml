# flint-forge — a git server per repository, with S3 behind it.
#
#   helm install flint-forge ./flint-forge-chart -n flint-system --create-namespace
#
# Then a repository is one `kubectl apply` of a FlintRepo, and an agent
# clones it through the door with its own ServiceAccount token as the
# password.
#
# Design of record: docs/plans/flint-forge-design.md

# The operator image, which carries the FlintRepo controller AND the
# git door (flint-hub-gateway built from a tree that has the Door::Git
# arm). It is its OWN image rather than another name for
# flint-lite-operator: that one COPYs each binary unconditionally, so
# adding forge's would make every lite and lean release depend on a
# pre-release component.
image:
  repository: dilipdalton
  name: flint-forge-operator
  tag: "1.46.0"
  ref: ""
  pullPolicy: IfNotPresent

# The two images a SERVER pod runs. The operator renders them into every
# repository's Deployment, so changing them here and rolling the
# operator re-renders the fleet.
#
# They are ONE tag by default: the hook in the git image is the syncer
# binary, and a hook from one build talking to a syncer from another
# over the pod's socket is the drift the published-artifact drill hit
# when the two were two free-form strings. `server.tag` covers both
# and defaults to `image.tag`; the two full-reference overrides below
# exist for a drill that pins a digest, and the operator warns when
# what it was handed carries two different tags.
server:
  repository: dilipdalton
  tag: ""
  # Full-reference overrides. Empty = <repository>/flint-forge-git:<tag>
  # (flint-forge-gitcgi in front of git http-backend, plus the two hooks) and
  # <repository>/flint-forge-syncer:<tag> (the one writer of the
  # repository's S3 state; the pod's main container, so its exit
  # restarts the pod; it also carries flint-sync for the legible export).
  gitImage: ""
  syncerImage: ""
  logLevel: info

# One replica. The reconcile is idempotent and the arbitration is a
# pure function of the CR set, so N replicas are safe; they duplicate
# apiserver work for no gain.
replicaCount: 1

# Restrict the watch to one namespace. Empty = every namespace.
namespace: ""

# WHERE THE DOOR RUNS.
#
# Set this and every repository gets a NetworkPolicy admitting only the
# gateway's pods to its git port. That policy is what makes
# `X-Remote-User` mean anything: the door sets it from a verified
# TokenReview, but anything that can reach the port directly can set it
# too, and both `pre-receive` and the syncer would believe it.
#
# Leave `namespace` empty and no policy is rendered — a real posture for
# a single-tenant cluster or one whose CNI does not enforce
# NetworkPolicy, but then REACHING THE PORT IS THE AUTHORIZATION.
door:
  namespace: ""
  podLabel: "app.kubernetes.io/name=flint-hub-gateway"

  # RENDER THE DOOR ITSELF (flint-hub-gateway with `--git-only`).
  #
  # Off by default, because on a cluster that already runs flint-lite
  # the right door is the shared gateway from that chart — one process
  # serving both route tables. Turn this on for a forge-only cluster,
  # which has no hubs, no root key and no inbound token and therefore
  # cannot run the lite chart's gateway at all.
  #
  # When you enable this, set `namespace` (above) to this release's
  # namespace as well, so every repository gets the NetworkPolicy that
  # makes `X-Remote-User` mean something.
  deploy: false
  replicas: 1
  # The audience an agent's projected token must carry. A token minted
  # for the apiserver's own audience is refused, and that separation is
  # the whole reason any pod token in the cluster is not a forge
  # credential. Must match the agent's `serviceAccountToken.audience`.
  audience: "forge.chert.us"
  # How long a git request is HELD for a parked repository. Long,
  # deliberately: git clients do not retry a 503, and a wake after an
  # unclean death is a lease wait plus a restore from the bucket.
  wakeWaitSecs: 180
  reviewTtlSecs: 60
  readOnly: false
  # For a push or a fetch this is the longest SILENCE allowed in either
  # direction, never a bound on the transfer: a pack is as large as the
  # repository, and the hook that must acknowledge it uploads the whole
  # pack to the bucket first (git keeps the connection alive meanwhile).
  upstreamTimeoutSecs: 300
  logLevel: ""

  # THE REST FILE API (design `docs/plans/forge-file-api-design.md` §7).
  #
  # A second route table on the SAME listener and the same port as the
  # git door: `/repo/<namespace>/<name>/files…` beside
  # `/git/<namespace>/<repo>.git/…`. A browser app's backend reaches a
  # repository here; agents keep using a git client. One address, one
  # `spec.consumers` list, one wake.
  #
  # Off by default, and `--git-only` deliberately does NOT imply it: an
  # existing install must not grow a new door onto tenant data by being
  # upgraded. A repository still serves the file API only when its own
  # `spec.fileApi.enabled` is set, so this alone exposes nothing — but
  # it is a door, and it deserves a decision rather than a default.
  repoFiles:
    enabled: false
    # SECONDS, unlike the git door's minutes: a browser backend retries
    # a 503, and holding its request for three minutes is how one parked
    # repository exhausts its connection pool.
    wakeWaitSecs: 25
    # A door-side bound as well as the repository's own
    # `spec.fileApi.maxMb`. Without it a single request of arbitrary
    # length is buffered on behalf of a caller the door has not yet
    # reviewed. 64 MiB.
    maxBytes: 67108864

  # A JWT AN EXTERNAL ISSUER MINTED, beside the pod tokens the door
  # already reviews (design `docs/plans/forge-knox-jwt-design.md`).
  #
  # Agents authenticate with their own ServiceAccount token and always
  # will; this is for the OTHER caller — a browser app's backend, or
  # anything holding a token an issuer minted for a PERSON. Both
  # credentials arrive the same way (`Authorization`, or the Basic
  # password for a git client), a router picks the verifier from the
  # token's own `iss`, and there is no fallback between them.
  #
  # A verified token's `sub` becomes the principal, and a repository
  # admits it by listing `jwt:user:<sub>` in `spec.consumers` — the
  # SAME list the ServiceAccounts are in, so authority stays keyed on
  # one thing.
  #
  # Leave `issuer` empty and none of this is rendered: no key is
  # fetched from anywhere and the door behaves exactly as it did.
  jwt:
    # The `iss` accepted, matched EXACTLY. It must not be the cluster's
    # own ServiceAccount issuer — the door reads that from its own
    # token and refuses to start on a collision, because every pod
    # token would then be routed to the offline verifier, which cannot
    # see that a pod was deleted.
    issuer: ""

    # The audience a verified token must carry.
    #
    # OPTIONAL, and its absence is a real exposure rather than a
    # nicety: with no audience check, any token this issuer minted is
    # accepted here, INCLUDING one minted for another service. Every
    # service sharing the issuer can then present a user's token to
    # this door as that user, bounded only by `spec.consumers`. Left
    # empty because some issuers cannot mint a per-application audience
    # at all — a topology-wide value, or none — which is a
    # configuration this chart does not control. The door logs a loud
    # warning at start-up when it is unset.
    audience: ""

    # WHERE THE SIGNING KEYS COME FROM — exactly one of these two.
    #
    # `jwksUrl` is fetched, cached, and refetched when a token names a
    # key the door does not hold, no sooner than once a minute — so a
    # stream of unknown-key tokens cannot become a denial-of-service
    # against the issuer, delivered by the door.
    jwksUrl: ""
    # …or a Secret holding one RSA public key in PEM, for a deployment
    # that would rather the door never reached the issuer at all. It is
    # mounted read-only; `keyId` is the `kid` that key answers to, and
    # a token naming any other `kid` is refused.
    publicKeySecret:
      name: ""
      key: "public.pem"
    keyId: "static"

    # The longest `exp - iat` accepted, WHATEVER THE SIGNATURE SAYS.
    # Some issuers default to lifetimes measured in months, and with
    # revocation out of scope this is the only bound on a stolen token.
    maxLifetimeSecs: 3600
    # Clock-skew tolerance on `exp` and `nbf`.
    leewaySecs: 60

  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources:
  requests:
    cpu: 50m
    memory: 96Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
