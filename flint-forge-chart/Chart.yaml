apiVersion: v2
name: flint-forge
description: >-
  The flint-forge control plane — one FlintRepo per git repository, a
  controller that renders its server (nginx + git http-backend + the
  syncer that owns every write to S3), and the door's git arm on the
  shared flint-hub-gateway. Agents are stock git clients; the bucket is
  a bare git repository; a repository's local disk is a cache. No PVCs:
  a suspended repository is bucket objects and nothing else.
type: application

# Chart version, independent of the flint release train.
# 0.1.0: first cut — CRD, controller, server pods, the door's --git arm.
# 0.2.0: `door.deploy` renders the door itself, with the RBAC it needs
#        (flintrepos + tokenreviews). First cluster run.
version: 0.2.0

# The flint release whose images this chart runs. The operator, the
# syncer and the gateway ship from the same build and speak the same
# bucket format and the same status document — keep them in step.
appVersion: "1.46.0-forge.4"

keywords:
  - git
  - s3
  - agents
  - operator
  - flint
