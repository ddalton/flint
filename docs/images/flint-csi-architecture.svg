<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="876" viewBox="0 0 1280 876" role="img" aria-label="flint-csi-driver: a controller Deployment and a dashboard in flint-system, and on every worker node a flint-csi-node pod running spdk-tgt. An application pod&#x27;s I/O goes through the kernel NVMe-oF/TCP initiator to the local spdk-tgt, which mirrors it with RAID1 to a replica on another node and stores it in lvols on the node&#x27;s NVMe disks. Setup is three steps: install the chart, prepare each node, initialize the disks.">
  <title>flint-csi-driver: a controller Deployment and a dashboard in flint-system, and on every worker node a flint-csi-node pod running spdk-tgt. An application pod&#x27;s I/O goes through the kernel NVMe-oF/TCP initiator to the local spdk-tgt, which mirrors it with RAID1 to a replica on another node and stores it in lvols on the node&#x27;s NVMe disks. Setup is three steps: install the chart, prepare each node, initialize the disks.</title>
  <defs>
    <style>
svg{--bg:#ffffff;--edge:#d0d7de;--soft:#f6f8fa;--card:#ffffff;--ink:#1f2328;--ink2:#424a53;--mut:#656d76;--ctl:#8c959f;--block:#6e56cf;--block-deep:#5a3fc0;--block-tint:#f4f1fd;--lite:#184f95;--lite-deep:#184f95;--lite-tint:#eef3fa;--lean:#1baf7a;--lean-deep:#0f7a55;--lean-tint:#ecf8f2;--pass:#a06b12;--pass-deep:#7d530c;--pass-tint:#faf3e6;--forge:#b03060;--forge-deep:#8c2449;--forge-tint:#faedf2;--s3:#57606a;--s3-deep:#424a53;--s3-tint:#f6f8fa}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--edge:#30363d;--soft:#151b23;--card:#1c2129;--ink:#e6edf3;--ink2:#c9d1d9;--mut:#9198a1;--ctl:#7d8590;--block:#a18bf5;--block-deep:#bcaaf9;--block-tint:#221d36;--lite:#58a6ff;--lite-deep:#79b8ff;--lite-tint:#142236;--lean:#3dd68c;--lean-deep:#56e0a0;--lean-tint:#13281f;--pass:#d29922;--pass-deep:#e3b341;--pass-tint:#2b2213;--forge:#f778ba;--forge-deep:#ff9bce;--forge-tint:#2f1a25;--s3:#9198a1;--s3-deep:#c9d1d9;--s3-tint:#151b23}}
