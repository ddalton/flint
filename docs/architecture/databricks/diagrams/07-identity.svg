<svg xmlns='http://www.w3.org/2000/svg' width='1632' height='701' viewBox='0 0 1632 701'><defs><marker id='ah-2E6FB7' markerWidth='8' markerHeight='6' refX='7.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L8,3 L0,6 z' fill='#2E6FB7'/></marker><marker id='ahs-2E6FB7' markerWidth='8' markerHeight='6' refX='0.5' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M8,0 L0,3 L8,6 z' fill='#2E6FB7'/></marker></defs><rect x='0' y='0' width='1632.0' height='700.8' fill='#FFFFFF'/><rect x='28.80' y='28.80' width='763.20' height='513.60' rx='13.44' fill='#FCFDFE' stroke='#3F4B5B' stroke-width='0.86' stroke-dasharray='6 4'/><text xml:space='preserve' x='50.40' y='57.69' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.67' fill='#5A646F' text-anchor='start' font-weight='600'>a Databricks node</text><text xml:space='preserve' x='50.40' y='75.33' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#6B7683' text-anchor='start'>the platform creates every user and every sandbox</text><path d='M62.40,100.80 L388.80,100.80 L388.80,182.40 L62.40,182.40 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='225.60' y='139.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>user A's code</text><text xml:space='preserve' x='225.60' y='153.24' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>Linux user spark-6166… — created by Databricks</text><rect x='331.20' y='91.20' width='48.00' height='19.20' rx='9.60' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='0.77'/><text xml:space='preserve' x='355.20' y='103.97' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='8.53' fill='#2E6FB7' text-anchor='middle' font-weight='600'>SEEN</text><path d='M432.00,100.80 L758.40,100.80 L758.40,182.40 L432.00,182.40 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='595.20' y='139.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>user B's code</text><text xml:space='preserve' x='595.20' y='153.24' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>Linux user spark-5a9e… — created by Databricks</text><path d='M62.40,235.20 L758.40,235.20 L758.40,302.40 L62.40,302.40 Z' fill='#EDEFF2' stroke='#78828E' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='410.40' y='267.01' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>the kernel's FUSE request</text><text xml:space='preserve' x='410.40' y='280.44' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>carries the caller's uid, gid and pid</text><path d='M62.40,355.20 L758.40,355.20 L758.40,446.40 L62.40,446.40 Z' fill='#E6DBF6' stroke='#6F45B5' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='410.40' y='399.01' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>a /Volumes daemon</text><text xml:space='preserve' x='410.40' y='412.44' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>uid → the user it was created for → that user's Unity Catalog grants</text><rect x='700.80' y='345.60' width='48.00' height='19.20' rx='9.60' fill='#FFF1D6' stroke='#A8741A' stroke-width='0.77'/><text xml:space='preserve' x='724.80' y='358.37' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='8.53' fill='#A8741A' text-anchor='middle' font-weight='600'>INFER</text><polyline points='225.60,182.40 225.60,235.20' fill='none' stroke='#2E6FB7' stroke-width='1.34' marker-end='url(#ah-2E6FB7)' /><polyline points='595.20,182.40 595.20,235.20' fill='none' stroke='#2E6FB7' stroke-width='1.34' marker-end='url(#ah-2E6FB7)' /><polyline points='410.40,302.40 410.40,355.20' fill='none' stroke='#2E6FB7' stroke-width='1.34' marker-end='url(#ah-2E6FB7)' /><text xml:space='preserve' x='410.40' y='211.87' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#2E6FB7' text-anchor='middle' font-weight='600'>open() on /Volumes</text><rect x='62.40' y='465.60' width='696.00' height='52.80' rx='4.80' fill='#E8F5EC' stroke='#2F7D4A' stroke-width='0.96'/><text xml:space='preserve' x='410.40' y='488.76' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#1F5A34' text-anchor='middle' font-weight='600'>a uid names a person, because nobody but the platform can pick one</text><rect x='840.00' y='28.80' width='763.20' height='513.60' rx='13.44' fill='#FCFDFE' stroke='#A9B2BD' stroke-width='0.86' stroke-dasharray='6 4'/><text xml:space='preserve' x='861.60' y='57.69' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.67' fill='#5A646F' text-anchor='start' font-weight='600'>a shared Kubernetes node</text><text xml:space='preserve' x='861.60' y='75.33' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.13' fill='#6B7683' text-anchor='start'>every pod picks its own uid</text><path d='M873.60,100.80 L1200.00,100.80 L1200.00,182.40 L873.60,182.40 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1036.80' y='139.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>tenant 1's pod</text><text xml:space='preserve' x='1036.80' y='153.24' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>securityContext.runAsUser: 1000</text><path d='M1243.20,100.80 L1569.60,100.80 L1569.60,182.40 L1243.20,182.40 Z' fill='#E4EEF9' stroke='#2E6FB7' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1406.40' y='139.81' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>tenant 2's pod</text><text xml:space='preserve' x='1406.40' y='153.24' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>securityContext.runAsUser: 1000</text><path d='M873.60,235.20 L1569.60,235.20 L1569.60,302.40 L873.60,302.40 Z' fill='#EDEFF2' stroke='#78828E' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1221.60' y='267.01' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#101010' text-anchor='middle' font-weight='600'>the kernel's FUSE request</text><text xml:space='preserve' x='1221.60' y='280.44' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#3D4650' text-anchor='middle'>uid 1000 — and uid 1000</text><path d='M873.60,355.20 L1569.60,355.20 L1569.60,446.40 L873.60,446.40 Z' fill='#FDECEC' stroke='#C0392B' stroke-width='1.15' stroke-linejoin='round'/><text xml:space='preserve' x='1221.60' y='399.01' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='12.53' fill='#C0392B' text-anchor='middle' font-weight='600'>one shared node daemon</text><text xml:space='preserve' x='1221.60' y='412.44' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='10.40' fill='#8C2F22' text-anchor='middle'>cannot tell the two tenants apart</text><polyline points='1036.80,182.40 1036.80,235.20' fill='none' stroke='#2E6FB7' stroke-width='1.34' marker-end='url(#ah-2E6FB7)' /><polyline points='1406.40,182.40 1406.40,235.20' fill='none' stroke='#2E6FB7' stroke-width='1.34' marker-end='url(#ah-2E6FB7)' /><polyline points='1221.60,302.40 1221.60,355.20' fill='none' stroke='#2E6FB7' stroke-width='1.34' marker-end='url(#ah-2E6FB7)' /><text xml:space='preserve' x='1221.60' y='211.87' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='9.87' fill='#2E6FB7' text-anchor='middle' font-weight='600'>open() on the mount</text><rect x='873.60' y='465.60' width='696.00' height='52.80' rx='4.80' fill='#FDECEC' stroke='#C0392B' stroke-width='0.96'/><text xml:space='preserve' x='1221.60' y='488.76' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.73' fill='#8C2F22' text-anchor='middle' font-weight='600'>a uid names nobody: two tenants chose the same one</text><rect x='28.80' y='571.20' width='1574.40' height='100.80' rx='5.76' fill='#D6F0EC' stroke='#17847A' stroke-width='1.34'/><text xml:space='preserve' x='47.52' y='595.95' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='13.33' fill='#14181D' text-anchor='start' font-weight='600'>so flint mounts once PER POD, and identity is the ServiceAccount, not the uid</text><text xml:space='preserve' x='47.52' y='620.97' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#3D4650' text-anchor='start'>kubelet hands NodePublishVolume a token bound to this pod; the plugin checks it against the resource's spec.consumers and binds the mount into that pod alone. NodePublishVolume never sees the pod's securityContext, so inside a pod a passthrough mount is one uid —</text><text xml:space='preserve' x='47.52' y='635.19' font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size='11.47' fill='#3D4650' text-anchor='start'>per pod, never per user.</text></svg>