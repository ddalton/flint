<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img"
     aria-label="Prior art beside forge, dimension by dimension: GitHub Spokes, GitLab Gitaly, AWS CodeCommit, Palantir's Stemma on JGit's DFS backend, Cursor's Continuity and the walgit server built on it, and JGit's S3 dumb transport — against flint-forge on the durable substrate, what serves git, the unit of durability, the acknowledgement, writer coordination, the disk's role, restore and idle, read scaling, identity and how each is verified.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
