<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 572" role="img"
     aria-label="flint-lite, drawn as a flow: agent pods on a node share one kernel NFS client, which carries every read and write live over NFSv4.2 to one hub pod; the hub's PVC is a cache, and the hub publishes to the S3 prefix on a cadence and hydrates from it on demand. The epoch cell, the operator and the unauthenticated port are control, off the data path.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .t1{font-size:17.0px;font-weight:600}
  .t2{font-size:13.0px;font-weight:600}
  .t3{font-size:12.0px}
  .t3b{font-size:12.0px;font-weight:600;fill:#334155}
  .t4{font-size:11.0px;fill:#64748b}
  .t4b{font-size:11.0px;font-weight:600;fill:#334155}
  .mono{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:10.5px;fill:#334155}
  .mute{fill:#64748b}
  .cap{font-size:9.5px;font-weight:600;letter-spacing:.1em;fill:#64748b}
  .num{font-size:11.0px;font-weight:600;fill:#ffffff}
  .on{font-size:13.0px;font-weight:600;fill:#ffffff}
  .onsub{font-size:11.0px;fill:#ffffff;opacity:.85}
  .c-red{fill:#b4232a}
  .c-lite{fill:#184f95} .c-lean{fill:#0f7a55} .c-pass{fill:#7d530c} .c-forge{fill:#8c2449}
  .f-lite{fill:#184f95} .f-lean{fill:#1baf7a} .f-pass{fill:#a06b12} .f-forge{fill:#b03060}
  .f-red{fill:#b4232a} .f-ink{fill:#334155}
  .b-lite{fill:#eef3fa;stroke:#184f95;stroke-width:1.4} .b-lean{fill:#ecf8f2;stroke:#1baf7a;stroke-width:1.4} .b-pass{fill:#faf3e6;stroke:#a06b12;stroke-width:1.4} .b-forge{fill:#faedf2;stroke:#b03060;stroke-width:1.4}
  .hd-lite{fill:#184f95} .hd-lean{fill:#0f7a55} .hd-pass{fill:#7d530c} .hd-forge{fill:#8c2449}
  .hd-lbl{fill:#334155}
  .l-lite{stroke:#184f95;stroke-width:2.2;fill:none} .l-lean{stroke:#1baf7a;stroke-width:2.2;fill:none} .l-pass{stroke:#a06b12;stroke-width:2.2;fill:none} .l-forge{stroke:#b03060;stroke-width:2.2;fill:none}
  .l-ctl{stroke:#94a3b8;stroke-width:1.6;fill:none}
  .l-ink{stroke:#334155;stroke-width:2.2;fill:none}
  .l-red{stroke:#b4232a;stroke-width:2.2;fill:none}
  .bx{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4}
  .panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}
  .s3{fill:#f1f5f9;stroke:#64748b;stroke-width:1.6}
  .grp{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:7 5}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .lbl{fill:#f8fafc} .rowb{fill:#fbfcfd}
  .frame{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .halo{fill:#ffffff}
  .chip{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
  .chip-red{fill:#b4232a}
  .chip-lite{fill:#184f95} .chip-lean{fill:#0f7a55} .chip-pass{fill:#7d530c} .chip-forge{fill:#8c2449}
  .chip .cap{fill:#334155}
  /* On a filled shape. Last on purpose: a class beats a presentation
     attribute, so this must win over .t4/.cap/.mono. */
  .on,.num,.onsub{fill:#ffffff}
  .cap.on{fill:#ffffff}
</style>
<defs><marker id="a-lite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="a-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker><marker id="a-forge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03060"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/></marker></defs>
<rect x="24" y="22" width="470" height="420" rx="10" class="grp"/>
<text class="cap" x="40" y="44">CONSUMER CLUSTER</text>
<text class="t4" x="172" y="44">installs nothing from flint</text>
<rect x="44" y="56" width="430" height="356" rx="7" class="panel"/>
<text class="cap" x="62" y="80">node</text>
<rect x="64" y="96" width="118" height="52" rx="7" class="bx"/>
<text class="t3" x="123" y="127" style="text-anchor:middle">agent pod</text>
<line class="l-lite" x1="123" y1="148" x2="123" y2="178" marker-end="url(#a-lite)"/>
<rect x="196" y="96" width="118" height="52" rx="7" class="bx"/>
<text class="t3" x="255" y="127" style="text-anchor:middle">agent pod</text>
<line class="l-lite" x1="255" y1="148" x2="255" y2="178" marker-end="url(#a-lite)"/>
<rect x="328" y="96" width="118" height="52" rx="7" class="bx"/>
<text class="t3" x="387" y="127" style="text-anchor:middle">agent pod</text>
<line class="l-lite" x1="387" y1="148" x2="387" y2="178" marker-end="url(#a-lite)"/>
<rect x="64" y="182" width="390" height="66" rx="7" class="b-lite"/>
<text class="t2 c-lite" x="80" y="206">kernel NFS client — one mount per node</text>
<text class="t4" x="80" y="226">shared by every pod on it, with its page cache</text>
<text class="mono" x="64" y="278" xml:space="preserve">PV: nfs server=&lt;hub&gt; path=/</text>
<text class="mono" x="64" y="296" xml:space="preserve">nfsvers=4.1 · hard · nconnect=4   (≥ 2, or no trunk)</text>
<text class="t4b" x="64" y="330">the node is the client: one mount, one identity, its own uid</text>
<text class="t4" x="64" y="348">full POSIX across pods and clusters: locks, rename, O_EXCL</text>
<line class="l-lite" x1="494" y1="215" x2="612" y2="215" marker-start="url(#a-lite)" marker-end="url(#a-lite)"/>
<rect x="496" y="188" width="114" height="30" rx="3" class="halo"/>
<text class="t4b c-lite" x="553" y="199" style="text-anchor:middle">NFSv4.2 :2049</text>
<text class="t4" x="553" y="214" style="text-anchor:middle">every read and write</text>
<rect x="616" y="22" width="520" height="420" rx="10" class="grp"/>
<text class="cap" x="632" y="44">HUB CLUSTER</text>
<text class="t4" x="723" y="44">one FlintShare per volume</text>
<rect x="636" y="56" width="480" height="212" rx="7" class="bx"/>
<path class="f-lite" d="M643,56 H1109 A7,7 0 0 1 1116,63 V61 H636 V63 A7,7 0 0 1 643,56 Z"/>
<text class="t2 c-lite" x="654" y="82">flint-lite hub — ONE pod · Recreate · exclusive flock</text>
<rect x="654" y="98" width="212" height="70" rx="7" class="b-lite"/>
<text class="t2 c-lite" x="670" y="122">:2049  NFSv4.2</text>
<text class="t4" x="670" y="142">the data plane: locks,</text>
<text class="t4" x="670" y="157">close-to-open, rename</text>
<rect x="886" y="98" width="212" height="70" rx="7" class="bx"/>
<path class="f-red" d="M886,105 A7,7 0 0 1 893,98 H891 V168 H893 A7,7 0 0 1 886,161 Z"/>
<text class="t2 c-red" x="902" y="122">:8080  status + files</text>
<text class="t4" x="902" y="142">ClusterIP only · one bearer per</text>
<text class="t4" x="902" y="157">share</text>
<text class="t4" x="654" y="196">both doors are NFS compounds in one process — one tree</text>
<text class="mono" x="654" y="214" xml:space="preserve">Service :2049 — advertiseAddress for remote clusters</text>
<text class="t4b" x="654" y="244">the coherence authority: N pods, N clusters, ONE tree</text>
<line class="l-lite" x1="876" y1="268" x2="876" y2="296" marker-start="url(#a-lite)" marker-end="url(#a-lite)"/>
<rect x="636" y="300" width="480" height="60" rx="7" class="panel"/>
<text class="t2" x="652" y="324">PVC — the working set, a CACHE</text>
<text class="t4" x="652" y="344">losing it is a rebuild from the bucket, not a loss</text>
<rect x="636" y="372" width="480" height="60" rx="10" class="grp"/>
<text class="cap" x="652" y="394">CONTROL — OFF THE DATA PATH</text>
<text class="t4" x="654" y="412">epoch cell: one hub per prefix, a second is fenced · operator: suspend idle, wake on request</text>
<rect x="1290" y="56" width="286" height="304" rx="7" class="s3"/>
<line class="l-lite" x1="1136" y1="150" x2="1286" y2="150" marker-end="url(#a-lite)"/>
<line class="l-lite" x1="1286" y1="182" x2="1136" y2="182" stroke-dasharray="6 5" marker-end="url(#a-lite)"/>
<rect x="1146" y="121" width="131" height="15" rx="3" class="halo"/>
<text class="t4b c-lite" x="1211" y="132" style="text-anchor:middle">publish · on a cadence</text>
<rect x="1151" y="195" width="119" height="30" rx="3" class="halo"/>
<text class="t4b c-lite" x="1211" y="206" style="text-anchor:middle">hydrate · on demand</text>
<text class="t4" x="1211" y="221" style="text-anchor:middle">RPO = the cadence</text>
<text class="t1" x="1308" y="84">S3 — the durable copy</text>
<text class="mono" x="1308" y="114" xml:space="preserve">&lt;prefix&gt;/&lt;path&gt;</text>
<text class="t4" x="1308" y="132">whole-file generations, untorn</text>
<text class="mono" x="1308" y="164" xml:space="preserve">.flint/epoch · manifest · owner</text>
<text class="t4" x="1308" y="182">who is the hub · the DR document</text>
<line class="hair" x1="1308" y1="200" x2="1558" y2="200"/>
<text class="t4b" x="1308" y="226">the bucket trusts ONE principal:</text>
<text class="t4" x="1308" y="244">the hub. Consumers never hold a</text>
<text class="t4" x="1308" y="262">credential; they use :2049.</text>
<text class="t4" x="1308" y="294">everything durable is here,</text>
<text class="t4" x="1308" y="312">everything fast is on the disk.</text>
<rect x="24" y="464" width="1552" height="54" rx="7" class="bx"/>
<path class="f-red" d="M24,471 A7,7 0 0 1 31,464 H29 V518 H31 A7,7 0 0 1 24,511 Z"/>
<text class="t4b c-red" x="48" y="486">port 2049 authenticates nobody — reachability is the boundary; the :8080 token is per share, not per user; a second hub on one prefix is split-brain, which the epoch cell fences.</text>
<line class="l-ink" x1="28" y1="544" x2="54" y2="544"/>
<text class="t4" x="60" y="548">data path</text>
<line class="l-ctl" x1="127.98" y1="544" x2="153.98000000000002" y2="544" stroke-dasharray="6 5"/>
<text class="t4" x="160" y="548">control</text>
<rect x="217" y="537" width="5" height="14" rx="2" class="f-red"/>
<text class="t4" x="229" y="548">hazard / trust boundary</text>
</svg>
