<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 636" role="img"
     aria-label="flint-passthrough, drawn as a flow: every file operation in the tenant pod is intercepted by FUSE and served by an unprivileged worker running mount-s3, which turns it into GET, PUT or LIST against the S3 prefix; nothing is buffered. The node plugin's mount(2), the descriptor hand-off and the broker are control, off the data path. The bucket is mounted as-is, with no flint control namespace.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .t1{font-size:17.0px;font-weight:600}
  .t2{font-size:13.0px;font-weight:600}
  .t3{font-size:12.0px}
  .t3b{font-size:12.0px;font-weight:600;fill:#334155}
  .t4{font-size:11.0px;fill:#64748b}
  .t4b{font-size:11.0px;font-weight:600;fill:#334155}
  .mono{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:10.5px;fill:#334155}
  .mute{fill:#64748b}
  .cap{font-size:9.5px;font-weight:600;letter-spacing:.1em;fill:#64748b}
  .num{font-size:11.0px;font-weight:600;fill:#ffffff}
  .on{font-size:13.0px;font-weight:600;fill:#ffffff}
  .onsub{font-size:11.0px;fill:#ffffff;opacity:.85}
  .c-red{fill:#b4232a}
  .c-lite{fill:#184f95} .c-lean{fill:#0f7a55} .c-pass{fill:#7d530c} .c-forge{fill:#8c2449}
  .f-lite{fill:#184f95} .f-lean{fill:#1baf7a} .f-pass{fill:#a06b12} .f-forge{fill:#b03060}
  .f-red{fill:#b4232a} .f-ink{fill:#334155}
  .b-lite{fill:#eef3fa;stroke:#184f95;stroke-width:1.4} .b-lean{fill:#ecf8f2;stroke:#1baf7a;stroke-width:1.4} .b-pass{fill:#faf3e6;stroke:#a06b12;stroke-width:1.4} .b-forge{fill:#faedf2;stroke:#b03060;stroke-width:1.4}
  .hd-lite{fill:#184f95} .hd-lean{fill:#0f7a55} .hd-pass{fill:#7d530c} .hd-forge{fill:#8c2449}
  .hd-lbl{fill:#334155}
  .l-lite{stroke:#184f95;stroke-width:2.2;fill:none} .l-lean{stroke:#1baf7a;stroke-width:2.2;fill:none} .l-pass{stroke:#a06b12;stroke-width:2.2;fill:none} .l-forge{stroke:#b03060;stroke-width:2.2;fill:none}
  .l-ctl{stroke:#94a3b8;stroke-width:1.6;fill:none}
  .l-ink{stroke:#334155;stroke-width:2.2;fill:none}
  .l-red{stroke:#b4232a;stroke-width:2.2;fill:none}
  .bx{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4}
  .panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}
  .s3{fill:#f1f5f9;stroke:#64748b;stroke-width:1.6}
  .grp{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:7 5}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .lbl{fill:#f8fafc} .rowb{fill:#fbfcfd}
  .frame{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .halo{fill:#ffffff}
  .chip{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
  .chip-red{fill:#b4232a}
  .chip-lite{fill:#184f95} .chip-lean{fill:#0f7a55} .chip-pass{fill:#7d530c} .chip-forge{fill:#8c2449}
  .chip .cap{fill:#334155}
  /* On a filled shape. Last on purpose: a class beats a presentation
     attribute, so this must win over .t4/.cap/.mono. */
  .on,.num,.onsub{fill:#ffffff}
  .cap.on{fill:#ffffff}
</style>
<defs><marker id="a-lite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="a-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker><marker id="a-forge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03060"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/></marker></defs>
<rect x="24" y="22" width="452" height="330" rx="10" class="grp"/>
<text class="cap" x="40" y="44">TENANT NAMESPACE</text>
<text class="t4" x="172" y="44">PodSecurity restricted — and it stays that way</text>
<rect x="44" y="56" width="412" height="190" rx="7" class="bx"/>
<path class="f-pass" d="M51,56 H449 A7,7 0 0 1 456,63 V61 H44 V63 A7,7 0 0 1 51,56 Z"/>
<text class="t2 c-pass" x="62" y="82">the tenant pod</text>
<text class="mono" x="62" y="106" xml:space="preserve">volumes:</text>
<text class="mono" x="62" y="123" xml:space="preserve">  - name: data</text>
<text class="mono" x="62" y="140" xml:space="preserve">    csi:</text>
<text class="mono" x="62" y="157" xml:space="preserve">      driver: s3.csi.chert.us</text>
<text class="mono" x="62" y="174" xml:space="preserve">      volumeAttributes:</text>
<text class="mono" x="62" y="191" xml:space="preserve">        chert.us/mount: datasets</text>
<text class="t4" x="62" y="228">nine lines of pod spec — no sidecar, label, credential or privilege</text>
<rect x="44" y="262" width="412" height="76" rx="7" class="bx"/>
<text class="t2" x="60" y="286">FlintPassthroughMount — in the pod's namespace</text>
<text class="mono" x="60" y="306" xml:space="preserve">bucket · keyPrefix · readOnly · uid · consumers</text>
<line class="l-pass" x1="456" y1="120" x2="576" y2="120" marker-start="url(#a-pass)" marker-end="url(#a-pass)"/>
<rect x="479" y="93" width="73" height="30" rx="3" class="halo"/>
<text class="t4b c-pass" x="516" y="104" style="text-anchor:middle">FUSE</text>
<text class="t4" x="516" y="119" style="text-anchor:middle">every file op</text>
<rect x="580" y="56" width="300" height="130" rx="7" class="bx"/>
<path class="f-pass" d="M587,56 H873 A7,7 0 0 1 880,63 V61 H580 V63 A7,7 0 0 1 587,56 Z"/>
<text class="t2 c-pass" x="596" y="80">mount-s3 worker — unprivileged</text>
<text class="mono" x="596" y="100" xml:space="preserve">serves the fd it was given</text>
<text class="t4" x="596" y="115">non-root · no caps · read-only rootfs · no SA token</text>
<text class="t4b" x="596" y="130">needs no privilege: mount(2) already happened</text>
<line class="l-pass" x1="880" y1="120" x2="1214" y2="120" marker-start="url(#a-pass)" marker-end="url(#a-pass)"/>
<rect x="953" y="93" width="188" height="30" rx="3" class="halo"/>
<text class="t4b c-pass" x="1047" y="104" style="text-anchor:middle">GET · PUT · LIST · per operation</text>
<text class="t4" x="1047" y="119" style="text-anchor:middle">no RPO — nothing is buffered</text>
<rect x="580" y="214" width="300" height="118" rx="7" class="bx"/>
<text class="t2" x="596" y="238">flint-s3-broker — the only standing credential</text>
<text class="t4" x="596" y="258">online TokenReview · registration · consumers</text>
<text class="mono" x="596" y="273" xml:space="preserve">→ short-lived keys, on a loopback door</text>
<line class="l-ctl" x1="730" y1="214" x2="730" y2="190" stroke-dasharray="6 5" marker-end="url(#a-ctl)"/>
<rect x="1218" y="56" width="358" height="276" rx="7" class="s3"/>
<text class="t1" x="1238" y="84">S3 — and it is just S3</text>
<text class="mono" x="1238" y="114" xml:space="preserve">&lt;prefix&gt;/&lt;key&gt;</text>
<text class="t4" x="1238" y="132">objects appear as files, and nothing else is written</text>
<line class="hair" x1="1238" y1="150" x2="1554" y2="150"/>
<text class="t4" x="1238" y="176">no control namespace: a prefix someone else's</text>
<text class="t4" x="1238" y="194">tooling owns stays exactly as it was.</text>
<text class="t4b" x="1238" y="226">durability, consistency and access control are</text>
<text class="t4b" x="1238" y="244">S3's, unmediated — flint adds and removes none.</text>
<text class="t4" x="1238" y="276">one uid inside the pod; two pods on one prefix</text>
<text class="t4" x="1238" y="294">do not see each other.</text>
<rect x="24" y="374" width="816" height="132" rx="10" class="grp"/>
<text class="cap" x="40" y="396">S3.CSI.CHERT.US — THE NODE DAEMONSET · CONTROL</text>
<text class="t4" x="358" y="396">one privileged process per node — no S3 credential, no Secrets RBAC</text>
<line class="l-ctl" x1="250" y1="374" x2="250" y2="346" stroke-dasharray="6 5" marker-end="url(#a-ctl)"/>
<text class="t4" x="262" y="364">NodePublishVolume</text>
<line class="l-ctl" x1="730" y1="374" x2="730" y2="336" stroke-dasharray="6 5" marker-end="url(#a-ctl)"/>
<text class="t4" x="742" y="364">/dev/fuse fd</text>
<circle cx="56" cy="444" r="11" class="f-pass"/>
<text class="num" x="56" y="448" style="text-anchor:middle">1</text>
<text class="t2" x="76" y="448">resolve the CR</text>
<text class="t4" x="76" y="466">in the token's</text>
<text class="t4" x="76" y="481">namespace</text>
<circle cx="214" cy="444" r="11" class="f-pass"/>
<text class="num" x="214" y="448" style="text-anchor:middle">2</text>
<text class="t2" x="234" y="448">authorise the SA</text>
<text class="t4" x="234" y="466">consumers — absent</text>
<text class="t4" x="234" y="481">means deny</text>
<circle cx="371" cy="444" r="11" class="f-pass"/>
<text class="num" x="371" y="448" style="text-anchor:middle">3</text>
<text class="t2" x="391" y="448">mount(2) itself</text>
<text class="t4" x="391" y="466">the one privileged</text>
<text class="t4" x="391" y="481">act</text>
<circle cx="529" cy="444" r="11" class="f-pass"/>
<text class="num" x="529" y="448" style="text-anchor:middle">4</text>
<text class="t2" x="549" y="448">hand the fd over</text>
<text class="t4" x="549" y="466">SCM_RIGHTS, to</text>
<text class="t4" x="549" y="481">the worker</text>
<circle cx="686" cy="444" r="11" class="f-pass"/>
<text class="num" x="686" y="448" style="text-anchor:middle">5</text>
<text class="t2" x="706" y="448">bind into the pod</text>
<text class="t4" x="706" y="466">one Bidirectional</text>
<text class="t4" x="706" y="481">view</text>
<rect x="24" y="528" width="1552" height="54" rx="7" class="bx"/>
<path class="f-red" d="M24,535 A7,7 0 0 1 31,528 H29 V582 H31 A7,7 0 0 1 24,575 Z"/>
<text class="t4b c-red" x="48" y="550">NOT POSIX — no rename, no append, no in-place write   ·   NOT coordinated — two pods on one prefix do not see each other   ·   NOT per-user — one uid   ·   NOT self-healing — a dead mounter strands the pod on ENOTCONN</text>
<text class="t4" x="48" y="570">privilege: the node plugin, one per node · the workers, none · the tenant pod, none · the broker holds the only standing credential — the same chain flint-lean uses</text>
<line class="l-ink" x1="28" y1="608" x2="54" y2="608"/>
<text class="t4" x="60" y="612">data path</text>
<line class="l-ctl" x1="127.98" y1="608" x2="153.98000000000002" y2="608" stroke-dasharray="6 5"/>
<text class="t4" x="160" y="612">control</text>
<rect x="217" y="601" width="5" height="14" rx="2" class="f-red"/>
<text class="t4" x="229" y="612">hazard / trust boundary</text>
</svg>
