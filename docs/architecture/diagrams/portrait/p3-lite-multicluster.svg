<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img"
     aria-label="Three clusters mounting one flint-lite hub. The wire is identical from each and the hub sees only client names, so two clusters sharing a node hostname collide as one client. Three requirements the fleet must supply: unique client names, a network boundary, and a keepalive.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .tt{font-size:13px;font-weight:600}
  .th{font-size:11.5px;font-weight:600}
  .tx{font-size:10.5px;fill:#64748b}
  .tsb{font-size:10.5px;font-weight:600;fill:#475569}
  .mns{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:9.5px;fill:#475569}
  .ctr{text-anchor:middle}
  .c-blue{fill:#1a5f9e}.c-ochre{fill:#a06b12}.c-red{fill:#b4232a}
  .bx{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
  .bx-blue{fill:#e9f2fa;stroke:#1a5f9e;stroke-width:1.4}
  .bx-hub{fill:#f7fbfe;stroke:#1a5f9e;stroke-width:2}
  .bx-ochre{fill:#fbf2de;stroke:#a06b12;stroke-width:1.6}
  .bx-warn{fill:#fdf2f2;stroke:#b4232a;stroke-width:1.4}
  .bx-slate{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.2}
  .ln-blue{stroke:#1a5f9e;stroke-width:1.8;fill:none}
  .ln-ochre{stroke:#a06b12;stroke-width:1.8;fill:none}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .num{fill:#b4232a}
  .numt{font-size:10px;font-weight:600;fill:#ffffff}
</style>
<defs>
  <marker id="p3-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a5f9e"/></marker>
  <marker id="p3-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker>
</defs>

<rect x="8" y="6" width="186" height="44" rx="6" class="bx"/>
<text class="th" x="20" y="24">Cluster A</text>
<text class="mns" x="20" y="41">hostname "agent-7"</text>

<rect x="8" y="58" width="186" height="44" rx="6" class="bx-warn"/>
<text class="th c-red" x="20" y="76">Cluster B</text>
<text class="mns" x="20" y="93">hostname "agent-7"  ← COLLIDES</text>

<rect x="8" y="110" width="186" height="44" rx="6" class="bx"/>
<text class="th" x="20" y="128">Cluster C</text>
<text class="mns" x="20" y="145">hostname "builder-2"</text>

<path class="ln-blue" d="M194 28 L232 28 L232 74" marker-end="url(#p3-b)"/>
<path class="ln-blue" d="M194 80 L232 80" marker-end="url(#p3-b)"/>
<path class="ln-blue" d="M194 132 L232 132 L232 86" marker-end="url(#p3-b)"/>
<text class="tsb c-blue ctr" x="232" y="164">NFSv4.2</text>

<rect x="252" y="20" width="196" height="130" rx="7" class="bx-hub"/>
<text class="tt c-blue" x="266" y="42">ONE hub</text>
<text class="tx" x="266" y="59">one project, one prefix</text>
<line class="hair" x1="266" y1="70" x2="434" y2="70"/>
<text class="tsb" x="266" y="88">A hub does not count</text>
<text class="tsb" x="266" y="104">clusters. It sees CLIENTS,</text>
<text class="tsb" x="266" y="120">and a client is a NAME.</text>
<text class="tx" x="266" y="136">Nothing makes a cluster visible.</text>

<line class="ln-ochre" x1="448" y1="70" x2="486" y2="70" marker-end="url(#p3-o)"/>
<rect x="490" y="20" width="142" height="130" rx="7" class="bx-ochre"/>
<text class="tt c-ochre" x="504" y="42">S3</text>
<text class="tx" x="504" y="60">the durable copy</text>
<line class="hair" x1="504" y1="70" x2="618" y2="70"/>
<text class="mns" x="504" y="88">.flint/epoch</text>
<text class="tx" x="504" y="105">fences a second hub —</text>
<text class="tx" x="504" y="121">but only when prefixes</text>
<text class="tx" x="504" y="137">are EXACTLY equal.</text>

<rect x="8" y="176" width="624" height="106" rx="7" class="bx-slate"/>
<text class="tt" x="24" y="197">What the FLEET must supply — the chart and the protocol cannot</text>
<circle cx="34" cy="219" r="9" class="num"/><text class="numt ctr" x="34" y="223">1</text>
<text class="th" x="50" y="223">A unique name per client.</text>
<text class="tx" x="196" y="223">Two clusters sharing a node name are ONE client, and the</text>
<text class="tx" x="50" y="239">protocol requires the server to treat the second as the first REBOOTING — the incumbent's locks just go.</text>
<circle cx="34" cy="257" r="9" class="num"/><text class="numt ctr" x="34" y="261">2</text>
<text class="th" x="50" y="261">A network boundary.</text>
<text class="tx" x="172" y="261">kube-proxy SNATs remote clients to the hub cluster's own gateway:</text>
<text class="tx" x="50" y="277">1486 of 1486 connections measured. networkPolicy cannot draw this line — use peering, SGs or a gateway.</text>

<rect x="8" y="290" width="624" height="102" rx="7" class="bx-warn"/>
<circle cx="34" cy="312" r="9" class="num"/><text class="numt ctr" x="34" y="316">3</text>
<text class="th c-red" x="50" y="316">A keepalive per remote mount.</text>
<text class="tx" x="240" y="316">The idle ladder suspends a quiet share, and a partitioned</text>
<text class="tx" x="50" y="332">cluster's busy agents look exactly like idle ones. `suspendWithSessions` DEFAULTS to suspending anyway.</text>
<text class="th c-red" x="50" y="356">The failure mode is silent by construction.</text>
<text class="tx" x="50" y="374">A colliding client gets no error: the server does the correct thing with a false premise, and the loser's state</text>
<text class="tx" x="50" y="388">is simply gone. Nothing logs an anomaly, because to the hub none occurred. Six defects traced to this cause.</text>
</svg>
