<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img"
     aria-label="flint-lean: the CSI node plugin owns a tree that is bind-mounted into the agent pod as plain local files and hostPathed into an unprivileged flint-sync worker, which checks out from and publishes to S3. Below, the four-step loop from pod start to a durable acknowledged boundary.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .tt{font-size:13px;font-weight:600}
  .th{font-size:11.5px;font-weight:600}
  .tx{font-size:10.5px;fill:#64748b}
  .tsb{font-size:10.5px;font-weight:600;fill:#475569}
  .mns{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:9.5px;fill:#475569}
  .mn{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:10.5px}
  .ctr{text-anchor:middle}
  .c-violet{fill:#6d4aa8}.c-ochre{fill:#a06b12}
  .bx{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}
  .bx-violet{fill:#f0eafb;stroke:#6d4aa8;stroke-width:1.4}
  .bx-pod{fill:#fcfaff;stroke:#6d4aa8;stroke-width:2}
  .bx-ochre{fill:#fbf2de;stroke:#a06b12;stroke-width:1.6}
  .bx-slate{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.2}
  .ln-violet{stroke:#6d4aa8;stroke-width:1.8;fill:none}
  .ln-ochre{stroke:#a06b12;stroke-width:1.8;fill:none}
  .dash{stroke-dasharray:4 3}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .num{fill:#6d4aa8}
  .numt{font-size:10px;font-weight:600;fill:#ffffff}
</style>
<defs>
  <marker id="p4-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d4aa8"/></marker>
  <marker id="p4-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker>
</defs>

<rect x="8" y="6" width="200" height="96" rx="7" class="bx-pod"/>
<text class="tt c-violet" x="22" y="27">the agent pod</text>
<text class="mns" x="22" y="46">/workspace</text>
<text class="tx" x="22" y="63">PLAIN FILES on local disk.</text>
<text class="tx" x="22" y="79">Full POSIX, zero interception.</text>
<text class="tsb" x="22" y="95">It holds NO S3 credential.</text>

<line class="ln-violet" x1="208" y1="54" x2="238" y2="54" marker-end="url(#p4-v)"/>
<text class="tx ctr" x="223" y="44">bind</text>

<rect x="242" y="6" width="150" height="96" rx="7" class="bx-violet"/>
<text class="th c-violet ctr" x="317" y="27">the plugin-owned tree</text>
<text class="mns ctr" x="317" y="47">volumes/&lt;vid&gt;/tree</text>
<line class="hair" x1="256" y1="58" x2="378" y2="58"/>
<text class="tx ctr" x="317" y="76">ONE tree, two views —</text>
<text class="tx ctr" x="317" y="92">the pod's and the worker's</text>

<line class="ln-violet" x1="392" y1="54" x2="422" y2="54" marker-end="url(#p4-v)"/>
<text class="tx ctr" x="407" y="44">hostPath</text>

<rect x="426" y="6" width="206" height="96" rx="7" class="bx-violet"/>
<text class="th c-violet" x="440" y="27">flint-sync — the worker pod</text>
<text class="tx" x="440" y="45">unprivileged, non-root, in a</text>
<text class="tx" x="440" y="61">SYSTEM namespace</text>
<text class="tsb" x="440" y="80">It holds the credential the</text>
<text class="tsb" x="440" y="96">agent must not.</text>

<line class="ln-ochre" x1="529" y1="102" x2="529" y2="132" marker-end="url(#p4-o)"/>
<text class="tsb c-ochre" x="537" y="122">publish / checkout</text>

<rect x="426" y="136" width="206" height="106" rx="7" class="bx-ochre"/>
<text class="tt c-ochre" x="440" y="158">S3 — the durable copy</text>
<line class="hair" x1="440" y1="168" x2="618" y2="168"/>
<text class="mns" x="440" y="186">&lt;prefix&gt;/files/&lt;path&gt;</text>
<text class="mns" x="440" y="203">.flint/lean/epoch · claim</text>
<text class="mns" x="440" y="220">.flint/lean/current</text>
<text class="tsb" x="440" y="238">The lease lives HERE, so it</text>

<rect x="8" y="112" width="404" height="130" rx="7" class="bx-slate"/>
<text class="tt" x="22" y="133">The loop — one agent, start to durable</text>
<circle cx="34" cy="155" r="9" class="num"/><text class="numt ctr" x="34" y="159">1</text>
<text class="th" x="50" y="159">pod starts</text>
<text class="tx" x="130" y="159">checkout completes BEFORE the agent's first line</text>
<circle cx="34" cy="181" r="9" class="num"/><text class="numt ctr" x="34" y="185">2</text>
<text class="th" x="50" y="185">the agent works</text>
<text class="tx" x="160" y="185">local files at local speed; git and sqlite work</text>
<circle cx="34" cy="207" r="9" class="num"/><text class="numt ctr" x="34" y="211">3</text>
<text class="th" x="50" y="211">it declares a boundary</text>
<text class="mn" x="192" y="211">echo &gt; .flint/publish</text>
<circle cx="34" cy="233" r="9" class="num"/><text class="numt ctr" x="34" y="237">4</text>
<text class="th" x="50" y="237">the sidecar answers</text>
<text class="mn" x="172" y="237">.flint/publish.ack</text>
<text class="tx" x="290" y="237">— ok = it is in S3</text>

<rect x="8" y="254" width="624" height="66" rx="7" class="bx-slate"/>
<text class="th" x="22" y="275">The ordering is the architecture.</text>
<text class="tx" x="200" y="275">kubelet blocks every container on NodePublishVolume, so the checkout</text>
<text class="tx" x="22" y="292">finishes before the agent runs — no init container, no readiness dance — and calls NodeUnpublish only after</text>
<text class="tx" x="22" y="308">every container has exited, which is where the final barrier goes. That ordering is why lean needs no FUSE.</text>

<rect x="8" y="330" width="624" height="72" rx="7" class="bx-violet"/>
<text class="th c-violet" x="22" y="351">Gated mode — durability and visibility become separate events</text>
<text class="tx" x="22" y="369">The upload lane runs continuously: every changed file becomes a new object version, durable immediately and</text>
<text class="tx" x="22" y="385">INVISIBLE. One CAS then installs the whole pending set, so a reader sees the entire change or none of it.</text>
<text class="tx" x="22" y="398">Gated is REFUSED without a lag bound — unbounded staleness is impossible by construction, not by convention.</text>
</svg>
