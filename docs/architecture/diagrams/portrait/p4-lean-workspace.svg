<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img"
     aria-label="flint-lean: the CSI node plugin owns a tree bind-mounted into the agent pod as plain local files and hostPathed into an unprivileged flint-sync worker that checks out from and publishes to S3.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .t1{font-size:14.96px;font-weight:600}
  .t2{font-size:11.44px;font-weight:600}
  .t3{font-size:10.56px}
  .t3b{font-size:10.56px;font-weight:600;fill:#334155}
  .t4{font-size:9.68px;fill:#64748b}
  .t4b{font-size:9.68px;font-weight:600;fill:#334155}
  .mono{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:9.24px;fill:#334155}
  .mute{fill:#64748b}
  .cap{font-size:8.36px;font-weight:600;letter-spacing:.1em;fill:#64748b}
  .num{font-size:9.68px;font-weight:600;fill:#ffffff}
  .on{font-size:11.44px;font-weight:600;fill:#ffffff}
  .onsub{font-size:9.68px;fill:#ffffff;opacity:.85}
  .c-red{fill:#b4232a}
  .c-lite{fill:#184f95} .c-lean{fill:#0f7a55} .c-pass{fill:#7d530c} .c-forge{fill:#8c2449}
  .f-lite{fill:#184f95} .f-lean{fill:#1baf7a} .f-pass{fill:#a06b12} .f-forge{fill:#b03060}
  .f-red{fill:#b4232a} .f-ink{fill:#334155}
  .b-lite{fill:#eef3fa;stroke:#184f95;stroke-width:1.4} .b-lean{fill:#ecf8f2;stroke:#1baf7a;stroke-width:1.4} .b-pass{fill:#faf3e6;stroke:#a06b12;stroke-width:1.4} .b-forge{fill:#faedf2;stroke:#b03060;stroke-width:1.4}
  .hd-lite{fill:#184f95} .hd-lean{fill:#0f7a55} .hd-pass{fill:#7d530c} .hd-forge{fill:#8c2449}
  .hd-lbl{fill:#334155}
  .l-lite{stroke:#184f95;stroke-width:2.2;fill:none} .l-lean{stroke:#1baf7a;stroke-width:2.2;fill:none} .l-pass{stroke:#a06b12;stroke-width:2.2;fill:none} .l-forge{stroke:#b03060;stroke-width:2.2;fill:none}
  .l-ctl{stroke:#94a3b8;stroke-width:1.6;fill:none}
  .l-ink{stroke:#334155;stroke-width:2.2;fill:none}
  .l-red{stroke:#b4232a;stroke-width:2.2;fill:none}
  .bx{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4}
  .panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}
  .s3{fill:#f1f5f9;stroke:#64748b;stroke-width:1.6}
  .grp{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:7 5}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .lbl{fill:#f8fafc} .rowb{fill:#fbfcfd}
  .frame{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .halo{fill:#ffffff}
  .chip{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
  .chip-red{fill:#b4232a}
  .chip-lite{fill:#184f95} .chip-lean{fill:#0f7a55} .chip-pass{fill:#7d530c} .chip-forge{fill:#8c2449}
  .chip .cap{fill:#334155}
  /* On a filled shape. Last on purpose: a class beats a presentation
     attribute, so this must win over .t4/.cap/.mono. */
  .on,.num,.onsub{fill:#ffffff}
  .cap.on{fill:#ffffff}
</style>
<defs><marker id="a-lite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="a-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker><marker id="a-forge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03060"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/></marker></defs>
<rect x="8" y="8" width="420" height="250" rx="10" class="grp"/>
<text class="cap" x="24" y="30">ONE NODE</text>
<rect x="24" y="38" width="180" height="110" rx="7" class="bx"/>
<text class="t2" x="40" y="62">the agent pod</text>
<text class="mono" x="40" y="82" xml:space="preserve">/workspace</text>
<text class="t4" x="40" y="95">plain local files, full POSIX, zero</text>
<text class="t4" x="40" y="108">interception; no S3 credential</text>
<line class="l-lean" x1="204" y1="92" x2="232" y2="92" marker-end="url(#a-lean)"/>
<rect x="236" y="60" width="80" height="64" rx="7" class="b-lean"/>
<text class="mono" x="244" y="84" xml:space="preserve">the tree</text>
<text class="t4" x="244" y="97">one tree, two</text>
<text class="t4" x="244" y="110">views</text>
<line class="l-lean" x1="316" y1="92" x2="344" y2="92" marker-end="url(#a-lean)"/>
<rect x="348" y="38" width="64" height="110" rx="7" class="bx"/>
<path class="f-lean" d="M355,38 H405 A7,7 0 0 1 412,45 V43 H348 V45 A7,7 0 0 1 355,38 Z"/>
<text class="t4b" x="356" y="62">flint-sync</text>
<text class="t4" x="356" y="75">the</text>
<text class="t4" x="356" y="88">worker;</text>
<text class="t4" x="356" y="101">holds the</text>
<text class="t4" x="356" y="114">credential</text>
<rect x="24" y="160" width="388" height="84" rx="7" class="panel"/>
<text class="t2" x="40" y="184">s3.csi.chert.us — the node DaemonSet</text>
<text class="t4" x="40" y="204">kubelet blocks the pod on NodePublishVolume, so the checkout completes</text>
<text class="t4" x="40" y="217">BEFORE the agent's first line; the final barrier runs on NodeUnpublish.</text>
<line class="l-lean" x1="428" y1="110" x2="468" y2="110" marker-start="url(#a-lean)" marker-end="url(#a-lean)"/>
<rect x="400" y="87" width="97" height="15" rx="3" class="halo"/>
<text class="t4b c-lean" x="448" y="98" style="text-anchor:middle">checkout · publish</text>
<rect x="472" y="8" width="160" height="250" rx="7" class="s3"/>
<text class="t2" x="482" y="32">S3</text>
<text class="mono" x="482" y="52" xml:space="preserve">files/&lt;path&gt;</text>
<text class="mono" x="482" y="65" xml:space="preserve">.flint/lean/epoch</text>
<text class="mono" x="482" y="78" xml:space="preserve">  claim · manifest</text>
<text class="mono" x="482" y="91" xml:space="preserve">  inbox · conflicts/</text>
<text class="t4" x="482" y="104">the lease lives in the BUCKET,</text>
<text class="t4" x="482" y="117">so one writer holds across</text>
<text class="t4" x="482" y="130">clusters</text>
<rect x="8" y="272" width="306" height="138" rx="7" class="bx"/>
<path class="f-lean" d="M15,272 H307 A7,7 0 0 1 314,279 V277 H8 V279 A7,7 0 0 1 15,272 Z"/>
<text class="t2 c-lean" x="24" y="296">The loop</text>
<text class="t4" x="24" y="316">1 · pod starts: checkout first</text>
<text class="t4" x="24" y="329">2 · the agent works at disk speed</text>
<text class="mono" x="24" y="342" xml:space="preserve">3 · echo &gt; .flint/publish</text>
<text class="mono" x="24" y="355" xml:space="preserve">4 · .flint/publish.ack = ok</text>
<text class="t4" x="24" y="368">ok means the bytes are in S3. RPO = the last barrier, ≤</text>
<text class="t4" x="24" y="381">floorSecs on a hard kill.</text>
<rect x="326" y="272" width="306" height="138" rx="7" class="bx"/>
<path class="f-lean" d="M333,272 H625 A7,7 0 0 1 632,279 V277 H326 V279 A7,7 0 0 1 333,272 Z"/>
<text class="t2 c-lean" x="342" y="296">Gated mode</text>
<text class="t4" x="342" y="316">every changed file is uploaded as a new version at once —</text>
<text class="t4" x="342" y="329">durable and INVISIBLE — and one CAS cites the whole</text>
<text class="t4" x="342" y="342">pending set. A reader sees all of a change or none of it; gated</text>
<text class="t4" x="342" y="355">is refused without a lag bound.</text>
</svg>
