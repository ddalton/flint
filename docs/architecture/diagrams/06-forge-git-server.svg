<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 642" role="img"
     aria-label="flint-forge, drawn as a flow: an agent pod's stock git pushes and fetches over smart HTTP through the door, which verifies the pod's ServiceAccount token and routes to one server pod per repository; there gitcgi and git-http-backend serve, hooks hand every push to one syncer, and the syncer uploads packs, CASes one snapshot and only then acknowledges. S3 holds a bare repository. The lease, the operator and the presigned levers are control.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .t1{font-size:17.0px;font-weight:600}
  .t2{font-size:13.0px;font-weight:600}
  .t3{font-size:12.0px}
  .t3b{font-size:12.0px;font-weight:600;fill:#334155}
  .t4{font-size:11.0px;fill:#64748b}
  .t4b{font-size:11.0px;font-weight:600;fill:#334155}
  .mono{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:10.5px;fill:#334155}
  .mute{fill:#64748b}
  .cap{font-size:9.5px;font-weight:600;letter-spacing:.1em;fill:#64748b}
  .num{font-size:11.0px;font-weight:600;fill:#ffffff}
  .on{font-size:13.0px;font-weight:600;fill:#ffffff}
  .onsub{font-size:11.0px;fill:#ffffff;opacity:.85}
  .c-red{fill:#b4232a}
  .c-lite{fill:#184f95} .c-lean{fill:#0f7a55} .c-pass{fill:#7d530c} .c-forge{fill:#8c2449}
  .f-lite{fill:#184f95} .f-lean{fill:#1baf7a} .f-pass{fill:#a06b12} .f-forge{fill:#b03060}
  .f-red{fill:#b4232a} .f-ink{fill:#334155}
  .b-lite{fill:#eef3fa;stroke:#184f95;stroke-width:1.4} .b-lean{fill:#ecf8f2;stroke:#1baf7a;stroke-width:1.4} .b-pass{fill:#faf3e6;stroke:#a06b12;stroke-width:1.4} .b-forge{fill:#faedf2;stroke:#b03060;stroke-width:1.4}
  .hd-lite{fill:#184f95} .hd-lean{fill:#0f7a55} .hd-pass{fill:#7d530c} .hd-forge{fill:#8c2449}
  .hd-lbl{fill:#334155}
  .l-lite{stroke:#184f95;stroke-width:2.2;fill:none} .l-lean{stroke:#1baf7a;stroke-width:2.2;fill:none} .l-pass{stroke:#a06b12;stroke-width:2.2;fill:none} .l-forge{stroke:#b03060;stroke-width:2.2;fill:none}
  .l-ctl{stroke:#94a3b8;stroke-width:1.6;fill:none}
  .l-ink{stroke:#334155;stroke-width:2.2;fill:none}
  .l-red{stroke:#b4232a;stroke-width:2.2;fill:none}
  .bx{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4}
  .panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}
  .s3{fill:#f1f5f9;stroke:#64748b;stroke-width:1.6}
  .grp{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:7 5}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .lbl{fill:#f8fafc} .rowb{fill:#fbfcfd}
  .frame{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .halo{fill:#ffffff}
  .chip{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
  .chip-red{fill:#b4232a}
  .chip-lite{fill:#184f95} .chip-lean{fill:#0f7a55} .chip-pass{fill:#7d530c} .chip-forge{fill:#8c2449}
  .chip .cap{fill:#334155}
  /* On a filled shape. Last on purpose: a class beats a presentation
     attribute, so this must win over .t4/.cap/.mono. */
  .on,.num,.onsub{fill:#ffffff}
  .cap.on{fill:#ffffff}
</style>
<defs><marker id="a-lite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="a-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker><marker id="a-forge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03060"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/></marker></defs>
<rect x="24" y="22" width="250" height="178" rx="7" class="bx"/>
<path class="f-forge" d="M31,22 H267 A7,7 0 0 1 274,29 V27 H24 V29 A7,7 0 0 1 31,22 Z"/>
<text class="t2 c-forge" x="40" y="46">the agent pod — any namespace</text>
<text class="mono" x="40" y="66" xml:space="preserve">helper: flint-forge-credential</text>
<text class="t4" x="40" y="81">stock git; the pod's token is the Basic</text>
<text class="t4" x="40" y="96">password</text>
<text class="t4b" x="40" y="111">no bucket credential, no sidecar, no</text>
<text class="t4b" x="40" y="126">privilege</text>
<line class="l-forge" x1="274" y1="110" x2="384" y2="110" marker-start="url(#a-forge)" marker-end="url(#a-forge)"/>
<rect x="282" y="83" width="94" height="30" rx="3" class="halo"/>
<text class="t4b c-forge" x="329" y="94" style="text-anchor:middle">git smart HTTP</text>
<text class="t4" x="329" y="109" style="text-anchor:middle">push ↑ · fetch ↓</text>
<rect x="388" y="22" width="270" height="178" rx="7" class="bx"/>
<path class="f-forge" d="M395,22 H651 A7,7 0 0 1 658,29 V27 H388 V29 A7,7 0 0 1 395,22 Z"/>
<text class="t2 c-forge" x="404" y="46">the door — the lite gateway's git arm</text>
<text class="t4" x="404" y="66">TokenReview ≤ 60 s · consumers · routes ·</text>
<text class="t4" x="404" y="81">wakes</text>
<text class="mono" x="404" y="96" xml:space="preserve">forwards X-Remote-User only</text>
<text class="t4b" x="404" y="111">stateless; holds a wake request ≤ 180 s</text>
<line class="l-forge" x1="658" y1="110" x2="770" y2="110" marker-start="url(#a-forge)" marker-end="url(#a-forge)"/>
<rect x="666" y="83" width="96" height="30" rx="3" class="halo"/>
<text class="t4b c-forge" x="714" y="94" style="text-anchor:middle">HTTP</text>
<text class="t4" x="714" y="109" style="text-anchor:middle">+ X-Remote-User</text>
<rect x="774" y="22" width="466" height="178" rx="7" class="bx"/>
<path class="f-forge" d="M781,22 H1233 A7,7 0 0 1 1240,29 V27 H774 V29 A7,7 0 0 1 781,22 Z"/>
<text class="t2 c-forge" x="792" y="48">one server pod per FlintRepo — emptyDir cache, idles to zero</text>
<rect x="792" y="62" width="208" height="122" rx="7" class="bx"/>
<text class="t2" x="808" y="86">git container</text>
<text class="mono" x="808" y="106" xml:space="preserve">gitcgi + git-http-backend</text>
<text class="t4" x="808" y="121">the hooks are the syncer binary</text>
<text class="t4b" x="808" y="136">holds no bucket credential</text>
<rect x="1012" y="62" width="210" height="122" rx="7" class="bx"/>
<text class="t2" x="1028" y="86">syncer container</text>
<text class="t4" x="1028" y="106">batches pushes; uploads packs</text>
<text class="t4" x="1028" y="121">four at a time</text>
<text class="t4b" x="1028" y="136">the only writer of the bucket</text>
<line class="l-forge" x1="1240" y1="110" x2="1352" y2="110" marker-start="url(#a-forge)" marker-end="url(#a-forge)"/>
<rect x="1247" y="79" width="97" height="30" rx="3" class="halo"/>
<text class="t4b c-forge" x="1296" y="90" style="text-anchor:middle">packs ↑ on push</text>
<text class="t4" x="1296" y="105" style="text-anchor:middle">restore ↓ at start</text>
<text class="t4" x="1296" y="146" style="text-anchor:middle">RPO = last ack</text>
<rect x="1356" y="22" width="220" height="178" rx="7" class="s3"/>
<text class="t1" x="1372" y="48">S3 — &lt;prefix&gt;/</text>
<text class="mono" x="1372" y="74" xml:space="preserve">git/objects/pack/*</text>
<text class="mono" x="1372" y="91" xml:space="preserve">git/snapshot — ONE CAS</text>
<text class="mono" x="1372" y="108" xml:space="preserve">git/epoch · git/claim</text>
<text class="mono" x="1372" y="125" xml:space="preserve">git/bundles · lfs/…</text>
<text class="mono" x="1372" y="142" xml:space="preserve">files/&lt;path&gt; — export</text>
<text class="t4" x="1372" y="176">a bare repo; clonable, server down</text>
<rect x="24" y="224" width="1552" height="100" rx="7" class="panel"/>
<text class="t1" x="46" y="252">the push — acknowledged means durable</text>
<circle cx="58" cy="282" r="11" class="f-forge"/>
<text class="num" x="58" y="286" style="text-anchor:middle">1</text>
<text class="t2" x="78" y="286">the hook hands over</text>
<text class="t4" x="78" y="304">the commands, judged in order against</text>
<text class="t4" x="78" y="319">local refs, the snapshot, the batch</text>
<circle cx="312" cy="282" r="11" class="f-forge"/>
<text class="num" x="312" y="286" style="text-anchor:middle">2</text>
<text class="t2" x="332" y="286">policy, twice</text>
<text class="t4" x="332" y="304">pre-receive names the rule; the syncer</text>
<text class="t4" x="332" y="319">enforces it</text>
<circle cx="565" cy="282" r="11" class="f-forge"/>
<text class="num" x="565" y="286" style="text-anchor:middle">3</text>
<text class="t2" x="585" y="286">renew the lease</text>
<text class="t4" x="585" y="304">412 ⇒ this server fences itself and</text>
<text class="t4" x="585" y="319">exits</text>
<circle cx="819" cy="282" r="11" class="f-forge"/>
<text class="num" x="819" y="286" style="text-anchor:middle">4</text>
<text class="t2" x="839" y="286">upload the packs</text>
<text class="t4" x="839" y="304">content-named, immutable, four at a</text>
<text class="t4" x="839" y="319">time</text>
<circle cx="1073" cy="282" r="11" class="f-forge"/>
<text class="num" x="1073" y="286" style="text-anchor:middle">5</text>
<text class="t2" x="1093" y="286">ONE snapshot CAS</text>
<text class="t4" x="1093" y="304">If-Match: thirty refs move as one object</text>
<circle cx="1326" cy="282" r="11" class="f-forge"/>
<text class="num" x="1326" y="286" style="text-anchor:middle">6</text>
<text class="t2" x="1346" y="286">ref transaction, then the report</text>
<text class="t4" x="1346" y="304">only THEN ok or ng — a crash before</text>
<text class="t4" x="1346" y="319">fails the push</text>
<rect x="24" y="346" width="760" height="104" rx="10" class="grp"/>
<text class="cap" x="40" y="368">CONTROL — OFF THE DATA PATH</text>
<text class="t4" x="44" y="386">lease heartbeat on its own task, gated on progress — a wedged pod loses its lease</text>
<text class="t4" x="44" y="404">operator: idle to zero on pushes only; the door arms a wake and holds the request</text>
<text class="t4" x="44" y="422">bundles and LFS answer with presigned URLs — those bytes never cross the pod</text>
<rect x="808" y="346" width="768" height="104" rx="7" class="bx"/>
<path class="f-forge" d="M815,346 H1569 A7,7 0 0 1 1576,353 V351 H808 V353 A7,7 0 0 1 815,346 Z"/>
<text class="t2 c-forge" x="824" y="370">the export — a legible mirror, by the shipped lean binary</text>
<text class="t4" x="824" y="390">after the report, never a second writer of the snapshot; lean and passthrough readers mount main read-only</text>
<text class="t4b c-red" x="824" y="405">never repaired: a foreign write is not noticed; a manifest-verifying reader refuses it, a raw mount takes it</text>
<rect x="24" y="472" width="1552" height="54" rx="7" class="panel"/>
<text class="t4b" x="48" y="494">drilled: 12 falsifiers green (EC2 2026-09-04, rights on Cilium 2026-09-05) · 10 GiB and 40 GiB pushes on real S3 · the takeover window closed against a real challenger</text>
<text class="t4" x="48" y="514">open: a pack's parts upload one at a time · a full repack every 24 pushes re-uploads the repository · a roll mid-push costs that push · agents in another cluster are not drilled</text>
<rect x="24" y="542" width="1552" height="44" rx="7" class="bx"/>
<path class="f-red" d="M24,549 A7,7 0 0 1 31,542 H29 V586 H31 A7,7 0 0 1 24,579 Z"/>
<text class="t4b c-red" x="48" y="569">nothing in-tree terminates TLS — the token rides two cleartext hops; X-Remote-User is a NetworkPolicy the operator renders only when told where the door runs; the server runs as root</text>
<line class="l-ink" x1="28" y1="614" x2="54" y2="614"/>
<text class="t4" x="60" y="618">data path</text>
<line class="l-ctl" x1="127.98" y1="614" x2="153.98000000000002" y2="614" stroke-dasharray="6 5"/>
<text class="t4" x="160" y="618">control</text>
<rect x="217" y="607" width="5" height="14" rx="2" class="f-red"/>
<text class="t4" x="229" y="618">hazard / trust boundary</text>
</svg>
