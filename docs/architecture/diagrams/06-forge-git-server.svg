<defs><marker id="a-lite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="a-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker><marker id="a-forge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03060"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/></marker></defs>
<rect x="24" y="22" width="262" height="236" rx="7" class="bx"/>
<path class="f-forge" d="M31,22 H279 A7,7 0 0 1 286,29 V27 H24 V29 A7,7 0 0 1 31,22 Z"/>
<text class="t2 c-forge" x="40" y="46">the agent pod — any namespace</text>
<text class="t4" x="40" y="66">a stock git client; the working tree is local</text>
<text class="t4" x="40" y="81">disk</text>
<text class="mono" x="40" y="96" xml:space="preserve">helper: flint-forge-credential</text>
<text class="t4" x="40" y="111">re-reads the pod's projected ServiceAccount</text>
<text class="t4" x="40" y="126">token on every call — audience forge.chert.us</text>
<text class="t4" x="40" y="141">— and presents it as the Basic password</text>
<text class="t4b" x="40" y="156">no bucket credential, no sidecar, no</text>
<text class="t4b" x="40" y="171">privilege</text>
<text class="t4" x="40" y="186">uncommitted work has no RPO: git's contract</text>
<line class="l-forge" x1="286" y1="130" x2="398" y2="130" marker-start="url(#a-forge)" marker-end="url(#a-forge)"/>
<rect x="300" y="105" width="83" height="15" rx="3" class="halo"/>
<text class="t4b c-forge" x="342" y="116" style="text-anchor:middle">HTTP · Basic</text>
<text class="t4" x="342" y="152" style="text-anchor:middle">HTTPS is a line in</text>
<text class="t4" x="342" y="166" style="text-anchor:middle">the diagram: nothing</text>
<text class="t4" x="342" y="180" style="text-anchor:middle">in-tree terminates it</text>
<rect x="402" y="22" width="300" height="236" rx="7" class="bx"/>
<path class="f-forge" d="M409,22 H695 A7,7 0 0 1 702,29 V27 H402 V29 A7,7 0 0 1 409,22 Z"/>
<text class="t2 c-forge" x="418" y="46">the door — the lite gateway's git arm</text>
<text class="t4" x="418" y="66">N stateless replicas, no state of their own</text>
<text class="t4" x="418" y="81">TokenReview per session, cached ≤ 60 s by token</text>
<text class="t4" x="418" y="96">hash — a refusal is cached, a transport failure is not</text>
<text class="t4" x="418" y="111">spec.consumers must list the ServiceAccount; a</text>
<text class="t4" x="418" y="126">credential-less peer gets 401 and is never dialled</text>
<text class="t4" x="418" y="141">forwards Git-Protocol and X-Remote-User, never</text>
<text class="t4" x="418" y="156">Authorization; arms the wake, holds a request ≤ 180</text>
<text class="t4" x="418" y="171">s</text>
<line class="l-forge" x1="706" y1="130" x2="786" y2="130" marker-start="url(#a-forge)" marker-end="url(#a-forge)"/>
<rect x="725" y="105" width="42" height="15" rx="3" class="halo"/>
<text class="t4b c-forge" x="746" y="116" style="text-anchor:middle">HTTP</text>
<text class="mono" x="746" y="152" style="text-anchor:middle" xml:space="preserve">X-Remote-User</text>
<text class="t4" x="746" y="168" style="text-anchor:middle">= the trust</text>
<text class="t4" x="746" y="182" style="text-anchor:middle">boundary</text>
<rect x="790" y="22" width="470" height="236" rx="7" class="bx"/>
<path class="f-forge" d="M797,22 H1253 A7,7 0 0 1 1260,29 V27 H790 V29 A7,7 0 0 1 797,22 Z"/>
<text class="t2 c-forge" x="808" y="48">one server pod per FlintRepo — headless Service</text>
<text class="t4" x="808" y="66">emptyDir cache · Recreate · idles to zero</text>
<line class="hair" x1="808" y1="76" x2="1242" y2="76"/>
<rect x="808" y="86" width="212" height="160" rx="7" class="bx"/>
<text class="t2" x="824" y="110">git container</text>
<text class="mono" x="824" y="130" xml:space="preserve">nginx :8080</text>
<text class="mono" x="824" y="145" xml:space="preserve">fcgiwrap · git-http-backend</text>
<text class="t4" x="824" y="160">REMOTE_USER = X-Remote-User;</text>
<text class="t4" x="824" y="175">hooks pre-receive (names the rule)</text>
<text class="t4" x="824" y="190">and proc-receive (hands the push to</text>
<text class="t4" x="824" y="205">the syncer over a socket)</text>
<text class="t4b" x="824" y="220">holds no bucket credential</text>
<rect x="1032" y="86" width="210" height="160" rx="7" class="bx"/>
<text class="t2" x="1048" y="110">syncer container</text>
<text class="t4" x="1048" y="130">lock · lease heartbeat 10 s · the</text>
<text class="t4" x="1048" y="145">batch · S3 sync · repack · sweep ·</text>
<text class="t4" x="1048" y="160">export · bundles · LFS batch API ·</text>
<text class="t4" x="1048" y="175">/status</text>
<text class="t4b" x="1048" y="190">bucket credentials land HERE</text>
<text class="t4b" x="1048" y="205">only (envFrom)</text>
<text class="t4b" x="1048" y="220">the only writer of the bucket</text>
<line class="l-forge" x1="1264" y1="130" x2="1326" y2="130" marker-end="url(#a-forge)"/>
<rect x="1264" y="105" width="63" height="15" rx="3" class="halo"/>
<text class="t4b c-forge" x="1295" y="116" style="text-anchor:middle">flint-store</text>
<text class="t4" x="1295" y="150" style="text-anchor:middle">TLS to S3</text>
<rect x="1330" y="22" width="246" height="236" rx="7" class="s3"/>
<text class="t1" x="1348" y="48">S3 — &lt;prefix&gt;/</text>
<text class="mono" x="1348" y="72" xml:space="preserve">git/objects/pack/*</text>
<text class="mono mute" x="1348" y="88" xml:space="preserve">  immutable, content-named</text>
<text class="mono" x="1348" y="103" xml:space="preserve">git/snapshot</text>
<text class="mono mute" x="1348" y="118" xml:space="preserve">  THE pointer — one CAS</text>
<text class="mono" x="1348" y="134" xml:space="preserve">git/epoch · git/claim</text>
<text class="mono mute" x="1348" y="150" xml:space="preserve">  the lease · the owner</text>
<text class="mono" x="1348" y="165" xml:space="preserve">git/bundles/&lt;oid&gt;</text>
<text class="mono" x="1348" y="180" xml:space="preserve">lfs/objects/&lt;oid&gt;</text>
<text class="mono" x="1348" y="196" xml:space="preserve">files/&lt;path&gt;</text>
<text class="mono mute" x="1348" y="212" xml:space="preserve">  the export = a lean workspace</text>
<text class="t4" x="1348" y="231">a bare repository: clonable with</text>
<text class="t4" x="1348" y="245">the server down</text>
<rect x="24" y="276" width="1552" height="226" rx="7" class="panel"/>
<text class="t1" x="46" y="304">The push — acknowledged means durable</text>
<text class="t4" x="46" y="322">receive-pack serialises nothing and, under proc-receive, checks nothing: the syncer re-implements staleness and fast-forward, and batches every push that arrives while one is in flight.</text>
<rect x="46" y="340" width="240" height="148" rx="7" class="bx"/>
<circle cx="66" cy="362" r="11" class="f-forge"/>
<text class="num" x="66" y="366" style="text-anchor:middle">1</text>
<text class="t2" x="84" y="366">the hook hands the</text>
<text class="t2" x="84" y="381">commands over</text>
<text class="t4" x="60" y="408">one process per push; the syncer judges</text>
<text class="t4" x="60" y="423">them in arrival order against the local</text>
<text class="t4" x="60" y="438">refs, the snapshot AND its own running</text>
<text class="t4" x="60" y="453">view; a stale one is ng stale: fetch first</text>
<line class="l-forge" x1="286" y1="414" x2="300" y2="414" marker-end="url(#a-forge)"/>
<rect x="300" y="340" width="240" height="148" rx="7" class="bx"/>
<circle cx="320" cy="362" r="11" class="f-forge"/>
<text class="num" x="320" y="366" style="text-anchor:middle">2</text>
<text class="t2" x="338" y="366">policy, twice</text>
<text class="t4" x="314" y="388">pre-receive names the rule at the edge;</text>
<text class="t4" x="314" y="403">the syncer enforces the same document,</text>
<text class="t4" x="314" y="418">so a missing hook does not open the</text>
<text class="t4" x="314" y="433">repository</text>
<line class="l-forge" x1="539" y1="414" x2="553" y2="414" marker-end="url(#a-forge)"/>
<rect x="553" y="340" width="240" height="148" rx="7" class="bx"/>
<circle cx="573" cy="362" r="11" class="f-forge"/>
<text class="num" x="573" y="366" style="text-anchor:middle">3</text>
<text class="t2" x="591" y="366">renew the lease</text>
<text class="t4" x="567" y="388">a foreign holder ⇒ 412 ⇒ this server</text>
<text class="t4" x="567" y="403">fences itself: no reads, no writes, exit</text>
<line class="l-forge" x1="793" y1="414" x2="807" y2="414" marker-end="url(#a-forge)"/>
<rect x="807" y="340" width="240" height="148" rx="7" class="bx"/>
<circle cx="827" cy="362" r="11" class="f-forge"/>
<text class="num" x="827" y="366" style="text-anchor:middle">4</text>
<text class="t2" x="845" y="366">upload the packs</text>
<text class="t4" x="821" y="388">unconditional PUT of content-named,</text>
<text class="t4" x="821" y="403">immutable objects — a merge's loose</text>
<text class="t4" x="821" y="418">objects are packed first</text>
<line class="l-forge" x1="1047" y1="414" x2="1061" y2="414" marker-end="url(#a-forge)"/>
<rect x="1061" y="340" width="240" height="148" rx="7" class="bx"/>
<circle cx="1081" cy="362" r="11" class="f-forge"/>
<text class="num" x="1081" y="366" style="text-anchor:middle">5</text>
<text class="t2" x="1099" y="366">ONE snapshot CAS</text>
<text class="t4" x="1075" y="388">If-Match on the etag: thirty refs move as</text>
<text class="t4" x="1075" y="403">one object, and a reader never sees half a</text>
<text class="t4" x="1075" y="418">batch</text>
<line class="l-forge" x1="1300" y1="414" x2="1314" y2="414" marker-end="url(#a-forge)"/>
<rect x="1314" y="340" width="240" height="148" rx="7" class="bx"/>
<circle cx="1334" cy="362" r="11" class="f-forge"/>
<text class="num" x="1334" y="366" style="text-anchor:middle">6</text>
<text class="t2" x="1352" y="366">the ref transaction, then the</text>
<text class="t2" x="1352" y="381">report</text>
<text class="t4" x="1328" y="408">update-ref --stdin applies locally; only</text>
<text class="t4" x="1328" y="423">THEN ok or ng per ref. A crash before</text>
<text class="t4" x="1328" y="438">this fails every push at the client and the</text>
<text class="t4" x="1328" y="453">restart restores from the snapshot</text>
<text class="t4" x="46" y="496"></text>
<rect x="24" y="520" width="505" height="200" rx="7" class="bx"/>
<path class="f-forge" d="M31,520 H522 A7,7 0 0 1 529,527 V525 H24 V527 A7,7 0 0 1 31,520 Z"/>
<text class="t2 c-forge" x="40" y="544">Idle to zero — one rung, and a wake the door holds</text>
<text class="t4" x="40" y="564">idle for suspendAfterSecs ⇒ replicas 0 and the emptyDir is gone, so a parked repository costs</text>
<text class="t4" x="40" y="579">nothing but its objects. The ladder suspends only on the server's own polled /status, and a</text>
<text class="t4" x="40" y="594">poll failure holds forever.</text>
<text class="t4" x="40" y="609">The door arms chert.us/requested-at on the CR, waits on the CR — never the pod — and holds</text>
<text class="t4" x="40" y="624">the request up to 180 s; the restore is one pack.</text>
<text class="t4b" x="40" y="639">As built the clock counts pushes only: a fetch never reaches the syncer, so read-only</text>
<text class="t4b" x="40" y="654">use is parked one threshold after its wake.</text>
<rect x="547" y="520" width="505" height="200" rx="7" class="bx"/>
<path class="f-forge" d="M554,520 H1046 A7,7 0 0 1 1053,527 V525 H547 V527 A7,7 0 0 1 554,520 Z"/>
<text class="t2 c-forge" x="563" y="544">Fleet levers — take the server out of the transfer</text>
<text class="t4" x="563" y="564">A thousand clones are ~130 CPU-s but 43 GB from one NIC: egress binds before CPU.</text>
<text class="t4" x="563" y="579">Bitmaps ship with every pack; a clone BUNDLE is cut on a floor, uploaded beside the packs</text>
<text class="t4" x="563" y="594">and advertised as a presigned URL re-signed at half its TTL — the client must opt in</text>
<text class="t4" x="563" y="609">(transfer.bundleURI=true).</text>
<text class="t4b" x="563" y="624">Measured on EC2 (F8): 1,000 clones cost the server 5.7 MiB of egress with bundles</text>
<text class="t4b" x="563" y="639">advertised and the client opted in, 40,409 MiB with the opt-in off — 7,000×.</text>
<text class="t4" x="563" y="654">LFS: the batch API runs in the syncer and answers with presigned URLs, so a checkpoint</text>
<text class="t4" x="563" y="669">goes client-to-store and the pod sees a few hundred bytes of JSON. The pruner takes only</text>
<text class="t4" x="563" y="684">branches main already contains, and only once quiet.</text>
<rect x="1071" y="520" width="505" height="200" rx="7" class="bx"/>
<path class="f-forge" d="M1078,520 H1569 A7,7 0 0 1 1576,527 V525 H1071 V527 A7,7 0 0 1 1078,520 Z"/>
<text class="t2 c-forge" x="1087" y="544">The export — a legible mirror, by the shipped lean binary</text>
<text class="t4" x="1087" y="564">After a batch moves an exported ref, the syncer materialises the tree with a two-tree</text>
<text class="t4" x="1087" y="579">read-tree — touching exactly what changed, removing what is gone — and runs flint-sync</text>
<text class="t4" x="1087" y="594">barrier over it, so lean's ordering (upload, CAS, deletes LAST) is inherited, not re-derived.</text>
<text class="t4" x="1087" y="609">It runs AFTER the report and never CASes the snapshot; lean and passthrough readers mount</text>
<text class="t4" x="1087" y="624">main read-only with no forge code in them.</text>
<text class="t4b c-red" x="1087" y="639">A mirror that is never repaired: a foreign write into it is not noticed (the barrier diffs a</text>
<text class="t4b c-red" x="1087" y="654">local scan against a local baseline); a reader that verifies against the manifest refuses</text>
<text class="t4b c-red" x="1087" y="669">it, a mount with no manifest takes it. Readers of an export are readers.</text>
<text class="t4" x="1087" y="684">It is awaited inline with the heartbeat: a blocked barrier now times out and backs off, but</text>
<text class="t4" x="1087" y="699">pushes stall for that long.</text>
<rect x="24" y="738" width="1552" height="118" rx="7" class="panel"/>
<text class="t1" x="46" y="766">Built, and drilled on a real cluster — 2026-09-04</text>
<text class="t4" x="46" y="784">All eleven falsifiers ran on EC2 and went green: acknowledged-means-durable under 8 mid-push kills; two pushes to one ref; a merge surviving a cold restore; the fence deposing a straggler within one heartbeat; a byte-identical restore and a dumb clone from the bucket with the server down;</text>
<text class="t4" x="46" y="799">protected main, which found a fresh repository unable to create main at all; idle-to-zero, with an 11 s clone through the door on a pod the request created; the storm above; the export, 3 of 164 objects rewritten by a three-file push, after a defect that froze it; the sweep; and an S3 outage — clones</text>
<text class="t4" x="46" y="814">served, pushes refused, not ready in ~20 s.</text>
<text class="t4" x="46" y="831">Phase 0 measured the buy option: Gitea's 4,019 MiB of egress for 100 clones sits level with forge's control arms. The composition drills, on a local MinIO rig, found the five things on the composition page. Not drilled: agents in another cluster.</text>
<text class="t4" x="46" y="848">What forge is not: a web UI, pull requests, code search, CI, a POSIX volume, untracked files. Uncommitted work is not durable, which is git's contract; .env, build output and datasets are durable only if committed or put in LFS.</text>
<line class="l-ink" x1="28" y1="868" x2="54" y2="868"/>
<text class="t4" x="60" y="872">data path</text>
<line class="l-ctl" x1="127.98" y1="868" x2="153.98000000000002" y2="868" stroke-dasharray="6 5"/>
<text class="t4" x="160" y="872">control</text>
<rect x="217" y="861" width="5" height="14" rx="2" class="f-red"/>
<text class="t4" x="229" y="872">hazard / trust boundary</text>
</svg>
