<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img"
     aria-label="flint-forge: an agent pod runs stock git with a credential helper that presents the pod's projected ServiceAccount token as the Basic password. The door — the lite gateway's git arm — verifies it by TokenReview, checks the repository's consumers and routes to one server pod per repository, where nginx and git-http-backend serve the smart protocol and hooks hand every push to one syncer. The syncer batches pushes, uploads packs, CASes one snapshot and only then reports ok; S3 holds a bare repository, a lease, clone bundles, LFS objects and an optional export that is a valid lean workspace.">
