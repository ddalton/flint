<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" role="img"
     aria-label="flint-lean: the CSI node plugin owns a tree, checks it out from S3 before the agent container starts, hostPaths it into an unprivileged flint-sync worker and bind-mounts it into the agent pod as plain local files. The agent declares a boundary by writing a file; the worker answers with an ack once the bytes are in S3. Gated mode splits durability from visibility with one CAS.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .t1{font-size:17.0px;font-weight:600}
  .t2{font-size:13.0px;font-weight:600}
  .t3{font-size:12.0px}
  .t3b{font-size:12.0px;font-weight:600;fill:#334155}
  .t4{font-size:11.0px;fill:#64748b}
  .t4b{font-size:11.0px;font-weight:600;fill:#334155}
  .mono{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:10.5px;fill:#334155}
  .mute{fill:#64748b}
  .cap{font-size:9.5px;font-weight:600;letter-spacing:.1em;fill:#64748b}
  .num{font-size:11.0px;font-weight:600;fill:#ffffff}
  .on{font-size:13.0px;font-weight:600;fill:#ffffff}
  .onsub{font-size:11.0px;fill:#ffffff;opacity:.85}
  .c-red{fill:#b4232a}
  .c-lite{fill:#184f95} .c-lean{fill:#0f7a55} .c-pass{fill:#7d530c} .c-forge{fill:#8c2449}
  .f-lite{fill:#184f95} .f-lean{fill:#1baf7a} .f-pass{fill:#a06b12} .f-forge{fill:#b03060}
  .f-red{fill:#b4232a} .f-ink{fill:#334155}
  .b-lite{fill:#eef3fa;stroke:#184f95;stroke-width:1.4} .b-lean{fill:#ecf8f2;stroke:#1baf7a;stroke-width:1.4} .b-pass{fill:#faf3e6;stroke:#a06b12;stroke-width:1.4} .b-forge{fill:#faedf2;stroke:#b03060;stroke-width:1.4}
  .hd-lite{fill:#184f95} .hd-lean{fill:#0f7a55} .hd-pass{fill:#7d530c} .hd-forge{fill:#8c2449}
  .hd-lbl{fill:#334155}
  .l-lite{stroke:#184f95;stroke-width:2.2;fill:none} .l-lean{stroke:#1baf7a;stroke-width:2.2;fill:none} .l-pass{stroke:#a06b12;stroke-width:2.2;fill:none} .l-forge{stroke:#b03060;stroke-width:2.2;fill:none}
  .l-ctl{stroke:#94a3b8;stroke-width:1.6;fill:none}
  .l-ink{stroke:#334155;stroke-width:2.2;fill:none}
  .l-red{stroke:#b4232a;stroke-width:2.2;fill:none}
  .bx{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4}
  .panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}
  .s3{fill:#f1f5f9;stroke:#64748b;stroke-width:1.6}
  .grp{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:7 5}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .lbl{fill:#f8fafc} .rowb{fill:#fbfcfd}
  .frame{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .halo{fill:#ffffff}
  .chip{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
  .chip-red{fill:#b4232a}
  .chip-lite{fill:#184f95} .chip-lean{fill:#0f7a55} .chip-pass{fill:#7d530c} .chip-forge{fill:#8c2449}
  .chip .cap{fill:#334155}
  /* On a filled shape. Last on purpose: a class beats a presentation
     attribute, so this must win over .t4/.cap/.mono. */
  .on,.num,.onsub{fill:#ffffff}
  .cap.on{fill:#ffffff}
</style>
<defs><marker id="a-lite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="a-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker><marker id="a-forge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03060"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/></marker></defs>
<rect x="24" y="22" width="1020" height="430" rx="10" class="grp"/>
<text class="cap" x="40" y="44">ONE NODE</text>
<text class="t4" x="107" y="44">where a lean workspace actually lives — no FUSE, no privileged container in the tenant pod, no webhook</text>
<rect x="44" y="60" width="472" height="240" rx="7" class="bx"/>
<path class="f-lean" d="M51,60 H509 A7,7 0 0 1 516,67 V65 H44 V67 A7,7 0 0 1 51,60 Z"/>
<text class="t2 c-lean" x="62" y="86">the agent pod — tenant namespace</text>
<text class="t4" x="62" y="104">admissible under PodSecurity restricted</text>
<rect x="62" y="116" width="436" height="78" rx="7" class="bx"/>
<text class="t2" x="78" y="140">app container — the image is unchanged</text>
<text class="mono" x="78" y="160" xml:space="preserve">/workspace</text>
<text class="t4" x="78" y="175">plain files on local disk · full POSIX · zero interception</text>
<rect x="62" y="206" width="436" height="78" rx="7" class="panel"/>
<text class="t2" x="78" y="230">It holds no S3 credential and knows nothing about flint.</text>
<text class="t4" x="78" y="250">git, sqlite, hard links and index locks all just work — it is a real disk.</text>
<line class="l-lean" x1="516" y1="166" x2="572" y2="166" marker-end="url(#a-lean)"/>
<text class="t4" x="544" y="150" style="text-anchor:middle">bind mount</text>
<rect x="576" y="116" width="196" height="112" rx="7" class="b-lean"/>
<text class="t2 c-lean" x="592" y="140">the plugin-owned tree</text>
<text class="mono" x="592" y="160" xml:space="preserve">plugins/s3.csi.chert.us/</text>
<text class="mono" x="592" y="175" xml:space="preserve">volumes/&lt;vid&gt;/tree</text>
<text class="t4" x="592" y="190">ONE tree, two views — the pod's</text>
<text class="t4" x="592" y="205">and the worker's</text>
<line class="l-lean" x1="772" y1="166" x2="828" y2="166" marker-end="url(#a-lean)"/>
<text class="t4" x="800" y="150" style="text-anchor:middle">hostPath</text>
<rect x="832" y="60" width="192" height="240" rx="7" class="bx"/>
<path class="f-lean" d="M839,60 H1017 A7,7 0 0 1 1024,67 V65 H832 V67 A7,7 0 0 1 839,60 Z"/>
<text class="t2 c-lean" x="848" y="84">flint-sync</text>
<text class="t4" x="848" y="104">the worker pod, in a SYSTEM</text>
<text class="t4" x="848" y="119">namespace — never the</text>
<text class="t4" x="848" y="134">tenant's</text>
<text class="t4" x="848" y="156">non-root · every capability</text>
<text class="t4" x="848" y="171">dropped · read-only rootfs · no</text>
<text class="t4" x="848" y="186">SA token</text>
<text class="t4b" x="848" y="208">it holds the credential the</text>
<text class="t4b" x="848" y="222">agent must not</text>
<rect x="44" y="314" width="980" height="122" rx="7" class="panel"/>
<text class="t2" x="60" y="338">s3.csi.chert.us — the CSI node DaemonSet, one per node</text>
<text class="t4" x="60" y="358">kubelet blocks every container in the pod on NodePublishVolume, so the CHECKOUT COMPLETES BEFORE THE AGENT'S FIRST LINE RUNS — no init container, no readiness dance —</text>
<text class="t4" x="60" y="373">and calls NodeUnpublishVolume only after every container has exited, which is where the final barrier goes.</text>
<text class="t4b" x="60" y="388">A published lean tree is the tenant's live data: the plugin REFUSES to clean one up, even on a retry path.</text>
<line class="l-lean" x1="1044" y1="150" x2="1124" y2="150" marker-end="url(#a-lean)"/>
<line class="l-lean" x1="1124" y1="182" x2="1044" y2="182" stroke-dasharray="6 5" marker-end="url(#a-lean)"/>
<rect x="1059" y="127" width="49" height="15" rx="3" class="halo"/>
<text class="t4b c-lean" x="1084" y="138" style="text-anchor:middle">publish</text>
<rect x="1055" y="197" width="59" height="15" rx="3" class="halo"/>
<text class="t4b c-lean" x="1084" y="208" style="text-anchor:middle">checkout</text>
<rect x="1128" y="22" width="448" height="430" rx="7" class="s3"/>
<text class="t1" x="1148" y="50">S3 — the durable copy</text>
<text class="t4" x="1148" y="70">the workspace exists here between pods, and nowhere else</text>
<line class="hair" x1="1148" y1="82" x2="1556" y2="82"/>
<rect x="1148" y="94" width="408" height="76" rx="7" class="bx"/>
<text class="t2" x="1164" y="118">the files</text>
<text class="mono" x="1164" y="138" xml:space="preserve">&lt;prefix&gt;/files/&lt;path&gt;</text>
<text class="t4" x="1164" y="153">whole objects — a publish re-uploads a touched file entire</text>
<rect x="1148" y="182" width="408" height="150" rx="7" class="bx"/>
<text class="t2" x="1164" y="206">.flint/lean/ — the control namespace</text>
<text class="mono" x="1164" y="226" xml:space="preserve">epoch      the subtree LEASE — one writer</text>
<text class="mono" x="1164" y="241" xml:space="preserve">claim      which project owns this prefix</text>
<text class="mono" x="1164" y="256" xml:space="preserve">manifest   what the last boundary contains</text>
<text class="mono" x="1164" y="271" xml:space="preserve">inbox      the HITL window token, one CAS doc</text>
<text class="mono" x="1164" y="286" xml:space="preserve">conflicts/ what could not be reconciled</text>
<text class="t4" x="1164" y="301">the manifest is the wall: ~277 B per entry, exactly linear</text>
<rect x="1148" y="344" width="408" height="94" rx="7" class="panel"/>
<text class="t2" x="1164" y="368">The lease lives in the BUCKET, not in Kubernetes.</text>
<text class="t4" x="1164" y="388">So it fences a second writer no matter which cluster it is in — a property</text>
<text class="t4" x="1164" y="403">flint-lite's admission check cannot have, because it only sees its own</text>
<text class="t4" x="1164" y="418">cluster.</text>
<rect x="24" y="470" width="760" height="196" rx="7" class="panel"/>
<text class="t1" x="44" y="498">The loop — one agent, start to durable</text>
<circle cx="56" cy="528" r="11" class="f-lean"/>
<text class="num" x="56" y="532" style="text-anchor:middle">1</text>
<text class="t2" x="78" y="532">pod starts</text>
<text class="t4" x="78" y="550">checkout runs first — the agent never sees an empty tree</text>
<circle cx="426" cy="528" r="11" class="f-lean"/>
<text class="num" x="426" y="532" style="text-anchor:middle">2</text>
<text class="t2" x="448" y="532">the agent works</text>
<text class="t4" x="448" y="550">local files at local speed; the syncer publishes at cadence</text>
<text class="t4" x="448" y="565">anyway</text>
<circle cx="56" cy="594" r="11" class="f-lean"/>
<text class="num" x="56" y="598" style="text-anchor:middle">3</text>
<text class="t2" x="78" y="598">the agent declares a boundary</text>
<text class="mono" x="78" y="616" xml:space="preserve">echo &gt; .flint/publish</text>
<text class="t4" x="78" y="634">one file write — the entire API surface</text>
<circle cx="426" cy="594" r="11" class="f-lean"/>
<text class="num" x="426" y="598" style="text-anchor:middle">4</text>
<text class="t2" x="448" y="598">the worker answers</text>
<text class="mono" x="448" y="616" xml:space="preserve">.flint/publish.ack</text>
<text class="t4" x="448" y="634">ok ⇒ the bytes are in S3 · partial · refused-fenced</text>
<rect x="808" y="470" width="768" height="196" rx="7" class="panel"/>
<text class="t1" x="828" y="498">Gated mode — durability and visibility become separate events</text>
<rect x="828" y="512" width="356" height="140" rx="7" class="bx"/>
<path class="f-lean" d="M835,512 H1177 A7,7 0 0 1 1184,519 V517 H828 V519 A7,7 0 0 1 835,512 Z"/>
<text class="t2 c-lean" x="844" y="536">the upload lane — always running</text>
<text class="t4" x="844" y="556">every changed file becomes a NEW OBJECT VERSION as soon</text>
<text class="t4" x="844" y="571">as it is scanned. Durable immediately —</text>
<text class="t4b" x="844" y="586">and INVISIBLE to readers.</text>
<text class="t4" x="844" y="601">A crash in this lane loses nothing, because nothing here was</text>
<text class="t4" x="844" y="616">ever cited.</text>
<rect x="1198" y="512" width="360" height="140" rx="7" class="bx"/>
<path class="f-lean" d="M1205,512 H1551 A7,7 0 0 1 1558,519 V517 H1198 V519 A7,7 0 0 1 1205,512 Z"/>
<text class="t2 c-lean" x="1214" y="536">the citation — ONE CAS</text>
<text class="t4" x="1214" y="556">installs the whole pending set at once, naming version ids. No</text>
<text class="t4" x="1214" y="571">copy phase, so no half-boundary exists.</text>
<text class="t4b" x="1214" y="586">A reader sees the whole change or none of it.</text>
<text class="t4" x="1214" y="601">Gated is REFUSED without a lag bound — unbounded staleness</text>
<text class="t4" x="1214" y="616">is impossible by construction.</text>
<rect x="24" y="684" width="1552" height="172" rx="7" class="panel"/>
<text class="t1" x="46" y="712">Three questions, in order — the cheapest disqualifier first</text>
<rect x="46" y="726" width="491" height="116" rx="7" class="bx"/>
<text class="t2" x="62" y="750">1 · Does the workspace fit the disk?</text>
<text class="t4" x="62" y="770">The whole tree is materialised — no stubs, no eviction — and the gate is the FILE COUNT</text>
<text class="t4" x="62" y="785">before the byte count: ~250k files, which falls out of the manifest size.</text>
<text class="t4b" x="62" y="800">No ⇒ this is not the front end you want.</text>
<rect x="555" y="726" width="491" height="116" rx="7" class="bx"/>
<text class="t2" x="571" y="750">2 · Is one writer per subtree enough?</text>
<text class="t4" x="571" y="770">The lease admits exactly one syncer; a second is REFUSED, not merged. Two agents</text>
<text class="t4" x="571" y="785">cannot share one live tree here — several integrate through a git host instead.</text>
<text class="t4b" x="571" y="800">No ⇒ the hub, for live shared POSIX.</text>
<rect x="1063" y="726" width="491" height="116" rx="7" class="bx"/>
<text class="t2" x="1079" y="750">3 · Is snapshot freshness acceptable?</text>
<text class="t4" x="1079" y="770">Readers see the last published boundary, never your last write. A hard kill loses at most</text>
<text class="t4" x="1079" y="785">floorSecs (default 60 s); a graceful stop loses nothing.</text>
<text class="t4b" x="1079" y="800">No ⇒ the hub. Yes ⇒ lean is the cheapest thing that works.</text>
<line class="l-ink" x1="28" y1="868" x2="54" y2="868"/>
<text class="t4" x="60" y="872">data path</text>
<line class="l-ctl" x1="127.98" y1="868" x2="153.98000000000002" y2="868" stroke-dasharray="6 5"/>
<text class="t4" x="160" y="872">control</text>
<rect x="217" y="861" width="5" height="14" rx="2" class="f-red"/>
<text class="t4" x="229" y="872">hazard / trust boundary</text>
</svg>
