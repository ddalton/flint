<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img"
     aria-label="flint-lean, drawn as a flow: the agent pod writes plain local files in a tree the CSI node plugin owns and bind-mounts; the same tree is hostPathed into an unprivileged flint-sync worker, which checks it out from S3 at start and publishes changed files at a boundary or on cadence. The lease, the broker and the boundary verbs are control, off the data path. Gated mode makes durability and visibility separate events with one CAS.">
<style>
  text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0f172a}
  .t1{font-size:17.0px;font-weight:600}
  .t2{font-size:13.0px;font-weight:600}
  .t3{font-size:12.0px}
  .t3b{font-size:12.0px;font-weight:600;fill:#334155}
  .t4{font-size:11.0px;fill:#64748b}
  .t4b{font-size:11.0px;font-weight:600;fill:#334155}
  .mono{font-family:Menlo,"SF Mono",Consolas,monospace;font-size:10.5px;fill:#334155}
  .mute{fill:#64748b}
  .cap{font-size:9.5px;font-weight:600;letter-spacing:.1em;fill:#64748b}
  .num{font-size:11.0px;font-weight:600;fill:#ffffff}
  .on{font-size:13.0px;font-weight:600;fill:#ffffff}
  .onsub{font-size:11.0px;fill:#ffffff;opacity:.85}
  .c-red{fill:#b4232a}
  .c-lite{fill:#184f95} .c-lean{fill:#0f7a55} .c-pass{fill:#7d530c} .c-forge{fill:#8c2449}
  .f-lite{fill:#184f95} .f-lean{fill:#1baf7a} .f-pass{fill:#a06b12} .f-forge{fill:#b03060}
  .f-red{fill:#b4232a} .f-ink{fill:#334155}
  .b-lite{fill:#eef3fa;stroke:#184f95;stroke-width:1.4} .b-lean{fill:#ecf8f2;stroke:#1baf7a;stroke-width:1.4} .b-pass{fill:#faf3e6;stroke:#a06b12;stroke-width:1.4} .b-forge{fill:#faedf2;stroke:#b03060;stroke-width:1.4}
  .hd-lite{fill:#184f95} .hd-lean{fill:#0f7a55} .hd-pass{fill:#7d530c} .hd-forge{fill:#8c2449}
  .hd-lbl{fill:#334155}
  .l-lite{stroke:#184f95;stroke-width:2.2;fill:none} .l-lean{stroke:#1baf7a;stroke-width:2.2;fill:none} .l-pass{stroke:#a06b12;stroke-width:2.2;fill:none} .l-forge{stroke:#b03060;stroke-width:2.2;fill:none}
  .l-ctl{stroke:#94a3b8;stroke-width:1.6;fill:none}
  .l-ink{stroke:#334155;stroke-width:2.2;fill:none}
  .l-red{stroke:#b4232a;stroke-width:2.2;fill:none}
  .bx{fill:#ffffff;stroke:#e2e8f0;stroke-width:1.4}
  .panel{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.4}
  .s3{fill:#f1f5f9;stroke:#64748b;stroke-width:1.6}
  .grp{fill:none;stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:7 5}
  .hair{stroke:#e2e8f0;stroke-width:1}
  .lbl{fill:#f8fafc} .rowb{fill:#fbfcfd}
  .frame{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .halo{fill:#ffffff}
  .chip{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
  .chip-red{fill:#b4232a}
  .chip-lite{fill:#184f95} .chip-lean{fill:#0f7a55} .chip-pass{fill:#7d530c} .chip-forge{fill:#8c2449}
  .chip .cap{fill:#334155}
  /* On a filled shape. Last on purpose: a class beats a presentation
     attribute, so this must win over .t4/.cap/.mono. */
  .on,.num,.onsub{fill:#ffffff}
  .cap.on{fill:#ffffff}
</style>
<defs><marker id="a-lite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#184f95"/></marker><marker id="a-lean" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="a-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a06b12"/></marker><marker id="a-forge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03060"/></marker><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4232a"/></marker></defs>
<rect x="24" y="22" width="1020" height="310" rx="10" class="grp"/>
<text class="cap" x="40" y="44">ONE NODE</text>
<text class="t4" x="107" y="44">no FUSE, no privileged container in the tenant pod, no webhook</text>
<rect x="44" y="56" width="430" height="160" rx="7" class="bx"/>
<path class="f-lean" d="M51,56 H467 A7,7 0 0 1 474,63 V61 H44 V63 A7,7 0 0 1 51,56 Z"/>
<text class="t2 c-lean" x="62" y="82">the agent pod — tenant namespace</text>
<rect x="62" y="98" width="394" height="100" rx="7" class="bx"/>
<text class="t2" x="78" y="122">app container — the image is unchanged</text>
<text class="mono" x="78" y="142" xml:space="preserve">/workspace — plain local files</text>
<text class="t4" x="78" y="157">no S3 credential; git, sqlite and locks just work</text>
<line class="l-lean" x1="474" y1="150" x2="556" y2="150" stroke-dasharray="6 5" marker-start="url(#a-lean)" marker-end="url(#a-lean)"/>
<text class="t4" x="515" y="134" style="text-anchor:middle">bind mount</text>
<rect x="560" y="98" width="210" height="100" rx="7" class="b-lean"/>
<text class="t2 c-lean" x="576" y="122">the plugin-owned tree</text>
<text class="mono" x="576" y="142" xml:space="preserve">volumes/&lt;vid&gt;/tree</text>
<text class="t4" x="576" y="157">one tree, two views</text>
<line class="l-lean" x1="770" y1="150" x2="846" y2="150" stroke-dasharray="6 5" marker-start="url(#a-lean)" marker-end="url(#a-lean)"/>
<text class="t4" x="808" y="134" style="text-anchor:middle">hostPath</text>
<rect x="850" y="56" width="174" height="160" rx="7" class="bx"/>
<path class="f-lean" d="M857,56 H1017 A7,7 0 0 1 1024,63 V61 H850 V63 A7,7 0 0 1 857,56 Z"/>
<text class="t2 c-lean" x="866" y="80">flint-sync — the worker</text>
<text class="t4" x="866" y="100">unprivileged, in a system</text>
<text class="t4" x="866" y="115">namespace</text>
<text class="t4b" x="866" y="130">holds the credential the</text>
<text class="t4b" x="866" y="145">agent must not</text>
<rect x="44" y="232" width="980" height="84" rx="7" class="panel"/>
<text class="t2" x="60" y="256">s3.csi.chert.us — the node DaemonSet, one per node</text>
<text class="t4" x="60" y="276">kubelet blocks the pod on NodePublishVolume, so the checkout completes before the agent's first line; the final barrier runs at NodeUnpublish</text>
<text class="t4b" x="60" y="291">a published tree is live data: the plugin refuses to clean it up</text>
<rect x="1200" y="22" width="376" height="310" rx="7" class="s3"/>
<line class="l-lean" x1="1044" y1="118" x2="1196" y2="118" marker-end="url(#a-lean)"/>
<line class="l-lean" x1="1196" y1="150" x2="1044" y2="150" stroke-dasharray="6 5" marker-end="url(#a-lean)"/>
<rect x="1054" y="89" width="132" height="15" rx="3" class="halo"/>
<text class="t4b c-lean" x="1120" y="100" style="text-anchor:middle">publish · at a boundary</text>
<rect x="1060" y="163" width="119" height="30" rx="3" class="halo"/>
<text class="t4b c-lean" x="1120" y="174" style="text-anchor:middle">checkout · at start</text>
<text class="t4" x="1120" y="189" style="text-anchor:middle">RPO = the last barrier</text>
<text class="t1" x="1220" y="50">S3 — the durable copy</text>
<text class="mono" x="1220" y="80" xml:space="preserve">&lt;prefix&gt;/files/&lt;path&gt;</text>
<text class="t4" x="1220" y="98">whole objects — a touched file is re-uploaded</text>
<text class="mono" x="1220" y="130" xml:space="preserve">.flint/lean/  epoch · claim · manifest · inbox</text>
<text class="t4" x="1220" y="148">the lease · the owner · the last boundary · HITL</text>
<line class="hair" x1="1220" y1="166" x2="1556" y2="166"/>
<text class="t4b" x="1220" y="192">the lease lives in the BUCKET, not in Kubernetes,</text>
<text class="t4" x="1220" y="210">so it fences a second writer in any cluster.</text>
<text class="t4" x="1220" y="242">the manifest is the wall: ~277 B per entry, ~250k files.</text>
<text class="t4" x="1220" y="274">readers see the last published boundary,</text>
<text class="t4" x="1220" y="292">never your last write.</text>
<rect x="24" y="354" width="1552" height="92" rx="7" class="panel"/>
<text class="t1" x="44" y="382">the loop — one agent, start to durable</text>
<circle cx="56" cy="410" r="11" class="f-lean"/>
<text class="num" x="56" y="414" style="text-anchor:middle">1</text>
<text class="t2" x="78" y="414">pod starts</text>
<text class="t4" x="78" y="432">checkout first — never an empty tree</text>
<circle cx="436" cy="410" r="11" class="f-lean"/>
<text class="num" x="436" y="414" style="text-anchor:middle">2</text>
<text class="t2" x="458" y="414">the agent works</text>
<text class="t4" x="458" y="432">local files at local speed</text>
<circle cx="817" cy="410" r="11" class="f-lean"/>
<text class="num" x="817" y="414" style="text-anchor:middle">3</text>
<text class="mono" x="839" y="414" xml:space="preserve">echo &gt; .flint/publish</text>
<text class="t4" x="839" y="432">declares a boundary — the whole API</text>
<circle cx="1198" cy="410" r="11" class="f-lean"/>
<text class="num" x="1198" y="414" style="text-anchor:middle">4</text>
<text class="mono" x="1220" y="414" xml:space="preserve">.flint/publish.ack</text>
<text class="t4" x="1220" y="432">ok = in S3 · partial · refused-fenced</text>
<rect x="24" y="468" width="760" height="96" rx="10" class="grp"/>
<text class="cap" x="40" y="490">CONTROL — OFF THE DATA PATH</text>
<text class="t4" x="44" y="508">lease in the bucket — one writer; a second syncer is refused, never merged</text>
<text class="t4" x="44" y="526">broker → short-lived keys → the worker, over a loopback door · consumers absent = deny</text>
<text class="t4" x="44" y="544">the boundary verbs are files: an agent that can write a file can declare a coherent point</text>
<rect x="808" y="468" width="768" height="96" rx="7" class="bx"/>
<path class="f-lean" d="M815,468 H1569 A7,7 0 0 1 1576,475 V473 H808 V475 A7,7 0 0 1 815,468 Z"/>
<text class="t2 c-lean" x="824" y="492">gated mode — durable now, visible on ONE CAS</text>
<text class="t4" x="824" y="512">every changed file is uploaded as a new version at once: durable, and invisible; one CAS cites the whole set</text>
<text class="t4b" x="824" y="527">a reader sees the whole change or none of it; refused without a lag bound</text>
<line class="l-ink" x1="28" y1="592" x2="54" y2="592"/>
<text class="t4" x="60" y="596">data path</text>
<line class="l-ctl" x1="127.98" y1="592" x2="153.98000000000002" y2="592" stroke-dasharray="6 5"/>
<text class="t4" x="160" y="596">control</text>
<rect x="217" y="585" width="5" height="14" rx="2" class="f-red"/>
<text class="t4" x="229" y="596">hazard / trust boundary</text>
</svg>
