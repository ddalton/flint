[package]
name = "spdk-csi-driver"
version = "1.3.0"
edition = "2021"

# Old CRD-based controller operator - disabled in minimal state
# [[bin]]
# name = "controller" 
# path = "src/controller_operator.rs"

[[bin]]
name = "csi-driver"
path = "src/main.rs"

[[bin]]
name = "flint-nfs-server"
path = "src/nfs_main.rs"

# Emits the dashboard OpenAPI spec (source of the SPA's generated TS types);
# see spdk-dashboard/scripts/check-api-types.sh
[[bin]]
name = "dashboard-openapi"
path = "src/bin/dashboard_openapi.rs"

[[bin]]
name = "nfs-test-client"
path = "tests/nfs_client_test.rs"

# flint-lite operator: the FlintShare control plane
# (docs/plans/flint-lite-operator-plan.md). Ships in its own image via
# the same prebuilt/zigbuild recipe as the others.
[[bin]]
name = "flint-lite-operator"
path = "src/bin/flint_lite_operator.rs"

# flint-hub-gateway: the fleet's file-API front door. Ships INSIDE the
# flint-lite-operator image — same crate, same build, one fewer image to
# publish and keep in step; the chart picks which binary a pod runs.
[[bin]]
name = "flint-hub-gateway"
path = "src/bin/flint_hub_gateway.rs"

# Prints the FlintShare CRD YAML (the chart's crds/ bootstrap copy).
# The operator applies its own compiled-in copy at startup regardless.
[[bin]]
name = "crdgen"
path = "src/bin/crdgen.rs"

# pNFS binaries (experimental)
[[bin]]
name = "flint-pnfs-mds"
path = "src/nfs_mds_main.rs"

[[bin]]
name = "flint-pnfs-ds"
path = "src/nfs_ds_main.rs"

# Test-only CLI for the pNFS CSI integration; not shipped in
# production manifests. Exercises the same MDS gRPC verbs the CSI
# driver uses without requiring a Kubernetes cluster.
[[bin]]
name = "pnfs-csi-cli"
path = "src/pnfs_csi_cli_main.rs"

# The fleet rig's stand-in hub. Not shipped in any image — it exists so
# 300 "live" shares fit on a small cluster and the measurement is about
# the OPERATOR rather than about 300 copies of the tier.
[[bin]]
name = "flint-hub-stub"
path = "src/bin/flint_hub_stub.rs"

# flint-sync and flint-lean-gateway moved to the flint-lean crate
# (lean/sidecar/) so the lean test loop builds without this crate's
# binaries and dep trees; flint-store (crates/flint-store) is the
# shared layer.

# The flint-lean operator: FlintLeanWorkspace CRD + claim/adopt +
# native-sidecar injection (docs/plans/flint-lean-plan.md §2.4). Ships
# in the flint-lite-operator image; SEPARATE controller — no FlintShare
# coupling (strict mode stays hub-side by construction).
[[bin]]
name = "flint-lean-operator"
path = "src/bin/flint_lean_operator.rs"

[[bin]]
name = "flint-s3-csi-node"
path = "src/bin/flint_s3_csi_node.rs"

[[bin]]
name = "flint-s3-broker"
path = "src/bin/flint_s3_broker.rs"


# flint-passthrough's webhook. Same image, different binary; NO
# controller — see src/passthrough/mod.rs for why the whole component
# is a webhook and three files.
# Removed old binaries:
# - node-agent: now a library module, not standalone binary
# - spdk-dashboard-backend: replaced by spdk_dashboard_backend_minimal.rs

[features]
# DEFAULT ON since 2026-08-29, after measurement. The server ships as a
# STATIC MUSL binary, and a read-path profile put futex at 66% of syscall
# time with ~2.4 mmap+munmap per READ in 16-28 KiB chunks -- the shape of
# musl's mallocng, not of the payload (which is spliced and never
# allocated). The allocator is process-global, which is also why adding
# TCP connections changed nothing (nc4/nc1 = 0.989).
#
# Measured: 350 -> 325 cpu-ms/GiB, 4154 -> 4423 MiB/s, mmap 464 -> 16,
# munmap 464 -> 0, with splice/sendto counts IDENTICAL across arms.
#
# `--no-default-features` restores musl's allocator and is how
# tests/lima/pnfs/allocator-differential.sh builds its baseline arm.
default = ["fastalloc"]
fastalloc = ["dep:mimalloc"]

# Concurrency model checking (AWS `shuttle`). OFF by default and
# optional, so an ordinary build never pulls it. With it on, the
# delegation table's entry locks and counters become shuttle
# primitives, which is what gives the scheduler somewhere to preempt:
#
#   cargo test --features shuttle-test shuttle_
#
# It is a TEST-ONLY posture. Nothing ships with this feature on.
shuttle-test = ["dep:shuttle"]

[dependencies]
# Concurrency model checker, enabled only by the `shuttle-test`
# feature. See that feature's note above.
shuttle = { version = "0.9", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
tokio = { version = "1.0", features = ["full"] }
kube = { version = "3.0.0", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.27.0", features = ["latest"] }
# schemars is back for ONE reason: the FlintShare CRD (flint-lite
# operator). kube-derive's CustomResource emits a JsonSchema impl, and
# kube-core 3.0 pins schemars 1.0 — the earlier removal note predates
# both, so this is "add at the current pins", not "restore the old
# line". Nothing else in the crate derives JsonSchema.
schemars = "1.0"
# rustls is a DIRECT dependency for exactly one line of code:
# `install_crypto_provider()` in lib.rs. Since v1.26.0 put the AWS SDK
# in the tree, rustls 0.23 sees BOTH provider features enabled
# (aws-lc-rs from the SDK, ring from hyper-rustls) and refuses to guess
# a process default — so every kube TLS client PANICKED at
# construction. See lib.rs for the whole story.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# Query-string parsing in flint-hub-gateway. Already in the tree via warp;
# named here because the gateway uses it directly.
serde_urlencoded = "0.7"
# Pure Rust TLS, no OpenSSL. `stream`: flint-hub-gateway proxies file
# bodies without buffering them — a GiB download must not be held in
# memory per concurrent reader (Body::wrap_stream / Response::bytes_stream).
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"], default-features = false }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4.0", features = ["derive", "env"] }  # env: the operator takes its fleet defaults from the pod env
warp = { version = "0.3", features = ["tls"] }
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
regex = "1.0"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
bytes = "1.0"
async-trait = "0.1"
nix = { version = "0.27", features = ["fs", "user", "mount", "socket", "uio"] }  # mount+socket+uio: s3csi's mount(2) and SCM_RIGHTS fd passing
libc = "0.2"  # raw name_to_handle_at/open_by_handle_at (fh_kernel, Linux-only paths)
thiserror = "1.0"
rand = "0.8"
dashmap = "6.1"  # Lock-free concurrent HashMap for high-performance state management
sha2 = "0.10"
sha1 = "0.10"  # SHA-1 for Kerberos HMAC-SHA1
crossbeam = "0.8"  # Lock-free channels and queues
# Pure Rust Kerberos cryptography - no glibc dependencies
aes = "0.8"  # AES encryption for Kerberos
cbc = { version = "0.1", features = ["alloc"] }  # CBC mode
hmac = "0.12"  # HMAC for Kerberos integrity
pbkdf2 = { version = "0.12", features = ["simple"] }  # Key derivation
filetime = "0.2.26"
# Pure-Rust embedded SQLite (no system libsqlite dependency); used by
# state_backend::sqlite for durable NFSv4/pNFS state persistence.
# `bundled` ships SQLite 3.45+ so we can rely on UPDATE ... RETURNING
# for atomic instance-counter increments.
rusqlite = { version = "0.31", features = ["bundled"] }
utoipa = { version = "5.5.0", default-features = false, features = ["macros"] }
# S3 cold tier (tier::store::s3, design A6/A9/A13): the official SDK is
# the only client with the full conditional-write surface the design
# requires — If-Match on CompleteMultipartUpload, If-None-Match:* creates,
# CRC64NVME FULL_OBJECT checksums across multipart, and
# x-amz-copy-source-if-match on UploadPartCopy. rustls (no OpenSSL),
# explicit BehaviorVersion in code (no behavior-version-latest feature).
aws-config = { version = "1.10.1", default-features = false, features = ["rustls", "rt-tokio", "credentials-process"] }
aws-sdk-s3 = { version = "1.141.0", default-features = false, features = ["rustls", "rt-tokio"] }
# The extracted store layer (ObjectStore + stamps + memory double + S3
# backend); re-exported at the old path via `tier::store`. flint-lean
# depends on the same crate WITHOUT this crate's build.
flint-store = { path = "../crates/flint-store", features = ["s3"] }

# SPDK Integration - Custom bindings generated for Flint's specific needs
# No external dependencies - bindings generated from your SPDK v25.05 installation

[target.'cfg(target_os = "linux")'.dependencies]
# UBLK_U_CMD_DEL_DEV escape hatch: uring_cmd on /dev/ublk-control needs a
# real io_uring (SQE128) ring; the ABI structs/tests stay cross-platform.
io-uring = "0.7"

[dev-dependencies]
tempfile = "3.0"
# test-util: virtual time (start_paused) for the crash-sweep sim harness —
# the timeout that "crashes" a hung flow fires in virtual time, so the
# whole sweep runs in milliseconds of wall clock.
tokio = { version = "1.0", features = ["full", "test-util"] }

[build-dependencies]
tonic-build = "0.10"
prost-build = "0.12"

[lib]
name = "spdk_csi_driver"
path = "src/lib.rs"
