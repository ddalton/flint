// pNFS MDS-DS Control Protocol
// 
// This protocol is used for Data Server registration, heartbeats,
// and capacity reporting to the Metadata Server.
//
// Communication is DS -> MDS (DS initiates, MDS responds)

syntax = "proto3";

package pnfs.control;

// MDS Control Service - manages data server registration and monitoring
service MdsControl {
  // Register a new data server with the MDS
  rpc RegisterDataServer(RegisterRequest) returns (RegisterResponse);
  
  // Send heartbeat to MDS
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // Update capacity information
  rpc UpdateCapacity(CapacityUpdate) returns (CapacityResponse);
  
  // Unregister data server (clean shutdown)
  rpc UnregisterDataServer(UnregisterRequest) returns (UnregisterResponse);

  // Provision a new pNFS volume — creates the metadata file under the
  // MDS export, sized to `size_bytes`. Idempotent: a CreateVolume call
  // with a matching size on an existing volume is a success; mismatch
  // is an error. Called by the CSI provisioner on behalf of
  // CreateVolume gRPC requests.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);

  // Delete a pNFS volume — removes its directory subtree (or the
  // legacy metadata file) and reclaims all DS stripes pinned under
  // it. Idempotent: DeleteVolume on an absent volume is a success.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);

  // Grow a pNFS volume's recorded capacity. Directory volumes (the
  // current model) carry no per-volume size on the MDS — capacity is
  // pool-side at the data servers — so this is a metadata-only
  // acknowledgement. Legacy sparse-file volumes DO have a real size and
  // are grown in place. Shrinking is always refused.
  rpc ExpandVolume(ExpandVolumeRequest) returns (ExpandVolumeResponse);

  // Fence one block-layout (scsi) client of a volume: durable fence
  // rows in the allocator (no further grants; its extents free on
  // reclaim once the preempt is CONFIRMED, quarantine while it is
  // not), reservation preempt at the NVMe target (the client's next
  // raw read/write gets RESERVATION CONFLICT), and eviction from the
  // export allow-list. The operator/roller lever for a client that is
  // unresponsive or about to be — the reclaim driver runs the same
  // sequence on its own when a recall goes unanswered. Idempotent.
  //
  // The fence STANDS until UnfenceBlockClient clears it: the durable
  // fenced_clients record survives MDS restarts, tgt restarts, and
  // ptpl loss (the startup replay re-acquires the reservation from it),
  // and the admission guard refuses the client's own LAYOUTGET-driven
  // re-admission while it exists.
  rpc FenceBlockClient(FenceBlockClientRequest) returns (FenceBlockClientResponse);

  // Lift a client's fence: clear the durable fenced_clients record
  // (reopening LAYOUTGET-driven admission) and, when NO other client
  // remains fenced on the volume, release the MDS's EA-RO reservation
  // so non-registrant I/O flows again. The reservation is volume-wide
  // — kernel blocklayout clients register no key, so EA-RO blocks
  // every one of them — which is why it outlives any single client's
  // unfence while a sibling's fence stands. Idempotent; a retry after
  // a failed release converges. The client's next LAYOUTGET re-admits
  // it to the export allow-list; nothing is proactively restored.
  rpc UnfenceBlockClient(UnfenceBlockClientRequest) returns (UnfenceBlockClientResponse);

  // Per-node host admission for a block-class volume — the
  // ControllerPublish half of csi-node session management (design doc
  // §5, "per-node hostnqn registration via ControllerPublish"). Admits
  // flint_host_nqn(node_name) onto the volume's export allow-list
  // BEFORE any NFS traffic exists (the nvme session must be up before
  // the kernel's first LAYOUTGET resolves the device; the allow-list is
  // default-closed), durably (tgt-restart replay reconverges it), and
  // returns the session coordinates the csi-node connects with.
  // Idempotent. Refused while the node's NQN is fenced on the volume.
  rpc AttachBlockNode(AttachBlockNodeRequest) returns (AttachBlockNodeResponse);

  // The inverse (ControllerUnpublish): drop the node's attach row and
  // reconverge. Idempotent — a replay, or a detach after a fence
  // already evicted the row, succeeds with a "no attach record" detail.
  // Client-earned admissions (LAYOUTGET-time block_hosts rows) are NOT
  // touched; only their own lifecycle ends them.
  rpc DetachBlockNode(DetachBlockNodeRequest) returns (DetachBlockNodeResponse);

  // THE "SESSION UP" ACK — the second half of the redirect actor
  // (design doc §12). A csi-node calls this after its nvme-tcp session
  // to the volume's CURRENT target is established and the namespace
  // device exists, and the MDS answers by re-firing CB_NOTIFY_DEVICEID
  // to every client that cached the volume's device.
  //
  // Its whole reason for existing is ORDER, and the order was measured
  // rather than reasoned: a notification sent before the replacement
  // device exists is accepted by the client and does nothing (the
  // unfence drill, 2026-08-12 — "accepted 1/1, write still failed").
  // The MDS cannot know when a node's reconnect completed, so the node
  // has to say so. Nothing else in the system carries that fact.
  //
  // Idempotent and best-effort: a node may ack a session that never
  // moved, and a failed notification prunes nothing (right after a
  // restart a live client has no back-channel yet).
  rpc BlockSessionUp(BlockSessionUpRequest) returns (BlockSessionUpResponse);

  // Where this shard's block export lives, and who is connected to it.
  //
  // The maintenance roller's missing fact (design doc §11, "today's roll
  // orchestration is blind to remote initiators"). A block export lives
  // in the spdk-tgt COLOCATED with this MDS — same node, socket over a
  // shared hostPath — so deleting that node's csi-node pod takes the
  // target down under every remote kernel initiator at once, with no
  // VolumeAttachment, no raid leg and no record anywhere in the
  // roller's world to say so. This RPC is that record.
  //
  // Read-only and cheap (two indexed table scans); the roller polls it
  // once per tick. An initiator here is a LIVE admission: a node
  // attachment from ControllerPublish, or a client-earned admission
  // from LAYOUTGET. Fenced clients are absent by construction — the
  // fence deletes both rows.
  rpc BlockExportStatus(BlockExportStatusRequest) returns (BlockExportStatusResponse);

  // PLACEMENT, peer side: host a copy of a block volume this shard does
  // NOT compose. The caller is the CSI controller, which is the only
  // component that can see the whole fleet — an MDS shard's record is
  // its own and shares nothing with its peers.
  //
  // Idempotent: it mints the lvol, records who composes the volume, and
  // converges the leg export that offers the copy to that composer. It
  // does NOT copy any data — the composer's rebuild does that, and
  // until it has, this leg is STALE by construction.
  rpc HostBlockLeg(HostBlockLegRequest) returns (HostBlockLegResponse);

  // The reverse: drop a leg this shard hosts. Sent at DeleteVolume to
  // every target the composer's record named as holding a leg.
  rpc DropBlockLeg(DropBlockLegRequest) returns (DropBlockLegResponse);
}

message HostBlockLegRequest {
  string volume_id = 1;
  uint64 size_bytes = 2;
  // The target that composes this volume — the ONLY host admitted to
  // the leg export, and what this shard's seat records so its own
  // reconciler knows the volume is not its to serve.
  string composer_target = 3;
}

message HostBlockLegResponse {
  bool hosted = 1;
  string message = 2;
}

message DropBlockLegRequest {
  string volume_id = 1;
}

message DropBlockLegResponse {
  bool dropped = 1;
  string message = 2;
}

message BlockExportStatusRequest {}

message BlockExportStatusResponse {
  // False when this MDS has no blockExport configured: it can serve no
  // block-class volume, so no roll of any node can hurt one HERE. The
  // roller must still consult its other shards.
  bool enabled = 1;

  // The node whose spdk-tgt hosts this export, from the MDS pod's own
  // downward-API nodeName — the roller's join key. Empty on charts that
  // predate the env var, which is why traddr is also returned: the
  // roller then resolves the address against the Node objects instead.
  string export_node = 2;

  // The listener address clients are handed (the pinned node's IP).
  string export_traddr = 3;
  uint32 export_trsvcid = 4;

  // Every live initiator, across every block volume on this shard.
  repeated BlockInitiator initiators = 5;

  // CAPACITY, FOR PLACEMENT — and it is the PROMISED figure, never the
  // physically free one. Every flint block volume is thin, so SPDK's
  // free-cluster count says nothing about what this store has already
  // promised (`blob_resize` skips its free-cluster check entirely for
  // thin blobs). `lvstore_free_promise_bytes` is what a NEW promise can
  // still take: total minus everything already committed.
  //
  // BOTH ZERO means the store could not be read. Placement treats that
  // as UNKNOWN and keeps the shard as a candidate — the same stance the
  // MDS's own capacity gate takes, because turning an unreadable number
  // into a refusal would make an RPC blip look like a full fleet.
  uint64 lvstore_free_promise_bytes = 6;
  uint64 lvstore_total_bytes = 7;

  // This shard accepts promises past its store's capacity
  // (FLINT_PNFS_BLOCK_OVERCOMMIT=1). Placement must not exclude it for
  // want of room the operator has already decided to hand out anyway.
  bool overcommit = 8;
}

message BlockInitiator {
  string volume_id = 1;
  // The NVMe host NQN on the export's allow-list.
  string host_nqn = 2;
  // The Kubernetes node it was admitted for. Set for node attachments;
  // EMPTY for client-earned admissions, whose row is keyed by NFS
  // client id and never carried a node name. The roller must not read
  // an empty node as "no node" — see `source`.
  string node_name = 3;
  // "attach" (block_node_attach, ControllerPublish) or "client"
  // (block_hosts, LAYOUTGET-earned).
  string source = 4;
  // The NFSv4 client id for client-earned rows; 0 for attachments.
  uint64 client_id = 5;
  // When the admission was recorded (unix seconds).
  int64 since_unix = 6;
}

message FenceBlockClientRequest {
  // The pNFS volume (PVC volume id) whose export the client is fenced
  // from.
  string volume_id = 1;

  // The NFSv4 client id — the same u64 GETDEVICEINFO hands the client
  // as its reservation key (`sbv_pr_key`). Readable from the MDS's
  // state backend (`extent_grants.client_id`) or its grant log lines.
  uint64 client_id = 2;
}

message FenceBlockClientResponse {
  // True when the durable fence rows are in place. The preempt and
  // allow-list arms are best-effort on top; `detail` says what each
  // did.
  bool fenced = 1;
  string detail = 2;
}

message UnfenceBlockClientRequest {
  string volume_id = 1;
  // The fenced client's NFSv4 client id — the same u64
  // FenceBlockClient took.
  uint64 client_id = 2;
}

message UnfenceBlockClientResponse {
  // True when the durable record is cleared (or was already absent —
  // the idempotent replay). `detail` says what the release arm did;
  // "release FAILED" there means the volume is STILL blocked at the
  // device and the lever must be retried.
  bool unfenced = 1;
  string detail = 2;
}

message AttachBlockNodeRequest {
  string volume_id = 1;
  // The Kubernetes node name == the node's kernel hostname (fleet
  // discipline; the same equality LAYOUTGET-time admission relies on
  // when it derives the NQN from the kernel's co_ownerid).
  string node_name = 2;
}

message AttachBlockNodeResponse {
  bool attached = 1;
  // Error detail when attached=false. Empty on success.
  string message = 2;
  // nvme-tcp session coordinates: the csi-node runs
  //   nvme connect -t tcp -a <traddr> -s <trsvcid> -n <subnqn>
  //     --hostnqn <host_nqn>
  // and then resolves /dev/disk/by-id/nvme-eui.<nguid> (creating the
  // link itself when udev did not — the §4a landmine).
  string traddr = 3;
  uint32 trsvcid = 4;
  string subnqn = 5;
  string nguid = 6;
  // The NQN the MDS admitted. Connect with EXACTLY this string — it is
  // what keeps the controller, node, and MDS derivations from drifting.
  string host_nqn = 7;
}

message BlockSessionUpRequest {
  string volume_id = 1;
  string node_name = 2;
}

message BlockSessionUpResponse {
  bool acked = 1;
  string message = 2;
  // How many clients accepted the re-fired CB_NOTIFY_DEVICEID, out of
  // how many were attempted. Both zero is the ordinary steady state —
  // nobody had cached the device.
  uint32 notified = 3;
  uint32 attempted = 4;
}

message DetachBlockNodeRequest {
  string volume_id = 1;
  string node_name = 2;
}

message DetachBlockNodeResponse {
  bool detached = 1;
  string message = 2;
}

// CreateVolume request from CSI driver to MDS.
message CreateVolumeRequest {
  // CSI-provisioner-assigned volume ID. Becomes the file name under
  // the MDS export. Must be safe as a filesystem path component
  // (no slashes, no NUL).
  string volume_id = 1;

  // Total volume size in bytes. The MDS pre-allocates (sparse) to
  // this size so kernel WRITEs at any offset within the volume succeed.
  uint64 size_bytes = 2;

  // Per-volume stripe geometry, from StorageClass parameters
  // `pnfs.chert.us/stripeSize` and `pnfs.chert.us/stripeWidth`.
  // 0 means "unset — use the MDS's configured default".
  //
  // Geometry is fixed at volume creation and applies to every file
  // subsequently created in the volume: a file's placement is pinned at
  // its FIRST layout grant and never re-striped, so changing these
  // later could not affect existing data anyway.
  //
  // stripe_width caps how many data servers a file in this volume is
  // pinned across. The default (0) pins every active DS, which
  // maximises per-file bandwidth but also makes the failure domain the
  // whole fleet — any one DS loss affects every file. A smaller width
  // trades peak throughput for blast radius.
  uint64 stripe_size = 3;
  uint32 stripe_width = 4;

  // Ownership and permissions for the volume's root directory, from
  // StorageClass parameters `pnfs.chert.us/dirGid` and `dirMode`.
  //
  // The historical behaviour — 0777, no group — is what 0 in both
  // fields still means. Setting dir_gid chgrps the volume root to that
  // gid and sets the setgid bit, so files created inside inherit the
  // group; that is what makes a pod's `fsGroup` usable on a volume
  // whose consumers run as different uids. Without setgid, a 0770
  // volume would be group-writable but every file inside would land in
  // its creator's primary group, unreadable to the other consumers.
  uint32 dir_gid = 5;
  uint32 dir_mode = 6;

  // Layout class for the volume: "" or "file" = NFSv4.1 files layout
  // (the historical class, and what an older driver that predates this
  // field sends); "scsi" = the pnfs-block StorageClass (RFC 8154/9561
  // extents — LAYOUTGET hands out raw NVMe ranges from the MDS extent
  // allocator instead of stripe maps). Closed set: an unknown value
  // fails the provision. Fixed at creation for the volume's lifetime.
  string layout_class = 7;

  // PLACEMENT, composer side (scsi class only): the target the CSI
  // controller placed this volume's second copy on, and where it
  // answers. Empty = a single-copy volume, which is every volume an
  // older driver provisions.
  //
  // The composer records this as a registry row plus a STALE leg row in
  // the same act as seating the volume, and its next reconcile pass
  // frames the composition with a slot for that leg and rebuilds into
  // it. The leg is deliberately recorded STALE: the peer's lvol exists
  // but holds none of the volume's bytes yet, and only the rebuild may
  // say otherwise.
  string leg_target = 8;
  string leg_traddr = 9;
  uint32 leg_trsvcid = 10;
}

message CreateVolumeResponse {
  // Whether the volume was created (or already existed with matching size).
  bool created = 1;

  // Absolute path of the MDS export root
  // (e.g. "/tmp/flint-pnfs-mds-exports"). Directory volumes are
  // subtrees under it; the client mounts `<mds>:/<volume_file>`.
  string export_path = 2;

  // Volume name relative to `export_path` (directory subtree, or the
  // sparse file for legacy volumes). Currently equal to `volume_id`,
  // but kept separate to allow future per-tenant prefixes.
  string volume_file = 3;

  // Error message on failure (created=false). Empty on success.
  string message = 4;

  // Port the MDS serves NFSv4.1 on (its `bind.port`). The CSI driver
  // dialed the *gRPC* port to make this call — that is not the NFS
  // port, and mounting against it fails. 0 (an older MDS that predates
  // this field) → the caller falls back to the standard 2049.
  uint32 nfs_port = 5;

  // True when the volume is a directory subtree (directory-per-volume
  // model): NodePublish must mount `<mds>:/<volume_file>` so each PVC
  // gets an isolated namespace. False = legacy sparse-file volume (or
  // an older MDS that predates the field): NodePublish mounts the
  // export root as before.
  bool directory = 6;

  // The geometry the MDS ACTUALLY recorded for this volume, after
  // clamping and defaulting. The caller compares these against what it
  // asked for and fails the provision on mismatch.
  //
  // This echo is load-bearing, not diagnostic: the chart pins the pNFS
  // server image independently of the driver image, and proto3 silently
  // drops fields an older peer does not know. Without the echo, asking
  // an older MDS for a 1 MiB stripe would return a healthy-looking PV
  // striped at the 8 MiB default, and nothing would ever say so.
  // 0 in both fields = an MDS that predates them.
  uint64 effective_stripe_size = 7;
  uint32 effective_stripe_width = 8;

  // The layout class the MDS ACTUALLY recorded — same load-bearing echo
  // contract as the stripe fields above: proto3 silently drops fields
  // an older peer does not know, so an MDS predating the block layout
  // echoes "" here and the driver MUST fail a "scsi" provision on the
  // mismatch instead of shipping a PV whose layouts will be stripe maps
  // over a volume the caller believes is extent-backed.
  string effective_layout_class = 9;
}

message ExpandVolumeRequest {
  string volume_id = 1;
  uint64 size_bytes = 2;
}

message ExpandVolumeResponse {
  bool expanded = 1;
  // Size the MDS now records. For directory volumes this echoes the
  // request (nothing is stored per-volume); for legacy file volumes it
  // is the sparse file's new length. When `expanded` is false because a
  // leg is short, this is what the COMPOSITION currently serves.
  uint64 size_bytes = 2;
  string message = 3;

  // Legs that must grow before this volume can. raid1 serves the
  // SMALLEST leg, so a composed volume expands only as far as its
  // shortest copy — and a copy on another target is only reachable by
  // the controller. Empty on every solo volume and every success.
  repeated string leg_targets = 4;
}

message DeleteVolumeRequest {
  string volume_id = 1;
}

message DeleteVolumeResponse {
  bool deleted = 1;
  string message = 2;

  // Targets that held a leg of this volume, read from the composer's
  // record BEFORE it was swept. The controller drops each one; without
  // this the peer's lvol outlives the volume with nothing left in any
  // record to name it.
  repeated string leg_targets = 3;
}

// DS Control Service — the reverse direction: MDS → DS.
//
// Served by each DS on its control port (bind.controlPort), protected
// by the same FLINT_PNFS_CONTROL_TOKEN bearer scheme as MdsControl.
// Exists for operations whose correctness cannot wait for the
// heartbeat cycle: a client that truncates a striped file re-acquires
// layouts immediately after the SETATTR reply, so stale stripe bytes
// must be gone BEFORE the MDS answers — not one heartbeat later.
service DsControl {
  // Set a stripe file's length (both directions; a no-op if the file
  // does not exist — nothing written means nothing stale). Called by
  // the MDS while applying a client's size-changing SETATTR/OPEN, so
  // that bytes beyond the new EOF can never be re-exposed by a later
  // extension (fsx-found: truncate-down left stale stripe bytes).
  rpc TruncateStripeFile(TruncateStripeFileRequest) returns (TruncateStripeFileResponse);

  // F66: MDS fallback-I/O proxy (docs/plans/mds-fallback-proxy-plan.md).
  //
  // A pNFS client that holds no layout is ENTITLED to route I/O through
  // the MDS (RFC 8881 — the MDS is a full NFS server for the file), and
  // the Linux files-layout client does so routinely: every truncate
  // returns its layouts first (PNFS_LAYOUTRET_ON_SETATTR), and a page
  // queued during that window arrives at the MDS as a straggler AFTER
  // the client has already re-acquired a fresh layout — the fsx repro
  // shows LAYOUTGET succeeding 200 µs before the fallback WRITE. The
  // MDS cannot serve striped bytes from its sparse stub, so it applies
  // the I/O to the stripes through these two RPCs instead of answering
  // NFS4ERR_IO to a healthy client (which surfaced as msync EIO in
  // userspace — the fsx failure that was red at HEAD from v1.23.0).
  //
  // Offsets are FILE offsets: stripe files are sparse-addressed (the
  // same invariant TruncateStripeFile's uniform new_length rests on).
  rpc ReadStripe(ReadStripeRequest) returns (ReadStripeResponse);
  rpc WriteStripe(WriteStripeRequest) returns (WriteStripeResponse);
}

message ReadStripeRequest {
  // Identity guard, same as TruncateStripeFile: the DS refuses a
  // request addressed to a device it is not.
  string device_id = 1;
  // Stripe file path RELATIVE to the DS data dir.
  string rel_path = 2;
  // FILE offset (sparse addressing — not a within-stripe offset).
  uint64 offset = 3;
  uint32 count = 4;
}

message ReadStripeResponse {
  bool ok = 1;
  string message = 2;
  // May be SHORT of count, and is EMPTY (with ok=true) for an absent
  // stripe file. The DS reports holes raw and MUST NOT zero-fill or
  // infer EOF: it does not know the file size — only the MDS's stub
  // does, and the MDS resolves holes against it. A DS that guesses is
  // the tar --sparse bug class.
  bytes data = 3;
}

message WriteStripeRequest {
  string device_id = 1;
  string rel_path = 2;
  // FILE offset (sparse addressing).
  uint64 offset = 3;
  bytes data = 4;
}

message WriteStripeResponse {
  // ok=true means the bytes are DURABLE (fdatasync completed) — the
  // MDS replies FILE_SYNC to the client on the strength of this, so a
  // buffered-write-then-ok would be a lie with a power-loss window.
  bool ok = 1;
  string message = 2;
}

message TruncateStripeFileRequest {
  // The device the MDS believes it is talking to. The DS refuses a
  // mismatch (identity guard — same rationale as the registration
  // stamp: mutating another device's volume corrupts silently).
  string device_id = 1;

  // Stripe file path RELATIVE to the DS data dir.
  string rel_path = 2;

  // New file length in bytes (the file's new logical size — stripe
  // files are sparse/logically-addressed, so the length is uniform
  // across the group).
  uint64 new_length = 3;
}

message TruncateStripeFileResponse {
  bool ok = 1;
  // Error detail when ok=false. Empty on success.
  string message = 2;
}

// Registration request from DS to MDS
message RegisterRequest {
  // Unique device identifier (e.g., "ds-node1-lvol0")
  string device_id = 1;
  
  // Primary endpoint (IP:port where DS is listening for NFS)
  string endpoint = 2;
  
  // Additional endpoints for multipath/RDMA
  repeated string multipath_endpoints = 3;
  
  // Mount points this DS serves
  repeated string mount_points = 4;
  
  // Total capacity in bytes
  uint64 capacity = 5;
  
  // Used capacity in bytes
  uint64 used = 6;
  
  // Protocol version
  uint32 protocol_version = 7;

  // Unix-seconds creation stamp of the DS's on-volume identity marker
  // (.flint-ds-identity, durable-DS plan Phase 2). Stamped once at the
  // volume's first boot and stable for the volume's lifetime, so a
  // CHANGE across re-registrations of the same device_id means the DS
  // is serving a different data volume than before — the MDS logs
  // that transition at WARN. 0 from a DS that predates the field.
  uint64 identity_created_at = 8;

  // Port this DS serves DsControl (MDS → DS gRPC) on. The MDS reaches
  // it at the same host it uses for NFS I/O (the operator-configured
  // endpoint when one exists). 0 = DS has no control listener (older
  // build or unconfigured) — truncate propagation then parks the file
  // dirty until the listener appears; see the operator runbook.
  uint32 control_port = 9;
}

// Registration response from MDS to DS
message RegisterResponse {
  // Whether registration was accepted
  bool accepted = 1;
  
  // Message (error reason if not accepted, or success confirmation)
  string message = 2;
  
  // Assigned device ID (may be different if MDS modified it)
  string assigned_device_id = 3;
}

// Heartbeat request from DS to MDS
message HeartbeatRequest {
  // Device ID
  string device_id = 1;
  
  // Current capacity in bytes
  uint64 capacity = 2;
  
  // Current used space in bytes
  uint64 used = 3;
  
  // Number of active connections
  uint32 active_connections = 4;
  
  // Health status
  HealthStatus health = 5;
}

// Heartbeat response from MDS to DS
message HeartbeatResponse {
  // Whether heartbeat was acknowledged
  bool acknowledged = 1;
  
  // MDS instructions (optional)
  repeated Instruction instructions = 2;
}

// Capacity update (can be sent independently of heartbeat)
message CapacityUpdate {
  string device_id = 1;
  uint64 capacity = 2;
  uint64 used = 3;
}

message CapacityResponse {
  bool acknowledged = 1;
}

// Unregister request (clean shutdown)
message UnregisterRequest {
  string device_id = 1;
  string reason = 2;
}

message UnregisterResponse {
  bool acknowledged = 1;
}

// Health status of DS
enum HealthStatus {
  HEALTHY = 0;
  DEGRADED = 1;
  UNHEALTHY = 2;
}

// Instructions from MDS to DS
message Instruction {
  InstructionType type = 1;
  string details = 2;
}

enum InstructionType {
  NO_OP = 0;
  INCREASE_HEARTBEAT_FREQUENCY = 1;
  PREPARE_FOR_SHUTDOWN = 2;
  REPORT_CAPACITY_IMMEDIATELY = 3;
  // Best-effort stripe-file cleanup after NFS REMOVE (or a rename that
  // overwrote a striped target). `details` = the stripe file's path
  // RELATIVE to the DS data dir. Correctness never depends on this —
  // a recreated file gets a fresh file_id and therefore fresh stripe
  // paths — it only reclaims space.
  DELETE_STRIPE_FILE = 4;
}

