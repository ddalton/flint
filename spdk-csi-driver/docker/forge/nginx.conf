# The git server's whole HTTP surface: `git http-backend` behind
# fcgiwrap. Everything here is either required for the smart protocol
# or is a trust-boundary rule.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;

        # A push is a streamed pack of unknown length, and a clone is as
        # large as the repository. Both of these are limits nginx
        # applies by DEFAULT and both would break git: 1m of body, and a
        # buffered request that must land on disk before the backend
        # sees a byte.
        client_max_body_size 0;
        fastcgi_request_buffering off;
        fastcgi_buffering off;
        # A `repack` behind a fetch, or a large clone, legitimately runs
        # for minutes. The default 60s would cut it off as an error.
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;

        # Git LFS. The batch API is answered by the SYNCER, not by
        # `http-backend`, because it needs the bucket credentials —
        # and the objects themselves never come through here at all:
        # the response hands the client a presigned URL. A regex
        # location is matched before the prefix `location /` below, so
        # this wins without any ordering being implied by the file.
        location ~ ^/.*/info/lfs/objects/(batch|verify)$ {
            proxy_pass http://127.0.0.1:9848/lfs/objects/$1;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Content-Type $http_content_type;
            # The same principal the hooks read, from the same header.
            proxy_set_header X-Remote-User $http_x_remote_user;
            # Only the door knows the URL the client actually reached,
            # so only the door can say where `verify` lives.
            proxy_set_header X-Forge-Lfs-Verify $http_x_forge_lfs_verify;
        }

        location / {
            fastcgi_pass unix:/tmp/fcgiwrap.sock;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
            fastcgi_param GIT_PROJECT_ROOT /repo;
            fastcgi_param GIT_HTTP_EXPORT_ALL "";
            # fcgiwrap holds the CGI's output in libfcgi's buffer until the
            # request ends unless this is set (Alpine's no-buffering patch;
            # fcgiwrap reads it from the request's params, like the two
            # above). Without it `receive-pack`'s 5 s sideband keepalives
            # reach the client in one burst WITH the final report, so the
            # door — bounded on inactivity — cuts every push whose hook
            # runs longer than upstreamTimeoutSecs, and the push lands in
            # the bucket while its client is told the remote hung up
            # (runbx, 2026-09-05: a 40 GiB push, cut 311 s into the hook).
            fastcgi_param NO_BUFFERING "";
            fastcgi_param PATH_INFO $uri;

            # THE TRUST BOUNDARY. `REMOTE_USER` is what `pre-receive`
            # and the syncer read as the principal, and it comes from
            # the door's `X-Remote-User` — which the door sets from a
            # verified TokenReview and which no caller can smuggle
            # past it, because the door builds its upstream headers
            # from an allowlist.
            #
            # Anything that can reach THIS port, however, can set the
            # header itself. That is why the operator renders a
            # NetworkPolicy admitting only the gateway's pods, and why
            # this port is on a headless Service with no external
            # address. On a cluster whose CNI does not enforce
            # NetworkPolicy, reaching this port IS the authorization —
            # see `docs/plans/flint-forge-design.md` §6.
            fastcgi_param REMOTE_USER $http_x_remote_user;

            # Protocol v2. `http-backend` reads it from the environment,
            # and without it every session is v0: no `ls-refs` prefix
            # filtering, and bundle URIs cannot be advertised at all.
            fastcgi_param GIT_PROTOCOL $http_git_protocol;
        }
    }
}
