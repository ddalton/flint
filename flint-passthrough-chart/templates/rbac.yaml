{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flint-passthrough.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "flint-passthrough.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flint-passthrough.name" . }}
  labels: {{- include "flint-passthrough.labels" . | nindent 4 }}
rules:
  # Read-only, and `get` alone would do — the webhook fetches one CR by
  # name per admission and never lists or watches. list/watch are here
  # only so `kubectl auth can-i --as` and a human debugging with this
  # ServiceAccount see the same view the webhook does.
  - apiGroups: ["flint.io"]
    resources: ["flintpassthroughmounts"]
    verbs: ["get", "list", "watch"]
  # The registration carries the caBundle for the cert the operator
  # generates, so the operator owns the object.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["create", "get", "patch"]
  # NOTE: no customresourcedefinitions permission. Unlike the lean
  # operator this binary does not apply its own CRD — crds/ in this
  # chart is the only copy, which is why a chart UPGRADE does not
  # update it (see the note at the top of that file).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "flint-passthrough.name" . }}
  labels: {{- include "flint-passthrough.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "flint-passthrough.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flint-passthrough.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The cert Secret is namespace-scoped and read/created by the operator
# itself (replicas share one bundle; the loser of the create race
# adopts the winner's material).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flint-passthrough.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "flint-passthrough.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flint-passthrough.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "flint-passthrough.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flint-passthrough.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flint-passthrough.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
