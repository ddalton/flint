# FlintPassthroughMount — the argument list for a FUSE mount.
#
# There is no controller behind this CR and no status: nothing about a
# passthrough mount converges. (Nothing here can repair a mount either:
# if the mounter crashes, containers already running in the pod are
# stranded on a dead FUSE connection and the pod must be recreated.)
# The s3.csi.chert.us node plugin reads it at NodePublishVolume, when
# kubelet schedules a pod whose inline csi: volume names it in
# volumeAttributes as `chert.us/mount`. That is the whole lifecycle.
# There is no webhook and no label: before v1.45.0 a mutating webhook
# injected a privileged sidecar for the pod label
# flint.io/passthrough-mount, and fcac038f replaced it with the node
# DaemonSet.
#
# NOTE ON UPGRADES: Helm applies crds/ on INSTALL ONLY and never on
# upgrade. If a later chart version adds a field here, apply this file
# by hand:
#   kubectl apply -f flint-passthrough-chart/crds/flintpassthroughmounts.yaml
# The node plugin refuses a spec it cannot parse rather than defaulting
# it, so a stale CRD shows up as a FailedMount naming the field — not
# as a mount with a silently wrong shape.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flintpassthroughmounts.chert.us
spec:
  group: chert.us
  scope: Namespaced
  names:
    kind: FlintPassthroughMount
    listKind: FlintPassthroughMountList
    plural: flintpassthroughmounts
    singular: flintpassthroughmount
    shortNames: [fpm]
    categories: [flint]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - { name: Bucket, type: string, jsonPath: .spec.bucket }
        - { name: Prefix, type: string, jsonPath: .spec.keyPrefix }
        - { name: Mount, type: string, jsonPath: .spec.mountPath }
        - { name: RO, type: boolean, jsonPath: .spec.readOnly }
        - { name: Shared, type: boolean, jsonPath: .spec.sharing.readOnly }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            An S3 prefix, mounted into every pod labelled
            chert.us/passthrough-mount with this CR's name, by
            Mountpoint for S3. Passthrough only: no cache, no manifest,
            no publish boundary, and no coordination between pods
            sharing it. Writes are sequential writes to whole objects —
            no rename, no append, no in-place modification, at any
            setting. A pod that needs those wants flint-lean.
          properties:
            spec:
              type: object
              required: [bucket]
              properties:
                bucket:
                  type: string
                  description: The bucket to mount.
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,253}$'
                keyPrefix:
                  type: string
                  description: >-
                    Object key prefix to mount as the root. An object
                    KEY prefix, not a path — no leading slash.
                  pattern: '^([^/].*)?$'
                  x-kubernetes-validations:
                    - rule: "!self.contains('..')"
                      message: keyPrefix must not contain a .. segment
                endpoint:
                  type: string
                  description: >-
                    S3 endpoint override (MinIO, Ceph RGW, the lean
                    proxy). Unset means AWS S3.
                  pattern: '^https?://.+$'
                region:
                  type: string
                mountPath:
                  type: string
                  description: >-
                    Where the bucket appears inside the pod. Refused if
                    any container in the pod already mounts it.
                  default: /mnt/s3
                  pattern: '^/[A-Za-z0-9._/-]*[A-Za-z0-9._-]$'
                # A TOMBSTONE, not a leftover. Removing the field
                # outright would have the API server PRUNE it: a CR
                # asking for s3fs would be stored without the ask and
                # mounted with a write model it did not choose — no
                # rename, no append — and the first sign of it would be
                # a workload failing at 3am. Declared-and-refused turns
                # that into `kubectl apply` naming the field. The
                # plugin's deny_unknown_fields is the second gate, for
                # a CR stored while an older CRD was installed.
                driver:
                  type: string
                  description: >-
                    REMOVED. The mounter is Mountpoint for S3 and only
                    that. A pod needing rename, append or in-place
                    modification wants flint-lean, whose publish
                    boundary is what makes those safe.
                  x-kubernetes-validations:
                    - rule: "false"
                      message: >-
                        spec.driver has been removed — the mounter is
                        Mountpoint for S3 for every mount. Drop the field.
                        If you set it to s3fs for rename/append/in-place
                        writes, those are not available at any setting
                        here: use flint-lean.
                readOnly:
                  type: boolean
                  default: false
                pathStyle:
                  type: boolean
                  description: >-
                    Path-style addressing. Unset means "true when
                    endpoint is set" — every self-hosted gateway needs
                    it and AWS proper does not.
                credentialsSecretRef:
                  type: string
                  description: >-
                    Secret whose keys are AWS_* VERBATIM
                    (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
                    optionally AWS_SESSION_TOKEN) — the same shape
                    flint-lean takes. Unset means the ambient chain
                    (IRSA, instance profile), which mount-s3 resolves
                    natively.
                uid:
                  type: integer
                  description: >-
                    Owner uid reported for every file in the mount —
                    ONE uid for the whole mount and for every process
                    in the pod. There is no per-process or per-user
                    view of it.

                    THERE IS NO POD-DERIVED DEFAULT under the CSI
                    delivery: NodePublishVolume never sees the pod's
                    securityContext, so nothing can read runAsUser at
                    mount time. Resolution is the volume's
                    chert.us/uid attribute if set, else this field,
                    else 65534.

                    Set one of the two to the uid the workload runs
                    as. A mount owned by a uid the workload does not
                    have is one it can read and cannot write — EACCES
                    on the first create, which looks like a bucket
                    policy problem.
                  format: int64
                gid:
                  type: integer
                  description: >-
                    Owner gid, resolved the same way and with the same
                    absence of a pod-derived default: the volume's
                    chert.us/gid attribute if set, else this field,
                    else whatever the uid resolved to.
                  format: int64
                mountOptions:
                  type: array
                  description: >-
                    Extra mount-s3 arguments, appended verbatim as ARGV
                    (never through a shell). A flag and its value are
                    two entries: ["--metadata-ttl", "60"].
                  items:
                    type: string
                cache:
                  type: object
                  description: >-
                    Mountpoint's local block cache, in the worker's own
                    scratch emptyDir (/tmp, workers.scratchSize, default
                    1Gi). OFF unless enabled, a sharing CR included. For
                    a dataset mounted read-only and read many times that
                    FITS in maxSizeMib it is the largest single
                    performance lever available (a 512 MiB set warmed
                    2.5x faster on EC2); a working set larger than the
                    cache pays every fetched block to the disk under
                    /tmp -- the node's root volume, on an emptyDir -- and
                    warms nothing: 6 GiB through a 768 MiB cache read 5x
                    SLOWER than with no cache on a gp3 root, cold and
                    warm alike (2026-09-30, design doc section 11).
                    Enable it for a set that fits. WHERE it lives is the
                    chart's: workers.cacheHostPath places every cache in
                    a private directory on a device the operator names
                    (the instance store), and there a sharing CR that
                    names no cache gets one of workers.cacheSizeMib. The
                    plugin says where the cache landed: a CacheOnRootDisk
                    event on the tenant pod when the cache directory is on
                    the same disk as the kubelet root (always, on the
                    emptyDir; on a placement, when the root is on the
                    node's own disk). A note, not a refusal.
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    maxSizeMib:
                      type: integer
                      minimum: 1
                      description: >-
                        The cache ceiling in MiB. REQUIRED when enabled:
                        an unbounded cache fills the emptyDir, whose
                        sizeLimit then EVICTS the worker — and an evicted
                        passthrough worker is an unrecoverable mount
                        (restartPolicy: Never). Leave headroom under
                        workers.scratchSize.
                  required: [enabled]
                sharing:
                  type: object
                  description: >-
                    One mounter per NODE for this CR's read-only consumers
                    instead of one per pod: one worker pod, one FUSE
                    mount, one block cache and one connection pool, with
                    each pod's volume a bind of that mount. OFF unless
                    readOnly is true. Members are the pods whose effective
                    access is read (spec.readOnly, an SA in
                    readOnlyServiceAccounts, or the pod's own readOnly:
                    true) with the same effective uid/gid, on
                    identity.mode broker (a broker whose backend scopes a
                    read grant by the CR: sts or static) or ambient; a
                    read-write consumer keeps its own mounter, and
                    identity.mode static is refused with this set. The
                    trade, stated: one mounter's death strands every
                    member; one memory limit and prefetch budget serve
                    them all; and a member's grant cannot be revoked on
                    its own before its pod exits, because every member
                    holds the same authority (which is also why sharing
                    grants none of them anything). Per-member
                    registrations and exchanges are still logged by the
                    broker. A sharing CR that names no cache runs WITHOUT
                    the block cache (the one-day default of three quarters
                    of workers.scratchSize, 2026-09-29, was withdrawn once
                    measured: see cache) unless the chart PLACED the cache
                    on a fast device (workers.cacheHostPath), where it
                    gets one of workers.cacheSizeMib; name cache to choose.
                    Design: docs/plans/passthrough-read-only-mount-sharing.md.
                  properties:
                    readOnly:
                      type: boolean
                      default: false
                image:
                  type: string
                  description: >-
                    Per-mount mounter image override, and DEAD: it was
                    read by the mutating webhook that v1.45.0 removed.
                    The s3.csi.chert.us CSI driver never reads it — the
                    mounter image is pinned by the flint-s3-csi chart at
                    workers.passthroughImage, and the workers policy
                    admits only the two images that chart names. Setting
                    this changes nothing; it is the privileged-escape
                    knob the CSI design removes. (It said "the chart's
                    sidecarImage otherwise" until v1.50.0, naming a
                    value no chart has had since the webhook went.)
                consumers:
                  type: object
                  description: >-
                    CSI delivery (s3.csi.chert.us): which ServiceAccounts in
                    this namespace may mount the CR. ABSENT = DENY under
                    CSI — list them, or ["*"] for any SA in the namespace,
                    which is the old webhook delivery's trust level made
                    explicit. There is no other delivery: absent is DENY.
                  properties:
                    serviceAccounts:
                      type: array
                      description: >-
                        May mount read-write, or read-only when the pod's
                        volume says readOnly: true.
                      items:
                        type: string
                    readOnlyServiceAccounts:
                      type: array
                      description: >-
                        May mount read-only and never wider: on this CR a
                        pod asking readOnly: false is narrowed (mount-s3
                        runs --read-only). A FlintLeanWorkspace refuses such
                        a pod instead. flint-s3-broker issues a credential
                        that cannot write where its backend can scope one
                        (sts, rest, or static with a read key). A name beats
                        "*", and at equal specificity the read-only list
                        wins.
                      items:
                        type: string
                identity:
                  type: object
                  description: >-
                    CSI delivery: how the worker obtains its credential.
                    broker (default) — the node plugin exchanges the
                    pod-bound ServiceAccount token at flint-s3-broker for
                    short-lived proxy keys; webIdentity — REFUSED on this
                    kind (the mounter has no web-identity provider, so
                    the exchange is never attempted; it is honoured on a
                    FlintLeanWorkspace, whose syncer does implement it);
                    static — the pod's
                    nodePublishSecretRef (AWS_* keys verbatim, the
                    interim arm); ambient — the worker's own AWS chain.
                  properties:
                    mode:
                      type: string
                      enum: [broker, webIdentity, static, ambient]
                      default: broker
              # No `additionalProperties: false` here — a structural
              # schema forbids it alongside `properties`, and it would
              # be redundant: the API server PRUNES unknown fields
              # before storage. The node plugin additionally parses with
              # serde's deny_unknown_fields, which is what catches a CR
              # written while an older CRD was installed.
          required: [spec]
