apiVersion: v2
name: flint-passthrough
description: >-
  The FlintPassthroughMount CRD: an S3 prefix a pod mounts with
  Mountpoint for S3 through the s3.chert.us CSI node driver
  (flint-s3-csi-chart). One CR per bucket subtree, one csi: volume in
  the pod, and no control plane behind it: no checkout, no manifest, no
  claim, no publish boundary, no controller, no webhook, no privilege
  in the pod. Reads are fast and lazy; writes are whole new objects,
  with no rename, no append and no in-place modification.
type: application

# Chart version, independent of the flint release train.
version: 0.2.0

# The flint release this CRD ships with. The mounter image tag is
# flint-s3-csi-chart's business now.
appVersion: "1.45.0"

keywords:
  - s3
  - fuse
  - mountpoint-s3
  - passthrough
  - flint
home: https://flint.chert.us
sources:
  - https://github.com/ddalton/flint
