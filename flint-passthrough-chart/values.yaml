# flint-passthrough — an S3 prefix as a directory, and nothing else.
#
# The mounter is Mountpoint for S3 and only that. Reads are fast and
# lazy; writes are whole new objects written sequentially, with no
# rename, no append and no in-place modification at any setting. There
# is no knob here that changes that — a POSIX-emulating client would
# hand a workload a working tree with no coordination behind it, and
# flint-lean is the front end that has the boundary those need.
#
#   helm install flint-passthrough ./flint-passthrough-chart \
#     -n flint-system --create-namespace
#
# Then a bucket subtree is one `kubectl apply` of a
# FlintPassthroughMount, and a pod joins it with the label
#   flint.io/passthrough-mount: <name>
#
# ─────────────────────────────────────────────────────────────────────
# READ THIS BEFORE INSTALLING: THE SIDECAR IS PRIVILEGED
#
# A FUSE mount made inside a sidecar reaches the app container only
# through `mountPropagation: Bidirectional`, and Kubernetes allows that
# mode ONLY on a privileged container. There is no unprivileged
# variant of this design; the unprivileged alternatives are a CSI
# driver that holds the mount on the node, or flint-lean, whose
# sidecar copies bytes instead of mounting and needs no privilege at
# all.
#
# Two consequences:
#   · Pods land in namespaces you control. In a namespace enforcing
#     PodSecurity `baseline` or `restricted`, the mutated pod is
#     REJECTED — the webhook cannot and should not work around that.
#   · Anyone who can create a labelled pod AND a FlintPassthroughMount
#     in such a namespace can obtain a privileged container. Gate the
#     CR with RBAC if that is not already true of the namespace.
#
# AND: A MOUNTER CRASH IS NOT RECOVERABLE IN PLACE
#
# Every container already running in the pod holds a private copy of the
# FUSE filesystem, made when it started. If the mounter dies, that copy
# goes ENOTCONN and stays there — the replacement mounter's fresh mount
# does not reach it. The pod must be recreated. The sidecar detects the
# case and goes NOT READY (so the pod leaves its Service endpoints and
# `kubectl describe` says why) but it cannot repair it. Run passthrough
# workloads under a controller that will replace a NotReady pod.
# ─────────────────────────────────────────────────────────────────────

# The webhook image. Composed as {repository}/{name}:{tag|appVersion};
# `ref` overrides the whole reference (e.g. a kind-loaded
# "flint-passthrough-operator:e2e").
#
# This is the SHARED flint operator image — the same one flint-lean
# names. The chart runs /usr/local/bin/flint-passthrough-operator out of
# it, never the image's own ENTRYPOINT.
image:
  repository: dilipdalton
  name: flint-lean-operator
  tag: ""
  ref: ""
  pullPolicy: IfNotPresent

# The mounter image the webhook injects. MUST carry a shell, mount-s3
# and fusermount — the injected launcher is `sh -c` and the
# startupProbe greps /proc/mounts. Built from
# spdk-csi-driver/docker/Dockerfile.passthrough.
#
# NOT named `flint-passthrough`: that Docker Hub repo is where the HELM
# CHART is pushed as an OCI artifact, and a repo holding both a chart
# and a container image makes `docker pull` and `helm pull` disagree
# about what a tag means. Same reason the lean operator image is
# published as flint-lean-OPERATOR.
sidecarImage:
  repository: dilipdalton
  name: flint-passthrough-mounter
  tag: ""
  ref: ""

# Two by default. The webhook is stateless (the cert lives in a Secret
# both replicas read) and `failurePolicy: Fail` puts it on the critical
# path for every labelled pod — though only for labelled pods, so an
# outage cannot wedge the cluster.
replicaCount: 2

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# Resources for the INJECTED mounter, applied to every mount this
# release admits. A per-mount override is not offered: the CR is
# writable by tenants, and the sidecar it configures is privileged.
#
# The memory limit is the knob that matters. mount-s3 sizes its
# prefetch buffers against the machine's memory, not the cgroup's, so a
# low limit shows up as an OOMKill under read load — and an OOMKilled
# mounter takes the MOUNT with it: the app container's open file
# descriptors go ENOTCONN and stay that way, even though the sidecar
# restarts and remounts underneath them. Raise this before blaming the
# bucket.
sidecarResources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

# The mutating webhook. Certs are generated by the operator and kept in
# a Secret — no cert-manager dependency. failurePolicy is Fail by
# design: an opted-in pod either gets its mount or does not schedule.
# The alternative starts the pod against an EMPTY DIRECTORY, which
# nothing inside the pod can tell apart from an empty bucket.
webhook:
  port: 9443

nodeSelector: {}
tolerations: []
affinity: {}
