# flint-passthrough — the FlintPassthroughMount CRD, and nothing else.
#
# There is no workload in this chart. A pod gets its mount from the
# s3.chert.us CSI node driver (flint-s3-csi-chart): one `csi:` volume
# naming a FlintPassthroughMount in the pod's own namespace, no label,
# no webhook, no sidecar, no privilege in the pod. The mounter image the
# driver runs is pinned there (`workers.passthroughImage`), never here.
#
# Install this chart once per cluster (its CRD is cluster-scoped);
# tenants then declare CRs in their namespaces.
nameOverride: ""
