# One sampler pod per node. It sees the node's processes (hostPID) and
# reports how much CPU the storage driver's processes used during a fio
# window: `sample.sh <delay-s> <window-s> <label=regex,...>` prints one
# JSON object. Driver-agnostic: the caller passes the process patterns.
apiVersion: v1
kind: Namespace
metadata:
  name: flint-bench
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-sampler
  namespace: flint-bench
data:
  sample.sh: |
    #!/bin/sh
    # Sums utime+stime (all threads) and VmRSS of the processes whose
    # cmdline matches each pattern, before and after the window.
    set -eu
    delay=$1 window=$2 patterns=$3
    tck=$(getconf CLK_TCK)
    ticks() {  # <regex> -> "<ticks> <rss_kib> <npids>"
      re=$1 t=0 r=0 n=0
      for d in /proc/[0-9]*; do
        c=$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null) || continue
        [ -n "$c" ] || continue
        case "$c" in *sample.sh*) continue ;; esac   # not this sampler
        echo "$c" | grep -Eq -- "$re" || continue
        # utime, stime are fields 14, 15; cut "pid (comm) " first, comm may hold spaces
        st=$(sed 's/^.*) //' "$d/stat" 2>/dev/null) || continue
        u=$(echo "$st" | awk '{print $12 + $13}')
        k=$(awk '/^VmRSS:/{print $2}' "$d/status" 2>/dev/null || true)
        t=$(( t + u )) r=$(( r + ${k:-0} )) n=$(( n + 1 ))
      done
      echo "$t $r $n"
    }
    cpu() { awk '/^cpu /{print $2+$3+$4+$5+$6+$7+$8+$9, $5+$6}' /proc/stat; }
    labels=$(echo "$patterns" | tr ',' '\n')
    sleep "$delay"
    bf=$(mktemp)
    echo "$labels" | while IFS= read -r p; do ticks "${p#*=}" >> "$bf"; done
    set -- $(cpu); n0=$1 i0=$2
    sleep "$window"
    set -- $(cpu); n1=$1 i1=$2
    busy=$(awk -v a="$n0" -v b="$n1" -v c="$i0" -v d="$i1" -v w="$window" -v t="$tck" \
      'BEGIN{printf "%.3f", ((b-a)-(d-c))/t/w}')
    printf '{"node":"%s","window_s":%s,"node_busy_cores":%s,"procs":{' "$NODE_NAME" "$window" "$busy"
    i=0
    echo "$labels" | while IFS= read -r p; do
      i=$(( i + 1 ))
      set -- $(sed -n "${i}p" "$bf"); tb=$1
      set -- $(ticks "${p#*=}"); ta=$1 rss=$2 np=$3
      [ "$i" = 1 ] || printf ','
      printf '"%s":{"cores":%s,"rss_mib":%s,"pids":%s}' "${p%%=*}" \
        "$(awk -v a="$tb" -v b="$ta" -v w="$window" -v t="$tck" 'BEGIN{printf "%.3f", (b-a)/t/w}')" \
        "$(( rss / 1024 ))" "$np"
    done
    printf '}}\n'
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bench-sampler
  namespace: flint-bench
spec:
  selector:
    matchLabels: {app: bench-sampler}
  template:
    metadata:
      labels: {app: bench-sampler}
    spec:
      hostPID: true
      tolerations: [{operator: Exists}]
      # The samplers are how the harness reaches the hosts (hostexec). On
      # 2026-10-08 all three were evicted when a driver's image pull put the
      # 8 GiB roots into DiskPressure, and the run died mid-step. Critical
      # pods are admitted under pressure and evicted last.
      priorityClassName: system-node-critical
      containers:
      - name: sampler
        image: alpine:3.20
        command: ["sleep", "infinity"]
        env:
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        securityContext: {privileged: true}
        volumeMounts: [{name: scripts, mountPath: /bench}]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
      volumes:
      - name: scripts
        configMap: {name: bench-sampler, defaultMode: 0755}
