# Mayastor StorageClasses (plan §3): NVMe-oF, replica count 1 and 3, thick,
# ext4 like every other driver here.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: mayastor-bench-r1}
provisioner: io.openebs.csi-mayastor
parameters: {protocol: nvmf, repl: "1", thin: "false", fsType: ext4}
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: {name: mayastor-bench-r3}
provisioner: io.openebs.csi-mayastor
parameters: {protocol: nvmf, repl: "3", thin: "false", fsType: ext4}
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
