# The store half of the e2e rig: namespace, MinIO (stand-in for the
# deployment proxy), and the bucket bootstrap. Shared by run.sh (raw
# manifests) and run-chart.sh (helm).
apiVersion: v1
kind: Namespace
metadata:
  name: flint-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: flint-system
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data", "--address", ":9000"]
          env:
            - { name: MINIO_ROOT_USER, value: drill }
            - { name: MINIO_ROOT_PASSWORD, value: drillsecret }
          ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: flint-system
spec:
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: 9000 }]
---
# Bucket bootstrap (the operator deliberately has no CreateBucket).
apiVersion: batch/v1
kind: Job
metadata:
  name: make-bucket
  namespace: flint-system
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set m http://minio.flint-system.svc:9000 drill drillsecret; do sleep 2; done
              mc mb --ignore-existing m/agentws
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: flint-system
type: Opaque
stringData:
  # Keys AWS_* VERBATIM — the operator principal's ambient chain.
  AWS_ACCESS_KEY_ID: drill
  AWS_SECRET_ACCESS_KEY: drillsecret
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://minio.flint-system.svc:9000
