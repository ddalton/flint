# The store half of the e2e rig on the SECOND store: RustFS, behind the
# Service still named `minio`, so verbs.yaml, chaos.yaml and both drills
# address it unchanged. Apply this OR minio.yaml, never both.
#
# Why a second store: every leg's expectation was written against MinIO,
# and a protocol that only works on one vendor's reading of S3 is a
# finding. MinIO stays the primary store (its measured behaviour, e.g.
# DELETE ignoring If-Match, is what the legs were calibrated on).
# run-verbs.sh detects the store; B8 counts requests with MinIO's admin
# trace, which RustFS does not serve, so on RustFS B8 is SKIPPED, loudly.
# The mc oracle and the bucket bootstrap are the same MinIO client.
apiVersion: v1
kind: Namespace
metadata:
  name: flint-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: flint-system
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: rustfs/rustfs:latest
          env:
            - { name: RUSTFS_ACCESS_KEY, value: drill }
            - { name: RUSTFS_SECRET_KEY, value: drillsecret }
            - { name: RUSTFS_VOLUMES, value: /data }
          ports: [{ containerPort: 9000 }]
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: logs, mountPath: /logs }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: logs, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: flint-system
spec:
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: 9000 }]
---
# Bucket bootstrap (the operator deliberately has no CreateBucket).
apiVersion: batch/v1
kind: Job
metadata:
  name: make-bucket
  namespace: flint-system
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: cgr.dev/chainguard/minio-client:latest-dev
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set m http://minio.flint-system.svc:9000 drill drillsecret; do sleep 2; done
              mc mb --ignore-existing m/agentws
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: flint-system
type: Opaque
stringData:
  # Keys AWS_* VERBATIM — the operator principal's ambient chain.
  AWS_ACCESS_KEY_ID: drill
  AWS_SECRET_ACCESS_KEY: drillsecret
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://minio.flint-system.svc:9000
