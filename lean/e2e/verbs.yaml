---
# B14's mixed fleet, and it is a REAL old binary rather than a
# simulation: built from `69b35978` — the commit before the boundary
# verbs existed — so it has no sentinel support, no capability marker,
# and no `.flint/` reservation in its scan. That last one is the hazard
# the leg demonstrates, and it cannot be faked by a knob.
#
# Two containers over ONE emptyDir: `sync` is the old binary, `new` is
# the shipping one. The downgrade-over-a-live-tree arm needs both to see
# the same workspace, which is exactly what a rollback looks like.
apiVersion: v1
kind: Pod
metadata: { name: verbs-old, namespace: default }
spec:
  restartPolicy: Always
  containers:
    - name: sync
      image: flint-sync:predo
      imagePullPolicy: Never
      command: ["/bin/sh", "-c", "exec sleep infinity"]
      env:
        - { name: FLINT_SYNC_BUCKET, value: agentws }
        - { name: FLINT_SYNC_PREFIX, value: "tenants/b14" }
        - { name: FLINT_SYNC_ROOT, value: /work }
        - { name: FLINT_SYNC_ENDPOINT, value: "http://minio.flint-system.svc:9000" }
        - { name: FLINT_SYNC_FLOOR_SECS, value: "3600" }
        - { name: FLINT_SYNC_FANOUT, value: "1" }
        - { name: AWS_ACCESS_KEY_ID, value: drill }
        - { name: AWS_SECRET_ACCESS_KEY, value: drillsecret }
        - { name: AWS_REGION, value: us-east-1 }
      volumeMounts: [{ name: work, mountPath: /work }]
    - name: new
      image: flint-sync:e2e
      imagePullPolicy: Never
      command: ["/bin/sh", "-c", "exec sleep infinity"]
      env:
        - { name: FLINT_SYNC_BUCKET, value: agentws }
        - { name: FLINT_SYNC_PREFIX, value: "tenants/b14" }
        - { name: FLINT_SYNC_ROOT, value: /work }
        - { name: FLINT_SYNC_ENDPOINT, value: "http://minio.flint-system.svc:9000" }
        - { name: FLINT_SYNC_FLOOR_SECS, value: "3600" }
        - { name: FLINT_SYNC_FANOUT, value: "1" }
        - { name: AWS_ACCESS_KEY_ID, value: drill }
        - { name: AWS_SECRET_ACCESS_KEY, value: drillsecret }
        - { name: AWS_REGION, value: us-east-1 }
      volumeMounts: [{ name: work, mountPath: /work }]
  volumes: [{ name: work, emptyDir: {} }]
