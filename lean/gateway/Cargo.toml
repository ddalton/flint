# flint-lean-gateway: the lean gateway. The LIBRARY is the verbs
# (`workspace.rs`, `drafts.rs`) — what a backend calls in-process to
# serve lean workspaces without running a gateway beside each one — and
# the BINARY `flint-lean-gateway` is `main` around the same verbs behind
# HTTP (`http.rs`). One crate, so the two cannot drift. Depends on
# `flint-lean` for the protocol (inbox, manifest, config) and on
# `flint-store` for the bucket; the S3 backend is on by default.
#
#   cargo test                                  # the API + the HTTP battery on the in-memory store
#   cargo test --no-default-features            # the API alone (no AWS SDK, no warp)
#   cargo build --release                       # the shippable binary
[package]
name = "flint-lean-gateway"
version = "0.8.0"
edition = "2021"
description = "The flint lean gateway: read, write, delete, rename, draft and publish files in S3-backed lean workspaces from your own process, or run the binary"
license = "MIT"
repository = "https://github.com/ddalton/flint"
readme = "README.md"
keywords = ["s3", "workspace", "flint", "lean", "gateway"]
categories = ["filesystem"]

[features]
default = ["s3", "http", "fastalloc"]
# The real S3 backend (`connect`, `S3Store`). Off, the crate builds
# against the in-memory store only.
s3 = ["flint-lean/s3", "flint-store/s3"]
# The HTTP router (`http::routes`) and the binary. A backend on another
# web stack turns it off and never compiles warp.
http = ["dep:warp"]
# mimalloc as the binary's allocator, as the syncer and the NFS server ship
# it: the binary is static musl, whose malloc is one process-wide lock, and
# on mimalloc a UI save at 1M files took 2.9 s against 3.7 s (latency plan
# §16). Only the binary declares it; an embedder chooses its own.
fastalloc = ["dep:mimalloc"]

[[bin]]
name = "flint-lean-gateway"
path = "src/bin/flint_lean_gateway.rs"
required-features = ["s3", "http"]

# The HTTP battery drives the verbs through the router.
[[test]]
name = "battery"
required-features = ["http"]

[dependencies]
flint-lean = { version = "0.10.0", path = "../syncer", default-features = false }
flint-store = { version = "0.2.0", path = "../../crates/flint-store" }
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt", "time", "macros"] }
uuid = { version = "1.0", features = ["v4"] }
warp = { version = "0.4", features = ["server"], optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
# warp::test for the battery (the server feature comes with it).
warp = { version = "0.4", features = ["server", "test"] }
# Collects a reply body in the error-shape test (hyper 1 dropped to_bytes).
http-body-util = "0.1"
# A counting store wrapper pins what a read costs in requests.
async-trait = "0.1"
# The battery skips one leg when it runs as root.
libc = "0.2"
tempfile = "3.0"
tokio = { version = "1.0", features = ["full"] }
