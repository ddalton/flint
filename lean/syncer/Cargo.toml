# flint-lean: the checkout/publish syncer (flint-sync) and the lean
# protocol it implements (manifest, inbox, lease, barrier). The gateway
# is its own crate, lean/gateway (flint-lean-gateway), built ON this one.
# Plan of record: docs/plans/flint-lean-plan.md; formal model:
# lean/formal/.
#
# Deliberately its OWN crate: `cargo test` here builds flint-store's
# memory double + this crate + a small dep tree — never the hub crate's
# 13 binaries or the aws/kube/nfs trees. The bins need the real S3
# backend, so they sit behind the `s3` feature:
#
#   cargo test                          # the battery (small, no AWS SDK)
#   cargo build --release --features s3 # the shippable binaries
[package]
name = "flint-lean"
version = "0.8.0"
edition = "2021"
description = "flint lean: the checkout/publish syncer for S3-backed agent workspaces, and the gateway verbs it shares with flint-lean-gateway"
license = "MIT"
repository = "https://github.com/ddalton/flint"
keywords = ["s3", "sync", "workspace", "flint"]
categories = ["filesystem"]

[features]
# DEFAULT ON since 2026-09-12, after measurement — the same finding the
# hub made for the NFS server on 2026-08-29 (spdk-csi-driver/Cargo.toml,
# `fastalloc`). flint-sync ships as a STATIC MUSL binary, and musl's
# malloc holds ONE process-wide lock. That never showed while the
# checkout fan-out was driven from a single task; the moment the fetches
# ran on several threads the lock made it 3x the CPU per file and SLOWER
# (6-vCPU rig: 6 musl drivers 8.4-10.4k files/s at ~430 us/file vs one
# driver 11.9-13.0k at ~110 us). Same binary, mimalloc: 21.5-27.7k at
# ~90 us/file. On i4i.xlarge against real S3: 3,277-3,481 -> 6,188-6,521.
# `--no-default-features --features s3` restores musl's allocator and is
# the control arm. Details: lean/e2e/perf/results/fanout-ceiling-2026-09-12.md.
default = ["fastalloc", "http"]
fastalloc = ["dep:mimalloc"]
s3 = ["flint-store/s3"]
# The syncer binary's own HTTP endpoint (`/metrics`, warp). Off, the
# crate is the protocol and the syncer core with no web stack at all —
# what `flint-lean-gateway` builds against, so an embedder's backend
# does not compile warp to use it.
http = ["dep:warp"]

[[bin]]
name = "flint-sync"
path = "src/bin/flint_sync.rs"
required-features = ["s3", "http"]

[dependencies]
flint-store = { version = "0.1.4", path = "../../crates/flint-store" }
futures = "0.3"
libc = "0.2"
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
warp = { version = "0.3", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3.0"
