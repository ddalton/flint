# flint-lite-operator — the FlintShare control plane.
#
# Install once per cluster; then every share is a `kubectl apply` of a
# FlintShare, and `kubectl get flintshares -A` is the fleet.
#
#   helm install flint-lite-operator oci://registry-1.docker.io/dilipdalton/flint-lite-operator \
#     -n flint-system --create-namespace
#
# The operator renders the SAME objects the flint-lite chart renders
# (a golden test in the suite fails the build if they ever drift), so
# adopting it does not change what runs — only what manages it.

image:
  # Composed as {repository}/{name}:{tag|Chart.appVersion}. `ref`
  # overrides the whole reference verbatim (e.g. a kind-loaded
  # "flint-lite-operator:local").
  repository: dilipdalton
  name: flint-lite-operator
  tag: ""
  ref: ""
  pullPolicy: IfNotPresent

# Default hub image for shares that do not set spec.image. THIS is the
# fleet's upgrade lever: change it, roll the operator, and every share
# that did not pin an image moves on its next reconcile (each roll is a
# Recreate bounce of that hub).
hubImage: ""          # "" = dilipdalton/flint-pnfs:<Chart.appVersion>
hubImagePullPolicy: IfNotPresent

# startupProbe budget (in 10s periods) for tiered hubs that do not set
# spec.startupFailureThreshold. Startup legitimately runs long: the
# epoch claim may WAIT OUT a dead holder's lease and a DR import walks
# the whole bucket, all before the listener binds.
hubStartupFailureThreshold: 60

# Namespaces the operator watches. "" = all (the fleet posture).
# Restricting it to one namespace also restricts what conflict
# arbitration can see — two shares on one bucket prefix in DIFFERENT
# namespaces would then both run, and when one hub dies for a lease
# window the other takes the prefix over. Only narrow this if the
# fleet genuinely lives in one namespace.
watchNamespace: ""

# Two replicas: one leader, one warm standby. Wake is level-triggered
# and only the operator writes the annotation it keys on, so while no
# operator reconciles, NO share in this cluster can be woken — the
# whole wake path would otherwise ride on one pod's node. The standby
# holds open watches and warm caches without writing, so failover does
# not pay for a cold reflector.
#
# `1` restores the old posture (strategy Recreate, no PDB). More than
# one REQUIRES leaderElection; the chart refuses the combination.
replicas: 2

# Leader election. The lease is what makes the second replica a standby
# rather than a second writer: a non-leader keeps its caches warm and
# does not write. It also covers the partition case a partitioned node
# can create, where an old pod is still running as its replacement
# starts. `false` disables it (dev only, and then run exactly one).
leaderElection: true

# The operator applies its own compiled-in CRD at startup. Leave this
# on: helm NEVER upgrades crds/, so with it off the schema freezes at
# whatever this cluster first installed and every knob added in a later
# release is silently pruned at admission — the exact failure the CRD
# exists to retire. Off is for clusters where policy forbids the
# operator managing CRDs; then a human applies `crdgen` output on every
# upgrade.
manageCrd: true

# Default-deny ingress, for the operator and for the hubs it runs.
# OFF by default: an empty client list breaks every mount, and only
# this cluster's operator knows its node CIDRs. Needs a CNI that
# enforces NetworkPolicy (Cilium, Calico) — elsewhere every rule is
# ignored silently.
networkPolicy:
  enabled: false

  # Namespaces holding FlintShares. A NetworkPolicy only covers its own
  # namespace, so each one that runs hubs needs its own copy and this
  # is the list helm renders them into. A share in a namespace NOT
  # listed here is unprotected and nothing detects that — keep this in
  # step with where shares are created.
  hubNamespaces: []
  #  - workspaces

  # Who may reach a hub's 2049. Kubelet-driven mounts arrive from the
  # NODE ip, so node CIDRs are usually what you want; a podSelector
  # cannot express that client set. Cross-cluster consumers (the
  # advertiseAddress case) are always CIDRs. EMPTY ADMITS NOTHING.
  nfsClientCIDRs: []
  nfsClientSelectors: []      # NetworkPolicyPeer objects, verbatim

  # EXTRA peers for a hub's 8080 (/status, /health, the file API). The
  # operator is admitted automatically — it polls the pod ip directly,
  # and a hub it cannot poll is an unknown hub that never suspends.
  # Add the browse front door here; nothing else needs this port, and
  # the file API can rewrite any file in the project.
  apiClientCIDRs: []
  apiClientSelectors: []

# The FRONT DOOR's own identity — the projects service that ensures a
# share exists and keeps it awake. Off by default: most installs drive
# FlintShares with kubectl and need none of this.
#
# It is a separate ServiceAccount from the operator's, with a much
# smaller role: get/list/watch/create/patch on flintshares and nothing
# else. No delete (project deletion is a decision, and this role is
# held by a web service handling untrusted input), no pods, no PVCs,
# no secrets. Plus read-only access to the operator's leader-election
# Lease, which is how it tells "waking" from "no operator is running,
# so nothing will ever happen".
frontDoor:
  create: false
  serviceAccountName: flint-frontdoor
  # Defaults to the release namespace. Set it to wherever the projects
  # service actually runs.
  namespace: ""

rbac:
  # Create the ClusterRole/Binding. The operator needs cluster scope:
  # shares live in tenant namespaces and uniqueness spans all of them.
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}     # e.g. eks.amazonaws.com/role-arn for IRSA

logLevel: info
# Sized for a FLEET, not a demo. Measured on a real cluster at the
# design target (3000 FlintShares, 300 live): the operator's reflector
# store and its in-flight reconciles sit at ~50 MiB, and the old
# 256Mi limit was where BOTH replicas were OOMKilled (exit 137, 8
# restarts each) before the reconcile concurrency was bounded.
#
# 512Mi is ~5.8x the worst spike at the design target. The spike is a
# watch RELIST, which briefly holds the reflector store twice: measured
# 53 MiB total at 3000 shares, of which ~35 MiB is store (~12 KiB per
# share), so a relist peaks near 88 MiB. That leaves 3.2x headroom at
# 6000 shares and 2x at 10,000.
#
# A limit is a CEILING, not a reservation — the request below is what
# reserves capacity — so an oversized limit is nearly free while an
# undersized one is a fleet-wide outage: the operator OOMs, CrashLoops,
# and no project in the cluster can be woken, because level-triggered
# wake only happens while it reconciles. But a limit set absurdly high
# is not free either: it lets a leak run longer before anything notices
# and can push a NODE into memory pressure, evicting other pods, before
# the operator is the one killed. 512Mi is where those meet.
#
# NO CPU LIMIT, deliberately. Reconcile wall time is the denominator of
# the operator's self-trigger amplification: throttling the operator
# makes each reconcile longer, which is exactly the direction that
# makes the fleet less stable. A request reserves capacity; a limit
# would take it away under load.
resources:
  requests:
    cpu: 500m
    memory: 128Mi
  limits:
    memory: 512Mi
nodeSelector: {}
tolerations: []
podAnnotations: {}
nameOverride: ""
