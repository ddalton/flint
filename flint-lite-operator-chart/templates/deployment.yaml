{{- /*
The operator itself: one replica, strategy Recreate.

Recreate rather than RollingUpdate because two operators writing from
two differently-stale caches can disagree about which share owns a
bucket subtree. The lease makes that safe in the partition case; the
strategy keeps the ordinary case from needing it.

No PVC, no state: everything the operator knows lives in the cluster.
A restart re-lists and converges.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flint-lite-operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "flint-lite-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flint-lite-operator.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "flint-lite-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: operator
          image: {{ include "flint-lite-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flint-lite-operator"]
          args:
            - --hub-image={{ include "flint-lite-operator.hubImage" . }}
            - --hub-image-pull-policy={{ .Values.hubImagePullPolicy }}
            - --startup-failure-threshold={{ .Values.hubStartupFailureThreshold }}
            {{- with .Values.watchNamespace }}
            - --namespace={{ . }}
            {{- end }}
            - --election={{ ternary "enabled" "disabled" .Values.leaderElection }}
            - --manage-crd={{ .Values.manageCrd }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | default "info" | quote }}
            # The lease lives in the operator's own namespace; the pod
            # name is the election identity, so a log line names which
            # replica is holding.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
