{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.tokenSecret }}
{{- fail "gateway.enabled requires gateway.tokenSecret — an unauthenticated gateway is an open writer to every configured workspace" }}
{{- end }}
{{- if not .Values.gateway.workspaces }}
{{- fail "gateway.enabled requires gateway.workspaces (id=prefix pairs) — an empty map is a config error, not a healthy idle" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flint-lean.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "flint-lean.gatewaySelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels: {{- include "flint-lean.gatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "flint-lean.gatewaySelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: gateway
          image: {{ include "flint-lean.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flint-lean-gateway"]
          env:
            - { name: FLINT_LEAN_GW_LISTEN, value: "0.0.0.0:{{ .Values.gateway.port }}" }
            - { name: FLINT_LEAN_GW_BUCKET, value: {{ .Values.gateway.bucket | quote }} }
            - { name: FLINT_LEAN_GW_WORKSPACES, value: {{ .Values.gateway.workspaces | quote }} }
            - { name: FLINT_LEAN_GW_MAX_PUT_MB, value: {{ .Values.gateway.maxPutMB | quote }} }
{{- if .Values.gateway.endpoint }}
            - { name: FLINT_LEAN_GW_ENDPOINT, value: {{ .Values.gateway.endpoint | quote }} }
{{- end }}
            - name: FLINT_LEAN_GW_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.gateway.tokenSecret | quote }}, key: token }
            - { name: RUST_LOG, value: "info" }
{{- if .Values.gateway.credentialsSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.gateway.credentialsSecret | quote }} }
{{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.gateway.port }} }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flint-lean.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "flint-lean.gatewaySelectorLabels" . | nindent 4 }}
spec:
  selector: {{- include "flint-lean.gatewaySelectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.gateway.port }}, targetPort: http }
{{- end }}
