{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flint-lean.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "flint-lean.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flint-lean.name" . }}
  labels: {{- include "flint-lean.labels" . | nindent 4 }}
rules:
  # The operator applies its own compiled-in CRD at startup; the
  # crds/ copy is install-time bootstrap only (helm never upgrades it).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "patch"]
  - apiGroups: ["flint.io"]
    resources: ["flintleanworkspaces"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["flint.io"]
    resources: ["flintleanworkspaces/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "flint-lean.name" . }}
  labels: {{- include "flint-lean.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "flint-lean.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flint-lean.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
