apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flint-lean.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "flint-lean.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "flint-lean.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "flint-lean.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "flint-lean.serviceAccountName" . }}
      containers:
        - name: operator
          image: {{ include "flint-lean.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flint-lean-operator"]
          env:
            - name: FLINT_LEAN_OP_IDENTITY
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
{{- if .Values.watchNamespace }}
            - { name: FLINT_LEAN_OP_NAMESPACE, value: {{ .Values.watchNamespace | quote }} }
{{- end }}
{{- if .Values.endpoint }}
            - { name: AWS_ENDPOINT_URL, value: {{ .Values.endpoint | quote }} }
{{- end }}
            - { name: RUST_LOG, value: "info" }
{{- if .Values.operatorCredentialsSecret }}
          envFrom:
            # Keys must be AWS_* VERBATIM (the ambient credential chain).
            - secretRef: { name: {{ .Values.operatorCredentialsSecret | quote }} }
{{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
{{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
{{- end }}
