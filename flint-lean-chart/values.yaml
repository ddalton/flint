# flint-lean — the checkout/publish control plane.
#
#   helm install flint-lean ./flint-lean-chart -n flint-system --create-namespace
#
# Then a project is one `kubectl apply` of a FlintLeanWorkspace, and a
# pod joins it with the label `flint.io/lean-workspace: <name>`.
#
# Design of record: docs/plans/flint-lean-plan.md
# Formal model:     lean/formal/  (24-run TLC gate)
# Measurements:     docs/plans/flint-lean-0b-measurements.md

# The operator image. Composed as {repository}/{name}:{tag|appVersion};
# `ref` overrides the whole reference (e.g. a kind-loaded
# "flint-lean-operator:e2e").
#
# This is an ALIAS of dilipdalton/flint-lite-operator, published from the
# identical manifest digest — same crate, same build, one image, two
# names. Nothing flint-lite runs from it: the chart execs
# /usr/local/bin/flint-lean-operator (and -gateway), never the image's
# own flint-lite-operator ENTRYPOINT. The alias exists so that
# installing flint-lean never asks you to pull something called "lite".
image:
  repository: dilipdalton
  name: flint-lean-operator
  tag: ""
  ref: ""
  pullPolicy: IfNotPresent

# The sidecar image the webhook injects. MUST carry a shell — the
# injected startupProbe execs `test -f <marker>` inside this container,
# so a scratch-based image silently fails the gate.
sidecarImage:
  repository: dilipdalton
  name: flint-sync
  tag: ""
  ref: ""

# One replica by default. The reconcile is idempotent (the claim is a
# CAS), so N replicas are safe, but they duplicate bucket work for no
# gain; the webhook is the only reason to run more than one, and it is
# stateless behind the Service.
replicaCount: 1

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 256Mi }

# The mutating webhook. Certs are generated by the operator and kept in
# a Secret — no cert-manager dependency. failurePolicy is Fail by
# design: an opted-in pod either gets its sidecar or does not schedule.
# It NEVER starts ungated (an early agent clobbers the checkout).
webhook:
  enabled: true
  port: 9443

# The operator principal: bucket-admin ops (posture probes, the
# bucket-wide MPU sweep) run as THIS identity, never as a workspace's
# scoped sidecar credentials. Point it at a Secret with AWS_* keys
# verbatim, or leave empty to use the pod's ambient chain (IRSA, etc).
operatorCredentialsSecret: ""
endpoint: ""            # S3 endpoint override for the operator (MinIO rigs)

# Restrict the watch to one namespace ("" = all namespaces).
watchNamespace: ""

# The lean gateway (control plane: HITL writes, snapshot/sync reads,
# the window/inbox verbs with per-request epoch validation). Opt-in: it
# needs a bucket, a bearer, and an explicit workspace map, so it cannot
# be defaulted sensibly.
gateway:
  enabled: false
  replicaCount: 2
  port: 8091
  bucket: ""
  endpoint: ""
  # id=prefix pairs, e.g. "proj1=tenants/proj1,proj2=tenants/proj2"
  workspaces: ""
  # Secret with key `token` (>= 16 bytes). The gateway refuses to start
  # without one — an unauthenticated gateway is an open writer.
  tokenSecret: ""
  credentialsSecret: ""
  maxPutMB: 64
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 512Mi }

# D15's Prometheus plumbing. The exposition itself is a per-workspace
# CR knob (`spec.metrics.enabled`) — these flags only ship the cluster
# objects that scrape it, and both are off by default: a PodMonitor on a
# cluster without the Prometheus Operator CRDs fails the whole install,
# and a NetworkPolicy in the wrong namespace does nothing while looking
# like protection.
metrics:
  # Must match the CRs' spec.metrics.port for the NetworkPolicy to
  # match; the PodMonitor selects by port NAME and does not care.
  port: 9847
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # Namespaces to render the metrics NetworkPolicy into — the ones your
  # agent pods run in, NOT this release's namespace. Empty ⇒ no policy
  # is created and the port is reachable from anywhere the CNI allows.
  networkPolicyNamespaces: []
  monitoringNamespace: monitoring

nodeSelector: {}
tolerations: []
affinity: {}
