\* LIVENESS MUTATION: the lease has no supersede arm.  A cluster dies
\* holding the workspace and the stamp outlives it, so every other
\* cluster in the fleet waits on a holder that will never come back —
\* the project is unreachable and nothing in the data plane says why.
\* TLC must find the starvation lasso.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = FALSE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 1
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
  Inv_NoLostDrain
PROPERTIES
  EventuallyServed
  EventuallyDrained
CHECK_DEADLOCK FALSE
