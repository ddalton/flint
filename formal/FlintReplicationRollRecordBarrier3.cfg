\* Strict, 3-leg arity coverage for the barrier the IMPLEMENTATION has
\* (BarrierRaidAware = FALSE, record-only) — added 2026-07-29: the audit
\* found the faithful record-only barrier had NO 3-leg coverage (the
\* 3-leg Maint run and every mutation ran the raid-aware barrier the
\* roller cannot implement).  INVARIANTS ONLY, like Maint.cfg — the
\* record-lag drain races must cost availability (an honest Defer),
\* never safety and never unbounded planned-roll impact, at full arity.
\* First verified green by the audit's own TLC run (1,842,036 states);
\* this cfg makes that check part of the gate.  scripts/check-tla.sh
\* requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = FALSE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
INVARIANTS
  Inv
  Inv_PlannedRollNeverCausesOutage
  Inv_MaintFenceHolds
  Inv_PlannedRollBoundedImpact
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
