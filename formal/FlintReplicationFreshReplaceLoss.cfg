\* Stage-enforce tranche: the REPLACEMENT path, d788db50 as pushed.  A
\* served volume with no epoch yet (the window before the scheduler's first
\* cut) loses a stale leg's node; the replacer — its "no epochs, no swap"
\* guard removed — swaps in an empty leg, and the next stage, with no epochs,
\* attaches it as in_sync.  TLC MUST find Inv_NoSilentLoss violated;
\* scripts/check-tla.sh requires this run to FAIL.
