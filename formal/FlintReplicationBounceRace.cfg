\* THE TWO-BOUNCER RACE, LEASE HONORED (the F59 verdict extended to
\* cutover).  BounceRace = TRUE with BounceLeaderGate = TRUE: a deposed-
\* but-alive controller's captured plan lands after the world changed.
\* is_leader() is read ONCE per tick (cutover.rs:714 — the single
\* occurrence in 1548 lines) and never again, while the tick walks every
\* flint PV with a blocking await_detached bounded only by detach_timeout
\* (120s) PER bouncing volume, against a 15s lease.  The decisive
\* asymmetry with the roller: drain_for_maintenance had an rv-guarded
\* record CAS to move DrainMarksBelt INTO — cutover has NO CAS anywhere
\* (DeleteParams::default(), a bare create, whole-array merge patches), so
\* a commit-time preflight is the only belt this subsystem can host.
\* scripts/check-tla.sh requires the Inv_NoBounceInducedRisk
\* counterexample.
