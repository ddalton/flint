\* THE ONE PLACE THE TWO DIMENSIONS MEET: a lease sweep landing in the
\* middle of a mount's trunking probe. The module header has named this as
\* an open question since it was written — whether carrying the case-5
\* obligation through case 4 survives a sweep that retires the incumbent
\* between the two EXCHANGE_IDs, when the obligation is recorded against a
\* clientid the sweep is concurrently destroying.
\*
\* Everything fixed (AtomicSweep included), full trunking probe, two
\* mounts per agent. Every invariant must HOLD.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 2
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = TRUE
  AtomicSweep = TRUE
  NotifyRevoked = FALSE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
  Inv_LockLossIsDetectable
CHECK_DEADLOCK FALSE
