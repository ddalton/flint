\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* Availability probe (FlintCatchupTReachQ), rev 12: WriteQuorum 2, AssemblyQuorum 2, capture, trust, two failures.
\* Inv_NoSoloAck: violated = a write acked on ONE leg / a raid staged with ONE leg is reachable.  Expect HOLD (the price: through a two-leg failure writes fail and no stage completes).
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION QSpec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "trust"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = TRUE
  Crash = FALSE
  ZombieMoves = FALSE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = FALSE
  AssemblyMark = TRUE
  StageDefer = FALSE
  WriteQuorum = 2
  AssemblyQuorum = 2
  AckAfterMark = FALSE
  CutStampsAll = TRUE
INVARIANT Inv_NoSoloAck
CHECK_DEADLOCK FALSE
