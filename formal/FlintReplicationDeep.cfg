\* The shipped design at a deeper failure budget (2 legs, 3 crashes): torn
\* writes, hot-rejoin divergence, and the Scrub demotion are all REACHABLE
\* here (they need torn + blackhole + crash = 3 events), so this run proves
\* the guarded machine actually traverses them safely — invariants and
\* post-storm liveness must hold. scripts/check-tla.sh requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 2
  MaxCrashes = 3
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
INVARIANTS
  Inv
PROPERTIES
  EventuallyServingAgain
  AdmissionNotStarved
  EventuallyWritable
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
