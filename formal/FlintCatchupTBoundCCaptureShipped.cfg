  Capture = TRUE
  Crash = FALSE
  ZombieMoves = FALSE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
