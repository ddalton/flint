\* TRANCHE-3 LIVENESS STRICT: SpecLive = the reconcile pipeline, lease
\* timers and rebuild driver under WF, PLUS the redirect actor (the
\* component the code does not have yet — when it is built,
\* ClientEventuallyRedirected is its acceptance test).  All four progress
\* theorems must HOLD: promotion completes (to an in-sync survivor —
\* ElectInSync's honest scope; WaitsPrice prices the dropped conjunct),
\* fences confirm against the current composition, clients re-attach,
\* stale legs rejoin.  Every antecedent is conditioned on the exhausted
\* crash budget: under a budget "transiently down forever" is
\* unrepresentable, so the honest claim is post-storm progress — the
\* failures stop, the machine finishes.  MaxEpoch = 2 keeps temporal
\* checking (near-sequential) affordable; the round trip's reachability
\* is tranche 2's probe, not this run's job.
SPECIFICATION SpecLive
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 0
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
PROPERTIES
  PromotionCompletes
  FenceEventuallyConfirmed
  ClientEventuallyRedirected
  StaleLegEventuallyRejoins
CHECK_DEADLOCK FALSE
