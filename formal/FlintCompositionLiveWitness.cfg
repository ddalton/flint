\* TRANCHE-4 LIVENESS STRICT: SpecLiveW = SpecLive plus the one new
\* obligation the witness world runs on — CONTROL-PLANE CUTS HEAL (the
\* K8s API comes back).  All four progress theorems must HOLD with a cut
\* in the world: a promotion blocked by a witnessless elector completes
\* after the heal, a rebuild blocked by a cut wire completes after the
\* heal, fences re-confirm, clients re-attach.  The cut budget being
\* FINITE is load-bearing here the same way the crash budget is: an
\* infinite cut/heal churn would defeat every WF argument, and a real
\* API server is not obliged to flap forever.  NoWitness is this cfg's
\* required-to-fail twin: same world, heal obligation WITHHELD.
\* MaxCrashes = 1 + MaxCuts = 1 is the same two-event storm as the legacy
\* Live cfg's two crashes, and every property's subject stays reachable
\* (a failover needs one composer death OR one peer cut; a suspension
\* needs one witness cut).  The 10x lesson, measured before believed: at
\* MaxCrashes = 2 the cut dimension makes this graph 2.0M distinct and
\* near-sequential temporal checking bills 11 minutes for no corner the
\* one-crash world lacks; at 1 it is 2m22s, complete.
SPECIFICATION SpecLiveW
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 1
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 1
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
PROPERTIES
  PromotionCompletes
  FenceEventuallyConfirmed
  ClientEventuallyRedirected
  StaleLegEventuallyRejoins
CHECK_DEADLOCK FALSE
