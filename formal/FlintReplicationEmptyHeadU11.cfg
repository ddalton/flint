\* Empty-head tranche (2026-10-27): the PRE-EXISTING U11 path in the shipped
\* envelope (GateReal: 2 legs, the 180 s deadline, the forced-stale fallback;
\* at-stage admission on; stale-only replacement as before d788db50).  One leg
\* dies and is re-placed by an EMPTY leg; with one in-sync base the fallback
\* force-admits the empty replacement and raid1 serves its zeros.  The
\* content invariants never saw it (a stale member is exempt).  TLC MUST find
\* Inv_NoVirginServing violated; scripts/check-tla.sh requires this to FAIL.
