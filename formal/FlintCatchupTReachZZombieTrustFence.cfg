\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* Code-faithful (rev 8): the catch-up does not wait for a cut in flight.
\* Vacuity probe (FlintCatchupTReachZ): guard + fence mark, trust: the zombie's former leg is rebuilt and admitted.
\* Must be VIOLATED.
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION ZSpec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "trust"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = TRUE
  Crash = FALSE
  ZombieMoves = TRUE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = TRUE
  CatchupWaitsCut = FALSE
  AssemblyMark = FALSE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = FALSE
  CutStampsAll = TRUE
INVARIANT Inv_NoZombieLegAdmitted
CHECK_DEADLOCK FALSE
