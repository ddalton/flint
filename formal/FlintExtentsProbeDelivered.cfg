\* Non-vacuity probe for the graduated FlintExtents.cfg (shipped
\* constants, FreeRequiresDelivered = TRUE): TLC must VIOLATE
\* ProbeDeliveredFreeFires — a witness that ReclaimComplete really frees
\* blocks a fenced+CONFIRMED holder still held somewhere in the shipped
\* state space.  Without it, the shipped green on the stale theorems
\* could mean only that the new guard closed the fenced-free path
\* outright — the quarantine world wearing the flip's label.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  QuarantineIsolated = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = TRUE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  ProbeDeliveredFreeFires
CHECK_DEADLOCK FALSE
