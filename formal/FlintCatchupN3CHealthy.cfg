\* Bound C: three replicas, TWO failures (two stale legs at once, a rebuilt source), one write, three
\* epochs, one retained.  FlintCatchup's zombie premise, sources must be HEALTHY legs (an
\* idealisation: the controller cannot see a leg's detection lag).  Must hold.
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 3
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  SourceMustBeHealthy = TRUE
  ZombieExcluded = FALSE
  SourceTie = FALSE
  DemoteAsCode = TRUE
  FloorFirstOnly = FALSE
  RaidFailsAtDrop = FALSE
  AdmitPaths = "stage"
  HotFix = {}
INVARIANT Inv
CHECK_DEADLOCK FALSE
