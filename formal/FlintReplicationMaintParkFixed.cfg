\* THE PARKING FIX, strict (the wave-2 obligation): SuppressScoped = TRUE
\* restores the per-leg semantics the design doc specifies — a
\* maintenance mark excludes ITS leg from admission planning, not the
\* whole volume.  Same 3-leg wedged-roll world as FlintReplicationMaintPark:
\* StandbyAdmissionNotParked must now HOLD (the warm standby on the
\* unmarked node admits via the ordinary WF chain even while l1's wedged
\* mark persists), along with AdmissionNotStarved and every invariant.
\* This run is also the tranche's first 3-leg LIVENESS coverage — the
\* audit found every prior liveness run was 2-leg, where the
\* marked-leg + warm-standby + serving-source shape is unreachable.
\* scripts/check-tla.sh requires success.
SPECIFICATION SpecWedgedKubelet
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  LocalLegs = {}
  MaintProcessedGate = TRUE
  RefusalSticky = FALSE
  ConsumerMobile = FALSE
  RaidLifetimeArm = FALSE
  MaintLocalRefuse = FALSE
  RaidReconcileArm = FALSE
  VaCanLag = FALSE
  NodeStageValidatesBases = FALSE
  StrikeRepairArm = FALSE
  A2LocalStagingBelt = FALSE
  A2SoleOwnershipBelt = FALSE
  UncontrolledTgtDeath = FALSE
  DpSeenRehydrate = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
