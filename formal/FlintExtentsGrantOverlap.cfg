\* §8's RECORDED LANDMINE: the PK does not police overlap.
\* GrantsExclusive = FALSE — the grant transaction trusts the gate check's
\* stale read instead of re-validating disjointness inside the
\* transaction.  TLC must FIND Inv_NoConflictingGrants violated: two
\* two-step windows race to the same free block (check, check, insert,
\* insert) and both publish — two live grants over one physical range,
\* the silent-corruption precondition.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = FALSE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
INVARIANTS
  Inv_NoConflictingGrants
CHECK_DEADLOCK FALSE
