\* A/B BUG SIDE for Inv_RefusalNeverClears: fix B's eligibility gate reading
\* the REMEMBERED maintSkipped set instead of the live condition. The refusal
\* is then permanent — the node keeps an old driver forever even after its
\* consumer leaves — so no interleaving reaches a cleared-and-rolled state and
\* the invariant HOLDS. That green is the bug.
\*
\* This was the first draft of the model's own gate, and only the mobility
\* dimension could tell the two apart: with LocalLegs a constant a refused
\* node was refused in every reachable state, so remembered and live were
\* indistinguishable and the model was WEAKER than the shipped code.
\*
\* Carries Inv_RefusalNeverClears ALONE, deliberately. With the outage theorem
\* also armed this run fails on THAT first, which is a second and separate
\* indictment of the remembered gate: a memory has a WINDOW before it is
\* written, and in that window the gate fails to refuse at all, so the roll
\* destroys the composition. Worth knowing, but it is not the question this
\* A/B asks, and letting it fire here would hide the answer.
\*
\* EXPECTED: green (the refusal never clears). scripts/check-tla.sh requires it.
