\* MUTATION ProveFromDisk: a proof is taken over the object DIRECTORY
\* rather than the packs the snapshot names — what `follow::prove` and
\* `restore.rs` did until 2026-09-07 (audit F2). A fold leaves its
\* superseded inputs on disk for readers while the ledger sweep heads
\* for them in the bucket, so the walk passes on objects the repository
\* is losing and the verdict means the disk, not the bucket.
\* Inv_ProofIsOfTheBucket MUST FAIL here. If it holds, either the
\* retention or the checkpoint is not being reached.
\*
\* The OTHER invariants are expected to hold, and that is the finding
\* rather than an omission: with the coverage check on, a fold's roll-up
\* holds everything its inputs held, so a proof resting on the retained
\* inputs happens to be true of the bucket as well. F2 was latent, not
\* live, and this run says which single rule is why.
