\* FlintCatchupTLive (the data plane fair), bound D (three replicas, two failures, one write, two epochs, one retained).
\* Code-faithful (rev 9: no wait for a cut, the assembly mark lands, the FlintLocalLeg guard).  FlintCatchupTLive (data plane fair).
\* Trust WITHOUT the capture: a stale leg makes progress with confirmation from monitor ticks alone (no wait for a clean
\* unstage), Prop_StaleProgress.  Record only: at a bounded MaxEpoch an unstage before an epoch's observation can leave
\* no trusted target and no epoch left to cut (a lasso there is the bound, not the rule).
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION LiveSpec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "trust"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = FALSE
  Crash = FALSE
  ZombieMoves = FALSE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = FALSE
  AssemblyMark = TRUE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = FALSE
  CutStampsAll = TRUE
INVARIANT TypeOK
PROPERTY Prop_StaleProgress
CHECK_DEADLOCK FALSE
