\* A2 + CANDIDATE BELT 1 (sole ownership) — the belt that does NOT work, kept
\* as a run because "we checked whether anyone else holds it" is the first
\* thing anyone reaches for and it needs a standing refutation.
\*
\* The belt is a cluster-wide probe: refuse to assemble while any other host
\* holds a composition over these lvols.  Implementable today — fix C already
\* calls bdev_raid_get_bdevs against another node (maint_roll.rs
\* gather_volume_maint).  It is also check-then-act, and A2 defeats it by
\* going FIRST: assemble on the stale node while nobody holds anything, and
\* the legitimate NodeStage supplies the second host afterwards.  NodeStage
\* has no such belt and should not need one; it is the creator that is
\* actually right.
\*
\* So the ordering matters and the belt only constrains one order.  This is
\* the run that says so, rather than me asserting it in a design note.
\*
\* EXPECTED: Inv_A2AssemblesOnlyAtTruth VIOLATED.
\* scripts/check-tla.sh runs this and requires the violation.
