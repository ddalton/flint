\* Liveness mutation: FenceOn412=FALSE — the heartbeat swallows its 412
\* instead of fencing + exiting.  TLC must FIND the immortal-zombie
\* lasso: a deposed incarnation stays in "holding" forever
\* (DeposedEventuallyFenced violated) — the unbounded version of the
\* stale-publish window the probes bound.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Misses = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxRenews = 2
  MaxClaims = 2
  Sweep = TRUE
  TokenRotate = TRUE
  FenceOn412 = FALSE
  StampCheck = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  DeposedEventuallyFenced
CHECK_DEADLOCK FALSE
