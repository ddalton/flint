\* Mutation run: the maintenance mark is UNLEASED (MaintLease = FALSE).
\* The roller drains l1 (suppression mark stamped) and then dies; a live
\* roller would clear the mark (MaintClear) and the lease TTL would
\* clear a dead one (SuppressExpire) — with both gone, NOTHING lifts it.
\* The drained leg is excluded from readmission forever and the volume
\* parks at reduced redundancy: the F43 parked standby, re-created by a
\* maintenance flag that outlived its holder.  TLC MUST find the
\* temporal counterexample to MaintenanceEventuallyLifts (the lasso
\* where suppress stays non-empty forever).  scripts/check-tla.sh
\* requires this run to FAIL temporally.
SPECIFICATION Spec
