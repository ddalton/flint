\* F62a REPAIR A1 — the same world with data_path_raid_seen rehydrated at
\* agent start, from the STAGED-VOLUME set.  Not from live SPDK: that reads
\* the raid list, which is empty in exactly the situation that matters, so
\* such a seed would be a no-op precisely when it is needed.  The fresh
\* process can now emit CollapseEvent::Lost, and the SHIPPED bounce-and-
\* restage chain does the rest — no new re-creation code.
\*
\* Green here against a red FlintReplicationRaidSeenBlind.cfg is the argument
\* for coding A1 first: one rehydration call buys back a repair path that
\* already exists.  It remains only a REPAIR — the volume goes down and comes
\* back through a bounce — so fix B is still needed to stop the planned roll
\* from causing the outage in the first place, and A2 for the unplanned tgt
\* deaths no orchestrator can refuse.
\*
\* Built from FlintReplicationRaidLifetime.cfg (the quiet maintenance world)
\* with ONLY the repair chain added — BounceEnabled, DataPathArm, MaxBounces
\* = 1 — rather than from a bounce cfg with maintenance bolted on.  That
\* direction matters: the bounce templates carry WriterLimbo, RefusalBounded
\* and SuppressScoped arms that widen the space enough for TLC to answer with
\* traces about leg deaths, exhausted bounce budgets and the OPERATOR runbook
\* (LastResortServe restoring the volume by hand) instead of about the fix
\* under test.  Every one of those was a true statement about a world nobody
\* asked about.
\*
\* EXPECTED: green.  scripts/check-tla.sh runs this and requires success.
