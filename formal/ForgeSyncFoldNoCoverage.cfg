\* MUTATION FoldNoCoverage: the fold's commit lands a roll-up WITHOUT
\* checking that it holds everything the packs it supersedes hold.
\* This is the shipped behaviour before 2026-09-07 and the real failure
\* on cluster runcd: a fold's output was missing thirteen commits its
\* inputs held, the commit stopped naming those inputs, and the refs
\* still pointed past the missing objects. Inv_LandedPackComplete MUST
\* FAIL here. If it holds, the coverage check is not being tested.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = TRUE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = FALSE
  ReclaimWhileServing = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
  Inv_ProofIsOfTheBucket
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
