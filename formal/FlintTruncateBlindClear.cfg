\* Mutation: GateClearGuarded = FALSE — clear_truncate_dirty_if degraded to
\* the unconditional clear_truncate_dirty. A fanout that confirms a
\* SHALLOWER cut then lifts the mark while a deeper one is still unlanded,
\* and LAYOUTGET starts handing out layouts onto bytes the file no longer
\* has. TLC MUST find Inv_ClearImpliesFlushed violated; scripts/check-tla.sh
\* requires this run to FAIL. This is the A/B that shows the `confirmed <=
\* min` predicate is load-bearing rather than defensive.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = FALSE
  MarkKeepsMin = TRUE
  RecallOnTruncate = FALSE
INVARIANTS
  Inv_ClearImpliesFlushed
CHECK_DEADLOCK FALSE
