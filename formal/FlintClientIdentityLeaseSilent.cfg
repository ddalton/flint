\* THE SHIPPED SWEEP, consequence 2 of 2: A SILENT LOSS.
\*
\* `courtesy_release_expired` reads get_expired_clients(), strips those
\* clients' locks, then calls `cleanup_expired()` — which reads
\* get_expired_clients() A SECOND TIME to decide whose sessions, stateids
\* and client record to destroy. `renew_lease` is documented LOCK-FREE
\* ("per-client locking only, not global"), so a SEQUENCE landing between
\* the two reads renews the lease and the second read no longer sees the
\* client. Its locks are already gone. Everything else survives. And with
\* `status_flags` hardcoded to 0 it is never told.
\*
\* The result is a client still mounted, still holding its session, still
\* believing it owns a byte range the server has already handed away —
\* with nothing on the wire either side could have noticed.
\*
\* Inv_NoOrphanLocks is deliberately NOT listed: it is violated here too,
\* by the shorter path LeaseOrphan.cfg exists for, and would mask this.
\*
\* TLC must FIND Inv_LockLossIsDetectable.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 1
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = TRUE
  AtomicSweep = FALSE
  NotifyRevoked = FALSE
  MaxMounts = 1
  MaxLocks = 2
INVARIANTS
  Inv_LockLossIsDetectable
CHECK_DEADLOCK FALSE
