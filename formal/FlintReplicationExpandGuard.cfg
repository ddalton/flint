\* The size-guard mutation — the pre-F43-item-#8 world: SizeGuard = FALSE
\* (no admission size check, no construction boundary, no stage belt) and
\* SizeHeal = FALSE (the fix presupposes the guard).  TLC must FIND an
\* Inv_NoDeviceShrink violation: the returning pre-expand leg is admitted
\* straight into the assembly whose consumer-visible device already grew —
\* the silent device shrink (reads beyond the short leg's end; the
\* C2-B/§2.2a hazard class).  Proves the shipped guard is load-bearing,
\* not decorative.  scripts/check-tla.sh requires the violation.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = TRUE
  SizeGuard = FALSE
  SizeHeal = FALSE
INVARIANTS
  Inv
  Inv_NoDeviceShrink
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
