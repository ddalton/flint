\* VACUITY PROBE for FlintClientIdentityLeaseHandshake.cfg — the SAME
\* constants, checking only Probe_SweepLandsMidHandshake, which TLC must
\* VIOLATE.
\*
\* LeaseHandshake exists to answer an open question: does the case-5
\* obligation carry survive a sweep retiring records while a mount's
\* trunking probe is still in flight? It passes. But a run that passes
\* because the interleaving is never REACHED proves nothing, and that is a
\* mistake this repo has shipped often enough to write the check down —
\* 24 of 41 legs proposed for the cluster drill would have passed if the
\* product were broken.
\*
\* The counterexample here IS the evidence that LeaseHandshake has teeth:
\* an agent mid-EXCHANGE_ID with a sweep between its two steps. If this
\* run ever goes green, LeaseHandshake has gone vacuous and the open
\* question is open again.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 2
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = TRUE
  AtomicSweep = TRUE
  NotifyRevoked = FALSE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Probe_SweepLandsMidHandshake
CHECK_DEADLOCK FALSE
