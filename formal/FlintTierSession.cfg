\* Strict run: the designed two-level lease — depose-first takeover,
\* session-token rotation, beat-fail fence, and release drain all ON;
\* two hubs, two volumes, crashes in budget.  The two safety theorems
\* (a beating session is never deposed; a clean release is a publish
\* barrier) must HOLD — the liveness pair lives in
\* FlintTierSessionLive.cfg at reduced budgets (invariants at breadth,
\* liveness at depth).  The stale-land witness is deliberately NOT an
\* invariant here — it is reachable in the designed protocol and
\* belongs to the probe run.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Vols = {v1, v2}
  Misses = 2
  MaxBeats = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxClaims = 3
  Depose = TRUE
  SessRotate = TRUE
  FenceOnFail = TRUE
  DrainOnRelease = TRUE
INVARIANTS
  Inv
CHECK_DEADLOCK FALSE
