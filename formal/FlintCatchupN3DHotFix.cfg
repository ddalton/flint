\* Bound D (TLC confirmation): three replicas, two failures, one write, TWO epochs, one retained.
\* Hot rejoin with the fix (win, pad, tie, reap).  Must hold.
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  SourceMustBeHealthy = FALSE
  ZombieExcluded = TRUE
  SourceTie = TRUE
  DemoteAsCode = FALSE
  FloorFirstOnly = FALSE
  RaidFailsAtDrop = TRUE
  AdmitPaths = "hot"
  HotFix = {"win", "pad", "tie", "reap"}
INVARIANT Inv
CHECK_DEADLOCK FALSE
