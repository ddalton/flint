\* PinRetention = FALSE, one failure, two writes, three epochs, one retained:
\* safety HOLDS without the pin — the lineage-coverage check fails a session
\* whose base was retired (the pin buys progress, not safety).  Must hold.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 2
  MaxEpoch = 3
  MaxFails = 1
  Retain = 1
  Backoff = TRUE
  Revert = TRUE
  BaseInclusive = TRUE
  ReapNewer = TRUE
  FinalDelta = TRUE
  PinRetention = FALSE
  FullBuildReaps = TRUE
  FinalCutStrict = TRUE
INVARIANT Inv
CHECK_DEADLOCK FALSE
