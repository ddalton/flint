\* Mutation run: drain exists but the barrier is POD-READINESS, not
\* readmission (MaintBarrier = FALSE).  This models exactly what k8s
\* maxUnavailable=1 gives a DS roll: one node in maintenance at a time,
\* judged by pod Ready — which knows nothing of raid membership.  The
\* unconditional last-serving-member belt already stops the direct
\* drain-to-outage, so the barrier's necessity shows at THREE legs as
\* redundancy EROSION: drain l1, roll it, clear its mark — every pod
\* Ready — and the next drain fires while l1 is still stale,
\* un-readmitted; with zero real failures the volume walks down to a
\* single serving leg, one failure from outage.  TLC MUST find an
\* Inv_PlannedRollBoundedImpact violation (more than one leg out of
\* service under planned maintenance alone) — proving the barrier must
\* gate on IN-SYNC + SERVING (readmitted), separately from the fence
\* and the belt.  scripts/check-tla.sh requires this run to FAIL.
SPECIFICATION Spec
