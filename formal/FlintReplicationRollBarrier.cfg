\* Mutation run: drain exists but the barrier is POD-READINESS, not
\* readmission (MaintBarrier = FALSE).  This models exactly what k8s
\* maxUnavailable=1 gives a DS roll: one node in maintenance at a time,
\* judged by pod Ready — which knows nothing of raid membership.  The
\* counterexample: drain l1 (graceful, serving = {l2}), roll l1, clear
\* its mark — every pod is now Ready — so the roll proceeds to l2 and
\* drains the LAST serving leg while l1 is still stale, un-readmitted.
\* serving = {} with zero real failures (MaxCrashes = 0).  TLC MUST
\* find an Inv_PlannedRollNeverCausesOutage violation — proving the
\* barrier must gate on IN-SYNC + SERVING (readmitted), separately from
\* the fence.  scripts/check-tla.sh requires this run to FAIL.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 0
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = FALSE
  MaintLease = TRUE
INVARIANTS
  Inv_PlannedRollNeverCausesOutage
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
