\* ⚠️ RELABELLED 2026-07-30 — THE ARM IS SET BUT NEITHER ACTION IS REACHED.
\* This file was headed "THE ANSWER". Over its complete 1,261,953-state graph
\* NEITHER AgentBootReconcile NOR AssembleAdopt fires, so both adopt theorems
\* (Inv_NoAdoptOfA2Composition, Inv_NoValidateFlap) were green on a state space
\* containing no A2 composition to adopt. Verified: ProbeA2Fires HOLDS here.
\*
\* SAME SINGLE CAUSE AS A2Staging: UncontrolledTgtDeath = FALSE. A2's belt
\* requires `stagedAt = vaNode`, which only a CLASS-3 destroyer leaves behind,
\* and the class-3 destroyer is disarmed — so the guard is unsatisfiable by
\* construction, and with no A2 composition ever built there is nothing for the
\* adopt to adopt.
\*
\* THE ADOPT CLAIMS NOW LIVE IN FlintReplicationA2AdoptArmed.cfg, paired with
\* FlintA2ProbeAdoptArmed.cfg which the gate REQUIRES TLC to violate. Note that
\* pairing is NECESSARY BUT NOT SUFFICIENT: it witnesses A2 firing, not the
\* adopt firing. The adopt theorems are PARTIALLY gated until this module
\* carries a ghost for "AssembleAdopt ran" (adoptedA2 cannot serve — it is
\* false both when the adopt never runs and when it runs on a non-A2
\* composition, so probing it would be probing Inv_NoAdoptOfA2Composition).
\*
\* The design argument below is retained because it is sound, and is what
\* A2AdoptArmed now actually tests:
\*
\* THE ANSWER — the local-staging belt closes the adopt WITHOUT deleting
\* anything, so there is nothing for the two creators to fight over.
\*
\* THE ADOPT. `ensure_raid1_bdev` (driver.rs:3105) is create-OR-CONVERGE, and
\* its converge branch REUSES any raid of this name in state "online" without
\* comparing the base set to the one NodeStage intended ("already ONLINE (N
\* base(s) configured) — reusing"; that count reaches the log line and nowhere
\* else). Ordinary Assemble cannot represent it — Assemble requires
\* serving = {}, and an online raid has at least one configured base — so
\* AssembleAdopt is its own action.
\*
\* NOT a bug report against shipped code: with NodeStage the sole creator, an
\* online raid of that name is one NodeStage itself built from the same PV
\* replica record, so reuse is a correct idempotent restage. It becomes a
\* hazard only once A2 is a second creator whose base set was chosen at a
\* different time.
\*
\* A2 assembles only where kubelet still believes the volume staged, and the
\* shipped unconditional reuse is left exactly as it is
\* (NodeStageValidatesBases = FALSE). No phantom is ever built, so NodeStage
\* never finds a foreign object to inherit — and because the remedy is a
\* REFUSAL rather than a deletion, no create/delete cycle exists to enter.
\*
\* Both theorems armed together on purpose: this is the run that has to show
\* the belt does not buy safety at the price of flapping. If it held
\* Inv_NoAdoptOfA2Composition while violating Inv_NoValidateFlap, the belt
\* would be no better than the validating fix.
\*
\* CONSEQUENCE FOR THE CODE: the ensure_raid1_bdev change is defence in depth,
\* not a prerequisite. Read that as "no reachable trace in THIS
\* configuration" — `serving` is global here, so the model is exact only while
\* one composition exists at a time, which is what these traces do.
\*
\* EXPECTED: green. scripts/check-tla.sh runs this and requires success.
