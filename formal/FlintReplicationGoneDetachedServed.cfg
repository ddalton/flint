\* Gone-node tranche: the DOCUMENTED RESIDUAL of the guarded fix.  The
\* volume WAS assembled (writer set stamped, epochs cut) and is detached now;
\* a leg in that writer set dies while in_sync.  ReplaceSparesWriters spares
\* it — it may hold acked writes no other leg holds, and only the F36c gate
\* at the next assembly can judge that — so with nobody staging the volume it
\* stays in_sync on a dead node: TLC MUST find a GoneLegRebuilt lasso
\* (ReplicaReplacementBlocked is the code's event for it).
\* scripts/check-tla.sh requires this run to FAIL.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
