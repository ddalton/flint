\* Mutation run: the F48 bug — assembly does NOT sever the partitioned old
\* head (FenceZombie = FALSE). TLC MUST find a violation: the zombie head
\* keeps acking client writes after the new assembly serves, producing
\* either silent loss (Inv_NoSilentLoss: acked writes the new lineage
\* never sees) or split-brain divergence (Inv_NoDivergentServing: zombie
\* blocks written into serving legs behind the record's back). The fence
\* is catchup.rs's zombie-consumer sever. scripts/check-tla.sh requires
\* this run to FAIL.
SPECIFICATION Spec
