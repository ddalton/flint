\* THE SHIPPED ADMISSION WORLD: the client kernel honours lease expiry
\* (fs/nfs discards layout state when the lease dies — every userspace
\* write goes through the kernel's blocklayout driver, so a discarded
\* layout is an unreachable device) AND the successor lands on the SAME
\* node, re-admitting the very NQN the sweep evicted.  The door is wide
\* open; Inv_NoStaleDeviceWrite must STILL hold — that is the shipped
\* claim, and ClientHonorsLease is exactly what carries it.
SPECIFICATION Spec
CONSTANTS
  Zombie = Zombie
  Successor = Successor
  H1 = H1
  H2 = H2
  NoOwner = NoOwner
  ClientHonorsLease = TRUE
  SameHostReadmit = TRUE
  GenMax = 3
INVARIANT Inv_NoStaleDeviceWrite

CHECK_DEADLOCK FALSE
