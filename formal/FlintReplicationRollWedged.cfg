\* Strict run: the WEDGED-RESTART world (SpecWedgedKubelet — kubelet's
\* completion obligation dropped: the pod deleted for the roll never
\* comes back; image pull failure / crashloop, the runak/runaj wedge
\* family whose old operational workaround — delete the Node object —
\* is the Resurrect mutation's false-evidence hazard). Every invariant
\* must HOLD and the volume must stay WRITABLE on the survivor: a
\* wedged restart degrades exactly one leg's availability and nothing
\* else. MaintenanceEventuallyLifts is deliberately NOT checked here —
\* the mark parks with the wedged node (its leg is unreachable
\* regardless), which is the honest operational state until an operator
\* or replacement intervenes. scripts/check-tla.sh runs this and
\* requires success.
SPECIFICATION SpecWedgedKubelet
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
  RefusalBounded = FALSE
INVARIANTS
  Inv
  Inv_PlannedRollNeverCausesOutage
  Inv_MaintFenceHolds
  Inv_PlannedRollBoundedImpact
PROPERTIES
  EventuallyServingAgain
  EventuallyWritable
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
