\* THE SHIPPED-DESIGN WORLD, post-graduation (2026-08-10).  Every belt
\* the design commits to is ON, including FreeRequiresDelivered — the
\* free trusts only target-CONFIRMED exclusions (the code's delivered
\* bit; an unconfirmed fence quarantines).  FenceReaches STAYS FALSE:
\* the fence rig proved a confirmed preempt really excludes on real
\* hardware, but the code's preempt arm is best-effort and can fail at
\* runtime, so "every fence lands" would still be a lie — the theorems
\* are instead claimed in the harsher fences-CAN-fail world, which is
\* the stronger result.  Inv_NoStaleExtentRead/Write are now LISTED
\* (graduated from Target.cfg); FlintExtentsLostFence.cfg is the
\* single-flag A/B (FreeRequiresDelivered=FALSE) that must keep finding
\* the corruption this belt closes.  Citable only alongside the Probe
\* runs, including ProbeDeliveredFreeFires (the fenced-free really
\* fires — without it this green could be quarantine wearing the
\* flip's label).
\*
\* MERGE-ARMED (the merge-policy tranche): MergeEnabled models the
\* code's row-coalesce as gen coarsening over quiescent same-state
\* blocks (MAX). MergeHeld is its quiescence A/B, MergeMin its
\* gen-choice A/B, ProbeMergeFires its non-vacuity licence.
