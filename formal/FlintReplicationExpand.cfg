\* Strict expansion run — the F56 tranche's home: 2 legs, the fixed world
\* (SizeGuard + SizeHeal both ON), maintenance off to isolate the size
\* dimension.  MaxCrashes = 2 is enough for the wedge shape (blackhole the
\* leg mid-fan-out, bring it back) plus one more event.  Must HOLD:
\* every core invariant, Inv_NoDeviceShrink (the size-safety theorem),
\* ExpansionCompletes (the F56 theorem — an outstanding expansion reaches
\* every leg that stays alive and admissible), and AdmissionNotStarved
\* across expansion interleavings (the size guard must not re-create the
\* F43 parked standby).  scripts/check-tla.sh requires success.
SPECIFICATION SpecExpand
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  LocalLegs = {}
  MaintProcessedGate = TRUE
  RefusalSticky = FALSE
  ConsumerMobile = FALSE
  RaidLifetimeArm = FALSE
  MaintLocalRefuse = FALSE
  RaidReconcileArm = FALSE
  VaCanLag = FALSE
  NodeStageValidatesBases = FALSE
  StrikeRepairArm = FALSE
  A2LocalStagingBelt = FALSE
  A2SoleOwnershipBelt = FALSE
  UncontrolledTgtDeath = FALSE
  DpSeenRehydrate = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = TRUE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
  RefusalBounded = FALSE
INVARIANTS
  Inv
  Inv_NoDeviceShrink
PROPERTIES
  ExpansionCompletes
  AdmissionNotStarved
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
