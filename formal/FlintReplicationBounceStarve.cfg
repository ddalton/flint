\* THE BELT'S OWN LIVENESS, unbounded — the gap the 2026-07-29 CODE REVIEW
\* exposed and this module could not previously express.  BouncePreflight is
\* a GUARD, so a blocked bounce is merely a disabled action; nothing here ever
\* asked whether the lost data path gets REPAIRED, which is why an unbounded
\* belt had to be found by reading code instead.
\*
\* RefusalBounded = FALSE with the belt ON.  A recorded writer oscillates
\* unavailable/available (LegRecover is the environment's choice and carries no
\* fairness, so WF(LegPerish) never obligates the leg to die), therefore it
\* never becomes honestly excusable and BounceSafe is only INTERMITTENTLY
\* true — which weak fairness never obligates.  The data-path flag can only be
\* cleared by its own leg returning to a serving assembly, and that needs the
\* bounce.  TLC must FIND the RemediationNotStarved lasso: the terminal
\* remediation starved by its own safety belt, on a volume whose data path is
\* already dead.  This is the flapping-kubelet scenario, faithfully.
\* scripts/check-tla.sh requires the temporal counterexample.
SPECIFICATION SpecBounceLive
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 0
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  LocalLegs = {}
  MaintProcessedGate = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = TRUE
  MaxBounces = 1
  AdmissionArm = FALSE
  DataPathArm = TRUE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = TRUE
  RefusalBounded = FALSE
PROPERTIES
  RemediationNotStarved
INVARIANTS
  Inv_NoDoomedBounce
CHECK_DEADLOCK FALSE
CONSTRAINT
  BounceBound
