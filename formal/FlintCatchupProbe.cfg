\* The inductive invariant IndInv (FlintCatchupProof.tla proves it for every bound) and the
\* blob-chain probe, one failure, two writes, three epochs, one retained.  Must hold.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 2
  MaxEpoch = 3
  MaxFails = 1
  Retain = 1
  Backoff = TRUE
  Revert = TRUE
  BaseInclusive = TRUE
  ReapNewer = TRUE
  FinalDelta = TRUE
  PinRetention = TRUE
  FullBuildReaps = TRUE
  FinalCutStrict = TRUE
INVARIANT Inv IndInv Inv_Chain Inv_BaseSafe Inv_StandbyTracks
CHECK_DEADLOCK FALSE
