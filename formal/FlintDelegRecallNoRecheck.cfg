\* DETACHED LADDER TASK (LadderRecheck=FALSE): dropping a JoinHandle
\* detaches, it does not cancel.  The recall task outlives its record
\* (returned, freed) and its late wakeup revokes the SUCCESSOR grant —
\* a revocation the design never asked for, on a delegation that was
\* never recalled.  Every wakeup must re-acquire the entry lock and
\* no-op on record-gone/state-changed.  TLC must FIND the unasked
\* revoke.
SPECIFICATION Spec
CONSTANTS
  MaxMut = 2
  MaxGrants = 2
  MaxRestarts = 1
  MaxDies = 1
  MutationGuard = TRUE
  FenceComplete = TRUE
  DisownEvidence = TRUE
  RebindRearm = TRUE
  PersistHolderEvidence = TRUE
  LadderRecheck = FALSE
INVARIANTS
  Inv_RevokeOnlyFromRecall
CHECK_DEADLOCK FALSE
