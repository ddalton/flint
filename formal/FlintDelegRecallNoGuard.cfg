\* FATAL HOLE 1 (MutationGuard=FALSE): the grant's re-check ignores the
\* mutation-pending guard, so a grant lands between a lane's clear fence
\* consult and its execution — an admitted writer under a live
\* delegation, then an unsignalled stale believer.  TLC must FIND it.
SPECIFICATION Spec
CONSTANTS
  MaxMut = 2
  MaxGrants = 2
  MaxRestarts = 1
  MaxDies = 1
  MutationGuard = FALSE
  FenceComplete = TRUE
  DisownEvidence = TRUE
  RebindRearm = TRUE
  PersistHolderEvidence = TRUE
  LadderRecheck = TRUE
INVARIANTS
  Inv_NoAdmittedWriterUnderLiveDeleg
  Inv_NoUnsignalledStaleness
CHECK_DEADLOCK FALSE
