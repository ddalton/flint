\* Strict run: the shipped forge push path — the index gate, the ticking
\* checksum pass, the takeover rotation, the ack after the CAS, packs
\* before the CAS, the claim-time sweep, and the scheduling axiom all
\* ON. Two syncers, two pushes, crashes in budget. Every theorem must
\* HOLD; the told-failed-but-durable witness is deliberately NOT an
\* invariant here — it is reachable by design and belongs to the probe.
\* Inv_ProofNeverRestsOnRetention lives HERE, in its own witness cfg, and
\* in FoldCommitMidBatch (where it is the expected violation) — and in no
\* other mutation. It is deliberately not everywhere: a mutation cfg that
\* re-opens the mid-batch commit path reaches the retention state, trips
\* this FIRST, and halts before TLC ever searches for the loss that
\* mutation exists to demonstrate. That is not hypothetical — it happened
\* on 2026-09-07 to FoldNoCoverage, which stopped at 6.3M states with
\* 1.6M still queued and reported this invariant instead of the missing
\* coverage it was checking.
\*
\* Inv_ProofIsOfTheBucket stays in every cfg because it CANNOT mask: with
\* ProveFromDisk=FALSE the scope IS belief.packs, so its set difference is
\* empty by construction and it never fires. It is a witness, not coverage.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = FALSE
  ReclaimWhileServing = FALSE
  ReclaimBySet = FALSE
  RestoreLosesQueue = FALSE
  ReclaimUnlinks = FALSE
  NameAcceptedSet = FALSE
  ForgetPushPack = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
  Inv_ProofIsOfTheBucket
  Inv_ProofNeverRestsOnRetention
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
