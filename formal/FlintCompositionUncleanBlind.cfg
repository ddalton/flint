\* THE WRITE-HOLE A/B: UncleanResync = FALSE is stock raid1's actual
\* crash-recovery behaviour — a composer that died between leg writes
\* reassembles both legs as CONFIGURED equals at the same seq
\* (bdev_raid.c:3390-3396), with no dirty flag, no scrub, and no resync
\* path anywhere in the module.  TLC must FIND Inv_NoSplitRead violated:
\* the torn write left the member legs divergent, the recovered composer
\* serves them both, and the least-loaded balancer (raid1.c:227-233)
\* answers reads from either — LAYOUTCOMMIT-confirmed bytes flapping
\* between two values.  The belt is flint's, not SPDK's: any unclean
\* composer death comes back SOLO with the peer leg stale and
\* rebuild-only, because the code cannot see divergence — it can only
\* see "stopped uncleanly while serving" and must treat that as
\* divergence every time.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 3
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = FALSE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
INVARIANTS
  Inv_NoSplitRead
CHECK_DEADLOCK FALSE
