\* THE FIX, stated as sharply as possible: DrainMarksBelt = TRUE (the
\* one-node-at-a-time rule moved INTO drain_for_maintenance, where the
\* resourceVersion-guarded retry re-runs it against the fresh record —
\* race-proof) with RollerLeaderGate = FALSE — no leadership at all, a
\* permanently split second roller free to capture and commit stale
\* plans.  Every invariant must HOLD, including
\* Inv_PlannedRollBoundedImpact and Inv_PlannedRollNeverCausesOutage at
\* zero failures: the belt ALONE carries planned-maintenance safety.
\* The roller's lease therefore buys pacing and churn-freedom, not
\* safety — the same verdict shape FlintClaimsNoLeader proved for the
\* admission window, now machine-checked for the roller (the audit had
\* asserted the opposite in prose; the truth is the belt was MISSING,
\* not that the lease was load-bearing).  scripts/check-tla.sh requires
\* success.
