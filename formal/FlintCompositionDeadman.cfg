\* THE DEAD-MAN A/B: DeadmanGate = FALSE removes the serving lease's
\* teeth entirely — no self-suspend ever, and promotion does not wait for
\* the horizon.  TLC must FIND Inv_NoStaleServe violated: the partitioned
\* composer never stops answering its still-attached clients, so once the
\* survivor is active the old one serves an abandoned lineage FOREVER,
\* not for a skew window.  Writes are already contained without it
\* (eviction severs the fan-in, the DegradeBarrier refuses the solo ack
\* it cannot mark) — the dead-man's irreplaceable job is the composer's
\* LOCAL leg and its READ path, which no admission gate can reach.  This
\* is the belt that makes the review's minimal arbiter three parts, not
\* two.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = FALSE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
INVARIANTS
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
