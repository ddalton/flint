\* SHIPPED BASELINE (2026-09-27): the five rules the code runs by default
\* (NameAcceptedSet, ReclaimAtRestore, ReclaimBySet, ReclaimUnlinks,
\* RestoreLosesQueue) are TRUE here, as in every gated ForgeSync world;
\* before this the gate checked them OFF and the shipped combination
\* was one hand run.
\* Mutation: TickOnHash=FALSE — the checksum pass does real work and
\* ticks no progress (run 3 finding 1: ~70 s of silence at 40 GiB). TLC
\* must FIND Inv_NoSkipOverMovement violated: the renewer skips a
\* heartbeat while the holder moved — the sensor lied, and a challenger
\* counting that silence deposes a live holder mid-push.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = FALSE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = TRUE
  ReclaimWhileServing = FALSE
  ReclaimBySet = TRUE
  RestoreLosesQueue = TRUE
  ReclaimUnlinks = TRUE
  NameAcceptedSet = TRUE
  ForgetPushPack = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
  NameNeeded = FALSE
  NeededNamesQueued = FALSE
  MaxRewinds = 0
  MaxResends = 0
  NeededTrustsDisk = FALSE
  NeededSkipsRetained = FALSE
  RestoreDropsNamedRetention = FALSE
  NamingUnretains = FALSE
  ReclaimKeptSet = FALSE
  KeptSetAnyDrop = FALSE
  KeptSetVsOriginal = FALSE
  KeptSetWhileServing = FALSE
  KeptSetNoRenew = FALSE
  PacksOverlap = FALSE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
  Inv_ProofIsOfTheBucket
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
