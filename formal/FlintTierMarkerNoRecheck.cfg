\* Mutation: PostReadCheck=FALSE — BUG 3's world (no post-pread
\* re-consult).  TLC must FIND the mid-read evict race: a READ passes
\* the consult, the evictor marks and truncates, and the already-read
\* short bytes are served as content.
SPECIFICATION Spec
CONSTANTS
  EvictOrder = "safe"
  PostReadCheck = FALSE
  CycleCheck = FALSE
  HydFlagOn = TRUE
  MaxEvicts = 2
  MaxHyds = 2
  MaxHydFails = 1
  MaxReads = 3
  MaxCrashes = 2
INVARIANTS
  Inv_NoStubServed
CHECK_DEADLOCK FALSE
