\* Strict run: NO leader gate (LeaderGate = FALSE) — the F53 world, two
\* fully concurrent orchestrator processes — with the marker grace ON.
\* Every invariant and both liveness properties must HOLD.  This is the
\* machine-checked statement of what the runaj A/B showed live (the
\* dashboard's window was CORRECT, just unowned): SAFETY never depended
\* on the process singleton — the record CAS carries one-window-at-a-
\* time, and the grace carries scrub-vs-live-window.  What the Lease
\* buys is determinism of ownership, per-process backoff coherence, and
\* churn-freedom — operability, not safety — which is why F53's fix
\* (role grant + Lease) was still right, and why this run holding is a
\* feature of the design rather than an argument against P1.
\* scripts/check-tla.sh runs this and requires success.
SPECIFICATION Spec
CONSTANTS
  Procs = {p1, p2}
  MaxCrashes = 2
  LeaderGate = FALSE
  MarkerGrace = TRUE
INVARIANTS
  Inv
PROPERTIES
  WindowResolves
  EventuallyServes
CHECK_DEADLOCK FALSE
