\* Non-vacuity probe for FlintExtents.cfg (shipped constants): TLC must
\* VIOLATE ProbeFenceFires — a witness that Fence really executes.  A
\* state space where every holder politely returns never exercises the
\* machinery the module exists for, and every green over it would be
\* about a politer world than the one flint runs in.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
INVARIANTS
  ProbeFenceFires
CHECK_DEADLOCK FALSE
