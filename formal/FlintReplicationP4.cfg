\* Mutation run: the pre-P4 world — SpecNoP4 drops weak fairness on
\* RaidDeconfigure, i.e. NOTHING bounds dead-member detection (no
\* TCP_USER_TIMEOUT, no command watchdog, no fast_io_fail). TLC MUST
\* find a temporal counterexample to EventuallyWritable: the stall lasso
\* where a blackholed serving leg sits in the raid forever and every
\* write stalls — the 150-177s ledger stalls observed live on
\* runak/runal, unbounded. Note the stall is INVISIBLE to
\* EventuallyServingAgain (the raid is content-good throughout); gating
\* P4 required stating the write-availability property it actually
\* guarantees. scripts/check-tla.sh requires this run to FAIL
\* temporally.
SPECIFICATION SpecNoP4
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  LocalLegs = {}
  MaintProcessedGate = TRUE
  RefusalSticky = FALSE
  ConsumerMobile = FALSE
  RaidLifetimeArm = FALSE
  MaintLocalRefuse = FALSE
  RaidReconcileArm = FALSE
  VaCanLag = FALSE
  NodeStageValidatesBases = FALSE
  StrikeRepairArm = FALSE
  A2LocalStagingBelt = FALSE
  A2SoleOwnershipBelt = FALSE
  UncontrolledTgtDeath = FALSE
  DpSeenRehydrate = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
