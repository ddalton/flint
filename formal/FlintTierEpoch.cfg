\* Strict run: the shipped A8 protocol — sweep, token rotation, and the
\* 412 fence all ON; two hubs, crashes in budget, publishes decomposed
\* at store-request granularity.  The two safety theorems (pre-sweep
\* assemblies never land; a renewing holder is never deposed) and both
\* liveness properties (a deposed incarnation eventually stops
\* believing; a watch over a dead holder resolves) must HOLD — the
\* liveness pair lives in FlintTierEpochLive.cfg at reduced budgets
\* (TLC temporal checking is near-sequential; invariants at breadth,
\* liveness at depth — the 10x-gate-regression lesson).  The
\* stale-publish witnesses are deliberately NOT invariants here — they
\* are reachable in the shipped protocol and belong to the probe runs.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Misses = 2
  MaxPubs = 4
  MaxCrashes = 2
  MaxRenews = 3
  MaxClaims = 3
  Sweep = TRUE
  TokenRotate = TRUE
  FenceOn412 = TRUE
  StampCheck = TRUE
  FenceBeforeRelease = TRUE
INVARIANTS
  Inv
CHECK_DEADLOCK FALSE
