\* THE DELTA-REJOIN ANCESTRY A/B — the RejoinGuard transfer's teeth.
\* AncestryGuard = FALSE opens the incremental door to any stale leg.
\* TLC must FIND Inv_NoSplitRead violated: the delta copies only what the
\* record's dirty tracking knows changed on the SOURCE since the cut, so
\* a leg that wrote bytes of its own while away (a torn write that landed
\* on it alone, a degraded stint as composer) rejoins with that
\* divergence intact and live — the composition then reads two values for
\* one block.  With the guard on, the delta door opens only for a leg
\* provably AT its cut (no solo-acked bytes, no divergence), which the
\* block tier can prove cheaply: the leg-export admission gate means
\* nothing else could have written the absent leg, and the record pins
\* which cut it left at.  Everything else takes the full rebuild, the one
\* divergence eraser.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 3
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = FALSE
  PreemptFollowsRecord = TRUE
  MaxCuts = 0
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  Inv_NoSplitRead
CHECK_DEADLOCK FALSE
