\* §5's "PTPL IS MANDATORY", WITH TEETH.  PersistReservations = FALSE with
\* FenceReaches = TRUE: every fence lands as a real exclusion — and then
\* spdk-tgt restarts (the most-restarted component in the system,
\* FlintReplication proved it) and the reservation dies with the process.
\* TLC must FIND Inv_NoStaleExtentWrite violated: fence lands, blocks
\* freed and re-granted, TgtRestart forgets the exclusion, and the fenced
\* client's write goes straight through to the new owner's bytes.
\* FenceReaches = TRUE is what makes this single-flag: the lost-fence path
\* is closed, so the counterexample is attributable to amnesia alone.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = TRUE
  PersistReservations = FALSE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
INVARIANTS
  Inv_NoStaleExtentWrite
CHECK_DEADLOCK FALSE
