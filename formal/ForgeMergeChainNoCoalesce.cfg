\* MUTATION — the second shipped defect. `update-ref --stdin` refuses two
\* updates to one ref, and refuses at STEP 6: after the pack, the upload
\* and the snapshot CAS. So the batch publishes a tip and then errors,
\* leaving the pod's ref behind the bucket's — which is why runcj's
\* snapshot advanced past a batch whose log entry (seq 52) never appeared.
\*
\* TLC must FIND Inv_LocalAgreesWithBucket violated.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2, c3}
  Merges = {m1, m2}
  Packs = {q2}
  SeedPack = q1
  SeedTip = c1
  NoCommit = NoCommit
  ExcludeMergeBase = FALSE
  CoalesceRefUpdates = FALSE
\* Named individually so a mutation says WHICH property broke — a
\* combined invariant would let a run 'find the loss' by tripping
\* something else entirely.
INVARIANT TypeOK
INVARIANT Inv_NamedIsUploaded
INVARIANT Inv_RestorableFromBucket
INVARIANT Inv_LocalAgreesWithBucket

\* A batch is a terminal step in this module: with one pack there is
\* nothing enabled afterwards, and stopping is not a defect.
CHECK_DEADLOCK FALSE
