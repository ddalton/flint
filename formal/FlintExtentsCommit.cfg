\* TRANCHE-2 STRICT: the commit/size/scrub machinery armed on the shipped
\* base (FenceReaches still FALSE, so the stale theorems remain unlisted —
\* LostFence keeps that honest).  Claims: everything the tranche-1 strict
\* claims, plus the three tranche-2 theorems — a size-advance never
\* applies without its range promotion (the transactional statement; the
\* doc's sketched state predicate is violated by legal hole-filling and
\* was corrected), an invalid commit never applies, and no rightful read
\* of a fresh provisional extent serves a previous incarnation's bytes.
\* Citable only alongside ProbeCommit/ProbeTruncate (and the tranche-1
\* probes for the shared machinery).
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 2
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = TRUE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  InvCommit
CHECK_DEADLOCK FALSE
