\* FATAL HOLE 2 (DisownEvidence=FALSE): CB_RECALL crosses the granting
\* OPEN reply (referring_call_lists is empty — the client cannot detect
\* the race), the not-yet-holding client answers BAD_STATEID, and the
\* insta-drop rule erases the record and the evidence marker while the
\* reply is still in flight.  The client then installs an orphaned
\* delegation no future conflict will ever recall.  TLC must FIND it.
SPECIFICATION Spec
CONSTANTS
  MaxMut = 2
  MaxGrants = 2
  MaxRestarts = 1
  MaxDies = 1
  MutationGuard = TRUE
  FenceComplete = TRUE
  DisownEvidence = FALSE
  RebindRearm = TRUE
  PersistHolderEvidence = TRUE
  LadderRecheck = TRUE
INVARIANTS
  Inv_BelieverHasEvidence
  Inv_NoUnsignalledStaleness
CHECK_DEADLOCK FALSE
