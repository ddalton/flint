\* Tranche-4 non-vacuity probe: a COMPLETE failover — CAS, refused
\* renewal, horizon, evict, assemble — really completes with ZERO process
\* failures, driven by nothing but a peer cut.  MaxCrashes = 0 makes the
\* witness attributable: every step of the trace TLC produces is the new
\* axis's work.  Without this run, the Witness strict's green would be
\* compatible with "cuts never enable anything", the void-A2 lesson (a
\* non-vacuity probe must name the ACTION's effect, and this one names
\* the whole pipeline's).  TLC must VIOLATE ProbeCutFailoverCompletes.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 0
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 1
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  ProbeCutFailoverCompletes
CHECK_DEADLOCK FALSE
