\* RETIRED, DELIBERATELY NOT GATED.  Kept as the record of a probe that was
\* built and still got past its author; deleting it would delete the lesson.
\*
\* It carries PROBE 2 (ProbeA2WouldHaveFired), which FlintA2Probe.tla:10-22
\* records as TESTING THE WRONG PREDICATE: it asks whether the naive A2's
\* guard ever becomes SATISFIABLE, not whether the belted action ever FIRES,
\* and those differ exactly where it matters — so it can violate ("the hazard
\* arises!") across a complete 1,261,953-state graph in which
\* AgentBootReconcile is disabled from beginning to end.  Wiring it into the
\* gate would add a check whose pass and fail both mean nothing.  PROBE 3
\* (ProbeA2Fires, via FlintA2ProbeArmed.cfg) is the one that asks the right
\* question and it IS gated.
\*
\* Everything below this line describes FlintReplicationA2Staging.cfg, from
\* which this file was copied — including the "EXPECTED: green ... requires
\* success" verdict, which was never true of a probe.  Left verbatim rather
\* than rewritten: the copy is itself part of how PROBE 2 got past review.
\*
\* ---------------------------------------------------------------------
\*
\* A2 + CANDIDATE BELT 2 (local staging) — the belt that works, and the
\* deliverable of this tranche.
\*
\* A2 assembles only where kubelet ALSO still believes the volume staged
\* (stagedAt = vaNode).  That is the discriminator the F62 analysis named and
\* then did not use: a class-3 destroyer is DEFINED by leaving `staged` alone,
\* and a relocation is DEFINED by clearing it.  So this admits exactly the
\* case A2 exists for and refuses exactly the case that manufactures a
\* phantom — with no cluster-wide probe, no lease, no superblock, and nothing
\* remembered across the restart.
\*
\* Note what A2 does NOT do here: it leaves staged/stagedAt untouched, because
\* a node agent re-creating an SPDK object does not participate in kubelet's
\* bookkeeping.  An earlier draft had it write stagedAt' = vaNode, which would
\* let A2 satisfy this very belt with its own previous action.  The belt is
\* only worth anything because its input is somebody else's.
\*
\* Full invariant set, no expected violation to stop the run early — if A2
\* under this belt can still produce two compositions, erode redundancy, or
\* break the roll theorems, this is where it shows.
\*
\* NON-VACUITY: probed, not assumed — see the check-tla.sh catalogue entry.
\* A2 must actually FIRE in this configuration, or the green means only that
\* a disabled action is harmless.
\*
\* EXPECTED: green.  scripts/check-tla.sh runs this and requires success.
