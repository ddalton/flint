\* MUTATION ProveFromDisk, NARROWED TO RETENTION. Same mutation as
\* ForgeSyncProveFromDisk; the difference is that this run checks ONLY
\* Inv_ProofNeverRestsOnRetention, and that is the whole point of it.
\*
\* The general run stops at a trace that has nothing to do with
\* retention: a push's pack is on disk one step before its batch names
\* it, so a directory-scoped proof already reaches past the snapshot
\* with `retained` empty. Fair, and the same defect, but it is not audit
\* F2 — and taking it as F2's demonstration is how this module would
\* claim retention coverage it never exercised. Hiding the shorter
\* witness forces TLC to find fold -> retention -> checkpoint.
\* Inv_ProofNeverRestsOnRetention MUST FAIL here.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = FALSE
  ReclaimWhileServing = FALSE
  NameAcceptedSet = FALSE
  ForgetPushPack = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = TRUE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_ProofNeverRestsOnRetention
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
