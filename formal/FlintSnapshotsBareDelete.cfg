\* Mutation run: bare retention delete (RelinkOnDelete = FALSE) — the
\* FINDING #1 class at content level, and exactly what the sim harness's
\* fake bdev_lvol_delete used to do. Real SPDK blobstore re-parents the
\* surviving clone and absorbs the deleted snapshot's clusters
\* (lib/blob/blobstore.c delete_snapshot ctx; >1 clones refuses -EBUSY);
\* a bare delete instead loses them, and a later full build misses every
\* block whose last write lived only in the dropped epoch. TLC MUST find
\* an Inv_SessionFaithful violation; scripts/check-tla.sh requires this
\* run to FAIL.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 3
  MaxEpochs = 3
  MaxCuts = 3
  WalkFull = TRUE
  OrderedWalk = TRUE
  RelinkOnDelete = FALSE
INVARIANTS
  Inv_SessionFaithful
CHECK_DEADLOCK FALSE
