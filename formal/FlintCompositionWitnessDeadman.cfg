\* THE DEAD-MAN IN THE PURE-PARTITION WORLD — sharper than the tranche-1
\* Deadman run, because MaxCrashes = 0: no process dies, no node
\* partitions, and the violation is still reachable through nothing but a
\* cut cable.  DeadmanGate = FALSE; peerCut condemns the composer (the
\* verdict probe and the mirror ride the same wire), the peer CASes the
\* seat at the witness, the deposed composer's renewal is REFUSED — and
\* with no dead-man there is nothing that turns the refusal into a
\* suspension.  Its clients never left; it serves an abandoned lineage
\* with every process in the fleet healthy.  TLC must FIND
\* Inv_NoStaleServe violated.  This is the run that prices the dead-man
\* for the witness design specifically: the suspension is not (only)
\* about dying nodes, it is what contains a condemned composer that
\* nobody and nothing else can reach.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 0
  LegAdmissionGate = TRUE
  DeadmanGate = FALSE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 2
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
