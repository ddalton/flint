\* The shipped design: F36c gate, rejoin ancestry check, and F48 sever all
\* ON. Every invariant must hold and the post-storm liveness must converge.
\* Breadth run: 3 legs. scripts/check-tla.sh runs this and requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 3
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
INVARIANTS
  Inv
PROPERTIES
  EventuallyServingAgain
  AdmissionNotStarved
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
