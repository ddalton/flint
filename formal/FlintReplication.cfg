\* The shipped design: F36c gate ON. Every invariant must hold and the
\* post-storm liveness must converge. scripts/check-tla.sh runs this and
\* requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 3
  MaxCrashes = 2
  GateStrict = TRUE
INVARIANTS
  Inv
PROPERTIES
  EventuallyServingAgain
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
