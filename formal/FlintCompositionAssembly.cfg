\* THE RECORD-IS-THE-ONLY-DOOR A/B: RecordAssemblyOnly = FALSE is the
\* review's "nothing tears down A's export" finding (split-brain
\* dimension, finding 4) — a recovered node's reconciler re-converges
\* the same subnqn+NGUID over its stale local leg from durable local
\* config, without consulting the record.  TLC must FIND Inv_NoStaleServe
\* violated: the deposed composer heals, resumes serving its old epoch,
\* and accepts a still-attached client's IO while the new composition is
\* active — stale reads served and acks minted on an abandoned lineage.
\* With the belt on, a deposed node's first contact after recovery IS
\* the teardown verb, and SPDK auto-examine never gets to arbitrate.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = FALSE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
INVARIANTS
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
