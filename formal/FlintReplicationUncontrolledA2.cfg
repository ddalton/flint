\* THE DEFAULT PATH, REPAIRED BY A2 — and repaired WITHOUT the escalation
\* ladder, which is the difference worth paying for.
\*
\* THE DESTROYER IS NOT THE ROLLER.  UncontrolledTgtDeath arms TgtDie(l): a
\* csi-node tgt dies with node and consumer in place, gated on no maintenance
\* state whatsoever — no `rolling`, no marks, no lease, no barrier, no
\* refusal.  Class-3 destruction previously existed ONLY inside RollStart, so
\* every F62/F63 run asked "can flint's roller cause this?" about a feature
\* that is OFF BY DEFAULT and which, in that default configuration, refuses to
\* act at all (plan_roll returns Blocked when !on_delete, maint_roll.rs:248).
\*
\* The operative question is whether a routine `helm upgrade` can, and the
\* chart answers it: updateStrategy: OnDelete is emitted only inside the
\* maintenance.drainRoll.enabled conditional (node.yaml:13-24), and that flag
\* defaults FALSE — so the shipped DaemonSet takes k8s's RollingUpdate and
\* rolls every node pod on a template change.  OOM kills, kubelet restarts,
\* evictions, node-image upgrades and GitOps syncs land here too.
\*
\* MaintEnabled is still TRUE only so the roll theorems stay armed; nothing in
\* these runs needs the roller, and TgtDie ignores it.
\*
\* A2 with its working belt (A2LocalStagingBelt), and A1 deliberately OFF
\* (DpSeenRehydrate = FALSE) so the recovery cannot be credited to the
\* detector.  Note MaxBounces = 0 as well: no bounce, no pod delete, no
\* unstage, no restage.  The agent re-creates the composition in place.
\*
\* Why that matters beyond elegance — A1's path is a REPAIR: strike, flag,
\* controller data-path arm, BounceNfsPod, NodeStage.  The volume goes down,
\* the consumer is disrupted, and it comes back.  A2's path never takes the
\* consumer down, and its cost is one tgt restart per NODE regardless of how
\* many consumers that node hosts — where B' costs one relocation per
\* CONSUMER POD, with re-relocation as the roll advances (a pod evicted off
\* an early node can land on a later pending one).  Density is exactly what a
\* storage system has a lot of.
\*
\* EXPECTED: Inv_RaidRecoveryUnreachable VIOLATED.
\* scripts/check-tla.sh runs this and requires the violation.
SPECIFICATION SpecRaidRepair
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 0
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
