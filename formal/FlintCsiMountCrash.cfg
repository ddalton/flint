\* THE COMMON MULTI-CLUSTER FAILURE: a cluster dies holding the
\* workspace.  Spot reclamation is the routine event on this fleet and it
\* takes the node — plugin, worker and the plugin-owned tree — with it,
\* so nothing drains and the prefix's lease is left stamped with a holder
\* that no longer exists.  With the supersede arm on, the surviving
\* cluster takes over: durability still holds (what the app was TOLD is
\* in the bucket; the un-published tree is a known loss with a named
\* recovery), exclusivity still holds, and the waiting pod is SERVED.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 1
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
PROPERTIES
  EventuallyServed
  EventuallyDrained
CHECK_DEADLOCK FALSE
