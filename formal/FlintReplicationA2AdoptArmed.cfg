\* THE ADOPT, ARMED — the run FlintReplicationA2AdoptBelted.cfg was supposed
\* to be.
\*
\* ⚠️ 2026-07-30: A2AdoptBelted has UncontrolledTgtDeath = FALSE, so over its
\* complete 1,261,953-state graph AgentBootReconcile never fires and neither
\* does AssembleAdopt. Inv_NoAdoptOfA2Composition and Inv_NoValidateFlap were
\* green on a state space containing NO A2 composition to adopt. Same single
\* cause as A2Staging: the belt needs `stagedAt = vaNode`, which only a
\* class-3 destroyer leaves behind, and the class-3 destroyer was disarmed.
\*
\* This arms it, and drops the roll theorems as vacuous (MaintEnabled = FALSE
\* — no roller to exonerate, and the shipped default path has none anyway).
\*
\* OWED, AND NOT SILENTLY OMITTED: FlintA2ProbeAdoptArmed.cfg proves A2 fires
\* here, which is NECESSARY but not sufficient — a dedicated "AssembleAdopt
\* fired" probe needs a ghost variable this module does not yet carry
\* (adoptedA2 cannot serve: it is false both when the adopt never runs and
\* when it runs on a non-A2 composition, so probing it would be probing
\* Inv_NoAdoptOfA2Composition itself). Until that ghost exists, treat the
\* adopt theorems as PARTIALLY gated.
