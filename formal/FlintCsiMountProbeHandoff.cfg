\* VACUITY PROBE (required-fail).  The strict run is green over a state
\* space in which a cross-cluster handoff must actually happen: one
\* cluster serving a file ANOTHER cluster wrote.  If this invariant HOLDS,
\* that state is unreachable and the multi-cluster tranche above is a
\* green light over an empty road.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  Probe_HandoffReachable
CHECK_DEADLOCK FALSE
