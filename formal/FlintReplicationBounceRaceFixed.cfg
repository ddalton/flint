\* THE SHARP THEOREM (and, since 2026-07-29, the shipped configuration),
\* in the FlintReplicationRollerRaceFixed shape:
\* BouncePreflight = TRUE with BounceLeaderGate = FALSE — no leadership at
\* all, a permanently split second bouncer free to capture and commit
\* stale plans.  Every invariant must HOLD, so the commit-time preflight
\* ALONE carries bounce safety and the orchestrator lease buys pacing and
\* churn-freedom, not safety — a THIRD machine-checked instance of the
\* verdict FlintClaimsNoLeader proved for the admission window and
\* FlintReplicationRollerRaceFixed for the roller.  Note precisely what
\* the belt does NOT buy: Inv_NoPointlessRebounce is deliberately absent
\* here, because it does not close churn (that is BounceLoop).
\* scripts/check-tla.sh requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  LocalLegs = {}
  MaintProcessedGate = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = TRUE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = TRUE
  MaxBounces = 2
  AdmissionArm = TRUE
  DataPathArm = TRUE
  BouncePreflight = TRUE
  BounceRace = TRUE
  BounceLeaderGate = FALSE
  StageAdmit = TRUE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
  RefusalBounded = FALSE
INVARIANTS
  InvCore
  Inv_NoBounceInducedRisk
  Inv_WriterSetGrounded
CHECK_DEADLOCK FALSE
CONSTRAINT
  BounceBound
