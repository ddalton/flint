\* THE SHIPPED WORLD, and a result that says DO NOT WRITE THE FIX.
\* Identical to BouncePlanner except SuppressScoped = TRUE — the per-leg
\* maintenance marks that landed in the 2026-07-29 wave-2 code wave.  With
\* the planner STILL unfiltered (PlannerDisjoint = FALSE, exactly what
\* cutover.rs ships), Inv_NoDoomedBounce must HOLD: per-leg suppression
\* means a standby on an unaffected leg is still admissible, so a bounce
\* planned for it is not doomed.  The per-leg fix therefore already closed
\* a door nobody knew it was closing, and plan_cutover needs no
\* suppression filter.  NOTE the scope: the hot-rejoin MARKER half of the
\* same disjointness gap lives in FlintClaims' window abstraction and is
\* NOT tested here.  scripts/check-tla.sh requires success.
