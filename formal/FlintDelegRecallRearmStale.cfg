\* FATAL HOLE 3, disease side (RebindRearm=FALSE = HEAD: bind_back_channel
\* only appends, callback sends take .first()).  After one TCP reconnect
\* every send goes to the dead writer: Inv_NoDeliveryAfterRebind HOLDS —
\* no recall is ever delivered again, and every conflict converts to a
\* deadline revocation.  The full safety bundle also holds (the revoke
\* still raises the signal), which is exactly why this rot would ship
\* silently: it degrades "recall-or-die" to "die" without ever serving
\* stale.  This run documents that world; RearmWorks proves the fix
\* opens the door.
SPECIFICATION Spec
CONSTANTS
  MaxMut = 2
  MaxGrants = 2
  MaxRestarts = 1
  MaxDies = 1
  MutationGuard = TRUE
  FenceComplete = TRUE
  DisownEvidence = TRUE
  RebindRearm = FALSE
  PersistHolderEvidence = TRUE
  LadderRecheck = TRUE
INVARIANTS
  Inv
  Inv_NoDeliveryAfterRebind
CHECK_DEADLOCK FALSE
