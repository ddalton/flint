\* Mutation FullBuildReaps = FALSE (SHIPPED full build: a detection-lag epoch keeps its live name), two failures, one write, four epochs, two retained.
\* TLC must FIND Inv violated.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 1
  MaxEpoch = 4
  MaxFails = 2
  Retain = 2
  Backoff = TRUE
  Revert = TRUE
  BaseInclusive = TRUE
  ReapNewer = TRUE
  FinalDelta = TRUE
  PinRetention = TRUE
  FullBuildReaps = FALSE
  FinalCutStrict = TRUE
INVARIANT Inv
CHECK_DEADLOCK FALSE
