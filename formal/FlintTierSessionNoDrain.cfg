\* MUTATION (DrainOnRelease=FALSE) — release does not wait out the
\* volume's in-flight publish: TLC must FIND Inv_NoStragglerLand
\* violated — the straggler lands under the NEXT owner's reign (clean
\* release skips the lease wait, so the successor can already be
\* holding).  The drain is what makes the clean-release fast handoff
\* safe; this run is its teeth.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Vols = {v1, v2}
  Misses = 2
  MaxBeats = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxClaims = 3
  Depose = TRUE
  SessRotate = TRUE
  FenceOnFail = TRUE
  DrainOnRelease = FALSE
INVARIANTS
  Inv_NoStragglerLand
CHECK_DEADLOCK FALSE
