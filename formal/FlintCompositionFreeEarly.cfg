\* THE FREE-WAITS-ACTIVE A/B — this module's third finding, and the one
\* that shows the review's "delivered keyed by epoch" is necessary but
\* NOT sufficient.  FreeWaitsActive = FALSE lets an epoch-CURRENT,
\* execution-keyed confirmation license a free in the interregnum between
\* the CAS and the assembly.  TLC must FIND Inv_NoStaleExtentWrite
\* violated: fence the victim, confirm it absent at the SURVIVOR (epoch
\* matches, key honest — every delivered belt green), free and re-grant —
\* while the deposed composer's fan-in still reaches the surviving leg,
\* and the victim's writes arrive there under the COMPOSER'S inter-tgt
\* hostnqn, which no per-client preempt at the leg-export can
\* distinguish.  The license is real only once the confirming epoch's
\* composition is the ONLY reachable one: ACTIVE (assembled, which the
\* belts order after eviction and the horizon).  At epoch 1 the clause
\* is trivially true and costs nothing.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = FALSE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
INVARIANTS
  Inv_NoStaleExtentWrite
CHECK_DEADLOCK FALSE
