\* Mutation run: hot rejoin WITHOUT the shared-base ancestry check
\* (RejoinGuard = FALSE). TLC MUST find an Inv_NoDivergentServing
\* violation — the phantom-block scenario: a torn write lands on one leg
\* only, that leg later goes stale and recovers, the world reassembles a
\* lineage that never held the block, and an unguarded delta rejoin
\* (union copy — a block copy never erases) smuggles the dead-lineage
\* block into the serving raid: a split-read surface. This is the check
\* catchup.rs performs as "usable shared epoch history" (delta demoted to
\* full rebuild when absent). scripts/check-tla.sh requires this run to
\* FAIL.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 2
  MaxCrashes = 3
  GateStrict = TRUE
  RejoinGuard = FALSE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  LocalLegs = {}
  MaintProcessedGate = TRUE
  RefusalSticky = FALSE
  ConsumerMobile = FALSE
  RaidLifetimeArm = FALSE
  MaintLocalRefuse = FALSE
  RaidReconcileArm = FALSE
  VaCanLag = FALSE
  NodeStageValidatesBases = FALSE
  A2LocalStagingBelt = FALSE
  A2SoleOwnershipBelt = FALSE
  UncontrolledTgtDeath = FALSE
  DpSeenRehydrate = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
  RefusalBounded = FALSE
INVARIANTS
  Inv_NoDivergentServing
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
