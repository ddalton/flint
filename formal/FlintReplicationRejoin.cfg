\* Mutation run: hot rejoin WITHOUT the shared-base ancestry check
\* (RejoinGuard = FALSE). TLC MUST find an Inv_NoDivergentServing
\* violation — the phantom-block scenario: a torn write lands on one leg
\* only, that leg later goes stale and recovers, the world reassembles a
\* lineage that never held the block, and an unguarded delta rejoin
\* (union copy — a block copy never erases) smuggles the dead-lineage
\* block into the serving raid: a split-read surface. This is the check
\* catchup.rs performs as "usable shared epoch history" (delta demoted to
\* full rebuild when absent). scripts/check-tla.sh requires this run to
\* FAIL.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 2
  MaxCrashes = 3
  GateStrict = TRUE
  RejoinGuard = FALSE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
INVARIANTS
  Inv_NoDivergentServing
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
