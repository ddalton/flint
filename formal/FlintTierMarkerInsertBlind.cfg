\* Mutation: CycleOnInsert=FALSE with the cycle check ON — strips the
\* counter's load-bearing half.  The warm-fill wave moved the shipped
\* code to insert-only evidence (forget() no longer bumps); this run
\* proves that posture is the MINIMUM: drop the insert bump too and the
\* cycle check goes blind, resurrecting CycleBlind's counterexample —
\* a complete evict+hydrate cycle inside the read window clears the
\* marker before the re-consult looks, the counter never moved, and
\* the pread's stale stub/partial capture serves as content.  C2's
\* marker-before-truncate order is what makes the insert bump
\* sufficient; this mutation is what makes it necessary.
SPECIFICATION Spec
CONSTANTS
  EvictOrder = "safe"
  PostReadCheck = TRUE
  CycleCheck = TRUE
  CycleOnInsert = FALSE
  CycleOnClear = FALSE
  HydFlagOn = TRUE
  MaxEvicts = 2
  MaxHyds = 2
  MaxHydFails = 1
  MaxReads = 3
  MaxCrashes = 2
INVARIANTS
  Inv_NoStubServed
CHECK_DEADLOCK FALSE
