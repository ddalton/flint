\* MUTATION (Depose=FALSE) — the NAIVE two-level lease: takeover claims
\* the volume cell straight off the watcher's quiet count and leaves
\* the owner's session cell alive.  TLC must FIND the immortal
\* MULTI-VOLUME zombie lasso (ZombieOwnershipResolves violated): the
\* loser's beats keep SUCCEEDING against its untouched session cell, so
\* the beat-fail fence never fires and it believes — and publishes —
\* forever.  S3 has no cross-object CAS to close this; the DEPOSE step
\* (convert quiet-count evidence into stable store state BEFORE any
\* volume cell moves) is the only door, and this run is its teeth.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Vols = {v1}
  Misses = 2
  MaxBeats = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxClaims = 3
  Depose = FALSE
  SessRotate = TRUE
  FenceOnFail = TRUE
  DrainOnRelease = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  ZombieOwnershipResolves
CHECK_DEADLOCK FALSE
