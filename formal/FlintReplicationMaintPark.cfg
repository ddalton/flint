\* THE VOLUME-WIDE PARKING'S TEETH (2026-07-29 audit finding #4):
\* SuppressScoped = FALSE is the shipped plan_hot_rejoin — admission
\* planning parks for the WHOLE volume while ANY replica carries a live
\* maintenance mark (an accidental widening: the design doc and this
\* module's original semantics are per-leg).  Under SpecWedgedKubelet
\* (the rolled node's pod never returns — the runak/runaj wedge family)
\* the live roller renews the mark forever (900s TTL vs 60s tick, no
\* wedge timeout), so at 3 legs TLC must FIND the
\* StandbyAdmissionNotParked lasso: node l1 drained and wedged mid-roll,
\* leg l3 fails and returns as a warm responsive standby on an UNMARKED
\* node — and parks forever at 1/3 redundancy because suppress # {}
\* holds the volume's admission shut.  The F43 parked standby through a
\* third door.  scripts/check-tla.sh requires the violation.
SPECIFICATION SpecWedgedKubelet
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  LocalLegs = {}
  MaintProcessedGate = TRUE
  RefusalSticky = FALSE
  ConsumerMobile = FALSE
  RaidLifetimeArm = FALSE
  MaintLocalRefuse = FALSE
  RaidReconcileArm = FALSE
  VaCanLag = FALSE
  NodeStageValidatesBases = FALSE
  A2LocalStagingBelt = FALSE
  A2SoleOwnershipBelt = FALSE
  UncontrolledTgtDeath = FALSE
  DpSeenRehydrate = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
