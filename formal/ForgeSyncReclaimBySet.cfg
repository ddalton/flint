\* DIRECTION 4, THE FREE FORM — model-before-code, 2026-09-08.
\*
\* ForgeSyncReclaimAtRestore proved the reclaim SAFE, but what it proved
\* pays for it: `FoldPlan` requires a FRESH coverer (`holds[f] = {}`),
\* so that reclaim always runs `pack-objects --all --write-bitmap-index`
\* over the whole repository and uploads the result -- on the WAKE path,
\* since `restore()` precedes every `Phase::Serving`.
\*
\* The RULE never asked the coverer to be new. Measured n=3 x 3 base
\* cadences x 6 rounds (forge/e2e/results/direction4-cadence-*.log): a
\* greedy that keeps a SET holding every reachable object and drops a
\* pack whose reachable objects are all in another KEPT pack collects
\* 100% of the redundant bytes at every cadence INCLUDING the shipped
\* 3600, building nothing. The single-pack form does not survive a real
\* cadence at all (0/6 at 6s and at 3600s) -- that reading was an
\* artefact of a rig running base_rebuild_min_secs = 0.
\*
\* So this run asks the question the measurement cannot: is the SET rule
\* safe? `Drop` ranges over EVERY subset of the inputs, subject only to
\* "what stays named still holds everything the refs reached at plan
\* time" -- which is strictly more permissive than any greedy, and whose
\* kept set includes the fold's own output, so a green covers an
\* implementation that builds nothing a fortiori.
\*
\* Reachability is still read at PLAN time and used at COMMIT time, so a
\* straggler that is still serving may land a push inside the gap.
\* Every invariant must HOLD.
