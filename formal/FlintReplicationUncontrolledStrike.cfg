\* THE SHIPPED PERIODIC REPAIR, AND THE CORRECTION IT FORCED.
\*
\* This run exists because the tranche OVERSTATED its case.
\* FlintReplicationUncontrolledBlind.cfg is green — "no interleaving recovers
\* the volume" — and I read that as "the shipped code cannot recover an
\* uncontrolled tgt death, so A1 is the only thing holding the line." Wrong.
\* The model had only A1's trigger, which needs data_path_raid_seen (the
\* COLLAPSE-EVENT path, raid_collapse_verdict's `previously_seen`). The
\* layer-2 repair needs no seeded state at all: its gate is
\* strikes >= threshold on live observations, and it calls repair_data_path,
\* which reassembles exactly as NodeStage would.
\*
\* So: A1 OFF (DpSeenRehydrate = FALSE), A2 OFF (RaidReconcileArm = FALSE),
\* MaxBounces = 0 — no detector seed, no boot reconcile, no bounce — and the
\* volume still comes back, because the shipped periodic repair is enough.
\*
\* WHAT THIS DOES *NOT* SOFTEN: the repair's LATENCY. It needs N consecutive
\* ticks, and until 2026-07-30 it was the seventh of nine sequential passes in
\* one 60s task whose earlier members make cross-node RPCs with the same 300s
\* budget — so the strike cadence was the whole loop's duration, not 60s, and
\* a couple of stalled peers pushed a nominal ~3min repair into tens of
\* minutes. That starvation is a plausible explanation for runao's observed
\* ">5 minutes, no self-heal" and is fixed in code (own task, split budgets,
\* repair threshold 2 vs flag 3). Reachability is what this run establishes;
\* promptness is a drill question.
\*
\* Note the belt: repair_data_path refuses unless is_staged_here — kubelet's
\* own staging directory. That is the predicate this tranche derived for A2
\* from first principles, already shipped on the adjacent path. So the shipped
\* repair is already the SAFE shape, and A2 differs only in its trigger.
\*
\* EXPECTED: Inv_RaidRecoveryUnreachable VIOLATED — the counterexample IS the
\* shipped repair working. scripts/check-tla.sh requires the violation.
SPECIFICATION SpecRaidRepair
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 0
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  LocalLegs = {l2}
  MaintProcessedGate = TRUE
  RefusalSticky = FALSE
  ConsumerMobile = FALSE
  RaidLifetimeArm = TRUE
  MaintLocalRefuse = TRUE
  RaidReconcileArm = FALSE
  VaCanLag = FALSE
  NodeStageValidatesBases = FALSE
  StrikeRepairArm = TRUE
  A2LocalStagingBelt = FALSE
  A2SoleOwnershipBelt = FALSE
  UncontrolledTgtDeath = TRUE
  DpSeenRehydrate = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = TRUE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = TRUE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
