\* F62a TOOTH — the LIVENESS half, isolated.  Same arm-on, no-repair world as
\* FlintReplicationRaidLifetime.cfg, but the outage INVARIANT is deliberately
\* not checked: it fires at the destroying step and TLC would stop there,
\* never reaching the temporal property.  What this run asks is the different
\* and harder question — once the composition is gone, does it EVER come
\* back?
\*
\* It must not, and the reason is the whole of F62a: Assemble is the only
\* creator, kubelet calls NodeStage only for a volume it believes UNSTAGED,
\* and the tgt death that destroyed the composition cleared nothing.  The
\* existing repair path cannot help either, because the data-path-lost
\* detector needs data_path_raid_seen.contains(pv) and that HashSet died with
\* the same process — the guard is disabled exactly when the hazard fires.
\*
\* This run is what makes RaidEventuallyReassembled non-vacuous in
\* FlintReplicationRaidReconcile.cfg.  Without it that green proves nothing:
\* under fix B the composition is never destroyed, so the property passes
\* VACUOUSLY there, and a tooth that only ever passes is not a tooth.
\*
\* EXPECTED: RaidEventuallyReassembled VIOLATED.
\* scripts/check-tla.sh runs this and requires the violation.
