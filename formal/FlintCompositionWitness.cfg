\* TRANCHE-4 STRICT: the witness world — every belt on, and the two new
\* failure axes live: apiCut (a target loses the witness; API-server
\* outage) and peerCut (the tgt<->tgt wire cut with both nodes healthy —
\* the symmetric partition that refuted peer-arbitrated leases).  All
\* five theorems must HOLD, which includes the tranche's headline: under
\* a pure peerCut both sides race to the witness — the composer to mark
\* its peer stale, the peer to CAS the seat — and TLC explores BOTH
\* orders; whoever lands second is refused (the mark by the moved seat,
\* the CAS by ElectInSync reading the fresh mark).  The serialization
\* argument for a third party, machine-checked.  Pair with
\* ProbeCutFailover (a pure-partition failover really completes) and
\* ProbeBill (the availability cost is really paid) — a green here with
\* neither reachable would prove nothing about the new axis.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 2
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  TypeOK
  Inv_NoDivergentServing
  Inv_NoDoomedAck
  Inv_NoStaleExtentWrite
  Inv_NoStaleServe
  Inv_NoSplitRead
CHECK_DEADLOCK FALSE
