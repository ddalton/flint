\* THE SECOND DOOR, and the reason the reconciler fix ALONE was not enough
\* (both halves shipped 2026-07-29; this is the regression test):
\* ReconcilerBelt = TRUE (the reconciler is fixed) but DetachWaitHonored =
\* FALSE — the SHIPPED timeout path, where await_detached returning false
\* only WARNS and execute_cutover recreates the pod anyway ("recreating
\* anyway — a same-node reuse will surface as CutoverIneffective").  The
\* bouncer then defeats its OWN wait.  TLC must FIND
\* Inv_BounceNotSilentlyDefeated violated even with the second creator
\* belted, which is the sharp statement that these are two independent
\* doors to the same harm.  scripts/check-tla.sh requires the
\* counterexample.
