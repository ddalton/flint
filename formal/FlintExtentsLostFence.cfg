\* THE PERMANENT A/B FOR THE DELIVERED BELT — LostRecall's analog, and
\* since the 2026-08-10 graduation the single-flag mutation licensing
\* the shipped cfg's stale theorems (identical constants except
\* FreeRequiresDelivered = FALSE).  Without the belt, a fence that
\* silently fails to land at the target while the MDS proceeds is a
\* corruption: the holder is marked fenced, its blocks are freed and
\* re-granted, and the never-excluded client's raw NVMe write lands
\* across the ownership generation.  TLC must FIND Inv_NoStaleExtentWrite
\* violated — the harm is the WRITE, corrupting the new owner's bytes.
\* The fence rig proved CONFIRMED preempts real on hardware; this run is
\* why the code must never free on an UNCONFIRMED one (it quarantines).
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  Inv_NoStaleExtentWrite
CHECK_DEADLOCK FALSE
