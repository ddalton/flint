\* THE STANDING RESIDUAL — the LostRecall analog, and the reason the
\* shipped cfg does not list the theorems.  Identical constants to
\* FlintExtents.cfg (this IS the shipped world); the difference is what is
\* CLAIMED.  With FenceReaches = FALSE a fence can silently fail to land
\* while the MDS proceeds believing it did: the holder is marked fenced,
\* its blocks are freed and re-granted, and the never-excluded client's
\* raw NVMe write lands across the ownership generation.  TLC must FIND
\* Inv_NoStaleExtentWrite violated — the harm is the WRITE, corrupting the
\* new owner's bytes.  This run must keep FAILING until spdk-tgt
\* reservation enforcement is proven on real hardware and FenceReaches is
\* re-justified TRUE in the shipped cfg.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  PersistReservations = TRUE
INVARIANTS
  Inv_NoStaleExtentWrite
CHECK_DEADLOCK FALSE
