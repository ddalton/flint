\* CONSUMER MOBILITY — the refusal must not be TERMINAL (2026-07-29, forced by
\* the runap live gate rather than by the model).
\*
\* Same fix-B world as FlintReplicationRaidRefuse.cfg plus ConsumerMobile:
\* RelocateConsumer can move the consumer off the refused node, which is what
\* actually happens in operation and what the F62 tranche could not express
\* while LocalLegs was a constant. With it constant, a refused node was
\* refused in EVERY reachable state, so "refuses forever" and "re-examines
\* every tick" were indistinguishable — and the shipped code does the second
\* while the model only demanded the first. A model weaker than its
\* implementation is the direction that lets a regression land green.
\*
\* RefusalEventuallyClears is the obligation: a node refused for a reason that
\* has since gone away must eventually roll. Measured live at 14 seconds.
\*
\* EXPECTED: green. scripts/check-tla.sh runs this and requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 0
  GateStrict = TRUE
  RejoinGuard = TRUE
