\* THE A/B FOR THE COMMIT-GRACE TRANCHE, and the one that makes the probe
\* above mean something: with CommitGraceEnabled = FALSE the model is the
\* world flint shipped until 2026-08-11 — LAYOUTRETURN destroys the row
\* LAYOUTCOMMIT validates against — so no behaviour can reach a
\* commit-after-return and ProbeCommitAfterReturn HOLDS.  A gate that
\* cannot tell this cfg from ProbeCommitAfterReturn.cfg is not checking
\* the door; it is checking that commits exist.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 2
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  QuarantineIsolated = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = TRUE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = FALSE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  ProbeCommitAfterReturn
CHECK_DEADLOCK FALSE
