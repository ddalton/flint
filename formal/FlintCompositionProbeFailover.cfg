\* NON-VACUITY PROBE: the strict world's constants, and TLC must VIOLATE
\* ProbeFailoverCompletes — a witness trace where the record advances AND
\* the survivor assembles and serves.  Without this, every strict green
\* could mean "promotion is unreachable" (the guards deadlock it) rather
\* than "promotion is safe".  Init -> Partition -> LeaseLapse ->
\* PromoteCAS -> EvictAtLeg -> Assemble is the expected witness shape.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
INVARIANTS
  ProbeFailoverCompletes
CHECK_DEADLOCK FALSE
