\* FlintCatchupTLive (the data plane fair), bound D (three replicas, two failures, one write, two epochs, one retained).
\* Option (b) record-before-ack, rev 13: AckAfterMark, WriteQuorum 1, AssemblyQuorum 1, no F36c defer; code-faithful otherwise.
\* Capture, trust, two failures: a write held for its stale marks still completes.  Must hold.
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION LiveSpec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "trust"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = TRUE
  Crash = FALSE
  ZombieMoves = FALSE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = FALSE
  AssemblyMark = TRUE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = TRUE
  CutStampsAll = TRUE
INVARIANT TypeOK
PROPERTY Prop_AckProgress
CHECK_DEADLOCK FALSE
