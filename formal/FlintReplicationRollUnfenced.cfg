\* Mutation run: TODAY'S WORLD — no drain protocol at all (MaintFence =
\* FALSE).  A DaemonSet roll restarts spdk-tgt under a SERVING leg; the
\* raid cannot tell the planned restart from a blackhole, P4 faults the
\* leg out, and rolling the next node before readmission (k8s
\* maxUnavailable=1 is pod-level knowledge only) deconfigures the last
\* serving leg.  MaxCrashes = 0: the counterexample uses ZERO real
\* failures — a routine rolling restart alone drives the volume to
\* serving = {}.  This is the csi-node roll landmine as a
\* counterexample.  TLC MUST find an Inv_PlannedRollNeverCausesOutage
\* violation.  scripts/check-tla.sh requires this run to FAIL.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 0
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = FALSE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
INVARIANTS
  Inv_PlannedRollNeverCausesOutage
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
