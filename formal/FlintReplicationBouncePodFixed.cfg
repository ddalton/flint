\* THE SHIPPED FIX for the double-creator race (2026-07-29):
\* ReconcilerBelt = TRUE —
\* the reconciler holds off while a bounce window is open, so the pod has
\* exactly ONE creator at a time.  Strict: Inv_BounceNotSilentlyDefeated
\* and InvCore must HOLD, and the bounce still converges (the belt must
\* not strand the volume — WF(BounceRecreate) is the bouncer's own
\* obligation, which is precisely why the shipped fix must be a BOUNDED
\* suppression rather than an unconditional one: a bouncer that dies
\* mid-window must not disable the only actor that can rebuild the pod).
\* scripts/check-tla.sh requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = TRUE
  MaxBounces = 2
  AdmissionArm = TRUE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = TRUE
  PodLayer = TRUE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
  RefusalBounded = FALSE
INVARIANTS
  InvCore
  Inv_BounceNotSilentlyDefeated
PROPERTIES
  EventuallyServingAgain
CHECK_DEADLOCK FALSE
CONSTRAINT
  BounceBound
