\* The REFUTED hypothesis, kept as a run so it cannot be re-asserted.
\* MarkKeepsMin = FALSE — mark_truncate_dirty overwrites the pending size
\* instead of keeping the smaller one. That reads like the other half of the
\* gate's safety, and it is NOT: overwriting only ever raises the mark, and
\* the mark can only be raised by a SETATTR that also raised the file size,
\* so the exposure it would create is unreachable. STRICT: must HOLD. The
\* safety is carried entirely by clear_truncate_dirty_if (see BlindClear);
\* keeping the min is about not lifting a DEEPER cut's mark early, which is
\* an ordering property, not this invariant.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = FALSE
  RecallOnTruncate = FALSE
INVARIANTS
  Inv
CHECK_DEADLOCK FALSE
