\* THE SHIPPED-AFTER-FIX POSTURE, in the situation the fixes are for:
\* every agent presents ONE co_ownerid (Collide), and a mount is TWO
\* EXCHANGE_IDs (the nconnect trunking probe, which is the driver default
\* and what the guide mandates). All three fixes on. Every invariant must
\* hold across every interleaving of mount / exchange / confirm / lock /
\* unmount / lease-expiry.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 2
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = FALSE
  AtomicSweep = TRUE
  NotifyRevoked = FALSE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
CHECK_DEADLOCK FALSE
