\* NON-VACUITY PROBE: strict constants, and TLC must VIOLATE
\* ProbeZombieWriteReachable — a witness that a DEPOSED composer really
\* accepts a client write somewhere in this state graph (post-CAS,
\* pre-horizon: the zombie window the whole module exists to contain).
\* Without it, Inv_NoDivergentServing's green could mean "zombies never
\* write" instead of "zombie writes never reach the served lineage".
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
INVARIANTS
  ProbeZombieWriteReachable
CHECK_DEADLOCK FALSE
