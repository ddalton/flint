\* THE CUTOVER BOUNCE, strict — THE SHIPPED WORLD as of 2026-07-29 (the
\* preflight belt landed in cutover.rs).  A
\* controller-initiated ZERO-FAILURE teardown of a serving data path, with
\* the PROPOSED commit-time preflight ON, plus the at-stage admission
\* (admit_standbys_at_stage) that is the bounce's whole return path and
\* that Admit cannot represent.  Runs over the shipped availability
\* envelope (GateDeadline ON).  Must HOLD: InvCore, Inv_NoBounceInducedRisk
\* (a belted bounce never manufactures a hollow risk) and
\* Inv_WriterSetGrounded — the MACHINE-CHECK of the audit verifier's prose
\* rebuttal that admit-before-gate is the safe direction.  Plus the
\* post-bounce liveness: a bounced volume comes back and a warm standby
\* is not starved.  NOTE the two roll invariants are deliberately ABSENT:
\* they are violated BY CONSTRUCTION by any bounce, which is the sharpest
\* one-line statement of what the bounce IS — the drain is redundancy-
\* preserving by design, the bounce is a full teardown of a healthy data
\* path.  InvCore not Inv, because GateDeadline = TRUE trades away
\* Inv_NoFalseRisk (the existing rule).  scripts/check-tla.sh requires
\* success.
