\* Liveness at depth: a watch over a crashed holder resolves, and a push
\* that reached a serving syncer is answered, one way or the other. Reduced
\* budgets — TLC temporal checking is near-sequential.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 2
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = FALSE
  ReclaimWhileServing = FALSE
  NameAcceptedSet = FALSE
  ForgetPushPack = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
PROPERTIES
  DeadHolderWatchResolves
  SentPushResolves
CHECK_DEADLOCK FALSE
