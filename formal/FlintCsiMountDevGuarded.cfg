\* DEFENCE IN DEPTH, machine-checked.  Same blind oracle, but the fix's
\* second line is on: cleanup REFUSES a published lean volume.  This run
\* must HOLD — that is what makes the guard load-bearing rather than
\* decorative, and it is the answer to "why keep the guard once the
\* oracle is fixed": either one alone stops the loss.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "dev"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
CHECK_DEADLOCK FALSE
