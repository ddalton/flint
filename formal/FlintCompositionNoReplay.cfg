\* THE FENCE-REPLAY A/B — finding 4's counterexample, pinned permanently.
\* FenceReplayOnAssemble = FALSE opens the survivor's export without
\* converging the standing fences into its allow-list.  TLC must FIND
\* Inv_NoStaleExtentWrite violated by the trace this module's second
\* strict run produced: fence the holder, preempt CONFIRMED at the old
\* composer, free and re-grant LEGALLY at epoch 1 — then failover, and
\* the victim re-attaches to the survivor unfenced (its exclusion lives
\* in the old node's PTPL, which never travels; an empty PTPL dir loads
\* zero state silently, subsystem.c:3154-3158) and writes the new
\* owner's bytes.  No delivered-keying can close this: the free was
\* legal when it happened.  The belt is the export's MOUTH — the
\* allow-list is admissions-minus-fenced, computed MDS-side and
\* converged before the listener exists, fail-closed.
