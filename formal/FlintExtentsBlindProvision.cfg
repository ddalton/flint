\* THE UNSCRUBBED PROVISION (the doc's "BlindCommit" row, renamed — the
\* hazard is at provisioning, not commit).  ProvisionalInvisible = FALSE:
\* a fresh INVALID extent allocated from the free list still carries the
\* previous incarnation's bytes.  All reuse is intra-volume (§8's
\* per-volume allocator), so this is not a cross-tenant leak — it is
\* deleted-data resurrection: a deleted file's blocks resurface, readable,
\* inside a new file's fresh extent, violating the new-extent-reads-zeros
\* contract.  TLC must FIND Inv_NoPriorOwnerDisclosure violated: write,
\* return, free, re-grant, rightful read.  CommitEnabled stays FALSE —
\* the trace needs no commit machinery, which keeps this single-flag
\* against the shipped FlintExtents.cfg.  In code the belt is the
\* needs_scrub contract on reused ranges (write_zeroes before the layout
\* returns) — extent_alloc.rs carries the flag, the wire layer owes the
\* zeroing.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  QuarantineIsolated = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = FALSE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  Inv_NoPriorOwnerDisclosure
CHECK_DEADLOCK FALSE
