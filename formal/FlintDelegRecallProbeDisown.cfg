\* VACUITY PROBE (required to fail against the fixed world): the
\* recall-crosses-grant-reply state must actually be REACHED — the
\* client disowns while the OPEN reply is in flight.  If this run ever
\* goes green, the DisownEvidence coverage above it is a green light
\* over an empty road and the crossing question is open again.
SPECIFICATION Spec
CONSTANTS
  MaxMut = 2
  MaxGrants = 2
  MaxRestarts = 1
  MaxDies = 1
  MutationGuard = TRUE
  FenceComplete = TRUE
  DisownEvidence = TRUE
  RebindRearm = TRUE
  PersistHolderEvidence = TRUE
  LadderRecheck = TRUE
INVARIANTS
  Probe_DisownRaceReachable
CHECK_DEADLOCK FALSE
