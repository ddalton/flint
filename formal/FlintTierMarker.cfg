\* Strict run: the shipped orders — C2 durable-first + RAM-marker-
\* before-truncate (bug 4's fix), the post-read re-consult (bug 3's
\* fix), and the durable hydrating flag all ON.  Cycle evidence is
\* INSERT-ONLY (the warm-fill posture: forget() no longer bumps — this
\* run is the proof clear-bumps were never load-bearing).  Both faces
\* of the visibility invariant (no stub/partial served as content;
\* GETATTR never reports the stub while unmarked) and the restore
\* liveness must HOLD across evict/hydrate/read/crash interleavings.
SPECIFICATION Spec
CONSTANTS
  EvictOrder = "safe"
  PostReadCheck = TRUE
  CycleCheck = TRUE
  CycleOnInsert = TRUE
  CycleOnClear = FALSE
  HydFlagOn = TRUE
  MaxEvicts = 2
  MaxHyds = 2
  MaxHydFails = 1
  MaxReads = 3
  MaxCrashes = 2
INVARIANTS
  Inv
PROPERTIES
  MarkedEventuallyRestores
CHECK_DEADLOCK FALSE
