\* F65 REGRESSION. RecallOnTruncate = FALSE is the pre-fix world: the gate
\* is on and correct, but note_truncate never touches the layout manager,
\* so the LAYOUTGET TRYLATER only covers clients that do not yet hold a
\* layout. A layout acquired BEFORE the truncate walks straight past it and
\* the read never reaches the MDS at all.
\*
\* TLC MUST find Inv_NoStaleServe violated, three steps from Init:
\*   LayoutGet (gate clear) → SetSize → Read.
\* scripts/check-tla.sh requires this run to FAIL. If it ever passes, the
\* recall has been removed or has stopped selecting the file's layouts —
\* which is exactly the failure mode that looks like nothing at all.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = FALSE
  RecallReaches = TRUE
INVARIANTS
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
