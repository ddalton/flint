\* TODAY'S WORLD, and the gap. Everything exactly as shipped — the gate is
\* on and correct — but the property checked is the one the gate does not
\* reach: no client is ever SERVED content past the MDS size. note_truncate
\* never touches the layout manager (the only CB_LAYOUTRECALL in the tree is
\* the dead-DS fan-out in server.rs), so the TRYLATER in LAYOUTGET only
\* covers clients that do not yet hold a layout. TLC MUST find
\* Inv_NoStaleServe violated; scripts/check-tla.sh requires this run to
\* FAIL. Same shape as FlintReplicationRollUnfenced: a failing run that
\* records an OPEN hazard rather than guarding a fixed one.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = FALSE
INVARIANTS
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
