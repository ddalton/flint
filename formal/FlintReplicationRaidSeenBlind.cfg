\* F62a, THE TRIGGER HALF — the shipped detector, blind.  The whole repair
\* chain is armed and willing: BounceEnabled, DataPathArm, an orchestrator
\* obligated to bounce and an agent obligated to look.  The one thing missing
\* is the evidence that a raid was ever there — CollapseEvent::Lost needs
\* data_path_raid_seen.contains(pv), and that HashSet died with the same
\* process that took the composition.
\*
\* So the finding is not a missing repair path.  It is an UNREACHABLE one,
\* and the difference is the whole of F62a.
\*
\* Built from FlintReplicationRaidLifetime.cfg (the quiet maintenance world)
\* with ONLY the repair chain added — BounceEnabled, DataPathArm, MaxBounces
\* = 1 — rather than from a bounce cfg with maintenance bolted on.  That
\* direction matters: the bounce templates carry WriterLimbo, RefusalBounded
\* and SuppressScoped arms that widen the space enough for TLC to answer with
\* traces about leg deaths, exhausted bounce budgets and the OPERATOR runbook
\* (LastResortServe restoring the volume by hand) instead of about the fix
\* under test.  Every one of those was a true statement about a world nobody
\* asked about.
\*
\* EXPECTED: RaidEventuallyReassembled VIOLATED.
\* scripts/check-tla.sh runs this and requires the violation.
