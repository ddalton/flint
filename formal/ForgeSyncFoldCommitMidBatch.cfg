\* Mutation: the commit beside a batch (and the sweep with it), which
\* the loop makes impossible: the batch's earlier listing re-names S
\* and omits f, and a sweep between the two CASes has taken S. Must
\* lose Inv_NamedIsUploaded or Inv_NoUnrestorable.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = TRUE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
