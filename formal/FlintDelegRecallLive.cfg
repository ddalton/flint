\* Liveness depth: WF on the deadline, the lease renewal and the reply
\* install — never on DelegReturn (the client may not cooperate), never
\* on Rebind (dead stays dead).  The two progress theorems: the recall
\* barrier always lifts (the DELAYed writer's retry proceeds), and a
\* stale believer eventually stops believing.
SPECIFICATION SpecLive
CONSTANTS
  MaxMut = 2
  MaxGrants = 2
  MaxRestarts = 1
  MaxDies = 1
  MutationGuard = TRUE
  FenceComplete = TRUE
  DisownEvidence = TRUE
  RebindRearm = TRUE
  PersistHolderEvidence = TRUE
  LadderRecheck = TRUE
INVARIANTS
  Inv
PROPERTIES
  RecallResolves
  StaleBeliefResolves
CHECK_DEADLOCK FALSE
