\* QUARANTINE-ISOLATION A/B — the single flag is QuarantineIsolated, and
\* the code fact behind it is one line of `reclaim_complete`: the
\* quarantine branch DELETEs the range's `extents` row and INSERTs it
\* into `extent_quarantine`, a third table whose physical disjointness
\* from the other two `verify_volume_invariants` enforces.  Every
\* extent-table operation therefore misses a parked range for the same
\* reason: the grant transaction allocates from `extent_free` or the
\* arena watermark and re-grants from `extents`; merge and commit walk
\* `extents`.
\*
\* FALSE is the plausible refactor — keep the extent row and flag it —
\* and it is plausible precisely because a parked range then looks like
\* an ORPHAN: allocated, no live holder (the quarantine branch swept the
\* grant rows itself), which is the module's own definition of
\* re-grantable.  TLC must find the corruption: the orphan door hands the
\* parked range to a new owner at its OLD generation, and the sweep —
\* correctly gated, checking the provenance it was parked with — then
\* frees it under that owner's live grant.
\*
\* THIS RUN IS THE ANSWER TO CONSTRAINT 5.  The first draft of the sweep
\* rendered a parked block as still-provisional, TLC produced exactly the
\* trace above, and it was written down as an open constraint about the
\* two-step grant window.  It was not: the code has no two-step window
\* here (`grant` is one immediate transaction), and the trace was the
\* model's abstraction, not the design's hole.  The A/B is what keeps the
\* correction honest — remove the third home and the corruption returns.
