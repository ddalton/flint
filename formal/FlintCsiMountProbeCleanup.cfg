\* VACUITY PROBE (required-fail).  The cleanup branch of the republish
\* ladder must be REACHABLE under the blind oracle, or the mutation that
\* depends on it is checking nothing.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "dev"
  SameFsBind = TRUE
  CleanupGuard = FALSE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  Probe_CleanupReachable
CHECK_DEADLOCK FALSE
