\* Non-vacuity probe for the PTPL belt (shipped constants): TLC must
\* VIOLATE ProbeTgtRestarts — a witness that TgtRestart really occurs in
\* the shipped world too, so the FlintExtents.cfg green holds ACROSS a
\* restart rather than in its absence, and the TgtAmnesia contrast is an
\* A/B over one flag rather than over reachability.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
INVARIANTS
  ProbeTgtRestarts
CHECK_DEADLOCK FALSE
