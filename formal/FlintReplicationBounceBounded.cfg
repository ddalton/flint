\* THE SHIPPED BOUND (2026-07-29): RefusalBounded = TRUE — after the gate's own
\* defer bound a standing refusal yields and the bounce proceeds anyway,
\* emitting CutoverPreflightOverridden.  One flag away from BounceStarve, so
\* the bound is individually load-bearing.  Strict: RemediationNotStarved
\* must HOLD — the terminal remediation is never starved by its own belt — and
\* InvCore must hold with it, so buying that liveness costs no safety.  The
\* honest reading of the pair: a belt on a REMEDIATION path needs a deadline
\* for exactly the reason freshness_gate::evaluate has one ("Never hang").
\* scripts/check-tla.sh requires success.
