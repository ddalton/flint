\* Mutation: EvictOrder="rowlate" — the C2 durable-first violation
\* (truncate before the tier_evicted row).  TLC must FIND the crash
\* between truncate and row: the restart finds a 0-byte file with NO
\* durable evidence, the reconciler has no arm for it, and the stub is
\* served as the file's content — refusal-never-loss inverted.
SPECIFICATION Spec
CONSTANTS
  EvictOrder = "rowlate"
  PostReadCheck = TRUE
  CycleCheck = TRUE
  CycleOnInsert = TRUE
  CycleOnClear = FALSE
  HydFlagOn = TRUE
  MaxEvicts = 2
  MaxHyds = 2
  MaxHydFails = 1
  MaxReads = 3
  MaxCrashes = 2
INVARIANTS
  Inv_NoStubServed
  Inv_TruthfulAttrs
CHECK_DEADLOCK FALSE
