\* Strict maintenance run: the full csi-node-roll protocol — drain-before-
\* restart (MaintFence), the readmission barrier (MaintBarrier), and the
\* leased suppression mark (MaintLease) all ON, rolls enabled over a
\* 3-leg volume with a real failure budget alongside.  Every invariant
\* must hold — including Inv_PlannedRollNeverCausesOutage (with zero
\* real failures, a rolling restart alone never takes the volume down)
\* and Inv_MaintFenceHolds (a serving leg's tgt is never down for a
\* planned restart) — plus all liveness: the F43 arbitration survives
\* maintenance interleavings, and MaintenanceEventuallyLifts (no
\* suppression mark outlives its purpose, roller death included).
\* scripts/check-tla.sh runs this and requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
INVARIANTS
  Inv
  Inv_PlannedRollNeverCausesOutage
  Inv_MaintFenceHolds
PROPERTIES
  EventuallyServingAgain
  AdmissionNotStarved
  EventuallyWritable
  MaintenanceEventuallyLifts
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
