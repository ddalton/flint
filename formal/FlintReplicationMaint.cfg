\* Strict maintenance run, 3-leg breadth, INVARIANTS ONLY: the full
\* csi-node-roll protocol — drain-before-restart (MaintFence), the
\* readmission barrier (MaintBarrier), and the leased suppression mark
\* (MaintLease) all ON, rolls enabled with a real failure budget
\* alongside.  Every invariant must hold — including
\* Inv_PlannedRollNeverCausesOutage (with zero real failures, a rolling
\* restart alone never takes the volume down) and Inv_MaintFenceHolds
\* (a serving leg's tgt is never down for a planned restart).
\* LIVENESS deliberately lives in FlintReplicationMaintDeep.cfg: TLC's
\* temporal checking is near-sequential and per-leg-quantified
\* properties at 3 legs cost minutes for no new corners — every
\* maintenance liveness hazard (roller death, the dead-leg escape, the
\* claims interplay) is 2-leg-reachable.  This run's job is arity
\* coverage of the invariants, in parallel, in seconds.
\* scripts/check-tla.sh runs this and requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
INVARIANTS
  Inv
  Inv_PlannedRollNeverCausesOutage
  Inv_MaintFenceHolds
  Inv_PlannedRollBoundedImpact
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
