\* THE TRANCHE-1 FINDING, pinned permanently (the MarkOverwrite slot: a
\* refuted design hypothesis kept as a run so it cannot be quietly
\* re-asserted).  FreeRevalidates = FALSE is the design doc §9 AS FIRST
\* SKETCHED: the free trusts the reclaim's start-time holder snapshot,
\* and the grant-side belts (PublishRecheck / RecallBlocksGrant) were
\* believed to close the races.  They cannot: a grant that passes its gate
\* check BEFORE the reclaim starts and publishes AFTER the snapshot is
\* invisible to the snapshot, and the reclaim can complete-and-free
\* between that grant's insert and any recheck.  TLC must FIND
\* Inv_RecallCompletesBeforeReuse violated: blocks freed under a live
\* unfenced grant.  The repair is FreeRevalidates — the free transaction
\* re-validates the grants table — which is sqlite-native and carries
\* safety ALONE; the grant-side arms return in the liveness tranche as
\* progress belts.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = FALSE
  FenceReaches = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
INVARIANTS
  Inv_RecallCompletesBeforeReuse
CHECK_DEADLOCK FALSE
