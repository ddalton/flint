\* Liveness run at reduced budgets (temporal checking is near-
\* sequential — invariants at breadth, liveness at depth): a deposed
\* incarnation eventually stops believing it holds (the heartbeat 412
\* fence bounds every stale-publish window), and a watch over a dead
\* holder's frozen token resolves.  Both must HOLD.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Misses = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxRenews = 2
  MaxClaims = 2
  Sweep = TRUE
  TokenRotate = TRUE
  FenceOn412 = TRUE
  StampCheck = TRUE
INVARIANTS
  Inv
PROPERTIES
  DeposedEventuallyFenced
  DeadHolderWatchResolves
CHECK_DEADLOCK FALSE
