\* VACUITY PROBE, required PASS. The case-4 defect is switched back on
\* but a mount opens ONE connection, so case 4 never fires and nothing
\* breaks. This is why pynfs EID5f sails over the defect, and why
\* NConnect=1 is a probe rather than a cheaper run.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 1
  CarryObligation = FALSE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
CHECK_DEADLOCK FALSE
