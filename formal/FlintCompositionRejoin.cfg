\* TRANCHE-2 STRICT: the rebuild/rejoin world with every belt on.
\* RejoinEnabled opens the tranche-2 actions (torn composer death, the
\* rebuild pipeline, both rejoin doors), MaxEpoch = 3 makes the full
\* round trip reachable (promote away -> rebuild the old leg -> lose the
\* survivor -> promote BACK), and the whole theorem stack must hold —
\* including Inv_NoSplitRead, which raid1 cannot state about itself (no
\* scrub, no dirty flag, a balancer that coin-flips divergent reads).
\* Pair with the three tranche-2 probes: rejoin, torn death and fail-back
\* must each be WITNESSED or this green proves nothing.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 3
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
INVARIANTS
  TypeOK
  Inv_NoDivergentServing
  Inv_NoDoomedAck
  Inv_NoStaleExtentWrite
  Inv_NoStaleServe
  Inv_NoSplitRead
CHECK_DEADLOCK FALSE
