\* Mutation: StampCheck=FALSE — the pre-fix shipped protocol, preserved
\* as this module's own regression test.  TLC must FIND
\* Inv_NoSuccessorOverwrite violated: a deposed-but-unfenced zombie's
\* 412 HEAD-rediscovers the SUCCESSOR'S etag and its next If-Match
\* publish lands OVER the live successor's object (A6 local-wins cannot
\* tell a foreign hand from a successor hub without the stamp).  This
\* began life as a REQUIRED-FAIL RESIDUAL PROBE of the shipped code;
\* the counterexample forced the successor fence (flush.rs
\* successor_check: stamp above ours ⇒ verify against the store's epoch
\* object ⇒ fence, never re-publish; a FABRICATED stamp — store still
\* shows our reign — keeps local-wins, so an outside writer cannot
\* fence a healthy hub into a crash loop).  With the fix modeled
\* (StampCheck=TRUE), Inv_NoSuccessorOverwrite is a strict-run THEOREM.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Misses = 2
  MaxPubs = 4
  MaxCrashes = 2
  MaxRenews = 3
  MaxClaims = 3
  Sweep = TRUE
  TokenRotate = TRUE
  FenceOn412 = TRUE
  StampCheck = FALSE
INVARIANTS
  Inv_NoSuccessorOverwrite
CHECK_DEADLOCK FALSE
