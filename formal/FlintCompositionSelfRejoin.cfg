\* THE AUTO-EXAMINE SELF-REJOIN A/B: RecordRejoinOnly = FALSE lets a
\* recovered node's superblock examine win seq arbitration and declare
\* its own stale leg clean — no copy, no record-driven rebuild, just the
\* RECORD'S VIEW corrupted (bdev_raid.c:3883-3904 only ever sees its own
\* leg, which is exactly why the review said never let auto-examine
\* arbitrate).  TLC must FIND Inv_NoDoomedAck violated: the survivor
\* serves solo (its solo acks legitimate — peer duly marked stale), the
\* self-rejoined lie flips that peer to "insync", the survivor then
\* fails, and the election gate — honest, reading corrupt data — elects
\* the stale leg in good faith; its assembly discards the survivor's
\* acked bytes.  DegradeBlind's shape one layer up: a belt is only as
\* honest as the bookkeeping it reads, and only a record-driven rebuild
\* may write this bookkeeping.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 3
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = FALSE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 0
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  Inv_NoDoomedAck
CHECK_DEADLOCK FALSE
