\* MULTI-CLUSTER mutation: the lease is released BEFORE the final drain.
\* The departing cluster's late files are still only in its tree when the
\* next cluster checks out the stale manifest and publishes over it.  No
\* error is raised anywhere — the loss is silent, which is why the
\* ordering is a rule and not a convention.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = FALSE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
CHECK_DEADLOCK FALSE
