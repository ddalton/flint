\* MULTI-CLUSTER mutation: the lease is released BEFORE the final drain.
\* The departing pod has exited cleanly, so everything it wrote should
\* reach the bucket — but the next cluster supersedes the prefix in the
\* gap and the departing syncer's final conditional write is REFUSED.
\* The agent's last work is gone and nothing says so: the pod is
\* Terminated, the volume is unpublished, and the bucket is intact and
\* simply older than it should be.  (The publish is fenced on the lease
\* here, as the epoch fences it in the code — without that the model
\* would find a counterexample the real system refuses, which is how this
\* run read before the fencing went in.)
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = FALSE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
  Inv_NoLostDrain
CHECK_DEADLOCK FALSE
