\* Mutation: Sweep=FALSE — claims no longer abort in-flight assemblies.
\* TLC must FIND Inv_NoPreSweepMpuLand violated: a hub initiates a
\* multipart assembly, a successor claims (epoch+1), and the old
\* incarnation's Complete still lands — the deposed publish the A8 sweep
\* exists to fence (chaos phase E's orphan class, phase I's prey).
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Misses = 2
  MaxPubs = 4
  MaxCrashes = 2
  MaxRenews = 3
  MaxClaims = 3
  Sweep = FALSE
  TokenRotate = TRUE
  FenceOn412 = TRUE
  StampCheck = TRUE
INVARIANTS
  Inv_NoPreSweepMpuLand
CHECK_DEADLOCK FALSE
