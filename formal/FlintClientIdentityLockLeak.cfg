\* MUTATION: the case-5 cascade drops sessions, stateids, delegations
\* and the client record but not the locks. remove_client has already
\* taken the lease, and the only reaper iterates expired leases, so
\* what is left is unreachable by anything.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 2
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = FALSE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
CHECK_DEADLOCK FALSE
