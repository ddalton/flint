\* THE MARK-THEN-DEGRADE A/B — FlintReplication's RecordBarrier transferred
\* to the composer's raid.  DegradeBarrier = FALSE lets the raid ack a
\* solo-landing write BEFORE the record carries the peer leg's stale mark
\* (stock SPDK raid1's actual behaviour: it acks on any-one-leg success
\* and records the miss asynchronously, bdev_raid.c:705-718, 2440-2444).
\* TLC must FIND Inv_NoDoomedAck violated: the un-marked solo ack leaves
\* the election gate reading "insync" for a leg that is already missing
\* acked bytes, so a later promotion elects it in good faith and the
\* assembly discards the acks.  The barrier is what makes ElectInSync's
\* data honest — the pair is one mechanism (mark, then degrade; elect
\* only marked-clean), and this run is why flint must interpose on leg
\* failure rather than trust the stock ack path.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = FALSE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 0
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  Inv_NoDoomedAck
CHECK_DEADLOCK FALSE
