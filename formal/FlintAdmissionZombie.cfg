\* THE SAME-NODE ZOMBIE, machine-checked instead of a prose apology
\* (the lease sweep's documented residual).  A client frozen past its
\* own lease timer (live-migrated / SIGSTOP'd VM) keeps its extent
\* mappings; the sweep fences, revokes, and auto-unfences it; a
\* successor pod on the SAME node re-admits the shared NQN and the
\* reservation is already released — TLC must FIND the stale write
\* landing on the successor's re-granted extent.  This is the exact
\* trace the admission layer cannot close at per-Host granularity
\* (RFC 8154's own), and why it stays a documented residual rather
\* than a theorem.
SPECIFICATION Spec
CONSTANTS
  Zombie = Zombie
  Successor = Successor
  H1 = H1
  H2 = H2
  NoOwner = NoOwner
  ClientHonorsLease = FALSE
  SameHostReadmit = TRUE
  GenMax = 3
INVARIANT Inv_NoStaleDeviceWrite

CHECK_DEADLOCK FALSE
