\* THE VALIDATING FIX — AND WHY IT IS NOT THE ANSWER. IT FLAPS.
\*
\* THE ADOPT. `ensure_raid1_bdev` (driver.rs:3105) is create-OR-CONVERGE, and
\* its converge branch REUSES any raid of this name in state "online" without
\* comparing the base set to the one NodeStage intended ("already ONLINE (N
\* base(s) configured) — reusing"; that count reaches the log line and nowhere
\* else). Ordinary Assemble cannot represent it — Assemble requires
\* serving = {}, and an online raid has at least one configured base — so
\* AssembleAdopt is its own action.
\*
\* NOT a bug report against shipped code: with NodeStage the sole creator, an
\* online raid of that name is one NodeStage itself built from the same PV
\* replica record, so reuse is a correct idempotent restage. It becomes a
\* hazard only once A2 is a second creator whose base set was chosen at a
\* different time.
\*
\* NodeStageValidatesBases stops trusting "online" and takes the
\* delete-then-create path instead (the shape the code already has for a
\* CONFIGURING phantom). That does close the adopt. But its remedy is to
\* DESTROY the other creator's object, so the two creators can undo each
\* other: A2 builds, NodeStage validates and deletes, NodeStage builds, the
\* consumer moves away, A2 builds AGAIN on the same stale VA. Every turn of
\* that loop is a real raid teardown on a node that then hosts a consumer.
\*
\* A fix that trades a phantom for a create/delete loop is not a fix; it is
\* the MaintPark lasso wearing a different hat. This run is here so that
\* judgement is TLC's and not mine.
\*
\* Stated as REACHABILITY (a2Builds >= 2 with a validate-delete in between),
\* because a liveness "the composition eventually stabilises" would be
\* defeated by a flapping leg and an oscillating consumer — exactly as
\* RefusalEventuallyClears was, four widenings running.
\*
\* EXPECTED: Inv_NoValidateFlap VIOLATED.
\* scripts/check-tla.sh runs this and requires the violation.
