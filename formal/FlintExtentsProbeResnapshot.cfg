\* Non-vacuity probe for the FreeRevalidates belt (shipped constants): TLC
\* must VIOLATE ProbeResnapshotGrows — a witness that the retry loop's
\* re-read really finds holders the start-time snapshot missed.  That is
\* precisely the world FreeRevalidates exists for (the free the belt
\* refuses is the free the stale-snapshot mutation performs), so without
\* this violation the belt's green would be a statement about a disabled
\* guard.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  PersistReservations = TRUE
INVARIANTS
  ProbeResnapshotGrows
CHECK_DEADLOCK FALSE
