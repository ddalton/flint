\* A2 NAIVE — repair A2 with the only input the implementation actually has.
\*
\* AgentBootReconcile fires on `vaNode = me`, which is the predicate
\* rehydrate_exports_from_ground_truth already trusts
\* (node_agent.rs:3279, `va_map.get(&pv_name) == Some(&self.node_name)`).
\* VaCanLag = TRUE lets the attached VolumeAttachment keep naming the OLD
\* host after the consumer has moved, which is not a pessimisation invented
\* here: node_agent.rs:3219 explains the ublk reaper's existence as cleaning
\* up "the local disk a STALE VA made us rebuild after the consumer moved
\* away".  Rebuild-from-a-stale-VA is an OBSERVED behaviour with a garbage
\* collector already written for it.
\*
\* On the single-replica path that staleness leaks a ublk disk, and the
\* reaper takes it.  Here the same trigger assembles a RAID over lvols the
\* real host may also have assembled — a second writer, over the same bytes,
\* with no superblock and no lease to arbitrate ("superblock": false is
\* deliberate, driver.rs:3159).  No reaper undoes a write.
\*
\* This is the run that could not exist before this tranche: through F62 and
\* F63 `raidHost` was a SCALAR, so two compositions were unrepresentable and
\* FlintReplicationRaidReconcile.cfg went green on a hazard it was
\* structurally unable to see.  That green was then cited as "A2 is
\* modelled".  It was not.
\*
\* EXPECTED: Inv_A2AssemblesOnlyAtTruth VIOLATED.
\* scripts/check-tla.sh runs this and requires the violation.
