\* MERGE-QUIESCENCE MUTATION (MergeChecksHolders = FALSE): the merge
\* coalesces rows — and coarsens generations — WITHOUT checking that no
\* grant row references them.  Coarsening under a live unfenced grant
\* moves the extent's gen while the holder's gen-at-grant stands still,
\* which is Inv_RecallCompletesBeforeReuse's exact clause (gen never
\* moves under a live unfenced grant).  TLC must FIND it — this run is
\* why the code's merge window demands ZERO grant rows, fenced included,
\* on every row it swallows.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = TRUE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = TRUE
  MergeChecksHolders = FALSE
  MergeTakesMin = FALSE
INVARIANTS
  Inv_RecallCompletesBeforeReuse
CHECK_DEADLOCK FALSE
