\* THE PRICE OF THE SYNCHRONY AXIOM (FlintReplication's Resurrect
\* precedent: name what the idealization buys, then run the world without
\* it).  DeadmanCertain = FALSE splits the composer's self-suspend out of
\* the lapse into its own arbitrarily-late action, with EVERY belt still
\* on.  TLC must FIND Inv_NoStaleServe violated: the promotion completes
\* while the not-yet-suspended zombie still answers its attached clients
\* — a window of IO served from the abandoned lineage.  Note how far the
\* other belts already contain the skew world: WRITES cannot doom or
\* diverge (post-eviction they go solo, and the DegradeBarrier refuses a
\* solo ack the partitioned composer cannot mark), so what the axiom
\* actually buys is closing the stale-READ window.  That is the honest
\* price of leasing without consensus, and the residual to document in
\* the failover runbook.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = FALSE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
INVARIANTS
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
