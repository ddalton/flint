\* TWO-PLANNER DISJOINTNESS, pre-fix world.  plan_cutover applies NEITHER
\* of plan_hot_rejoin's admission filters, so it can commit a FULL
\* teardown of a healthy data path whose only purpose — admitting a
\* particular standby — the stage admission is guaranteed to refuse.
\* Checked with Inv_NoDoomedBounce, NOT the shared pointless-rebounce
\* canary: an A/B showed the canary fires with the filter ON as well as
\* OFF (BounceLoop's three other doors reach it), so it cannot test this
\* fix.  This invariant is violable only through this door — flipping
\* PlannerDisjoint alone flips the verdict.  Needs 3 legs: at 2 the drain
\* belt refuses to drain the last serving leg, so a standby and a
\* suppressed leg cannot coexist.  SuppressScoped = FALSE is the
\* VOLUME-WIDE plan_hot_rejoin gate that shipped before the 2026-07-29
\* wave-2 fix — see BouncePlannerScoped for what that fix already bought.
\* scripts/check-tla.sh requires the counterexample.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2, l3}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = TRUE
  MaxBounces = 2
  AdmissionArm = TRUE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = TRUE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
  RefusalBounded = FALSE
INVARIANTS
  Inv_NoDoomedBounce
CHECK_DEADLOCK FALSE
CONSTRAINT
  BounceBound
