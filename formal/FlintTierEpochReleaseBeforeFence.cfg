\* MUTATION (required-fail): mark the epoch cell released BEFORE
\* fencing the outgoing reign.
\*
\* The mark is what invites a successor to claim with no lease wait, so
\* between the mark and the fence the outgoing hub can still land a
\* publish onto a prefix whose new owner is already serving. This run
\* MUST violate Inv_NoPostReleaseLand: if it ever passes, the theorem in
\* the strict run is vacuous and the shipped ordering
\* (drain -> flush -> fence -> release) is unprotected by this model.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Misses = 2
  MaxPubs = 4
  MaxCrashes = 2
  MaxRenews = 3
  MaxClaims = 3
  Sweep = TRUE
  TokenRotate = TRUE
  FenceOn412 = TRUE
  StampCheck = TRUE
  FenceBeforeRelease = FALSE
INVARIANTS
  Inv_NoPostReleaseLand
CHECK_DEADLOCK FALSE
