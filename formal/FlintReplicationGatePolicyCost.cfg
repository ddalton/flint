\* (StageAdmit = TRUE: admit_standbys_at_stage runs before the gate, as
\* shipped — GateReal predates it.)
\* (SpecExpand: strong fairness on the claim-holder's own dispatch, Scrub and
\* CatchUp — weak fairness lets a no-op claim cycle starve a needed Scrub.)
\* Gate-policy tranche: the PRICE of the proposed policy.  A writer's
\* blackhole may persist (BlackholeResolves = FALSE: a Ready node whose tgt is
\* wedged is never node-gone evidence), the deadline arm is OFF, and the only
\* other survivor is stale: the volume Defers until the operator's
\* LastResortServe, which is not fair.  TLC MUST find an EventuallyAvailable
\* lasso; scripts/check-tla.sh requires this run to FAIL.
SPECIFICATION SpecExpand
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
