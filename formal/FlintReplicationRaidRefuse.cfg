\* F62 FIX B — the roller REFUSES a local-consumer node instead of rolling it,
\* and records it in maintSkipped so an operator can act ("N nodes host
\* serving compositions and need manual handling").  Same arm-on world as
\* FlintReplicationRaidLifetime.cfg, which VIOLATES the outage theorem; the
\* only delta is MaintLocalRefuse = TRUE.
\*
\* Three things must hold together here, and the third is the point:
\*   - Inv_PlannedRollNeverCausesOutage: the outage is PREVENTED, not
\*     repaired.  Refusal is the only fix with this property — repair A2
\*     (FlintReplicationRaidReconcile.cfg) still takes the volume down first.
\*   - RollProcessedNodeRolls: the campaign still CONVERGES.  A refusal that
\*     stalled every later node would be F61's livelock rebuilt out of its
\*     own fix, which is why the one-node-in-flight gate counts maintSkipped.
\*   - Inv_MaintFenceStrict: the fence recovers FULL strength.
\*     Inv_MaintFenceHolds has to carve LocalLegs out of its scope because a
\*     post-F61 roller demonstrably restarts a local half's tgt while it
\*     serves.  Refusing instead needs no carve-out at all — the sharpest
\*     statement available that refusal is the right fix and not a dodge.
\*
\* EXPECTED: green.  scripts/check-tla.sh runs this and requires success.
