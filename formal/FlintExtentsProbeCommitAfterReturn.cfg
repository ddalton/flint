\* NON-VACUITY PROBE for the commit-grace tranche.  FlintExtentsCommit's
\* green on InvCommit covers the grace door only if some behaviour walks
\* through it, so TLC must VIOLATE ProbeCommitAfterReturn: a commit whose
\* range was validated through graceG rather than a live grant — a client
\* that LAYOUTRETURNed and then LAYOUTCOMMITted, which is what the Linux
\* client does and what used to leave its bytes provisional forever.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 2
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = TRUE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  ProbeCommitAfterReturn
CHECK_DEADLOCK FALSE
