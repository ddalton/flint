\* THE ELECTION-GATE A/B — FlintReplication's GateStrict transferred to
\* the serving-target record, and the belt the FIRST STRICT RUN of this
\* module forced (the run that refuted doom-at-record and taught the
\* model that a degraded-window failover is the doom that matters).
\* ElectInSync = FALSE lets the CAS elect a leg the record has already
\* marked stale.  TLC must FIND Inv_NoDoomedAck violated: the composer
\* serves degraded (peer leg dead, duly marked, solo acks legitimate
\* under the barrier), then fails itself — and the promotion elects the
\* stale survivor, whose assembly force-degrades the ONLY leg holding
\* the acked bytes.  With the gate on, that election is refused and the
\* volume waits for the good leg's node instead: availability spent on
\* durability, the honest raid1 trade, with the operator override as the
\* LastResortServe analog (out of scope this tranche).
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = FALSE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
INVARIANTS
  Inv_NoDoomedAck
CHECK_DEADLOCK FALSE
