\* THE FORGED COMMIT.  CommitChecksGen = FALSE: LAYOUTCOMMIT applies
\* without validating (client, gen-at-grant) against the live grant table.
\* Reservations fence the NVMe DATA path only — the NFS control path stays
\* open — so a fenced or stale client can still deliver a LAYOUTCOMMIT,
\* and without the check it promotes extents it no longer owns.  TLC must
\* FIND Inv_NoForgedCommit violated.
\*
\* SPEC CORRECTION (2026-08-09): the design doc's matrix required this run
\* to violate Inv_NoStaleExtentWrite — impossible: a commit writes no
\* bytes.  Its harm is BOOKKEEPING corruption (the new owner's uncommitted
\* state served as committed data), which content-free modelling states
\* honestly as its own theorem.  The doc is amended.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = TRUE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = FALSE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  Inv_NoForgedCommit
CHECK_DEADLOCK FALSE
