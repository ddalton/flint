\* MOBILE-CONSUMER STRICT — the run that CHECKS what I had only asserted.
\*
\* Fix-B world with ConsumerMobile = TRUE, so RelocateConsumer is reachable and
\* the roller can act DURING a relocation: the window where the old host has
\* unstaged, the new host has not yet staged, `raidHosts = {}`, `~staged`,
\* and no leg is local.  After the runap escape-hatch demo I claimed a roll
\* landing in that window is "harmless by construction" — the volume is
\* unattached, so there is no composition to destroy, and the refusal predicate
\* stops applying because the consumer is nowhere.  That reasoning is code
\* reading plus ONE observation whose timing happened to work, which is not a
\* proof, and "by construction" was doing work the evidence did not support.
\*
\* So: full state space, every roll invariant armed, and no expected violation
\* to halt it early — which is why this cannot be folded into
\* FlintReplicationRefusalClears.cfg, a mutation run that stops at
\* Inv_RefusalNeverClears.  If a roll in the unattached window can manufacture
\* an outage or erode redundancy past one leg, this finds it.
\*
\* Both roll invariants carry the ~relocating exemption (a consumer reschedule
\* legitimately takes the volume down) and RelocationWindowCloses carries the
\* obligation that exemption would otherwise drop, so the window cannot just
\* stay open forever.
\*
\* NON-VACUITY, verified rather than hoped: the state (rolling # {} /\ relocating)
\* IS reachable in this configuration — probed with a scratch invariant
\* ~(rolling # {} /\ relocating), which TLC violates.  So the roller really does
\* roll inside the relocation window here and the invariants hold anyway.  Worth
\* re-probing if this cfg is ever narrowed, because a green run whose situation
\* never arises is the failure mode this whole tranche kept tripping over.
\*
\* EXPECTED: green.  scripts/check-tla.sh runs this and requires success.
