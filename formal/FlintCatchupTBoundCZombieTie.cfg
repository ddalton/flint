\* FlintCatchupT, bound C (three replicas, two failures, one write, THREE epochs, one retained).
\* A zombie consumer, gated marks, capture, the tie: no new loss.  Must hold.
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 3
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "tie"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = TRUE
  Crash = FALSE
  ZombieMoves = TRUE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = TRUE
  AssemblyMark = FALSE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = FALSE
  CutStampsAll = TRUE
INVARIANT Inv_NoNewLoss
CHECK_DEADLOCK FALSE
