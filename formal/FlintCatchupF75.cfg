\* Strict, two failures, one write, four epochs, two retained — the second-failure
\* corners.  Every invariant must hold.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 1
  MaxEpoch = 4
  MaxFails = 2
  Retain = 2
  Backoff = TRUE
  Revert = TRUE
  BaseInclusive = TRUE
  ReapNewer = TRUE
  FinalDelta = TRUE
  PinRetention = TRUE
  FullBuildReaps = TRUE
  FinalCutStrict = TRUE
INVARIANT Inv
CHECK_DEADLOCK FALSE
