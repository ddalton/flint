\* SHIPPED BASELINE (2026-09-27): the five rules the code runs by default
\* (NameAcceptedSet, ReclaimAtRestore, ReclaimBySet, ReclaimUnlinks,
\* RestoreLosesQueue) are TRUE here, as in every gated ForgeSync world;
\* before this the gate checked them OFF and the shipped combination
\* was one hand run.
\* Mutation: IdxGate=FALSE — local_packs lists every pack-*.pack (the
\* pre-426bd9fd listing). TLC must FIND Inv_LandedPackComplete violated:
\* a batch lists a neighbour's pack between its .pack and .idx renames,
\* uploads and names it without the index, the index is never uploaded
\* (a named pack is skipped for good), and the neighbour's push lands
\* into it — X1, unrecoverable at restore.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = FALSE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = TRUE
  ReclaimWhileServing = FALSE
  ReclaimBySet = TRUE
  RestoreLosesQueue = TRUE
  ReclaimUnlinks = TRUE
  NameAcceptedSet = TRUE
  ForgetPushPack = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
  Inv_ProofIsOfTheBucket
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
