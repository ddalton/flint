\* MULTI-CLUSTER mutation: no prefix lease.  Two clusters check out and
\* serve ONE workspace at the same time, each publishing full snapshots
\* of its own tree.  TLC must find the exclusivity violation (and, on the
\* way, the durability one) — this is the leg the drill asserts on the
\* wire, where cluster 2's pod must stay ContainerCreating while cluster
\* 1 holds the workspace.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = FALSE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
CHECK_DEADLOCK FALSE
