\* Mutation: HydFlagOn=FALSE — no durable hydrating flag.  TLC must
\* FIND the crashed-restore ambiguity: a flagless partial falls into
\* the C2 diverged-rollback arm ("local wins"), the marker drops, and
\* the PARTIAL becomes the file — served as content on the next read.
SPECIFICATION Spec
CONSTANTS
  EvictOrder = "safe"
  PostReadCheck = TRUE
  CycleCheck = TRUE
  HydFlagOn = FALSE
  MaxEvicts = 2
  MaxHyds = 2
  MaxHydFails = 1
  MaxReads = 3
  MaxCrashes = 2
INVARIANTS
  Inv_NoStubServed
  Inv_TruthfulAttrs
CHECK_DEADLOCK FALSE
