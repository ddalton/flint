\* THE EVICTION A/B — the FenceZombie transfer, mutated inside the honest
\* skew world (DeadmanCertain = FALSE is the BASE here, not part of the
\* mutation: under the certainty axiom the deadman silences the zombie
\* before assembly and eviction looks redundant, which is exactly the
\* argument this run exists to refute).  LegAdmissionGate = FALSE drops
\* the evict-before-assemble requirement, and TLC must FIND
\* Inv_NoDivergentServing violated: the late-suspending zombie's raid
\* fans an innocent client's write INTO the surviving leg while the new
\* composition is serving it — split-brain divergence on the promoted
\* device itself.  Attribution is clean because in the same skew world
\* with eviction ON, divergence is UNREACHABLE (assembly requires the
\* fan-in severed first), so the counterexample is the eviction belt's
\* and nothing else's.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = FALSE
  DeadmanGate = TRUE
  DeadmanCertain = FALSE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
INVARIANTS
  Inv_NoDivergentServing
CHECK_DEADLOCK FALSE
