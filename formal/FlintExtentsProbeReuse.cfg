\* Non-vacuity probe for FlintExtents.cfg (shipped constants): TLC must
\* VIOLATE ProbeReuseFires — a witness that GrantInsert really re-cycles a
\* previously-owned block somewhere in the shipped state space.  Without
\* it, the green on Inv_RecallCompletesBeforeReuse could mean only that
\* nothing was ever reused.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  ProbeReuseFires
CHECK_DEADLOCK FALSE
