\* QUARANTINE SWEEP A/B — the single flag is QuarantineChecksDelivered.
\* The shipped sweep frees a PARKED range only when every remembered
\* holder is confirmed-excluded at the target; drop that check and the
\* sweep hands a range back to the allocator while a client the target
\* never excluded still believes it holds it.  TLC must find the write.
\* This is FlintExtentsLostFence's corruption arriving by the other
\* door — the free that was correctly REFUSED at reclaim time, taken
\* later without re-checking.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = TRUE
  QuarantineChecksDelivered = FALSE
  FenceReaches = FALSE
  FreeRequiresDelivered = TRUE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = TRUE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  Inv
  Inv_NoStaleExtentWrite
  Inv_NoStaleExtentRead
CHECK_DEADLOCK FALSE
