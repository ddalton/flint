\* Non-vacuity probe for the merge-armed shipped cfg: TLC must VIOLATE
\* ProbeMergeFires — a witness that Merge really coarsens (unequal gens,
\* quiescent blocks) somewhere in the shipped state space.  Without it
\* the shipped green says nothing about merging, and MergeHeld's
\* counterexample could be about a world the shipped cfg never enters.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = TRUE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = TRUE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  ProbeMergeFires
CHECK_DEADLOCK FALSE
