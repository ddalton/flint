\* Mutation: EvictOrder="marklate" — BUG 4's shipped order (RAM marker
\* inserted AFTER truncate+fsync; the root cause of every git-under-
\* churn failure, strace'd live on the chaos rig).  TLC must FIND the
\* multi-ms window as a counterexample: a 0-byte stub with no visible
\* marker, GETATTR serving size 0 or a READ serving the bare stub.
SPECIFICATION Spec
CONSTANTS
  EvictOrder = "marklate"
  PostReadCheck = TRUE
  CycleCheck = TRUE
  HydFlagOn = TRUE
  MaxEvicts = 2
  MaxHyds = 2
  MaxHydFails = 1
  MaxReads = 3
  MaxCrashes = 2
INVARIANTS
  Inv_NoStubServed
  Inv_TruthfulAttrs
CHECK_DEADLOCK FALSE
