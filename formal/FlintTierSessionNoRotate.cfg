\* MUTATION (SessRotate=FALSE) — beats do not rotate the session token,
\* so a LIVE, beating hub's session is indistinguishable from a quiet
\* one at the depose CAS: TLC must FIND Inv_NoBeatingSessionDeposed
\* violated — real-S3 gate bug 1's shape, one layer up (the epoch
\* cell's rotation lesson applies to the session cell verbatim).
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Vols = {v1, v2}
  Misses = 2
  MaxBeats = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxClaims = 3
  Depose = TRUE
  SessRotate = FALSE
  FenceOnFail = TRUE
  DrainOnRelease = TRUE
INVARIANTS
  Inv_NoBeatingSessionDeposed
CHECK_DEADLOCK FALSE
