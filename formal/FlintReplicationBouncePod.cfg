\* THE DOUBLE-CREATOR RACE — the pod layer the first cutover tranche
\* abstracted away, brought in because the abstraction hid a race with no
\* mutual exclusion anywhere in it.  SHIPPED world: ReconcilerBelt = FALSE
\* (rwx_nfs.rs's liveness reconciler recreates an Absent server pod on
\* client attachments alone, and nfs_reconcile_decision's SIGNATURE proves
\* it cannot know a bounce is in flight), with DetachWaitHonored = TRUE so
\* the bouncer itself is IDEALIZED — it recreates only after the unstage it
\* waited for.  That isolation is the point: even a perfectly-behaved
\* bouncer is defeated by the second creator.  ZERO crash budget and no
\* maintenance: this is a pure orchestration race between two tokio tasks
\* in ONE process holding ONE lease.  TLC must FIND
\* Inv_BounceNotSilentlyDefeated violated — the pod returns while the
\* volume is still staged, kubelet reuses it, no reassembly ever happens.
\* scripts/check-tla.sh requires the counterexample.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 1
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = TRUE
  MaxBounces = 2
  AdmissionArm = TRUE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = TRUE
  PodLayer = TRUE
  ReconcilerBelt = FALSE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
INVARIANTS
  Inv_BounceNotSilentlyDefeated
CHECK_DEADLOCK FALSE
CONSTRAINT
  BounceBound
