\* Mutation run: walk-order violation (OrderedWalk = FALSE) — epochs
\* applied newest-first let an older epoch's version overwrite the newer
\* one for any block written in two epochs. This is the property
\* lineage_chain's chain.reverse() exists to enforce. TLC MUST find an
\* Inv_SessionFaithful violation; scripts/check-tla.sh requires this run
\* to FAIL.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 3
  MaxEpochs = 3
  MaxCuts = 3
  WalkFull = TRUE
  OrderedWalk = FALSE
  RelinkOnDelete = TRUE
INVARIANTS
  Inv_SessionFaithful
CHECK_DEADLOCK FALSE
