\* THE HALF-STUB, with teeth.  CommitGatesSize = FALSE: the LAYOUTCOMMIT
\* transaction is miswritten so the size half lands while the range half
\* refuses — exactly the shape today's operations/mod.rs LAYOUTCOMMIT
\* half-stub would produce if the size path shipped before the extent
\* path.  TLC must FIND Inv_SizeCommitCoupled violated: fsize advances on
\* a commit whose range promotion was refused, so the file claims data the
\* extent map says is INVALID — F67's silent-zeros lineage (size says
\* bytes, reads say zeros).  CommitChecksGen stays TRUE: the refusal
\* itself is correct, which is what makes this single-flag — the bug is
\* the decoupling, not the validation.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = TRUE
  ProvisionalInvisible = TRUE
  CommitGatesSize = FALSE
  CommitChecksGen = TRUE
INVARIANTS
  Inv_SizeCommitCoupled
CHECK_DEADLOCK FALSE
