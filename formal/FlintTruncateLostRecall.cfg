\* THE RESIDUAL THE FIX DOES NOT CLOSE — an OPEN hazard, recorded as a
\* failing run so the shipped green above can never be read as more than it
\* is.
\*
\* RecallReaches = FALSE: a recall may not reach its client (NoChannel — no
\* back-channel bound, or cb_program=0 — or TimedOut). The implementation
\* revokes SERVER-side through all of those outcomes, and that is the right
\* thing to do, but revocation is bookkeeping the client never sees: it
\* still believes it holds the layout and its reads go straight to a DS.
\*
\* TLC MUST find Inv_NoStaleServe violated. Closing this needs the DS to
\* refuse reads past the pending size — a DsControl fence issued before the
\* set_len fanout — not the MDS to ask more politely. That is a deliberate
\* non-fix for now: it costs an extra RPC on every size change, and the
\* exposed read was issued before the truncate was observable.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = TRUE
  RecallReaches = FALSE
  PublishRecheck = TRUE
INVARIANTS
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
