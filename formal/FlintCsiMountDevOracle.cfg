\* THE DEFECT, mutation.  MountOracle = "dev" is the shipped-then-fixed
\* device-number test, which cannot see a bind whose source and target
\* share a filesystem — every lean bind.  With the guard off (the code as
\* it was), the republish ladder falls through to "unfinished publish,
\* start over" and cleanup removes the tree under a running agent; the
\* syncer's next full-snapshot publish then overwrites the bucket with
\* what is left.  TLC must find both faces: the tree loss and, through
\* it, the durability loss.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "dev"
  SameFsBind = TRUE
  CleanupGuard = FALSE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
  Inv_NoLostDrain
CHECK_DEADLOCK FALSE
