\* THE RECORD-CURRENCY AXIOM'S TEETH (2026-07-29 audit, new finding):
\* MonitorCurrent = FALSE drops the assumption that the raid-health
\* monitor's stale-mark lands before a reassembly reads the record.  TLC
\* must FIND the silent stale-read: a leg is deconfigured (P4 faults it
\* out), writes continue on the survivor, the assembly crashes WITHIN
\* ONE MONITOR TICK (before the mark lands), the deconfigured leg
\* recovers — and the restage attaches BOTH record-insync legs into a
\* fresh superblock:false raid with NO generation arbitration (flint
\* never uses SPDK examine; driver.rs ensure_raid1_bdev), so the
\* content-behind leg serves reads missing the acked tail, gate reads
\* Proceed, no marker.  The strict runs' MonitorCurrent = TRUE is a
\* TIMING axiom (~60s monitor cadence vs the crash window), the same
\* instrument class as FlintClaims' marker grace — this run is its
\* honesty proof.  scripts/check-tla.sh requires the violation.
