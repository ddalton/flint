\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* Option (a), rev 12: WriteQuorum 2, AssemblyQuorum 2; code-faithful otherwise (no cut wait, assembly mark, guard).
\* a zombie move (gated marks, F36c defer), capture, trust, two failures: Inv_RaidHolds (some member of the live raid holds every acked write).  Record only.
