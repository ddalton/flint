\* Non-vacuity probe for FlintExtentsCommit.cfg: TLC must VIOLATE
\* ProbeTruncateFires — a witness that TruncateStart really executes (and
\* with it, the committed-block reclaim path it alone unlocks).
\* truncateFired's only writer is TruncateStart.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 2
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = TRUE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  ProbeTruncateFires
CHECK_DEADLOCK FALSE
