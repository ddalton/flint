\* TRANCHE-2 NON-VACUITY PROBE: strict rejoin-world constants, and TLC
\* must VIOLATE ProbeRejoinCompletes — a witness that a stale leg really
\* re-enters the composition through a rejoin door.  Without it, every
\* Inv_NoSplitRead green is compatible with "nothing ever rejoins" (the
\* quarantine tranche's vacuity lesson), and the fail-back probe would be
\* standing on an unwitnessed rebuild.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 3
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
INVARIANTS
  ProbeRejoinCompletes
CHECK_DEADLOCK FALSE
