\* THE GEN-CHOICE A/B (MergeTakesMin = TRUE): the merged row carries the
\* MINIMUM of its constituents' generations instead of the code's MAX.
\* Written EXPECTING GREEN — under the quiescence guard plus the shipped
\* belts (FreeRevalidates, FreeRequiresDelivered, CommitChecksGen), no
\* grant row can survive into a world where a recycled generation
\* matches it, so the choice should be safety-irrelevant and this run a
\* 5q-style machine-checked REDUNDANCY proof (the code keeps MAX as
\* monotonicity hygiene: a freed merged range's last_gen must dominate
\* every constituent's history so reuse always mints above it — a
\* CROSS-INCARNATION property the block model's single-gen-counter
\* representation cannot state).  If this run ever VIOLATES, the gen
\* choice became load-bearing and the code comment must be rewritten —
\* treat that as a finding, not a flake.  Run with the full theorem
\* stack so any violation names its harm.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = FALSE
  QuarantineChecksDelivered = TRUE
  QuarantineIsolated = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = TRUE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = TRUE
  MergeChecksHolders = TRUE
  MergeTakesMin = TRUE
INVARIANTS
  Inv
  Inv_NoStaleExtentWrite
  Inv_NoStaleExtentRead
CHECK_DEADLOCK FALSE
