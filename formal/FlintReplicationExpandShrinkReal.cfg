\* THE SHIPPED SIZE-BELT FLOOR'S TEETH (2026-07-29 audit finding #3):
\* DeviceFloor = FALSE is the code as shipped — every assembly-time size
\* belt floors on PV spec.capacity (leg_size_guard reads the PV), and PV
\* capacity LAGS the device after a partial expand fan-out (the resizer
\* bumps it only when the WHOLE fan-out succeeded; the device grows when
\* every SERVING leg grew).  TLC must FIND Inv_NoDeviceShrink violated:
\* fan-out grows l1, l2 blackholes un-grown, the raid deconfigures l2
\* and the device grows; l1's node then dies before the monitor marks
\* l2, and the restage — belt floored on the still-old PV capacity —
\* serves the lone old-size leg under a consumer that already saw the
\* grown device.  volumeMode: Filesystem is shielded (NodeExpandVolume
\* runs only after capacity moved); the exposure is Block consumers.
\* The DeviceFloor = TRUE strict world (FlintReplicationExpand.cfg) is
\* the wave-2 fix: belts additionally floor on the device high-water.
\* scripts/check-tla.sh requires the violation.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = TRUE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = FALSE
  SuppressScoped = TRUE
  DrainBelt = TRUE
INVARIANTS
  Inv_NoDeviceShrink
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
