\* Strict DEPTH: the same shipped posture, two pod generations per
\* cluster and two writes each, so the handoff runs both ways — cluster 1
\* seeds and drains, cluster 2 checks out and drains back, cluster 1
\* returns and sees its own files plus cluster 2's.  That is the shape
\* the two-cluster drill exercises on the wire (leg M3, "a cold pod sees
\* 201 files"), and it is where a stale-manifest checkout or a late drain
\* would show up if either ordering were wrong.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 2
  MaxCycles = 2
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
  Inv_NoLostDrain
PROPERTIES
  EventuallyServed
  EventuallyDrained
CHECK_DEADLOCK FALSE
