\* Mutation run: the DELTA-SPLIT bug (WalkFull = FALSE) — the walk applies
\* only the cut epoch's shallow delta, skipping middle epochs; a block
\* whose last write was in a middle epoch is silently lost. This is
\* catchup.rs's documented hazard ("a snapshot interleaved between two
\* epochs splits the newer epoch's delta — shallow copy moves only the
\* top layer"). TLC MUST find an Inv_SessionFaithful violation;
\* scripts/check-tla.sh requires this run to FAIL.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 3
  MaxEpochs = 3
  MaxCuts = 3
  WalkFull = FALSE
  OrderedWalk = TRUE
  RelinkOnDelete = TRUE
INVARIANTS
  Inv_SessionFaithful
CHECK_DEADLOCK FALSE
