\* MUTATION FoldReachableCoverage — DIRECTION 1 of the pack-pinning
\* finding (docs/plans/forge-pack-pinning-2026-09-08.md, runcl
\* 2026-09-08), refuted here before any code was written.
\*
\* The finding: 58% of that repository's snapshot-named bytes were two
\* packs kept named only because each held three UNREACHABLE objects —
\* the residue of a push forge correctly refused. The supersede rule is
\* strict object coverage, so three dead objects pin 22,832 live bytes
\* into every restore, forever.
\*
\* The tempting fix, and the one this run kills: supersede on REACHABLE
\* coverage — let an input go when everything it holds that the refs can
\* reach is in the roll-up. It is runcd with the arrow reversed. A batch
\* names the DIRECTORY and git migrates a push's pack out of quarantine
\* before the hook that queues it, so a queued push's pack is named one
\* batch BEFORE its ref moves. In that gap its objects ARE "unreachable
\* objects in a named pack" — observationally identical to a refusal's
\* residue. The rule unnames the pack, the push then lands, and its
\* objects are in nothing the snapshot names.
\*
\* Inv_LandedPackComplete MUST FAIL here. If it ever holds, either the
\* base rebuild's content rule or the directory-naming gap has stopped
\* being modelled, and the strict rule beside it is passing vacuously.
