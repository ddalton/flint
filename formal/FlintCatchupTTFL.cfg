\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* Option (b) record-before-ack: AckAfterMark, WriteQuorum 1, AssemblyQuorum 1; the mark-race fix (CutStampsAll
\* FALSE); code-faithful otherwise.  the LOST MARK (no capture, no crash, no zombie), two failures.  Spec: FlintCatchupT (the full tie: the control).
\* Inv_NoNewLoss, Inv_MembersHold, Inv_RaidHolds (one run; a violation names the first found).
\* flint-cb (design doc rev 7): does per-epoch membership earn its cut-time read once (b) is in?  Record only.
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "tie"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = FALSE
  Crash = FALSE
  ZombieMoves = FALSE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = FALSE
  AssemblyMark = TRUE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = TRUE
  CutStampsAll = FALSE
INVARIANT Inv_NoNewLoss
INVARIANT Inv_MembersHold
INVARIANT Inv_RaidHolds
CHECK_DEADLOCK FALSE
