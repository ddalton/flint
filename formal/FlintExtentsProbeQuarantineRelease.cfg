\* NON-VACUITY PROBE for the quarantine sweep.  The shipped cfg's green
\* means something only if a PARKED range is actually released — a range
\* the reclaim refused to free because its fence was unconfirmed, freed
\* later once the exclusion was confirmed.  TLC must VIOLATE this.
\* Without it the shipped green is compatible with "nothing was ever
\* quarantined" or "nothing was ever swept": the capacity leak the
\* tranche exists to close, wearing its label.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  QuarantineEnabled = TRUE
  QuarantineChecksDelivered = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = TRUE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = TRUE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  ProbeQuarantineReleaseFires
CHECK_DEADLOCK FALSE
