\* THE FORCED-STALE FLOOR'S TEETH (2026-07-29 audit finding #2): with
\* StaleFloor = TRUE — the shipped 2-base-floor fallback — TLC must FIND
\* Inv_NoStaleServe violated: a leg goes stale, the assembly dies, and
\* the next NodeStage — below 2 in-sync bases — AUTOMATICALLY admits the
\* record-Stale leg alongside the in-sync survivor.  GateDeadline stays
\* FALSE on purpose: the mixed case needs no deadline — the stale leg
\* left the writer set at mark_stale, so the gate reads Proceed and NO
\* risk marker is written (the only surfacing is the
\* StaleReplicaAdmitted event).  The violation trace is the reachability
\* proof for the per-leg StaleServed exemptions in the content
\* invariants.  scripts/check-tla.sh requires the violation.
