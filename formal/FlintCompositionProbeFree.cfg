\* NON-VACUITY PROBE: strict constants, and TLC must VIOLATE
\* ProbePostFailoverFreeReachable — a witness that a fenced holder's
\* range is actually freed and re-granted AFTER a failover, under every
\* belt (fence -> re-preempt at the survivor -> execution-keyed,
\* epoch-scoped delivered -> regrant).  This is the path the two
\* delivered belts police; a strict green with this free unreachable
\* would be the quarantine tranche's vacuity lesson repeated (a green
\* that meant "the sweep never fired").
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 0
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  ProbePostFailoverFreeReachable
CHECK_DEADLOCK FALSE
