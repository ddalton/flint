\* Mutation: TokenRotate=FALSE — renews succeed without rotating the CAS
\* token (real-S3 gate bug 1, verbatim: S3's epoch-object ETag was the
\* body MD5 and renewed_unix is second-granular, so renews were invisible
\* to the quiet-poll judge until the UUID salt).  TLC must FIND
\* Inv_NoRenewingHolderDeposed violated: a holder renews, the watcher's
\* polls still see an unchanged token, and the takeover CAS deposes a
\* provably-live holder.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Misses = 2
  MaxPubs = 4
  MaxCrashes = 2
  MaxRenews = 3
  MaxClaims = 3
  Sweep = TRUE
  TokenRotate = FALSE
  FenceOn412 = TRUE
  StampCheck = TRUE
  FenceBeforeRelease = TRUE
INVARIANTS
  Inv_NoRenewingHolderDeposed
CHECK_DEADLOCK FALSE
