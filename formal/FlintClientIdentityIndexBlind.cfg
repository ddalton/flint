\* MUTATION: remove_client_internal clears the owner index
\* unconditionally. A departing client evicts a LIVE peer sharing the
\* co_ownerid, whose next EXCHANGE_ID then mints a duplicate.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 2
  CarryObligation = TRUE
  CondIndexRemove = FALSE
  CascadeLocks = TRUE
  ModelLease = FALSE
  AtomicSweep = TRUE
  NotifyRevoked = FALSE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
CHECK_DEADLOCK FALSE
