\* AUDIT C6, ISOLATED — and now a REGRESSION run: C6 is fixed, so this cfg
\* records the world without the fix and must keep failing.
\*
\* PublishRecheck = FALSE — layoutget reads truncate_dirty at
\* operations/mod.rs:288 and publishes the layout at layout.rs:988 with NO
\* lock between them (LayoutManager has no Mutex or RwLock at all; `layouts`
\* and `truncate_dirty` are independent DashMaps). The shipped repair is not
\* mutual exclusion but the re-read at layout.rs:989.
\*
\* A grant that passes the gate check, then has the mark arm under it, then
\* publishes, escapes BOTH teeth: the gate already let it through, and the
\* recall's snapshot iterated `layouts` before it was in there. The retry task
\* only re-fans-out and never re-recalls, so on the park path a microsecond
\* race becomes an hours-long exposure with the gate showing dirty throughout.
\*
\* TLC MUST find Inv_NoStaleServe violated. This is the run that exists because
\* the module's FIRST cut modelled LAYOUTGET as one atomic action and was green
\* on a property the code does not hold.
