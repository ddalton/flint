\* Mutation ReapNewer = FALSE (the pre-F75 revert: a pre-failure leftover keeps its live name), two failures, one write, four epochs, two retained.
\* TLC must FIND Inv violated.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 1
  MaxEpoch = 4
  MaxFails = 2
  Retain = 2
  Backoff = TRUE
  Revert = TRUE
  BaseInclusive = TRUE
  ReapNewer = FALSE
  FinalDelta = TRUE
  PinRetention = TRUE
  FullBuildReaps = TRUE
  FinalCutStrict = TRUE
INVARIANT Inv
CHECK_DEADLOCK FALSE
