\* THREE agents on one co_ownerid — a third cluster mounting the same hub,
\* at full mount depth. This config is the reason the module carries the
\* canonicalisation it does: written naively it passed 36 MILLION distinct
\* states without terminating, and almost all of that was bookkeeping TLC
\* could see but the protocol could not — dead records kept their fields,
\* clientids came from a monotonic counter so the space grew with history
\* rather than state, and verifiers were globally unique so a genuine
\* case-1 renewal could never be tested twice. Erasing dead records,
\* recycling unreferenced ids and making the verifier per-mount brings it
\* to ~407k states, and it converges.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2, a3}
  Collide = TRUE
  NConnect = 2
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = FALSE
  AtomicSweep = TRUE
  NotifyRevoked = FALSE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
CHECK_DEADLOCK FALSE
