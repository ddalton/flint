\* THREE agents on one co_ownerid — a third cluster mounting the same hub.
\* Bounded to one mount and one lock each: at MaxMounts=2 this config
\* passed 36M distinct states without converging, which is a gate run
\* nobody would ever wait for. The three-way collision is what this run
\* is for; mount DEPTH is covered by the two-agent breadth run.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2, a3}
  Collide = TRUE
  NConnect = 2
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  MaxMounts = 1
  MaxLocks = 1
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
CHECK_DEADLOCK FALSE
