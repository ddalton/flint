\* THE HEADLINE MUTATION: BouncePreflight = FALSE — the SHIPPED planner.
\* VolumeCutoverView (cutover.rs:271-289) carries no leg health, no serving
\* membership and no writer set; plan_cutover (305-385) reads only
\* sync_state and last_epoch.  A SINGLE bouncer, lease fully honored, no
\* race of any kind, converts "degraded but serving on the survivor" into
\* "torn down, then served-with-risk on an excused writer that was
\* recoverable all along" — a hollow risk the failure ALONE could never
\* produce.  One flag away from FlintReplicationBounce.cfg, so the belt is
\* individually load-bearing.  This states exactly what cutover is
\* missing: CUTOVER HAS NO DrainBelt.  scripts/check-tla.sh requires the
\* Inv_NoBounceInducedRisk counterexample.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = TRUE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = TRUE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = TRUE
  MaxBounces = 2
  AdmissionArm = TRUE
  DataPathArm = TRUE
  BouncePreflight = FALSE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = TRUE
INVARIANTS
  InvCore
  Inv_NoBounceInducedRisk
  Inv_WriterSetGrounded
CHECK_DEADLOCK FALSE
CONSTRAINT
  BounceBound
