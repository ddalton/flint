\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* The code's stage, no capture, trust, checking Inv_TrustComplete: a lagging leg rejoins the next assembly
\* (the lost mark) and its epochs pass the rule while missing a pre-assembly write.  Expect violated: the
\* rule's completeness rests on the record being right at assembly.
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION Spec
