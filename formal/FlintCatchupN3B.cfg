\* Three replicas, TWO failures, one write, four epochs, two retained: two stale legs at once, a
\* rebuilt source, a source in its own detection lag.  Shipped sources (record-in_sync).  Expect Inv
\* violated (a source's zombie write propagates into the rebuilt replica).
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 4
  MaxFails = 2
  Retain = 2
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  SourceMustBeHealthy = FALSE
  ZombieExcluded = FALSE
  SourceTie = FALSE
  DemoteAsCode = TRUE
  FloorFirstOnly = FALSE
  RaidFailsAtDrop = FALSE
  AdmitPaths = "stage"
  HotFix = {}
INVARIANT Inv
CHECK_DEADLOCK FALSE
