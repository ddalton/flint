\* THE F65-OF-EXTENTS.  RecallBeforeReuse = FALSE: frees happen outright,
\* holders or no holders (FreeDirect), no recall, no fence.  TLC must FIND
\* Inv_NoStaleExtentWrite violated: a client's blocks are freed under its
\* live grant, re-granted to a new owner (gen bumps), and the old holder's
\* raw NVMe write lands across the ownership generation — corrupting the
\* new owner's bytes.  The read theorem falls the same way; the write is
\* the listed target because the write is the harm fencing exists for.
\* FreeRevalidates is TRUE and irrelevant here (it guards only the reclaim
\* path, which this mutation bypasses entirely) — the mutation is
\* single-flag.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 3
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = FALSE
  FreeRevalidates = TRUE
  FenceReaches = FALSE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = FALSE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
INVARIANTS
  Inv_NoStaleExtentWrite
CHECK_DEADLOCK FALSE
