\* THE BILL, COLLECTED — the etcd decision's one honest availability
\* cost, produced by TLC rather than asserted in prose (the WaitsPrice
\* pattern in probe form).  MaxCrashes = 0: every process healthy, every
\* client attached, every byte where it should be — and one target loses
\* its path to the witness.  Its heartbeat has nowhere to land, its lease
\* lapses, and the dead-man suspends a perfectly good export, because a
\* composer that cannot prove its entitlement must stop claiming it (the
\* alternative is WitnessDeadman's split brain).  TLC must VIOLATE
\* ProbeHealthySuspend.  The TTL is the knob trading failover latency
\* against API-outage tolerance; this probe is why the chart must ship it
\* documented, and why replicas=1 volumes — which never touch the
\* witness — must never pay it.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 0
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 1
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  ProbeHealthySuspend
CHECK_DEADLOCK FALSE
