\* F62 REPAIR A2 — the node agent re-creates the composition, on boot, for
\* volumes its own records say are staged on this node (the v1.10.0 note's
\* option 1).  Needs no superblock: flint passes "superblock": false ON
\* PURPOSE (driver.rs:3159 — the section-3 phantom-assembly class, and the
\* 1 MiB payload shift that silently formatted restored snapshots on
\* 2026-06-12), so auto-assembly is not the answer.  Re-creation is from the
\* RECORD, exactly as NodeStage already does it.
\*
\* NOTE WHAT IS NOT CHECKED HERE, because it is the finding: this run does
\* NOT carry Inv_PlannedRollNeverCausesOutage, and it CANNOT.  A2 repairs the
\* outage; it does not prevent it.  The composition is still destroyed by the
\* roll and the volume is still down for the repair interval, so the outage
\* invariant genuinely fails under A2 while the liveness property passes.
\* That is the whole argument for doing fix B as well as a repair: only
\* refusal keeps the volume up, and a repair alone converts a permanent
\* outage into a transient one.  Both are worth having — B for the planned
\* roll, A2 for every unplanned tgt death, which no orchestration can refuse.
\*
\* EXPECTED: green (RaidEventuallyReassembled holds).
\* scripts/check-tla.sh runs this and requires success.
