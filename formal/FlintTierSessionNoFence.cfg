\* MUTATION (FenceOnFail=FALSE) — the depose lands but the beat's CAS
\* mismatch is swallowed: TLC must FIND the immortal-zombie lasso
\* through the OTHER door (ZombieOwnershipResolves violated) — the
\* deposed hub can no longer beat, but nothing turns that into an exit,
\* so it believes forever.  The session-layer analog of
\* FlintTierEpochNoFence.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Vols = {v1}
  Misses = 2
  MaxBeats = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxClaims = 3
  Depose = TRUE
  SessRotate = TRUE
  FenceOnFail = FALSE
  DrainOnRelease = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  ZombieOwnershipResolves
CHECK_DEADLOCK FALSE
