\* Mutation: RotateOnTakeover=FALSE — a claim does not rotate the
\* snapshot (lean's LeanNoRotate, restated for forge). TLC must FIND
\* Inv_NoStragglerLandAfterRestore violated: the straggler's If-Match is
\* still valid after the successor restored, its batch lands, and the
\* successor's next CAS is fenced by its own predecessor.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = FALSE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
INVARIANTS
  Inv_NoStragglerLandAfterRestore
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
