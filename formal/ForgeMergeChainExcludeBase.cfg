\* MUTATION — THE SHIPPED BUG, as F14 found it on runcj 2026-09-08.
\* `excludes` was `merge_bases + snap.refs`, and a second merge's base is
\* the FIRST merge's tip: a loose commit the pack was supposed to carry.
\* `pack-objects` gets `M ^M` and drops M from its own pack; the snapshot
\* then names a commit whose parent reached no pack.
\*
\* TLC must FIND Inv_RestorableFromBucket violated. If it ever stops
\* finding it, this module has lost the only thing it was written for.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2, c3}
  Merges = {m1, m2}
  Packs = {q2}
  SeedPack = q1
  SeedTip = c1
  NoCommit = NoCommit
  ExcludeMergeBase = TRUE
  CoalesceRefUpdates = TRUE
\* Named individually so a mutation says WHICH property broke — a
\* combined invariant would let a run 'find the loss' by tripping
\* something else entirely.
INVARIANT TypeOK
INVARIANT Inv_NamedIsUploaded
INVARIANT Inv_RestorableFromBucket
INVARIANT Inv_LocalAgreesWithBucket

\* A batch is a terminal step in this module: with one pack there is
\* nothing enabled afterwards, and stopping is not a defect.
CHECK_DEADLOCK FALSE
