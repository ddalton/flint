\* THE DRAIN BELT'S RESTORED MUTATION (2026-07-29 audit): DrainBelt =
\* FALSE re-creates the PRE-fix record-level last-serving-member check
\* ("another recorded-insync leg exists"), which the RecordBarrier
\* investigation proved lethal — and whose fix (the unconditional
\* ground-truth belt, probe-first in maint_roll.rs drain_leg) had ERASED
\* the bug class from the model's configuration space, violating the
\* module's own rediscoverability rule.  TLC must FIND the silent loss:
\* l1 blackholes, P4 deconfigures it, a write lands acked on l2 alone,
\* and the drain — record still calling BOTH legs insync (the one-
\* monitor-tick lag) — passes the record-level belt and removes l2, THE
\* SOLE SERVING LEG, pruning it from the writer set; l1 recovers and the
\* next assembly reads writerSet = {l1}, Proceeds with no risk marker,
\* and serves without the acked tail.  BarrierRaidAware = FALSE too (the
\* pre-fix world had the record-only barrier).  scripts/check-tla.sh
\* requires the violation.
