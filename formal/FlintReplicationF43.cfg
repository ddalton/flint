\* Mutation run: the pre-F43 bug — no admission-priority claim
\* arbitration (ClaimArb = FALSE). TLC MUST find a temporal
\* counterexample to AdmissionNotStarved: the starvation lasso in which
\* catch-up's timer-driven claim renewal beats the admission claim to
\* every reacquisition, and a warm replacement standby parks forever —
\* exactly F43 as observed live on runad (RWX replacement admission
\* starved by catch-up's perpetual writes-independent claim; fixed by
\* leased+priority R2 arbitration). Note the lasso is WEAK-FAIRNESS
\* LEGAL: admission's enabling is intermittent, so WF never obligates
\* it — the fix had to be priority, not more fairness.
\* scripts/check-tla.sh requires this run to FAIL temporally.
