\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* Code-faithful (rev 9: no wait for a cut, the assembly mark lands, the FlintLocalLeg guard).  FlintCatchupTAnc: the ghost lineage equals the parent walk.
\* Trust (its tr/cutAck branches touch the same snapshots), ONE failure, capture, crash, gated zombie moves.  Must hold.
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 1
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "trust"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = TRUE
  Crash = TRUE
  ZombieMoves = TRUE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = FALSE
  AssemblyMark = TRUE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = FALSE
  CutStampsAll = TRUE
INVARIANT TypeOK
INVARIANT Inv_AncOK
CHECK_DEADLOCK FALSE
