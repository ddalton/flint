\* THE DEFECT, at the BUCKET.  Same blind oracle and no guard, but only
\* the durability invariant is checked — TLC may not stop at the local
\* tree loss and must walk the whole path: the sensor lies, cleanup
\* removes the tree under a running agent, the agent writes on, and the
\* syncer's next FULL-SNAPSHOT publish overwrites the prefix with what is
\* left.  That last step is what turns a node-local scare into a project
\* losing files it was told were durable, and it is the trace the kind
\* drill saw as a manifest citing the last 22 of 200 seeded files.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "dev"
  SameFsBind = TRUE
  CleanupGuard = FALSE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
CHECK_DEADLOCK FALSE
