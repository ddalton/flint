\* MUTATION ListingKeepsRetained: a batch lists the packs a fold
\* superseded and retention is holding on disk for readers, instead of
\* subtracting them (`Syncer::listed_packs`). The snapshot then names a
\* pack the ledger sweep has already taken out of the bucket.
\* Inv_NamedIsUploaded MUST FAIL here.
\*
\* This is not a hypothetical. It is the first draft of this module's
\* retention, which had no subtraction, and TLC refuted it in 3.6M
\* states before the rule was written down — the code has carried the
\* rule and a comment naming it "the collision every 'keep the old packs
\* a while' fix has" since the tiers were built.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = FALSE
  ReclaimWhileServing = FALSE
  ListingKeepsRetained = TRUE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
  Inv_ProofIsOfTheBucket
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
