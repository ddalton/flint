\* FIX B WITH UNIQUE CLIENT NAMES — the same posture as
\* FlintClientIdentityLeaseNotify.cfg with ONE constant changed
\* (Collide = FALSE), so the difference is attributable.
\*
\* Every client sets nfs4_unique_id, which is what the agent-fleet guide
\* mandates and what the many-clusters drill found nothing does by
\* default. Now each cluster has its own clientid, sr_status_flags has an
\* unambiguous addressee, and the cluster that lost the range is the one
\* that gets told. Inv_LockLossIsDetectable HOLDS.
\*
\* This is the machine-checked form of a claim the guide makes on other
\* grounds: unique client names are not only about one cluster stealing
\* another's state, they are a PRECONDITION for a revocation ever being
\* deliverable to the cluster it concerns.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = FALSE
  NConnect = 1
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = TRUE
  AtomicSweep = FALSE
  NotifyRevoked = TRUE
  MaxMounts = 1
  MaxLocks = 2
INVARIANTS
  Inv_LockLossIsDetectable
CHECK_DEADLOCK FALSE
