\* THE SHIPPED WORLD (post-F65). The gate's `confirmed <= min` clear guard,
\* mark_truncate_dirty keeping the smaller size, and note_truncate recalling
\* + revoking the file's layouts between the mark and the fanout. BOTH
\* theorems must hold: the gate's own claim (no DS holds content past the
\* MDS size whenever the mark is absent) and the one the gate could not
\* reach alone (no client is ever served such content).
\*
\* RecallReaches = TRUE is an ASSUMPTION, not a proof: it says every recall
\* was delivered and honoured. FlintTruncateLostRecall.cfg is the arm that
\* drops it, and it FAILS — see that cfg. Cite this green together with
\* that one.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = TRUE
  RecallReaches = TRUE
INVARIANTS
  Inv
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
