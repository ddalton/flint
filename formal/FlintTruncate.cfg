\* THE SHIPPED WORLD. Theorem 1 only — Inv_NoStaleServe is deliberately NOT
\* listed, because one residual still defeats it.
\*
\* Fixed since the 2026-07-31 audit, each with its own regression run:
\*   C1  the CB now carries seqid+1 (RFC 8881 §12.5.3) from a stateid minted
\*       with a known non-zero seqid, and `layouts` is keyed by `other` so
\*       the bump does not lose the entry.
\*   C2  per-session back-channel slot sequencing, the lock held ACROSS the
\*       reply await (RFC 8881 §2.10.6.1).
\*   C3  a refused reply is no longer scored as an ack — which is what let
\*       C1 and C2 hide.
\*   C6  PublishRecheck: layoutget re-reads the gate AFTER publishing and
\*       revokes a grant that raced an arming mark.  Hence TRUE below.
\*
\* STILL OPEN, and why Inv_NoStaleServe is absent: RecallReaches = FALSE.
\* Revocation is server-side, so it binds only clients the recall reaches.
\* C5 is fixed, so a session's other bound transports are now tried (the
\* registry was keeping one writer per session against an nconnect=4
\* mount). What remains is a client with NO live back-channel at all:
\* correctly encoded or not, the recall cannot reach it, and revoking
\* server-side does not tell it anything. Closing that needs the DS to
\* refuse reads past the pending size.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = TRUE
  RecallReaches = FALSE
  PublishRecheck = TRUE
INVARIANTS
  Inv
CHECK_DEADLOCK FALSE
