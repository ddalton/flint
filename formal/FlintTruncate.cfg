\* THE SHIPPED GATE. clear_truncate_dirty_if's `confirmed <= min` guard on,
\* mark_truncate_dirty keeping the smaller size, and NO recall on truncate
\* (which is what the code does today). The claim under test is the gate's
\* own: whenever the mark is absent, every DS has been cut to the MDS size,
\* so a layout handed out while clear cannot reach a byte the file no longer
\* has. scripts/check-tla.sh requires success.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = FALSE
INVARIANTS
  Inv
CHECK_DEADLOCK FALSE
