\* THE SHIPPED WORLD, and it does NOT satisfy Inv_NoStaleServe.
\*
\* This cfg checks Theorem 1 ONLY — the gate's own claim, which does hold.
\* Inv_NoStaleServe is deliberately NOT listed, because as of the 2026-07-31
\* audit the shipped code fails it on two independent counts:
\*
\*   RecallReaches = FALSE — the CB_LAYOUTRECALL is emitted with a
\*     non-incremented layout stateid seqid and a hardcoded CB_SEQUENCE
\*     slot 0 / seqid 1, so a conforming client refuses it; and
\*     `Ok(_reply) => Acked` discards the status, so the server cannot tell.
\*     (audit C1/C2/C3 — see docs/f65-...md)
\*   PublishRecheck = FALSE — layoutget reads the gate and publishes the
\*     layout with no lock between, so a grant can slip past both the gate
\*     and the recall snapshot. (audit C6)
\*
\* Listing Inv_NoStaleServe here would be the model asserting a delivery the
\* code does not achieve — which is exactly the failure this module's own
\* header warns about. FlintTruncateNoStaleServe.cfg is the CONDITIONAL
\* green: what the fix delivers once both are repaired.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = TRUE
  RecallReaches = FALSE
  PublishRecheck = FALSE
INVARIANTS
  Inv
CHECK_DEADLOCK FALSE
