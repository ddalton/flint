\* A2 ARMED — THE RUN THAT ACTUALLY EXERCISES THE LOCAL-STAGING BELT.
\*
\* Created 2026-07-30 after an audit found FlintReplicationA2Staging.cfg —
\* labelled "THE DELIVERABLE" — never fires AgentBootReconcile at all. Its
\* green was a statement about a disabled action. See FlintA2Probe.tla.
\*
\* THE DIFFERENCE IS ONE CONSTANT WITH A REASON: UncontrolledTgtDeath = TRUE.
\* A2 exists to answer a CLASS-3 destroyer — a tgt dying with node and
\* consumer in place, which leaves kubelet's `staged` belief set and so has no
\* inverse. The local-staging belt requires exactly that (`stagedAt = vaNode`).
\* With the class-3 death disarmed, the only reachable destroyers are the ones
\* that CLEAR staging, so belt and destroyers were mutually exclusive and the
\* guard was unsatisfiable by construction.
\*
\* MaintEnabled = FALSE, and that is the point rather than a convenience: this
\* is the SHIPPED DEFAULT PATH. `updateStrategy: OnDelete` is emitted only
\* inside the `maintenance.drainRoll.enabled` conditional, which defaults
\* false, so the DaemonSet takes k8s RollingUpdate and no roller stands
\* between a `helm upgrade` and the tgt. It also makes the four roll theorems
\* VACUOUS rather than suppressed — there is no roller here to exonerate, so
\* dropping them hides nothing. They stay checked in the roll cfgs, where the
\* roller is the subject and the class-3 death is off.
\*
\* Recorded, not silently omitted: this run is SAFETY ONLY. The two liveness
\* properties A2Staging carries (RelocationWindowCloses,
\* MaintenanceEventuallyLifts) are dropped — the second is vacuous with no
\* roller, and temporal checking is ~94% of the flagship run's cost.
\*
\* NON-VACUITY IS GATED, NOT ASSUMED: FlintA2ProbeArmed.cfg runs the same
\* constants under ProbeA2Fires and the gate REQUIRES a violation. If A2 ever
\* stops firing here, that run fails and this green stops being citable.
