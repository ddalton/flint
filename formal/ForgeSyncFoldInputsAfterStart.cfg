\* Mutation: the packs unnamed are read at the commit while the
\* roll-up's contents were fixed at the plan: a push named in between
\* is unnamed and held by nothing.
\*
\* IT DOES NOT LOSE, and that is the finding. This header said "Must
\* lose Inv_AckedIsDurable" and the gate ran it as a required-fail
\* until 2026-09-07, when it was run TO COMPLETION for the first time:
\* 37.8M distinct states, 0 left on queue, depth 57, "No error has
\* been found" -- on the model as it stood, so the retention work did
\* not cause this. The runcd coverage fix subsumes it: the commit may
\* only unname an input the roll-up COVERS
\* (D == {q \in S : holds[q] \subseteq holds[f]}), and a push named
\* between the plan and the commit is by construction not covered by a
\* roll-up planned before it arrived. Reading the inputs late is safe
\* BECAUSE of the coverage rule -- a stronger statement than this
\* mutation was written to make.
\*
\* A DOCUMENTED NON-RUN in scripts/check-tla.sh, not an oversight:
\* a mutation that cannot lose proves nothing, so running it would buy
\* a green that means nothing. Kept so the claim can be re-checked if
\* the coverage rule ever weakens.
