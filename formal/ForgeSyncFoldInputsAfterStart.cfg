\* Mutation: the packs unnamed are read at the commit while the
\* roll-up's contents were fixed at the plan: a push named in between
\* is unnamed and held by nothing. Must lose Inv_AckedIsDurable.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = TRUE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
