\* Mutation run: the pre-F36c bug (no freshness gate). TLC MUST find an
\* Inv_NoSilentLoss violation — the 6-write-tail scenario: a transiently
\* blackholed leg is faulted out, degraded writes ack on the survivor, the
\* leg recovers still recorded insync, the server crashes before the
\* monitor marks it stale, and reassembly from the returned leg alone
\* serves a trailing lineage. scripts/check-tla.sh requires this run to
\* FAIL; a model that cannot rediscover the bug class it exists for
\* proves nothing.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 2
  MaxCrashes = 2
  GateStrict = FALSE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
INVARIANTS
  Inv_NoSilentLoss
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
