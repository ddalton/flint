\* CONTROL for ForgeSyncReclaimBySet: the SET rule taken on a SERVING
\* syncer instead of in the Importing -> Serving window.
\*
\* Without this the strict run's green means nothing -- it would be
\* consistent with `Drop` never being able to take anything. Here a push
\* CAN reach the syncer, so a pack on disk may be waiting for a ref that
\* has not moved, and the set rule's "still holds everything the refs
\* REACHED" cannot see it. Inv_LandedPackComplete MUST FAIL.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = FALSE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = FALSE
  ReclaimWhileServing = TRUE
  ReclaimBySet = TRUE
  RestoreLosesQueue = FALSE
  NameAcceptedSet = FALSE
  ForgetPushPack = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
  Inv_ProofIsOfTheBucket
  Inv_ProofNeverRestsOnRetention
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
