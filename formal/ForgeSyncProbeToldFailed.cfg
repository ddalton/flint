\* PROBE, required to FAIL against the unmutated protocol: the client
\* hangs up before the report and the batch lands anyway (run 3
\* finding 3, on the wire). Not a defect — the syncer cannot see the
\* hangup and must not un-land a durable push — but a transition the
\* "acknowledged means durable" argument carries in the other direction:
\* told failed does NOT mean absent, and a retry converges.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
INVARIANTS
  Inv_NoToldFailedButDurable
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
