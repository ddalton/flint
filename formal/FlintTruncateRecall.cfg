\* The FIX, named precisely. RecallOnTruncate = TRUE: note_truncate revokes
\* every outstanding layout when it arms the gate, so no layout survives the
\* window and re-acquisition has to pass the TRYLATER. STRICT: both theorems
\* must HOLD. This states the smallest change that closes HeldLayout —
\* it is a recall, not a wider gate.
\*
\* SCOPE LIMIT, so this green is not over-cited: reads are atomic with
\* respect to revocation here. A read already on the wire to a DS is beyond
\* any MDS-side mechanism, so this run says the SERVER stops issuing new
\* stale reads; it does not say the DS refuses in-flight ones.
SPECIFICATION Spec
CONSTANTS
  DSes = {d1, d2}
  Clients = {c1}
  MaxOff = 2
  MaxSets = 3
  MaxJobs = 2
  GateClearGuarded = TRUE
  MarkKeepsMin = TRUE
  RecallOnTruncate = TRUE
INVARIANTS
  Inv
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
