\* Strict run: the SHIPPED posture on the common case — two clusters
\* sharing ONE bucket prefix, LEAN binds (source and target on one
\* filesystem, the case the old device-number test could not see), the
\* mountinfo oracle, the cleanup guard, the prefix lease, and the drain
\* before the release.  Durability (an acked file is in the bucket), the
\* local no-tree-loss face, single-writer exclusivity across clusters and
\* both liveness properties must hold across every interleaving of
\* publish, republish, app write, syncer publish, delete and drain.
SPECIFICATION Spec
CONSTANTS
  Clusters = {c1, c2}
  Files = {f1, f2}
  MountOracle = "mountinfo"
  SameFsBind = TRUE
  CleanupGuard = TRUE
  LeaseCheck = TRUE
  DrainBeforeRelease = TRUE
  LeaseExpiry = TRUE
  MaxWrites = 1
  MaxCycles = 1
  MaxCrashes = 0
INVARIANTS
  TypeOK
  Inv_NoAckedLoss
  Inv_NoTreeLoss
  Inv_SingleWriter
PROPERTIES
  EventuallyServed
  EventuallyDrained
CHECK_DEADLOCK FALSE
