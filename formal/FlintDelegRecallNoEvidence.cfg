\* FATAL HOLE 4 (PersistHolderEvidence=FALSE): the same-PVC restart is
\* transparent to the client (EXCHANGE_ID case 1 — belief survives, no
\* CLAIM_PREVIOUS, no reboot recovery), the server's delegation state and
\* seq-flags are in-memory only, and the "defensive DELETE at startup"
\* erases the only durable evidence.  Post-restart the writer commits
\* against a file the vanished record no longer guards, and the holder
\* serves its cache forever with no signal ever coming.  TLC must FIND
\* the unsignalled stale believer through the restart door.
