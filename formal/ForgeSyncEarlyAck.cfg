\* Mutation: AckAfterCas=FALSE — the hook is answered once the objects
\* are local (option B1 of the simplification note). TLC must FIND
\* Inv_AckedIsDurable violated: a crash or a fence after the ack and
\* before the CAS, and the client holds ok for a push the bucket never
\* saw — the successor restores strictly to the snapshot.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = FALSE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
INVARIANTS
  Inv_AckedIsDurable
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
