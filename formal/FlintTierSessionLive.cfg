\* Liveness run at reduced budgets (temporal checking is near-
\* sequential): a hub that lost a volume eventually stops believing it
\* owns it (depose -> stable store state -> the beat-fail fence, hub-
\* scoped), and a down hub's volume of record with a live watcher is
\* eventually claimed.  Both must HOLD.
SPECIFICATION Spec
CONSTANTS
  Hubs = {h1, h2}
  Vols = {v1}
  Misses = 2
  MaxBeats = 2
  MaxPubs = 2
  MaxCrashes = 1
  MaxClaims = 3
  Depose = TRUE
  SessRotate = TRUE
  FenceOnFail = TRUE
  DrainOnRelease = TRUE
INVARIANTS
  Inv
PROPERTIES
  ZombieOwnershipResolves
  DeadSessionWatchResolves
CHECK_DEADLOCK FALSE
