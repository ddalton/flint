\* THE EVICTION BARRIER'S REAL HALF: the same lease-defying zombie, but
\* the successor lands on a DIFFERENT node.  The zombie's NQN is never
\* re-admitted (attach is per-host, the zombie cannot re-handshake
\* without discarding itself, and nothing else shares its NQN) — so the
\* invariant HOLDS even with ClientHonorsLease FALSE.  Together with
\* FlintAdmissionZombie.cfg this pins the barrier's granularity claim
\* from both sides: per-host it is real, same-host it is conditional on
\* the kernel honouring its lease.
SPECIFICATION Spec
CONSTANTS
  Zombie = Zombie
  Successor = Successor
  H1 = H1
  H2 = H2
  NoOwner = NoOwner
  ClientHonorsLease = FALSE
  SameHostReadmit = FALSE
  GenMax = 3
INVARIANT Inv_NoStaleDeviceWrite

CHECK_DEADLOCK FALSE
