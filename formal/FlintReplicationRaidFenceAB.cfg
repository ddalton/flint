\* A/B COMPANION for Inv_MaintFenceStrict — the bug side.  Identical to
\* FlintReplicationRollProcessed.cfg (green) except that it checks the fence
\* with NO LocalLegs carve-out while the roller still rolls local-consumer
\* nodes.  It must fail: RollStart fires for l2 while l2 is serving, which is
\* precisely why Inv_MaintFenceHolds carries the carve-out at all.
\*
\* The fix side is FlintReplicationRaidRefuse.cfg, where the same invariant
\* HOLDS.  That run has RaidLifetimeArm = TRUE as well, and the difference
\* is worth being explicit about: the arm can only ever SHRINK `serving`
\* (its effect is to destroy the composition), so it makes this invariant
\* strictly EASIER to satisfy and cannot be what rescues it.  The refusal
\* is.
\*
\* EXPECTED: Inv_MaintFenceStrict VIOLATED.
\* scripts/check-tla.sh runs this and requires the violation.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 0
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  LocalLegs = {l2}
  MaintProcessedGate = TRUE
  RefusalSticky = FALSE
  ConsumerMobile = FALSE
  RaidLifetimeArm = FALSE
  MaintLocalRefuse = FALSE
  RaidReconcileArm = FALSE
  VaCanLag = FALSE
  NodeStageValidatesBases = FALSE
  StrikeRepairArm = FALSE
  A2LocalStagingBelt = FALSE
  A2SoleOwnershipBelt = FALSE
  UncontrolledTgtDeath = FALSE
  DpSeenRehydrate = FALSE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = TRUE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
  RollerRace = FALSE
  RollerLeaderGate = TRUE
  DrainMarksBelt = TRUE
  BounceEnabled = FALSE
  MaxBounces = 0
  AdmissionArm = FALSE
  DataPathArm = FALSE
  BouncePreflight = TRUE
  BounceRace = FALSE
  BounceLeaderGate = TRUE
  StageAdmit = FALSE
  PodLayer = FALSE
  ReconcilerBelt = TRUE
  DetachWaitHonored = TRUE
  PlannerDisjoint = FALSE
  WriterLimbo = FALSE
  RefusalBounded = FALSE
  KubeDsArm = FALSE
