\* Strict, one failure, two writes, three epochs, one retained: every guard of the catch-up ON
\* (the F75 reap on both reverts, the strict final cut).  Every invariant must hold.
SPECIFICATION Spec
CONSTANTS
  Blocks = {b1, b2}
  MaxVer = 2
  MaxEpoch = 3
  MaxFails = 1
  Retain = 1
  Backoff = TRUE
  Revert = TRUE
  BaseInclusive = TRUE
  ReapNewer = TRUE
  FinalDelta = TRUE
  PinRetention = TRUE
  FullBuildReaps = TRUE
  FinalCutStrict = TRUE
INVARIANT Inv
CHECK_DEADLOCK FALSE
