\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* Option (b) record-before-ack, rev 13: AckAfterMark, WriteQuorum 1, AssemblyQuorum 1; code-faithful otherwise.
\* the LOST MARK (no capture, no crash, no zombie), trust, two failures: Inv_NoNewLoss.  Record only.
