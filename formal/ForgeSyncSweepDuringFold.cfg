\* Mutation: the sweep runs with this holder's fold uploaded and
\* uncommitted, takes the roll-up, and the commit then names it.
\*
\* IT CANNOT LOSE EITHER INVARIANT, and this header used to claim it
\* must lose Inv_NamedIsUploaded. The grace already covers the roll-up
\* (it is inside an in-flight fold), and what the code's guard actually
\* prevents is the claim-time upload abort ending the holder's OWN
\* fold: wasted work and a confusing failure, not a lost invariant.
\*
\* A DOCUMENTED NON-RUN in scripts/check-tla.sh, not an oversight.
\* Kept so the claim can be re-checked if the grace rule changes.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = TRUE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
  FoldIds = {f1}
  MaxFolds = 1
  FoldCasBeforeUpload = FALSE
  FoldCasFromDisk = FALSE
  FoldInputsAfterStart = FALSE
  FoldCommitMidBatch = FALSE
  SweepDuringFold = TRUE
  FoldTicksBatchSensor = FALSE
  FoldNoRenew = FALSE
  FoldNoCoverageCheck = FALSE
  FoldSupersedesArrivals = FALSE
  FoldReachableCoverage = FALSE
  ReclaimAtRestore = FALSE
  ReclaimWhileServing = FALSE
  ReclaimBySet = FALSE
  RestoreLosesQueue = FALSE
  ReclaimUnlinks = FALSE
  NameAcceptedSet = FALSE
  ForgetPushPack = FALSE
  ListingKeepsRetained = FALSE
  ProveFromDisk = FALSE
  GraceOutlivesUpload = TRUE
INVARIANTS
  TypeOK
  Inv_AckedIsDurable
  Inv_LandedPackComplete
  Inv_NamedIsUploaded
  Inv_NoSkipOverMovement
  Inv_NoRenewOverWedge
  Inv_NoStragglerLandAfterRestore
  Inv_NoUnrestorable
  Inv_ProofIsOfTheBucket
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
