\* THE TARGET STATE, NOT THE CURRENT ONE — cite as a goal only.  What
\* shipping the block layout REQUIRES: with fencing proven to land
\* (FenceReaches) and PTPL holding exclusions across tgt restarts, both
\* stale theorems hold on top of the shipped belts.  Citing this as a
\* property of shipped code would be exactly the mistake the F65 audit
\* caught; FenceReaches graduates to the shipped cfg only against real
\* spdk-tgt reservation behaviour on real hardware.
\*
\* Since tranche 2 this cfg arms CommitEnabled — the goal state must cover
\* the commit machinery too, including the committed-block reuse that only
\* TruncateStart unlocks — and runs at NBlocks = 2: the full product at 3
\* blocks is a >10-minute sweep buying no corner the 3-block mutations do
\* not already pin.
SPECIFICATION Spec
CONSTANTS
  Clients = {c1, c2}
  NBlocks = 2
  MaxGrants = 4
  MaxReclaims = 2
  MaxTgtRestarts = 1
  GrantsExclusive = TRUE
  RecallBeforeReuse = TRUE
  FreeRevalidates = TRUE
  FenceReaches = TRUE
  FreeRequiresDelivered = FALSE
  PersistReservations = TRUE
  CommitEnabled = TRUE
  ProvisionalInvisible = TRUE
  CommitGatesSize = TRUE
  CommitChecksGen = TRUE
  CommitGraceEnabled = TRUE
  MergeEnabled = FALSE
  MergeChecksHolders = TRUE
  MergeTakesMin = FALSE
INVARIANTS
  InvTarget
CHECK_DEADLOCK FALSE
