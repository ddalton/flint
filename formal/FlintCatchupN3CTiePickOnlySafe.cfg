  PinRetention = TRUE
  CoverageWalk = FALSE
  SourceMustBeHealthy = FALSE
  ZombieExcluded = FALSE
  SourceTie = TRUE
  DemoteAsCode = FALSE
  FloorFirstOnly = FALSE
  RaidFailsAtDrop = FALSE
  AdmitPaths = "stage"
  HotFix = {}
INVARIANT Inv
CHECK_DEADLOCK FALSE
