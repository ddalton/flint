\* FIX A — one snapshot. Phase 2 acts on the set phase 1 already stripped
\* locks from, instead of re-reading get_expired_clients(). A client that
\* renews mid-sweep still loses its record, so the loss is LOUD: its next
\* COMPOUND gets BADSESSION and it does a full recovery. Costs nothing at
\* runtime — it is one fewer call — and needs no new server state.
\*
\* Same posture as FlintClientIdentityLease.cfg in every other respect, so
\* the two runs differ in ONE constant and the difference is attributable.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 1
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = TRUE
  AtomicSweep = TRUE
  NotifyRevoked = FALSE
  MaxMounts = 1
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
  Inv_LockLossIsDetectable
CHECK_DEADLOCK FALSE
