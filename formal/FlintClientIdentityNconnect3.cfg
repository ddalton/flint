\* THE QUESTION THE UNIT TESTS COULD NOT ANSWER. The fixes are verified
\* by a test that mounts with two connections. Three connections means
\* case 5 followed by TWO case-4 replacements, so the obligation has to
\* survive being carried twice. It does.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 3
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = FALSE
  AtomicSweep = TRUE
  NotifyRevoked = FALSE
  MaxMounts = 2
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
  Inv_IndexCoversLiveOwners
  Inv_OneConfirmedPerOwner
  Inv_ObligationHonoured
CHECK_DEADLOCK FALSE
