\* FlintCatchupT, bound C (three replicas, two failures, one write, THREE epochs, one retained).
\* Code-faithful (rev 8): the catch-up does not wait for a cut in flight.
\* The capture, no crash, no zombie, shipped, bound C.  Expect violated: the failure-window loss, shipped's bug.
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 3
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "shipped"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = TRUE
  Crash = FALSE
  ZombieMoves = FALSE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = FALSE
  AssemblyMark = FALSE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = FALSE
  CutStampsAll = TRUE
INVARIANT Inv_Catchup
CHECK_DEADLOCK FALSE
