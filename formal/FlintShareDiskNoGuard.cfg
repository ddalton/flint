\* Strict run: the shipped protocol — drain-before-delete, verify-before-
\* drain, the oscillation guard and the adopted-claim guard all ON, and
\* reprovision NOT abortable by a wake.  Auto-expand is ON and wants more
\* than the lattice's floor, so the shrink-versus-expand interaction is
\* live in every behaviour rather than needing its own run.
SPECIFICATION Spec
CONSTANTS
  Sizes = {1, 2, 4}
  ProjectWants = 2
  MaxRebuilds = 2
  MaxEdits = 2
  AutoExpand = TRUE
  Adopted = FALSE
  DrainFirst = TRUE
  VerifyFirst = TRUE
  GuardOscillation = FALSE
  AdoptGuard = TRUE
  AbortOnWake = FALSE
INVARIANTS
  Inv_ShrinkHonoured
CHECK_DEADLOCK FALSE
