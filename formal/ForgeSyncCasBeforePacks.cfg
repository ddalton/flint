\* Mutation: PacksBeforeCas=FALSE — the snapshot names the packs BEFORE
\* they are uploaded (design §4's ordering reversed). TLC must FIND
\* Inv_LandedPackComplete violated: a crash between the CAS and the
\* upload leaves the bucket naming a pack it does not hold.
SPECIFICATION Spec
CONSTANTS
  Syncers = {s1, s2}
  Pushes = {p1, p2}
  NoSyncer = NoSyncer
  Misses = 2
  MaxCrashes = 1
  MaxRenews = 3
  MaxClaims = 3
  IdxGate = TRUE
  TickOnHash = TRUE
  RotateOnTakeover = TRUE
  AckAfterCas = TRUE
  PacksBeforeCas = FALSE
  SweepAtClaim = TRUE
  PollsNoFasterThanHeartbeat = TRUE
INVARIANTS
  Inv_LandedPackComplete
VIEW
  View
SYMMETRY
  Sym
CHECK_DEADLOCK FALSE
