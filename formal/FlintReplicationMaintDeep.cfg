\* Strict maintenance at content depth: 2 legs, deeper write/failure
\* budget, so torn-write divergence, Scrub demotion, zombie heads and
\* roller death are all REACHABLE interleaved with a roll campaign —
\* the 3-leg breadth run (FlintReplicationMaint.cfg) covers arity, this
\* one covers content hazards crossing maintenance.  Every invariant
\* and every liveness property must HOLD.
\* scripts/check-tla.sh runs this and requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 2
  MaxCrashes = 3
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
INVARIANTS
  Inv
  Inv_PlannedRollNeverCausesOutage
  Inv_MaintFenceHolds
PROPERTIES
  EventuallyServingAgain
  AdmissionNotStarved
  EventuallyWritable
  MaintenanceEventuallyLifts
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
