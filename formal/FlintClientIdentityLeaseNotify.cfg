\* FIX B, AND THE HAZARD IT CARRIES: sr_status_flags IS ADDRESSED TO A
\* CLIENTID, AND A COLLISION MEANS TWO CLUSTERS SHARE ONE.
\*
\* Keep the racy two-read sweep, but have the server remember what it
\* revoked and report it in the next SEQUENCE as
\* SEQ4_STATUS_EXPIRED_SOME_STATE_REVOKED (RFC 8881 §18.46.3) — the field
\* `dispatcher.rs` hardcodes to 0 with the comment "For basic
\* implementation, 0 is sufficient".
\*
\* TLC finds Inv_LockLossIsDetectable anyway, and the counterexample is
\* the point: a1 and a2 are in different clusters presenting one
\* co_ownerid, so Inv_OneConfirmedPerOwner correctly collapses them onto
\* ONE clientid. a1's lease lapses, a1's locks are stripped, and then
\* a2's SEQUENCE arrives first and consumes the flag. a1 — the cluster
\* that actually lost the range — is never told. The notification went to
\* the wrong cluster because at the protocol level there is only one
\* client to send it to.
\*
\* NOT A SHIPPED DEFECT: flint sets no flags at all today. This is a
\* design result about the fix, and there are exactly two ways out.
\* (1) RFC 8881 makes these flags STICKY — set until the client resolves
\* the condition — so both sessions would see it; the model deliberately
\* takes the consume-on-report reading because that is the natural
\* implementation and the one that goes wrong. (2) Give every client a
\* unique nfs4_unique_id, which the agent-fleet guide already mandates
\* for other reasons: see FlintClientIdentityLeaseNotifyUnique.cfg, which
\* is the same posture with Collide = FALSE and HOLDS.
\*
\* Either way, fix A (LeaseAtomic) needs none of this reasoning.
\*
\* Inv_NoOrphanLocks is not listed: it fails here too, by the shorter
\* path LeaseOrphan.cfg exists for, and would mask this.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 1
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = TRUE
  AtomicSweep = FALSE
  NotifyRevoked = TRUE
  MaxMounts = 1
  MaxLocks = 2
INVARIANTS
  Inv_LockLossIsDetectable
CHECK_DEADLOCK FALSE
