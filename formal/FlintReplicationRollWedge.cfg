\* F61 MUTATION — the shipped eligibility predicate.  MaintProcessedGate =
\* FALSE gates RollStart on a MARK (l \in suppress) instead of on the drain
\* PASS having run (l \in processed).  LocalLegs = {l2} gives l2 the shape
\* maint_roll.rs skips: the serving raid lives on l2's own node (consumer ==
\* node, the local half), so its drain pass legitimately marks NOTHING.
\* TLC must FIND the livelock: l2 is processed and can never be rolled, so
\* the campaign never converges.  Found LIVE first (runao 2026-07-30, drill
\* 3.14) — this run is the rediscoverability tooth for it.
\* MaxCrashes = 0: RollStart needs legUp = "up", so a real failure stalls a
\* roll legitimately and would mask the bug.
\* Strict maintenance depth run — the tranche's LIVENESS home: 2 legs,
\* deep failure budget (3 events), so torn-write divergence, Scrub
\* demotion, zombie heads, roller death and the dead-leg corner (drain a
\* leg, then lose its node AND every rebuild source — the trace that
\* forced the death-escaped lifts property) are all REACHABLE
\* interleaved with a roll campaign.  Every invariant and every liveness
\* property must HOLD — including MaintenanceEventuallyLifts and
\* AdmissionNotStarved across maintenance interleavings.  MaxWrites = 1,
\* not 2: one torn write already manufactures the divergent payload every
\* content hazard needs, and the write counter is the state-space
\* multiplier that put this run at 4min; the 3-leg breadth run
\* (FlintReplicationMaint.cfg) carries invariant arity instead.
\* scripts/check-tla.sh runs this and requires success.
