\* Mutation: CycleCheck=FALSE with the marker re-consult ON — the code
\* AS SHIPPED BEFORE this module ran.  TLC must FIND the find that
\* forced the fix: a reader's consult passes pre-evict, a COMPLETE
\* evict + hydration cycle lands inside its read window (the pread
\* captures stub/partial bytes mid-cycle), the completed hydration
\* clears the marker, and the bug-3 re-consult — blind to the cycle —
\* serves the short bytes as content.  The fix is the marker cycle
\* counter sampled before the consult and re-verified at serve.
SPECIFICATION Spec
CONSTANTS
  EvictOrder = "safe"
  PostReadCheck = TRUE
  CycleCheck = FALSE
  CycleOnInsert = TRUE
  CycleOnClear = FALSE
  HydFlagOn = TRUE
  MaxEvicts = 2
  MaxHyds = 2
  MaxHydFails = 1
  MaxReads = 3
  MaxCrashes = 2
INVARIANTS
  Inv_NoStubServed
CHECK_DEADLOCK FALSE
