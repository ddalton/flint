\* FlintCatchupT, bound D (three replicas, two failures, one write, two epochs, one retained).
\* Code-faithful (rev 9): no wait for a cut in flight; each assembly marks the in-sync legs it excludes stale
\* in the same write (driver.rs:3099, when that best-effort write lands); no fence mark.
\* A zombie consumer, gated marks, capture, the FlintLocalLeg guard, trust: Inv_AdmitNoLoss.  Must hold.
\* Control: ZombieTrustGuardANLCode (no assembly mark: two moves in one monitor window admit the junk).
\* The rule: spdk-csi-driver/docs/incremental-replica-rebuild.md rev 6, §5 "Source trust: the per-epoch rule".
SPECIFICATION Spec
CONSTANTS
  Reps = {1, 2, 3}
  Blocks = {b1}
  MaxVer = 1
  MaxEpoch = 2
  MaxFails = 2
  Retain = 1
  Backoff = TRUE
  BaseInclusive = TRUE
  PinRetention = TRUE
  CoverageWalk = TRUE
  Policy = "trust"
  ZombieWhere = "colocated"
  StageOracle = FALSE
  Capture = TRUE
  Crash = FALSE
  ZombieMoves = TRUE
  MarkGate = TRUE
  RaidFailsAtDrop = TRUE
  ReadFails = FALSE
  LocalLegGuard = TRUE
  FenceMark = FALSE
  CatchupWaitsCut = FALSE
  AssemblyMark = TRUE
  StageDefer = FALSE
  WriteQuorum = 1
  AssemblyQuorum = 1
  AckAfterMark = FALSE
  CutStampsAll = TRUE
INVARIANT TypeOK
INVARIANT Inv_AdmitNoLoss
CHECK_DEADLOCK FALSE
