\* THE COLLAPSE-DETECTOR PATH ALONE, UNREACHABLE — a counterfactual, NOT the
\* shipped world. Read the scope line before citing this run.
\*
\* SCOPE (corrected 2026-07-30): green here means "with the collapse-event
\* detector as the ONLY trigger, no interleaving recovers the volume". It does
\* NOT mean the shipped code cannot recover an uncontrolled tgt death. The
\* shipped layer-2 repair (detect_lost_data_paths -> repair_data_path) needs no
\* seeded state — its gate is strikes >= threshold on live observations — and
\* FlintReplicationUncontrolledStrike.cfg shows it recovering with A1 off, A2
\* off and zero bounces. StrikeRepairArm is FALSE here to isolate the
\* detector-seed question, which is the only thing this run answers.
\*
\* I cited this run's green as "A1 is the only thing standing between a routine
\* helm upgrade and a permanent outage." That was an overstatement produced by
\* a model that had only one of the two triggers.
\*
\* THE DESTROYER IS NOT THE ROLLER.  UncontrolledTgtDeath arms TgtDie(l): a
\* csi-node tgt dies with node and consumer in place, gated on no maintenance
\* state whatsoever — no `rolling`, no marks, no lease, no barrier, no
\* refusal.  Class-3 destruction previously existed ONLY inside RollStart, so
\* every F62/F63 run asked "can flint's roller cause this?" about a feature
\* that is OFF BY DEFAULT and which, in that default configuration, refuses to
\* act at all (plan_roll returns Blocked when !on_delete, maint_roll.rs:248).
\*
\* The operative question is whether a routine `helm upgrade` can, and the
\* chart answers it: updateStrategy: OnDelete is emitted only inside the
\* maintenance.drainRoll.enabled conditional (node.yaml:13-24), and that flag
\* defaults FALSE — so the shipped DaemonSet takes k8s's RollingUpdate and
\* rolls every node pod on a template change.  OOM kills, kubelet restarts,
\* evictions, node-image upgrades and GitOps syncs land here too.
\*
\* MaintEnabled is still TRUE only so the roll theorems stay armed; nothing in
\* these runs needs the roller, and TgtDie ignores it.
\*
\* Neither repair is armed: DpSeenRehydrate = FALSE (A1's detector is blind,
\* its HashSet died with the process) and RaidReconcileArm = FALSE (no A2).
\* The whole bounce chain is armed and willing, and it does not matter,
\* because nothing can report a collapse that the reporting process cannot
\* remember.
\*
\* Stated as reachability, per the Inv_NoStaleServe idiom: the invariant
\* HOLDING is the bug.  No interleaving whatsoever reaches a state where a
\* composition exists again after a class-3 death.
\*
\* EXPECTED: green — and the green is the indictment.  scripts/check-tla.sh
\* runs this and requires success, with the catalogue entry explaining that
\* success here means "permanently down".
