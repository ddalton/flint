\* THE SHIPPED SWEEP, consequence 1 of 2: AN ORPHANED LOCK.
\*
\* `courtesy_release_expired` strips the expired clients' locks FIRST and
\* only then calls `cleanup_expired()` to retire their records. A lock
\* granted in that window belongs to a client that is about to be
\* destroyed — and once it is, the lock has no client, no lease, and no
\* reaper: `remove_client_locks` is only ever reached by iterating EXPIRED
\* LEASES, and this client no longer has one. The range is denied to
\* everyone, forever, and survives restart because locks are persisted.
\*
\* This is the CascadeLocks defect's own failure mode reached by a second
\* route, which is the argument for fixing the sweep rather than the site.
\*
\* TLC must FIND Inv_NoOrphanLocks.
SPECIFICATION Spec
CONSTANTS
  Agents = {a1, a2}
  Collide = TRUE
  NConnect = 1
  CarryObligation = TRUE
  CondIndexRemove = TRUE
  CascadeLocks = TRUE
  ModelLease = TRUE
  AtomicSweep = FALSE
  NotifyRevoked = FALSE
  MaxMounts = 1
  MaxLocks = 2
INVARIANTS
  Inv_NoOrphanLocks
  Inv_LocksReapable
CHECK_DEADLOCK FALSE
