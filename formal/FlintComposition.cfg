\* THE SHIPPED-DESIGN STRICT WORLD for the composition machine: every arm
\* on, including the DeadmanCertain synchrony axiom (bounded skew — the
\* composer's self-suspend precedes anything the MDS does with its lapse
\* observation).  All four theorems must HOLD across one full failover
\* with a fallible dead-vs-partitioned verdict, a zombie composer whose
\* clients keep writing, a fence executed against whichever tgt the
\* record currently names, and a free gated on the epoch-scoped,
\* execution-keyed delivered mark.  Pair every green here with the three
\* probe runs — a strict green whose failover, zombie write, or
\* post-failover free never fires proves nothing.
SPECIFICATION Spec
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 2
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = FALSE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 0
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
INVARIANTS
  TypeOK
  Inv_NoDivergentServing
  Inv_NoDoomedAck
  Inv_NoStaleExtentWrite
  Inv_NoStaleServe
CHECK_DEADLOCK FALSE
