\* THE SHIPPED TWO-SQLITE WORLD AS A LASSO — the 9fcdd05 finding
\* (the_leg_host_cannot_elect_itself...) machine-checked, the NoActor
\* pattern: specify a missing thing as a fairness obligation you
\* withhold.  SpecLive carries every obligation the implementation has
\* EXCEPT the heal of a witness cut, because in the shipped code there is
\* no witness to heal — a survivor whose shard cannot read the seat, the
\* marks or the lease is not in an outage, it is in the ARCHITECTURE.
\* The composer dies; the survivor is healthy, in-sync, client-reachable
\* — and PromoteCAS's witness guard is unsatisfiable forever, so the
\* volume parks with every remaining process healthy.  TLC must FIND the
\* temporal violation of PromotionCompletes.  When the witness code
\* lands, this run is the acceptance test's negative control: the same
\* lasso with the heal obligation restored is LiveWitness, and it is
\* green.
SPECIFICATION SpecLive
CONSTANTS
  Tgts = {tA, tB}
  Clients = {c1, c2}
  MaxEpoch = 2
  MaxCrashes = 1
  LegAdmissionGate = TRUE
  DeadmanGate = TRUE
  DeadmanCertain = TRUE
  RecordAssemblyOnly = TRUE
  ElectInSync = TRUE
  DegradeBarrier = TRUE
  FreeWaitsActive = TRUE
  FenceReplayOnAssemble = TRUE
  DeliveredEpochKeyed = FALSE
  RejoinEnabled = TRUE
  RecordRejoinOnly = TRUE
  UncleanResync = TRUE
  AncestryGuard = TRUE
  PreemptFollowsRecord = TRUE
  MaxCuts = 1
  MarkAtWitness = TRUE
  FenceAtWitness = TRUE
PROPERTIES
  PromotionCompletes
CHECK_DEADLOCK FALSE
