\* Strict run: the barrier the IMPLEMENTATION actually has
\* (BarrierRaidAware = FALSE) — the roller's barrier reads the sync
\* RECORD (every replica insync), not ground-truth raid membership,
\* because the record is what a controller can read in one list. The
\* record lags the raid by up to one monitor tick, so a drain can race
\* an undetected failure: TLC explores drains fired while a member is
\* already blackholed/deconfigured but not yet stale-marked. Every
\* invariant must still HOLD — the shortcut costs availability in that
\* race (an honest Defer at r=2, escaped by the liveness disjuncts),
\* NEVER safety. This is what licenses the implementation's record-only
\* barrier. scripts/check-tla.sh runs this and requires success.
SPECIFICATION Spec
CONSTANTS
  Legs = {l1, l2}
  MaxWrites = 1
  MaxCrashes = 2
  GateStrict = TRUE
  RejoinGuard = TRUE
  FenceZombie = TRUE
  ClaimArb = TRUE
  EvidenceStrict = TRUE
  MaintEnabled = TRUE
  MaintFence = TRUE
  MaintBarrier = TRUE
  MaintLease = TRUE
  BarrierRaidAware = FALSE
  ExpandEnabled = FALSE
  SizeGuard = TRUE
  SizeHeal = TRUE
  GateDeadline = FALSE
  StaleFloor = FALSE
  MonitorCurrent = TRUE
  DeviceFloor = TRUE
  SuppressScoped = FALSE
  DrainBelt = TRUE
INVARIANTS
  Inv
  Inv_PlannedRollNeverCausesOutage
  Inv_MaintFenceHolds
  Inv_PlannedRollBoundedImpact
PROPERTIES
  EventuallyServingAgain
  AdmissionNotStarved
  EventuallyWritable
  MaintenanceEventuallyLifts
CHECK_DEADLOCK FALSE
CONSTRAINT
  GenBound
