\* THE POINTLESS-REBOUNCE CANARY — the safety belt does NOT close the
\* churn loop.  With BouncePreflight = TRUE (every individual bounce
\* provably safe) a healthy volume still eats an unbounded series of
\* bounces: the data-path arm (cutover.rs:312-334) bypasses every standby
\* and lag gate by design, and its verification predicate is a flag ONLY
\* the flagging node's agent may clear (node_agent.rs:5241-5247) — the
\* flagger dies, the flag is permanent, and the ineffective verdict
\* re-arms eligibility every cooldown, forever.  Rediscoverability for a
\* CONFIRMED bug class whose fix — an attempt counter with backoff, plus
\* an ownership-staleness sweep for orphaned flags — is owed in CODE, not
\* in the model.  scripts/check-tla.sh requires the
\* Inv_NoPointlessRebounce counterexample.
