# flint-forge: the per-repo syncer (flint-forge-syncer) that owns every
# write to S3 and to `objects/pack/` for one bare git repository.
# Design of record: docs/plans/flint-forge-design.md.
#
# Its OWN crate, for the reason lean's is: `cargo test` here builds
# flint-store's memory double, this crate, and a small dep tree — never
# the hub's binaries or the aws/kube/nfs trees. The binary needs the
# real S3 backend, so it sits behind the `s3` feature:
#
#   cargo test                          # the battery (no AWS SDK)
#   cargo build --release --features s3 # the shippable binary
[package]
name = "flint-forge"
version = "0.1.0"
edition = "2021"

[features]
default = []
s3 = ["flint-store/s3"]
# The git container's HTTP front (`flint-forge-gitcgi`): hyper and its
# body/stream helpers, behind a feature so the battery never builds them.
gitcgi = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:tokio-util", "dep:futures-util"]

[[bin]]
name = "flint-forge-syncer"
path = "src/bin/flint_forge_syncer.rs"
required-features = ["s3"]

# The hook needs no object store: it is a relay between git and the
# syncer's socket, and it is spawned once per push, so it must build
# and start without the AWS SDK anywhere near it.
[[bin]]
name = "flint-forge-hook"
path = "src/bin/flint_forge_hook.rs"

# The git container's HTTP surface: `git http-backend` as a CGI child
# per request, streamed both ways, plus the LFS relay. Replaces nginx +
# fcgiwrap (simplification note A3).
[[bin]]
name = "flint-forge-gitcgi"
path = "src/bin/flint_forge_gitcgi.rs"
required-features = ["gitcgi"]

# The agent-side credential helper: reads the pod's projected token and
# prints it as the basic password. No store, no dependencies, and it
# ships in the AGENT image rather than the server's.
[[bin]]
name = "flint-forge-credential"
path = "src/bin/flint_forge_credential.rs"

[dependencies]
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
flint-store = { path = "../../crates/flint-store" }
bytes = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = "3.0"
tokio = { version = "1.0", features = ["full", "test-util"] }
