{{- /*
Flint-lite — the standalone hub (docs/flint-lite.md).

Four objects and nothing else: ConfigMap, RWO PVC, Service, and a
single-replica Deployment running flint-pnfs-mds in `mode: standalone`
(layouts off; EXCHANGE_ID advertises a plain NFS server, so clients
never ask; every byte serves through the MDS lane out of /data/exports
on the PVC).

Deployment + strategy Recreate + RWO PVC, not a StatefulSet: the
sqlite state.db is single-writer and the RWO attach is the fence — two
hub pods must never run concurrently.

State backend is sqlite ON THE PVC: the persistent server id keeps
client filehandles valid across pod restarts (no BADHANDLE storm), and
locks/sessions reload on the way up.

The S3 tier (tier.enabled) adds NO objects — it renders into the
ConfigMap's tier: section plus credentials env on the Deployment (the
Secret is operator-supplied, never created here) and a startupProbe
sized for the pre-listener epoch claim / DR import.
*/}}
{{- if and .Values.tier.enabled (not .Values.tier.bucket) }}
{{- fail "tier.enabled needs tier.bucket — the hub has no bucket to publish to (the server refuses the same at boot); set tier.bucket or disable the tier" }}
{{- end }}
{{- if .Values.tier.enabled }}
{{- /* The server's YAML parser IGNORES unknown keys, so a typo'd knob
would silently take the default — and the knobs are the economics
gate's REQUIREMENTS. Refuse at render instead. Kept in sync with
TierConfig (spdk-csi-driver/src/pnfs/config.rs) by the suite test
chart_tier_knob_list_matches_tier_config. */}}
{{- $known := list "flushFloorSecs" "quiesceSecs" "tickSecs" "wholePutMaxBytes" "partFloorBytes" "epochHeartbeatSecs" "epochLeaseMisses" "reserveBytes" "watermarkPct" "ballastBytes" "hydrateHoldSecs" "hydrateConcurrency" "hydrateFetchParallel" "hydrateWarmAfterImport" "hydrateWarmConcurrency" }}
{{- range $k, $_ := .Values.tier.settings }}
{{- if not (has $k $known) }}
{{- fail (printf "tier.settings.%s is not a TierConfig knob (the server would silently ignore it — see spdk-csi-driver/src/pnfs/config.rs). Valid keys: %s. Identity fields (bucket, keyPrefix, endpoint, importOnStart) have first-class values under tier" $k (join ", " $known)) }}
{{- end }}
{{- end }}
{{- end }}
{{- $img := .Values.image.ref }}
{{- if not $img }}
{{- $tag := .Values.image.tag | default .Chart.AppVersion }}
{{- $img = printf "%s/%s:%s" .Values.image.repository .Values.image.name $tag }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flint-lite-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
data:
  # The body lives in the flint-lite.mdsYaml template so the Deployment
  # can hash the SAME string into checksum/config — see the note there.
  mds.yaml: |
    {{- include "flint-lite.mdsYaml" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flint-lite-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  # Set = a chosen class; ABSENT (the default) = the cluster's default
  # StorageClass — any CSI driver's RWO volume backs the hub.
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: flint-lite
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: flint-lite
  ports:
    - name: nfs
      port: {{ .Values.service.port }}
      targetPort: 2049
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flint-lite
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flint-lite
  template:
    metadata:
      annotations:
        # The roll trigger. The hub reads --config ONCE at boot: without
        # this annotation a `helm upgrade` that changes tier.settings
        # (or logLevel, or the prefix) writes a new ConfigMap and the
        # running pod keeps its old values forever, while `kubectl get
        # cm` shows the new ones. Changing this rolls the Deployment
        # (Recreate — a brief outage; the same-PVC epoch re-claim is
        # instant).
        checksum/config: {{ include "flint-lite.mdsYaml" . | sha256sum }}
      labels:
        app: flint-lite
        flint.io/role: lite
        {{- include "flint-lite.selectorLabels" . | nindent 8 }}
    spec:
      # SIGTERM starts a real shutdown: drain in-flight replies, flush
      # everything dirty, write the DR manifest, then mark the epoch
      # released so the next hub claims without waiting out a lease
      # nobody holds. The default 30s is not enough to publish a large
      # dirty set — a hub killed at the deadline is still CORRECT (it
      # leaves the epoch held, so no successor serves a bucket that is
      # behind the PVC) but it is slow to wake and its last writes stay
      # unpublished until it comes back.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flint-pnfs-mds"]
          args: ["--config", "/etc/flint/mds.yaml"]
          {{- if .Values.securityContext.enabled }}
          # Audit finding 7. The hub is the one workload in this chart
          # that touches every tenant's bytes, and it was the only one
          # with no securityContext at all — while the operator and the
          # gateway both set runAsNonRoot/runAsUser 65532. It ran as a
          # DEFAULT-CAPABILITY root container.
          #
          # It cannot simply be made non-root. An NFS server serving
          # many uids must chown to arbitrary owners (SETATTR owner,
          # `fileops.rs` lchown/chown), read and write files it does not
          # own, and preserve setuid/setgid bits. That is CHOWN,
          # DAC_OVERRIDE, FOWNER and FSETID — with anything less it
          # serves wrong answers rather than failing loudly, which is
          # the worse outcome.
          #
          # So the posture is: still uid 0, but EXPLICITLY, with the
          # ~14-capability default set reduced to those four, privilege
          # escalation off, and the runtime seccomp profile on. That
          # drops NET_RAW, MKNOD, SYS_CHROOT, SETFCAP, SETPCAP,
          # AUDIT_WRITE and the rest, none of which this server uses.
          #
          # `runAsNonRoot: false` is stated rather than omitted so a
          # cluster policy that rejects it fails at admission, where an
          # operator can read the reason — instead of at the first
          # cross-uid chown, which surfaces as a client-visible EPERM
          # with no obvious cause.
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
              add:
                {{- toYaml .Values.securityContext.capabilities | nindent 16 }}
            seccompProfile:
              type: {{ .Values.securityContext.seccompProfile }}
          {{- end }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | default "info" | quote }}
            # Published on /status as `podName`. With `serverId` it is
            # how a caller tells a plain restart (podName changed, the
            # state survived) from a wake onto a fresh PVC (serverId
            # changed, every client stateid is stale).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if and .Values.tier.enabled .Values.tier.region }}
            - name: AWS_REGION
              value: {{ .Values.tier.region | quote }}
            {{- end }}
          {{- if and .Values.tier.enabled .Values.tier.credentialsSecret }}
          # S3 credentials ride an operator-supplied Secret verbatim
          # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY [+ AWS_SESSION_TOKEN]).
          # Absent = the SDK's ambient chain (IRSA / instance role).
          envFrom:
            - secretRef:
                name: {{ .Values.tier.credentialsSecret }}
          {{- end }}
          ports:
            - containerPort: 2049
              name: nfs
            {{- if .Values.monitoring.enabled }}
            # Declared for legibility only. This port is deliberately
            # NOT on the Service above: that Service carries NFS and may
            # be a LoadBalancer, and the file API can rewrite every file
            # in the share. The lifecycle controller reaches /status by
            # POD IP.
            - containerPort: {{ .Values.monitoring.port }}
              name: http
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- if .Values.tier.enabled }}
          # Tier startup runs BEFORE the socket opens: the epoch claim
          # may wait out a dead prior holder's lease (~60s default) and
          # a DR-restore import walks the whole bucket. Liveness and
          # readiness only begin once this succeeds — without it the
          # liveness probe would kill a takeover or import at ~55s.
          startupProbe:
            tcpSocket:
              port: 2049
            periodSeconds: 10
            failureThreshold: {{ .Values.tier.startupFailureThreshold }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/flint
            - name: data
              mountPath: /data
            {{- if and .Values.monitoring.enabled .Values.monitoring.fileApi.enabled .Values.monitoring.fileApi.tokenSecret }}
            - name: api-token
              mountPath: /etc/flint/api-token
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: flint-lite-config
        - name: data
          persistentVolumeClaim:
            claimName: flint-lite-data
        {{- if and .Values.monitoring.enabled .Values.monitoring.fileApi.enabled .Values.monitoring.fileApi.tokenSecret }}
        - name: api-token
          secret:
            secretName: {{ .Values.monitoring.fileApi.tokenSecret }}
        {{- end }}
