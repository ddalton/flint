{{- /*
Flint-lite — the standalone hub (docs/flint-lite.md).

Four objects and nothing else: ConfigMap, RWO PVC, Service, and a
single-replica Deployment running flint-pnfs-mds in `mode: standalone`
(layouts off; EXCHANGE_ID advertises a plain NFS server, so clients
never ask; every byte serves through the MDS lane out of /data/exports
on the PVC).

Deployment + strategy Recreate + RWO PVC, not a StatefulSet: the
sqlite state.db is single-writer and the RWO attach is the fence — two
hub pods must never run concurrently.

State backend is sqlite ON THE PVC: the persistent server id keeps
client filehandles valid across pod restarts (no BADHANDLE storm), and
locks/sessions reload on the way up.

The S3 tier (tier.enabled) adds NO objects — it renders into the
ConfigMap's tier: section plus credentials env on the Deployment (the
Secret is operator-supplied, never created here) and a startupProbe
sized for the pre-listener epoch claim / DR import.
*/}}
{{- if and .Values.tier.enabled (not .Values.tier.bucket) }}
{{- fail "tier.enabled needs tier.bucket — the hub has no bucket to publish to (the server refuses the same at boot); set tier.bucket or disable the tier" }}
{{- end }}
{{- if .Values.tier.enabled }}
{{- /* The server's YAML parser IGNORES unknown keys, so a typo'd knob
would silently take the default — and the knobs are the economics
gate's REQUIREMENTS. Refuse at render instead. Kept in sync with
TierConfig (spdk-csi-driver/src/pnfs/config.rs) by the suite test
chart_tier_knob_list_matches_tier_config. */}}
{{- $known := list "flushFloorSecs" "quiesceSecs" "tickSecs" "wholePutMaxBytes" "partFloorBytes" "epochHeartbeatSecs" "epochLeaseMisses" "reserveBytes" "watermarkPct" "ballastBytes" "hydrateHoldSecs" "hydrateConcurrency" "hydrateFetchParallel" }}
{{- range $k, $_ := .Values.tier.settings }}
{{- if not (has $k $known) }}
{{- fail (printf "tier.settings.%s is not a TierConfig knob (the server would silently ignore it — see spdk-csi-driver/src/pnfs/config.rs). Valid keys: %s. Identity fields (bucket, keyPrefix, endpoint, importOnStart) have first-class values under tier" $k (join ", " $known)) }}
{{- end }}
{{- end }}
{{- end }}
{{- $img := .Values.image.ref }}
{{- if not $img }}
{{- $tag := .Values.image.tag | default .Chart.AppVersion }}
{{- $img = printf "%s/%s:%s" .Values.image.repository .Values.image.name $tag }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flint-lite-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
data:
  mds.yaml: |
    apiVersion: flint.io/v1alpha1
    kind: PnfsConfig
    mode: standalone
    mds:
      bind:
        address: "0.0.0.0"
        port: 2049
      # Inert in standalone (no layouts are ever granted) but part of
      # the config schema.
      layout:
        type: file
        stripeSize: 8388608
        policy: stripe
      dataServers: []
      state:
        backend: sqlite
        config:
          path: /data/state/state.db
      {{- if .Values.tier.enabled }}
      # S3 cold tier (a field of the mds: section — the parser IGNORES
      # unknown top-level keys, so misplacing this renders a silently
      # tierless hub; the kind tier e2e's leg 1 pins the placement).
      # The volume epoch is claimed BEFORE the listener binds (an
      # unfenced hub never serves); ".flint/" under the prefix is
      # reserved for tier control objects. Unset knobs take the server
      # defaults — the economics gate's assumptions.
      tier:
        enabled: true
        bucket: {{ .Values.tier.bucket | quote }}
        {{- with .Values.tier.keyPrefix }}
        keyPrefix: {{ . | quote }}
        {{- end }}
        {{- with .Values.tier.endpoint }}
        endpoint: {{ . | quote }}
        {{- end }}
        importOnStart: {{ .Values.tier.importOnStart }}
        {{- with .Values.tier.settings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    exports:
      - path: /data/exports
        fsid: 1
        options: [rw, sync, no_subtree_check]
        access:
          - network: 0.0.0.0/0
            permissions: rw
    logging:
      level: {{ .Values.logLevel | default "info" }}
      format: text
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flint-lite-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  # Set = a chosen class; ABSENT (the default) = the cluster's default
  # StorageClass — any CSI driver's RWO volume backs the hub.
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: flint-lite
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: flint-lite
  ports:
    - name: nfs
      port: {{ .Values.service.port }}
      targetPort: 2049
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flint-lite
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
    app.kubernetes.io/component: lite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flint-lite
  template:
    metadata:
      labels:
        app: flint-lite
        flint.io/role: lite
        {{- include "flint-lite.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flint-pnfs-mds"]
          args: ["--config", "/etc/flint/mds.yaml"]
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | default "info" | quote }}
            {{- if and .Values.tier.enabled .Values.tier.region }}
            - name: AWS_REGION
              value: {{ .Values.tier.region | quote }}
            {{- end }}
          {{- if and .Values.tier.enabled .Values.tier.credentialsSecret }}
          # S3 credentials ride an operator-supplied Secret verbatim
          # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY [+ AWS_SESSION_TOKEN]).
          # Absent = the SDK's ambient chain (IRSA / instance role).
          envFrom:
            - secretRef:
                name: {{ .Values.tier.credentialsSecret }}
          {{- end }}
          ports:
            - containerPort: 2049
              name: nfs
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- if .Values.tier.enabled }}
          # Tier startup runs BEFORE the socket opens: the epoch claim
          # may wait out a dead prior holder's lease (~60s default) and
          # a DR-restore import walks the whole bucket. Liveness and
          # readiness only begin once this succeeds — without it the
          # liveness probe would kill a takeover or import at ~55s.
          startupProbe:
            tcpSocket:
              port: 2049
            periodSeconds: 10
            failureThreshold: {{ .Values.tier.startupFailureThreshold }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/flint
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: flint-lite-config
        - name: data
          persistentVolumeClaim:
            claimName: flint-lite-data
