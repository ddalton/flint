{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress for the hub pod, with explicit holes.
#
# Selecting the pod at all is the security control: a NetworkPolicy with
# policyTypes [Ingress] denies EVERY inbound port that no rule below
# admits. That is what closes 50051 — the MDS gRPC control plane, which
# binds 0.0.0.0, carries DeleteVolume, and is unauthenticated unless
# FLINT_PNFS_CONTROL_TOKEN is set. A standalone hub no longer starts it
# at all (it has no data servers to register and no CSI driver in front
# of it), but the policy is what makes that true for an OLD image too.
#
# Requires a CNI that enforces NetworkPolicy — Cilium, Calico, and
# friends do; a plain kubenet cluster silently ignores every rule here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flint-lite.name" . }}-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flint-lite.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    # NFS. Kernel clients connect FROM THE NODE IP when kubelet does the
    # mount (an `nfs:` PV, or nfs-subdir-external-provisioner), so a pod
    # selector cannot express that client set — hence the CIDR list.
    # In-pod mounts (a privileged sidecar mounting for itself) come from
    # the pod IP and want the selector list instead. Cross-cluster
    # consumers are always CIDRs.
    - from:
        {{- if not (or .Values.networkPolicy.nfsClientCIDRs .Values.networkPolicy.nfsClientSelectors) }}
        # Both lists empty: this admits NOTHING on 2049, which will
        # break every mount. Deliberate — a policy that silently falls
        # open is worse than no policy, because it reads as protection.
        # Set networkPolicy.nfsClientCIDRs to your node CIDRs.
        []
        {{- end }}
        {{- range .Values.networkPolicy.nfsClientCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.nfsClientSelectors }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- if .Values.monitoring.enabled }}
    # /status, /health and the file API. This surface can rewrite any
    # file in the project, so it is never on the consumer-facing
    # Service and never open to the NFS client set. Empty ⇒ nothing
    # reaches it, which is the right default: with the file API off,
    # only a monitoring scraper wants this port at all.
    - from:
        {{- if not (or .Values.networkPolicy.apiClientCIDRs .Values.networkPolicy.apiClientSelectors) }}
        []
        {{- end }}
        {{- range .Values.networkPolicy.apiClientCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.apiClientSelectors }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.monitoring.port }}
{{- end }}
{{- end }}
