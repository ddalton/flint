{{- if .Values.networkPolicy.enabled }}
# Default-deny ingress for the hub pod, with explicit holes.
#
# Selecting the pod at all is the security control: a NetworkPolicy with
# policyTypes [Ingress] denies EVERY inbound port that no rule below
# admits. That is what closes 50051 — the MDS gRPC control plane, which
# binds 0.0.0.0, carries DeleteVolume, and is unauthenticated unless
# FLINT_PNFS_CONTROL_TOKEN is set. A standalone hub no longer starts it
# at all, but the policy is what makes that true for an OLD image too.
#
# AN INGRESS RULE WITH NO PEERS ADMITS EVERYONE. Per the NetworkPolicy
# API, `from` empty or missing matches ALL sources — so a rule rendered
# with an empty peer list is not a closed door, it is an open one that
# reads like a closed one. Each rule below is therefore omitted
# ENTIRELY unless it has at least one peer, and a policy with no rules
# at all denies everything, which is the honest failure direction.
#
# Requires a CNI that enforces NetworkPolicy — Cilium, Calico, and
# friends do; a plain kubenet cluster silently ignores every rule here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flint-lite.name" . }}-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-lite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flint-lite.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
{{- if or .Values.networkPolicy.nfsClientCIDRs .Values.networkPolicy.nfsClientSelectors }}
    # NFS. Kernel clients connect FROM THE NODE IP when kubelet does the
    # mount (an `nfs:` PV, or nfs-subdir-external-provisioner), so a pod
    # selector cannot express that client set — hence the CIDR list.
    # In-pod mounts come from the pod IP and want the selector list.
    #
    # ⚠ THIS CANNOT RESTRICT CROSS-CLUSTER CONSUMERS. Nothing sets
    # `externalTrafficPolicy` on the Service, so kube-proxy SNATs a
    # NodePort/LoadBalancer client to a node address in THIS cluster
    # before the packet reaches the pod, and the policy evaluates that
    # rewritten source. Measured on a three-cluster rig: 1486 of 1486
    # connections from two remote clusters arrived as the hub cluster's
    # own gateway address, and zero as either remote node. So the only
    # CIDR that admits a remote cluster is this cluster's own — which
    # admits everyone who can reach the NodePort. Listing remote CIDRs
    # here is an outage; listing the local one is a vacuous control.
    # Restrict cross-cluster reach at the network layer instead.
    - from:
        {{- range .Values.networkPolicy.nfsClientCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.nfsClientSelectors }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        # THE POD'S PORT, NOT THE SERVICE'S. NetworkPolicy is enforced at
        # the endpoint, after kube-proxy has already DNAT'd, so this must
        # match what the container listens on — `targetPort: 2049` in
        # hub.yaml, hardcoded, and NFS_PORT in the operator's render.
        # Writing `.Values.service.port` here means the moment anyone
        # uses the port-per-project shape that `advertiseAddress` exists
        # to serve (`service.port: 2149`), the policy admits 2149 against
        # a pod listening on 2049 and every correctly-listed CIDR is
        # denied — while `kubectl get netpol -o yaml` shows exactly the
        # CIDR the admin expected, which is what makes it hard to see.
        # This is the mirror of the bug already caught in the other rule
        # (render.rs: "The chart's own NetworkPolicy hardcodes 8080
        # against a free `spec.monitoring.port`"). The operator chart has
        # always had it right.
        - protocol: TCP
          port: 2049
{{- end }}
{{- if and .Values.monitoring.enabled (or .Values.networkPolicy.apiClientCIDRs .Values.networkPolicy.apiClientSelectors) }}
    # /status, /health and the file API. This surface can rewrite any
    # file in the project, so it is never on the consumer-facing
    # Service and never open to the NFS client set.
    - from:
        {{- range .Values.networkPolicy.apiClientCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.apiClientSelectors }}
        - {{ toYaml . | nindent 10 | trim }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.monitoring.port }}
{{- end }}
{{- end }}
