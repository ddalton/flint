# Flint-lite — the standalone hub (docs/flint-lite.md).
#
# One pod, four objects, no CSI stack, no CRDs: ConfigMap, RWO PVC,
# Service, and a single-replica Deployment running flint-pnfs-mds in
# `mode: standalone` (layouts off; every byte serves through the MDS
# lane out of /data/exports on the PVC). Consumers need NOTHING from
# flint installed: any cluster mounts the hub with the in-tree `nfs:`
# PV type, or dynamically via nfs-subdir-external-provisioner.
#
# This chart deliberately knows nothing about SPDK, data servers, or
# the CSI driver — the hub's PVC comes from ANY CSI driver. A full
# pNFS cluster is the flint-csi-driver-chart's job, its own release.

image:
  # Composed as {repository}/{name}:{tag|Chart.appVersion}. `ref`
  # overrides the whole reference verbatim when set (e.g. a
  # kind-loaded local image "flint-lite-dev:local").
  # NOTE: `mode: standalone` and the S3 tier need image 1.26.0 or
  # newer (multi-arch: amd64 + arm64); the warm-fill knobs
  # (hydrateWarmAfterImport/hydrateWarmConcurrency) need 1.27.0.
  # Older MDS binaries refuse the mode at boot.
  repository: dilipdalton
  name: flint-pnfs
  tag: ""
  ref: ""
  pullPolicy: IfNotPresent

service:
  # ClusterIP serves same-cluster consumers and flat/peered pod
  # networks. Cross-cluster over a cloud LB: LoadBalancer — NFS is
  # one long-lived TCP flow, so mind LB idle timeouts and prefer
  # peered/flat networks where you have them (and keep hub and
  # consumers same-AZ: inter-AZ bytes are billed both ways).
  type: ClusterIP
  port: 2049
  # Fixed NodePort when type: NodePort ("" lets k8s pick).
  nodePort: ""
  annotations: {}

persistence:
  # "" = the CLUSTER DEFAULT StorageClass — any CSI driver's RWO
  # volume works (EBS gp3, GCE PD, local-path, Ceph): the hub writes
  # plain files. NVMe is a performance choice, never a requirement.
  # This PVC holds the hot tier + namespace + sqlite state; with
  # tier.enabled, durably flushed data lives in S3, so size for the
  # WORKING SET, not the dataset.
  storageClassName: ""
  size: 20Gi

# S3 cold tier (design of record: docs/plans/s3-tier-l2-design-review.md).
# Enabled ⇒ the hub captures every mutation durably, claims the volume
# epoch at startup (fencing BEFORE the listener — a second hub on the
# same prefix is fenced, never split-brained), publishes closed
# generations to the bucket, evicts cold files at the disk watermark,
# and hydrates them back on first touch (readers park on
# NFS4ERR_DELAY; kernel clients retry silently).
tier:
  enabled: false

  # REQUIRED when enabled. Must already exist — the hub never creates
  # buckets. Enable VERSIONING on it: delete-marker recovery (the DR
  # drills' phase J) assumes it.
  bucket: ""

  # Prefix under the bucket, e.g. "vol1/". ONE PREFIX = ONE VOLUME =
  # ONE HUB — two releases sharing a prefix will fence each other in
  # turn, forever. ".flint/" under the prefix is RESERVED for tier
  # control objects (the epoch cell, DR manifests).
  keyPrefix: ""

  # Custom S3 endpoint (MinIO rigs; forces path-style addressing).
  # "" = real S3.
  endpoint: ""

  # AWS_REGION for the SDK. "" = ambient (env / IRSA / IMDS).
  region: ""

  # Name of an EXISTING Secret in the release namespace, injected
  # wholesale as env vars — the standard keys are AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY (+ AWS_SESSION_TOKEN if temporary). "" =
  # ambient credentials (IRSA / instance role) — prefer that on EKS.
  credentialsSecret: ""

  # DR / bucket adoption: when the tier state is FRESH and the bucket
  # holds content, import the namespace before serving (and always
  # resume a crashed import). false = flush-only posture.
  importOnStart: true

  # Tuning knobs, rendered VERBATIM into the config's tier: section
  # (schema: TierConfig, spdk-csi-driver/src/pnfs/config.rs). Absent
  # keys take the server defaults, which are the ECONOMICS GATE'S
  # ASSUMPTIONS, not neutral tuning — flushFloorSecs 60 caps a hot
  # file's request bill (uncapped fsync churn priced at $6,480/mo);
  # quiesceSecs 10, tickSecs 10, wholePutMaxBytes 64Mi, partFloorBytes
  # 16Mi, epochHeartbeatSecs 10, epochLeaseMisses 6, reserveBytes
  # 256Mi, watermarkPct 85, ballastBytes 64Mi, hydrateHoldSecs 15,
  # hydrateConcurrency 4, hydrateFetchParallel 6 (ranged GETs per
  # restore — cold-read fan-out), hydrateWarmAfterImport false (bulk
  # warm fill after a DR/adopt import — resumes across restarts),
  # hydrateWarmConcurrency 16. Example: {watermarkPct: 90}.
  settings: {}

  # With the tier on, startup legitimately runs a long time before the
  # socket opens: the epoch claim WAITS out a dead prior holder's
  # lease (epochHeartbeatSecs × epochLeaseMisses ≈ 60s default), and a
  # DR-restore import walks the whole bucket — all BEFORE the listener
  # binds, because an unfenced hub must never serve. The startupProbe
  # allows failureThreshold × 10s for this; liveness only starts once
  # it succeeds.
  startupFailureThreshold: 60

# RUST_LOG for the hub.
# How long the kubelet waits after SIGTERM before SIGKILL. The hub
# uses that window to drain in-flight replies, flush every dirty file,
# write the DR manifest and release the epoch — so the next start (or
# the next hub) comes up instantly instead of waiting out a lease
# nobody holds. Raise it if this volume routinely holds a large dirty
# set: the flush is bounded by unpublished bytes, not by a constant.
terminationGracePeriodSeconds: 120

# The hub's HTTP surface: /health, /status, and optionally the file API.
#
# ClusterIP only — this port is NEVER added to the NFS Service. The
# lifecycle controller polls /status here (phase, epoch, and the RPO
# predicate that gates hibernation), and the project front door uses the
# file API to browse without holding a kernel mount.
# Default-deny ingress for the hub pod. OFF by default: a policy that
# lands with an empty client list breaks every mount, and only this
# cluster's operator knows its node CIDRs. Needs a CNI that enforces
# NetworkPolicy (Cilium, Calico); elsewhere every rule here is ignored
# silently.
#
# Turning it on closes 50051 — the MDS gRPC control plane, which binds
# 0.0.0.0 and carries DeleteVolume unauthenticated unless
# FLINT_PNFS_CONTROL_TOKEN is set. Images 1.28.0+ do not start it in
# standalone at all; the policy is what covers an older one.
networkPolicy:
  enabled: false

  # Who may reach 2049. Kernel mounts driven by kubelet arrive from the
  # NODE ip, not a pod ip, so node CIDRs are usually what you want —
  # a podSelector cannot express that client set at all. Cross-cluster
  # consumers are always CIDRs. BOTH LISTS EMPTY ADMITS NOTHING.
  nfsClientCIDRs: []
  #  - "10.0.0.0/16"
  # NetworkPolicyPeer objects, verbatim (podSelector/namespaceSelector).
  # For in-pod mounts, where the client's pod ip is the source.
  nfsClientSelectors: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: workloads

  # Who may reach the monitoring port (/status, /health, the file API).
  # Keep this to the scraper and the browse front door — the file API
  # can rewrite any file in the project. Empty admits nothing.
  apiClientCIDRs: []
  apiClientSelectors: []
  #  - podSelector:
  #      matchLabels:
  #        app.kubernetes.io/name: projects-frontdoor

monitoring:
  enabled: false
  port: 8080
  healthPath: /health

  # Browse and edit files over HTTP, served through the hub's own NFS
  # dispatcher — so it inherits eviction handling, export confinement,
  # locking, the write gate and the tier's capture notes rather than
  # reimplementing any of them.
  #
  # There is NO token-optional mode: this surface can rewrite any file
  # in the project. Point tokenFile at a projected Secret (rotating it
  # then needs no pod-spec change), or leave it unset and supply
  # FLINT_FILE_API_TOKEN in the environment. Neither ⇒ the routes are
  # not mounted and the hub logs why.
  fileApi:
    enabled: false
    # Name of an EXISTING Secret in this namespace holding the bearer
    # token under key `token`. Projected read-only at
    # /etc/flint/api-token, so rotating the token is a Secret edit
    # rather than a pod-spec change. Absent ⇒ the hub falls back to
    # FLINT_FILE_API_TOKEN in its environment; with neither, the routes
    # are not mounted and the hub logs why.
    tokenSecret: ""
    # Caps on a single request. A browse click on a cold file pulls it
    # out of S3 — real, billed egress — so the download cap is what
    # keeps one careless click from spending a lot of it. Callers fetch
    # larger files with Range requests.
    maxUploadBytes: 5368709120
    maxDownloadBytes: 5368709120
    # How long a download waits for an evicted file to hydrate before
    # answering 503 with a Retry-After.
    hydrateWaitSecs: 30
    # The hub's download memory bound. At or below this a body is
    # buffered whole, so a file that shrinks or is renamed over mid-read
    # is refused as a clean 409 BEFORE any byte ships. Above it the body
    # streams and memory stays O(chunk) whatever the file size — the
    # same conditions then end the stream with an error instead, so the
    # connection resets rather than delivering a short body under 200.
    # Buffering everything used to bound hub memory by maxDownloadBytes:
    # a 512 MiB request measured VmHWM 30 MB -> 541 MiB, and under a
    # 256Mi limit that GET was OOM-killed, taking the NFS export with
    # it. Hubs are 1:1 with projects, so that was a per-project cost.
    streamThresholdBytes: 8388608

logLevel: info
# Requests only, no limits, and matched by the operator's
# RenderDefaults — a hub with neither runs BestEffort, which at fleet
# scale means the scheduler packs by pod count alone and every hub is
# first out under node memory pressure. A memory LIMIT is deliberately
# absent: a hub is a filesystem server whose working set belongs to the
# caller, and a limit makes it killable mid-operation.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
# ─────────────────────────── Security context ────────────────────────────
# Audit finding 7. The hub had NO securityContext at all — a default root
# container — while the operator and the gateway in this same repo both
# run as uid 65532. The one workload that touches every tenant's bytes
# was the only one left unhardened.
#
# ── Does it actually need root? No. Measured 2026-08-24. ──
#
# The hub was believed to require root. It does not. Running as uid 65532
# on Linux, with the four capabilities below granted as FILE capabilities
# on the binary, pynfs 4.1 scored 171 passed / 0 failed / 91 skipped —
# identical to the root run — and all 45 objects the suite created were
# owned by the CALLER (503:1000), not by the server. The control arm,
# same uid with the capabilities stripped, produced 65532:988 for every
# one of them and logged nothing.
#
# What it needs is the CAPABILITIES, not uid 0:
#   CHOWN         stamp the caller's AUTH_SYS identity on created objects
#                 (postgres checks st_uid == geteuid and refuses to start
#                 otherwise; a mode-0700 dir locks out its own creator)
#   DAC_OVERRIDE  read/write files it does not own, after that chown
#   FOWNER        chmod/utimes on files it does not own
#   FSETID        preserve setuid/setgid across a chown
#
# NET_BIND_SERVICE is deliberately absent: NFS is 2049, not privileged.
# Add it if you move the listener below 1024.
#
# ⚠ DAC_READ_SEARCH is absent and is required by `FLINT_FH_KERNEL=1`:
# kernel inode handles resolve through `open_by_handle_at(2)`
# (`nfs/v4/fh_kernel.rs:31`). That path is off by default, so the
# capability is not granted for a feature nobody runs. Turning
# FLINT_FH_KERNEL on means adding DAC_READ_SEARCH in the same change.
securityContext:
  enabled: true

  # ── Why this still defaults to 0 ──
  # Kubernetes has NO ambient capabilities, so a non-root container does
  # not get an effective capability from `capabilities.add` alone — the
  # BINARY must carry file capabilities. `docker/Dockerfile.pnfs` setcaps
  # them, but only from the image that ships with this chart. Pin an
  # older image (or `--reuse-values` past an upgrade) and `runAsNonRoot`
  # would produce a hub that cannot chown, which shows up as a whole
  # export owned by the wrong uid rather than as a failure.
  #
  # So the default stays 0 until the file-capability image has been
  # verified on a live cluster. Flipping it is these two values, and the
  # server tells you at startup whether it worked: `nfs::privilege`
  # probes chown on boot and logs loudly when it is denied.
  #
  #   runAsUser: 65532
  #   runAsNonRoot: true
  runAsUser: 0
  runAsNonRoot: false

  # Off by default: the state DB, export mount and tier scratch are all
  # volume-backed, but a deployment may carry a sidecar or image that
  # writes to the root filesystem, and a hub that will not start is worse
  # than one whose rootfs is writable. Turn it on and test your own
  # configuration.
  readOnlyRootFilesystem: false

  capabilities:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - FSETID
  seccompProfile: RuntimeDefault

nodeSelector: {}
nameOverride: ""
