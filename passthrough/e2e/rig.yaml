# The store half of the passthrough rig: namespaces, MinIO, a seeded
# bucket, and a durable mc pod.
#
# The seed matters more than usual here. Every read leg asserts on
# CONTENT written by something that is not the pod doing the reading —
# a count of files in a directory the sidecar itself could have created
# would pass on an empty emptyDir with a stray marker in it.
apiVersion: v1
kind: Namespace
metadata:
  name: flint-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: pt-agents
  labels:
    # Deliberate: the injected sidecar is privileged, and `baseline`
    # would reject it. Leg A11 proves that rejection in a namespace
    # labelled the other way, so this label is a decision the rig
    # states rather than a default it inherits.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: pt-restricted
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: flint-system
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio
          args: ["server", "/data", "--address", ":9000"]
          env:
            - { name: MINIO_ROOT_USER, value: drill }
            - { name: MINIO_ROOT_PASSWORD, value: drillsecret }
          ports: [{ containerPort: 9000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: flint-system
spec:
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: 9000 }]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-bucket
  namespace: flint-system
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set m http://minio.flint-system.svc:9000 drill drillsecret; do sleep 2; done
              mc mb --ignore-existing m/ptbucket
              # Content, not just names: every read leg checks bytes.
              for i in 00 01 02 03 04 05 06 07 08 09; do
                echo "seeded-object-$i" | mc pipe "m/ptbucket/datasets/imagenet/shard-$i.txt"
              done
              echo "deep-seeded" | mc pipe m/ptbucket/datasets/imagenet/sub/deep.txt
              # Outside the prefix: proves keyPrefix actually scopes the
              # mount rather than being decoration.
              echo "must-not-be-visible" | mc pipe m/ptbucket/elsewhere/secret.txt
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: pt-agents
type: Opaque
stringData:
  # Keys AWS_* VERBATIM.
  AWS_ACCESS_KEY_ID: drill
  AWS_SECRET_ACCESS_KEY: drillsecret
  AWS_REGION: us-east-1
---
apiVersion: v1
kind: Pod
metadata:
  name: mc-pt
  namespace: flint-system
spec:
  containers:
    - name: mc
      image: minio/mc
      command: ["/bin/sh", "-c"]
      args:
        - |
          trap 'exit 0' TERM INT
          until mc alias set m http://minio.flint-system.svc:9000 drill drillsecret; do sleep 2; done
          sleep 86400 & wait
---
# A11 needs the webhook to SUCCEED in pt-restricted so that PodSecurity
# is what rejects the pod. Without a CR here the webhook denies first
# and the leg proves nothing about the privilege cost.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: pt-restricted
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: drill
  AWS_SECRET_ACCESS_KEY: drillsecret
  AWS_REGION: us-east-1
