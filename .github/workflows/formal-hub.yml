# The hub's models — 246 TLC runs, roughly three times the lean gate.
#
# The same caveat applies as in formal-lean.yml: a green badge says the
# models still CHECK OUT, never that they still describe the code.
#
# TRIGGERED NARROWLY, because it is expensive: only when `formal/**`
# itself changes, plus a weekly bit-rot run. A gate slow enough to
# ignore is a gate people learn to ignore, and the way to avoid that is
# to fire it rarely rather than to make it shallow.
#
# UNTIL 2026-09-12 THIS GATE COULD NOT RUN ON LINUX AT ALL. check-tla.sh
# opened with `mktemp -t tlaprofile`, which is BSD-only — GNU coreutils
# refuses a template with fewer than three trailing X's — so under
# `set -euo pipefail` the script died in under a second, before TLC ran
# once. It went unnoticed because the only machine it had ever run on
# was a macOS workstation. That is the argument for this file existing:
# a gate nobody runs anywhere but one laptop is not a gate.
#
# WHY IT IS SHARDED. Fixing the mktemp bug produced the first Linux run
# in this gate's life, and it did not finish: >110 minutes and still
# going. Not memory — the runner's 16 GiB gives the JVM a ~4 GiB default
# max heap, twice what the 8 GiB workstation gives it — but CPU. TLC
# takes `-workers auto`, and auto is 4 here against 8 there. So the work
# is split across a matrix of runners; the wall clock of the gate becomes
# the wall clock of its heaviest shard.
#
# THE SHARD LIST IS GENERATED, NOT WRITTEN HERE, by scripts/tla-shards.sh
# reading check-tla.sh. A hand-maintained list in this file would be a
# second place to record which modules exist, and therefore a place to
# forget one — a module dropped from the matrix would simply stop being
# checked, in green. Each shard additionally asserts the exact number of
# TLC runs it was supposed to execute, so a filter that matches nothing
# fails loudly instead of passing over an empty road.
name: formal-hub

on:
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'scripts/check-tla.sh'
      - 'scripts/tla-shards.sh'
      - 'scripts/tla-module-cost.tsv'
      - '.github/workflows/formal-hub.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'scripts/check-tla.sh'
      - 'scripts/tla-shards.sh'
      - 'scripts/tla-module-cost.tsv'
      - '.github/workflows/formal-hub.yml'
  # Bit-rot catcher: the models can stop checking without anyone editing
  # them — a TLC release changes, a run that used to fit in memory stops
  # fitting. Weekly rather than nightly because they change rarely and a
  # job that cries wolf is a job people mute.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: partition the gate
        run: |
          set -euo pipefail
          # The generator refuses to emit a partition whose shard run
          # counts do not sum to the gate's own total, so a matrix that
          # silently lost a module cannot reach the jobs below.
          matrix=$(bash scripts/tla-shards.sh 6)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo '## hub gate partition'
            echo '```'
            bash scripts/tla-shards.sh 6 --explain
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hub-model:
    needs: plan
    name: 'shard ${{ matrix.shard.id }} (${{ matrix.shard.runs }} runs)'
    runs-on: ubuntu-latest
    # The heaviest shard is FlintReplication's 71 runs, ~29% of the gate.
    # Module granularity cannot split it further; if it alone approaches
    # this limit, the next step is to teach the filter cfg-level names
    # rather than to raise the ceiling again.
    timeout-minutes: 90
    strategy:
      # Every shard reports. A gate whose first failure hides the state
      # of the other five turns one red run into several round trips.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .tla2tools.jar
          key: tla2tools-1.7.4
      - name: hub formal gate
        env:
          TLA_TOOLS_JAR: ${{ github.workspace }}/.tla2tools.jar
          TLA_MODULES: ${{ matrix.shard.modules }}
          TLA_EXPECT_RUNS: ${{ matrix.shard.runs }}
        run: bash scripts/check-tla.sh

  # ONE required check for a matrix whose shape is decided at run time.
  # Branch protection cannot name jobs that do not exist until `plan`
  # has run, and — the part that actually bites — a matrix job that
  # never starts reports NOTHING rather than failing, so "no red" is not
  # the same as "it passed". This job is the thing to mark required.
  gate:
    needs: [plan, hub-model]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every shard must have passed
        run: |
          set -euo pipefail
          plan='${{ needs.plan.result }}'
          shards='${{ needs.hub-model.result }}'
          echo "plan=$plan hub-model=$shards"
          # `success` is the only acceptable value for either. skipped,
          # cancelled and failure are all "the gate did not run", which
          # must not read as "the gate is fine".
          if [ "$plan" != success ] || [ "$shards" != success ]; then
            echo "FAIL: the hub formal gate did not pass (plan=$plan, shards=$shards)"
            exit 1
          fi
          echo "hub formal gate: all shards passed"
