# MDS config for the pnfs-block kernel-client rig (block-rig.sh).
#
# Unlike the files-layout smoke configs, the MDS runs INSIDE the lima VM
# (the block export needs a colocated spdk-tgt reachable over a unix
# socket, which cannot exist on the macOS host). Everything is loopback
# from the VM's point of view: the kernel client mounts 127.0.0.1 and
# dials the NVMe listener on 127.0.0.1:4420.
#
# State is sqlite BY REQUIREMENT: block-class volumes refuse a memory
# backend (the extent map IS the volume's data map — F67).

apiVersion: chert.us/v1alpha1
kind: PnfsConfig
mode: mds

mds:
  bind:
    address: "0.0.0.0"
    port: 20490

  layout:
    type: file          # fleet default for files-class volumes; unused here
    stripeSize: 8388608
    policy: stripe

  # No data servers: a pure block-class rig has no DS fleet — that is
  # the point of the layout.
  dataServers: []

  state:
    backend: sqlite
    config:
      path: /var/tmp/flint-rig/state.db

  blockExport:
    spdkSocket: /var/tmp/spdk-rig.sock
    lvstore: lvs_rig
    traddr: "127.0.0.1"
    trsvcid: 4420
    # Reservation persist-through-power-loss files (mandatory — the
    # kernel client's pr_register sets CPTPL unconditionally and SPDK
    # refuses it without a ptpl_file on the namespace).
    ptplDir: /var/tmp/flint-rig

exports:
  - path: /var/tmp/flint-rig/exports
    fsid: 1
    options: [rw, sync, no_subtree_check]
    access:
      - network: 0.0.0.0/0
        permissions: rw

logging:
  level: info
  format: text
  components:
    mds: info
    layout: info

monitoring:
  prometheus:
    enabled: false
    port: 0
    path: /metrics
  health:
    enabled: false
    port: 0
    path: /health
  metrics: []
