# MDS config for the SECOND target of the replication rig
# (replica-rig.sh). Everything that can collide with mds-block.yaml is
# different, because the whole point of this file is that two MDS shards
# SHARE NOTHING: separate sqlite, separate spdk-tgt over a separate
# socket, separate NVMe listener port, separate ptpl directory.
#
# That is not a rig convenience — it is the production shape. The chart
# renders N independent single-replica Deployments, each with its own
# RWO PVC, and the attach IS the single-writer fence. A target learns
# about another target only by being TOLD (HostBlockLeg, or a placement
# recorded at CreateVolume), never by discovery, and this pair of
# configs is what makes that testable on one machine.

apiVersion: flint.io/v1alpha1
kind: PnfsConfig
mode: mds

mds:
  bind:
    address: "0.0.0.0"
    port: 20491

  layout:
    type: file
    stripeSize: 8388608
    policy: stripe

  dataServers: []

  state:
    backend: sqlite
    config:
      path: /var/tmp/flint-rig-b/state.db

  blockExport:
    spdkSocket: /var/tmp/spdk-rigb.sock
    lvstore: lvs_rigb
    traddr: "127.0.0.1"
    trsvcid: 4421
    ptplDir: /var/tmp/flint-rig-b

exports:
  - path: /var/tmp/flint-rig-b/exports
    fsid: 2
    options: [rw, sync, no_subtree_check]
    access:
      - network: 0.0.0.0/0
        permissions: rw

logging:
  level: info
  format: text
  components:
    mds: info
    layout: info

monitoring:
  prometheus:
    enabled: false
    port: 0
    path: /metrics
  health:
    enabled: false
    port: 0
    path: /health
  metrics: []
