# Leg C1 — the standalone HUB under the conformance suite.
#
# WHY THIS FILE EXISTS. Every pynfs number this repo has ever recorded
# was taken against `flint-nfs-server` (`nfs_main.rs`). flint-lite does
# not run that binary: it runs `flint-pnfs-mds` with `standalone: true`
# (`nfs_mds_main.rs`, `flint-lite-chart/templates/hub.yaml`). They share
# the wire layer but NOT their bring-up, and three recovery mechanisms
# had drifted apart far enough to ship as defects (locks not persisted,
# F33 never armed, state.db crash-loop — all fixed in 1.37.0). A
# conformance number for one is not a conformance number for the other.
#
# Differences from `lite.yaml`, and why each is required to POSE the
# questions the suite asks:
#
#   state.backend: sqlite   `lite.yaml` uses `memory`, under which no
#                           restart, reclaim, lock-persistence or grace
#                           question can be asked at all — the state is
#                           gone with the process. The hub ships sqlite.
#
#   health.enabled: true    `lite.yaml` disables it, so `/status` cannot
#                           be probed. The hub ships it enabled.
#
# The export lives under /srv (not /tmp) so a tmpfs-backed /tmp cannot
# quietly change the durability posture underneath the run.

apiVersion: chert.us/v1alpha1
kind: PnfsConfig
mode: standalone

mds:
  bind:
    address: "0.0.0.0"
    port: 20490

  layout:
    type: file
    stripeSize: 8388608
    policy: stripe

  dataServers: []

  state:
    backend: sqlite
    config:
      path: /srv/flint-mds-state/state.db

  ha:
    enabled: false
    replicas: 1
    leaderElection: false

  # ── ARM C: THE TIER ON ──────────────────────────────────────────────
  # The ONLY difference from armc-notier.yaml. Every compliance number
  # this repo has recorded was taken with `capture::enabled()` FALSE, so
  # LINK was never refused and no object was ever written: those numbers
  # are the FLOOR for flint-lite, not a measurement of it.
  #
  # NESTED UNDER `mds:` because `tier` is a field of MdsConfig, not of
  # PnfsConfig. At the top level it is an unknown key, silently dropped,
  # and the hub starts with no tier at all — which is what the first cut
  # of this file did ("drained; no tier to flush").
  #
  # FALSIFIABILITY: with the tier on, `link/00.t` MUST fail — S3 cannot
  # encode a hard link, so the hub advertises LINK_SUPPORT=false and
  # refuses LINK with NFS4ERR_NOTSUPP. If it still passes, capture was
  # not enabled and this arm is VOID rather than green.
  tier:
    enabled: true
    bucket: armc
    keyPrefix: "armc/"
    endpoint: "http://host.lima.internal:9010"
    importOnStart: false
    ownerIdentity: arm-c-drill

exports:
  - path: /srv/flint-mds-export
    fsid: 1
    options: [rw, sync, no_subtree_check]
    access:
      - network: 0.0.0.0/0
        permissions: rw

logging:
  level: info
  format: text
  components:
    mds: info

monitoring:
  prometheus:
    enabled: false
    port: 0
    path: /metrics
  health:
    enabled: true
    port: 20491
    path: /health
  metrics: []
