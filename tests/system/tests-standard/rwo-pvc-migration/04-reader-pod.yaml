apiVersion: v1
kind: Pod
metadata:
  name: reader-pod
  labels:
    test: csi-reader
spec:
  restartPolicy: Never
  # A DIFFERENT node than the writer's, by name: __WRITER_NODE__ is
  # replaced by chainsaw-test.yaml step 04, which applies this file. (A
  # podAntiAffinity on the writer's label cannot do this once the writer
  # is deleted -- and the old kuttl step never deleted it.)
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - __WRITER_NODE__
  containers:
    - name: reader
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Reading data from PVC..."
          if [ ! -f /data/test-file.txt ]; then
            echo "ERROR: test-file.txt not found!"
            exit 1
          fi
          echo "File contents:"
          cat /data/test-file.txt
          if grep -q "CSI Driver Test - RWO Migration" /data/test-file.txt; then
            echo "SUCCESS: Data verified!"
            exit 0
          else
            echo "ERROR: Expected data not found!"
            exit 1
          fi
      volumeMounts:
        - name: test-volume
          mountPath: /data
  volumes:
    - name: test-volume
      persistentVolumeClaim:
        claimName: test-pvc
