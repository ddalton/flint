apiVersion: v1
kind: Pod
metadata:
  name: reader-pod-1
  labels:
    test: rox-reader
spec:
  restartPolicy: Never
  # REQUIRED, not preferred (F71): with `preferred` both readers land on
  # one node of a one-node rig and the multi-node claim is tested by
  # nothing. A rig with fewer than two schedulable nodes now fails at the
  # assert below (a reader stays Pending) instead of passing vacuously.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              test: rox-reader
          topologyKey: kubernetes.io/hostname
  containers:
    - name: reader
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - |
          cat /data/test-file.txt
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rox-pvc
        readOnly: true
