# F70's load-bearing leg (F71, 2026-09-27). A ROX volume must be read-only
# because it IS ROX, not because the pod remembered `readOnly: true`. When
# written, the driver's only read-only switch was kubelet's `readonly` bit,
# which comes from the POD SPEC; NodePublishVolume never read the access
# mode (MULTI_NODE_READER_ONLY), and the NFS server never read its own
# `read_only` config. This pod mounts the ROX PVC the ordinary way, without
# `readOnly`, and tries to write. Step 08 requires the write to be REFUSED.
# While F70 was open it LANDED, and this test FAILED — which was the point.
#
# Since then, TWO independent fences refuse it: the server answers
# NFS4ERR_ROFS (2026-09-28), and NodePublishVolume reads the access mode
# and mounts `ro` for a reader-only PV (2026-09-29), so this pod's write
# fails with EROFS on the client before anything is sent. That second fence
# means this leg can no longer SEE the server's: a server regression would
# be masked by the client's `ro`. The server fence is observed at unit level
# over a real TCP connection (`server_v4::export_access_wiring_tests`,
# `deleg_wiring_tests`); a cluster leg for it needs a DIRECT mount of the
# export (`mount -t nfs4 -o rw` from a privileged pod, bypassing CSI) — not
# written. Neither leg has been run against the fixed server yet.
apiVersion: v1
kind: Pod
metadata:
  name: rox-forgetful-writer
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - |
          if echo "F71_WROTE_THROUGH_ROX" > /data/f71-rw-probe 2>/tmp/err && sync; then
            echo "WRITE_LANDED"
          else
            echo "WRITE_REFUSED: $(cat /tmp/err)"
          fi
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rox-pvc
