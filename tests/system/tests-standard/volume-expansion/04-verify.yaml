apiVersion: v1
kind: Pod
metadata:
  name: post-expansion-pod
spec:
  restartPolicy: Never
  containers:
    - name: verifier
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Verifying data after expansion..."
          
          # Check original file exists
          if [ ! -f /data/test-file.txt ]; then
            echo "ERROR: Original file not found!"
            exit 1
          fi
          
          cat /data/test-file.txt
          
          if grep -q "Initial data before expansion" /data/test-file.txt; then
            echo "SUCCESS: Original data preserved!"
          else
            echo "ERROR: Original data corrupted!"
            exit 1
          fi
          
          # Assert the filesystem actually grew: a stale kernel device makes
          # resize2fs a silent no-op, and a 500M write fits in the ORIGINAL
          # 1Gi — the old `|| true` dd proved nothing (v1.21.0 fix). The fs
          # must now hold more than 1Gi could.
          echo "Checking available space..."
          df -h /data
          TOTAL_MB=$(df -m /data | awk 'NR==2 {print $2}')
          if [ "$TOTAL_MB" -lt 1500 ]; then
            echo "ERROR: filesystem is ${TOTAL_MB}M — never grew past the original 1Gi!"
            exit 1
          fi

          # Write PAST the original capacity; failure fails the pod.
          dd if=/dev/zero of=/data/expanded-file bs=1M count=1200
          sync

          echo "Post-expansion verification completed"
      volumeMounts:
        - name: test-volume
          mountPath: /data
  volumes:
    - name: test-volume
      persistentVolumeClaim:
        claimName: expandable-pvc
