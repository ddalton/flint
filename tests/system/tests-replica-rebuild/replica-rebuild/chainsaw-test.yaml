# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
# Converted from kuttl 2026-10-02; see tests/system/README.md.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: replica-rebuild
spec:
  steps:
  - name: 00-env-setup
    try:
    - script:
        shell: bash
        content: |
          #!/bin/bash
          set -e
          NS=flint-system
          DEPLOY=flint-csi-controller
          # The driver container name differs between chart versions/roles
          # (flint-csi-controller in the controller deployment, flint-csi-driver
          # in the node DS) — resolve it, never hardcode it.
          CONTAINER=$(kubectl -n $NS get deploy $DEPLOY \
            -o jsonpath='{.spec.template.spec.containers[*].name}' \
            | tr ' ' '\n' | grep '^flint' | head -n1)
          if [ -z "$CONTAINER" ]; then
            echo "ERROR: no flint driver container found in deploy/$DEPLOY"
            exit 1
          fi
          echo "driver container: $CONTAINER"

          echo "=== Ensuring Tier-1/Tier-2 orchestrators are enabled for the test ==="
          get_env() {
            kubectl -n $NS get deploy $DEPLOY -o json \
              | jq -r --arg c "$CONTAINER" --arg k "$1" \
                '.spec.template.spec.containers[] | select(.name==$c) | .env // [] | .[] | select(.name==$k) | .value // empty'
          }

          PREV_SCHED=$(get_env FLINT_EPOCH_SCHEDULER);   PREV_SCHED=${PREV_SCHED:-ABSENT}
          PREV_CATCH=$(get_env FLINT_CATCHUP);           PREV_CATCH=${PREV_CATCH:-ABSENT}
          PREV_HR=$(get_env FLINT_HOT_REJOIN);           PREV_HR=${PREV_HR:-ABSENT}
          PREV_IVAL=$(get_env FLINT_EPOCH_INTERVAL_SECS); PREV_IVAL=${PREV_IVAL:-ABSENT}

          CHANGES=""
          [ "$PREV_SCHED" != "enabled" ] && CHANGES="$CHANGES FLINT_EPOCH_SCHEDULER=enabled"
          [ "$PREV_CATCH" != "enabled" ] && CHANGES="$CHANGES FLINT_CATCHUP=enabled"
          [ "$PREV_HR" != "enabled" ]    && CHANGES="$CHANGES FLINT_HOT_REJOIN=enabled"
          # A long epoch interval makes convergence (lag <= max_lag) exceed the
          # suite timeout; pin to 30s unless already <= 60.
          if [ "$PREV_IVAL" = "ABSENT" ] || [ "$PREV_IVAL" -gt 60 ] 2>/dev/null; then
            CHANGES="$CHANGES FLINT_EPOCH_INTERVAL_SECS=30"
          fi

          # Record what was there before, so 07-env-restore puts it back exactly.
          kubectl -n $NAMESPACE create configmap rebuild-test-envprev \
            --from-literal=FLINT_EPOCH_SCHEDULER="$PREV_SCHED" \
            --from-literal=FLINT_CATCHUP="$PREV_CATCH" \
            --from-literal=FLINT_HOT_REJOIN="$PREV_HR" \
            --from-literal=FLINT_EPOCH_INTERVAL_SECS="$PREV_IVAL" \
            --from-literal=modified="$([ -n "$CHANGES" ] && echo true || echo false)"

          if [ -n "$CHANGES" ]; then
            echo "Applying controller env: $CHANGES"
            # shellcheck disable=SC2086
            kubectl -n $NS set env deploy/$DEPLOY -c $CONTAINER $CHANGES
            kubectl -n $NS rollout status deploy/$DEPLOY --timeout=180s
            # Verify the change actually landed (kubectl set env silently no-ops
            # on a container-name mismatch — never trust it blind).
            for CHECK in FLINT_EPOCH_SCHEDULER FLINT_CATCHUP FLINT_HOT_REJOIN; do
              if [ "$(get_env $CHECK)" != "enabled" ]; then
                echo "ERROR: $CHECK did not land on container $CONTAINER"
                exit 1
              fi
            done
          else
            echo "Orchestrator env already suitable; leaving the controller untouched"
          fi
          echo "OK: env ready"
  - name: 01-storageclass-pvc
    try:
    - apply:
        file: 01-storageclass-pvc.yaml
    - assert:
        file: 01-assert.yaml
  - name: 02-writer
    try:
    - apply:
        file: 02-writer.yaml
    - assert:
        file: 02-assert.yaml
  - name: 03-kill-replica-leg
    try:
    - script:
        shell: bash
        content: |
          #!/bin/bash
          set -e
          PV=$(kubectl -n $NAMESPACE get pvc rebuild-pvc -o jsonpath='{.spec.volumeName}')
          CONSUMER=$(kubectl -n $NAMESPACE get pod rebuild-writer -o jsonpath='{.spec.nodeName}')
          echo "PV=$PV consumer=$CONSUMER"

          sync_state() {
            kubectl get pv $PV -o json \
              | jq -r '.metadata.annotations["disk.chert.us/replica-sync-state"]'
          }

          # Give the writer a moment to seed and the scheduler a first epoch cut.
          sleep 5

          # Pick a replica node that is NOT the consumer: killing the consumer
          # node's spdk-tgt would sever the volume's own data path, which is a
          # different (collapse) scenario — this test wants a degraded-but-serving
          # raid with an incremental rebuild behind it.
          TARGET=$(sync_state | jq -r --arg c "$CONSUMER" \
            '.replicas[] | select(.node_name != $c) | .node_name' | head -n1)
          if [ -z "$TARGET" ] || [ "$TARGET" = "null" ]; then
            echo "ERROR: no non-consumer replica found — the test needs >= 2 workers with flint storage"
            sync_state | jq .
            exit 1
          fi
          echo "target replica node: $TARGET"
          kubectl -n $NAMESPACE create configmap rebuild-test-state \
            --from-literal=target="$TARGET" --from-literal=pv="$PV"

          NODEPOD=$(kubectl -n flint-system get pods -l app=flint-csi-node \
            --field-selector spec.nodeName=$TARGET -o name | head -n1)
          if [ -z "$NODEPOD" ]; then
            echo "ERROR: no flint-csi-node pod on $TARGET"
            exit 1
          fi

          echo "=== killing spdk-tgt on $TARGET ($NODEPOD) ==="
          kubectl -n flint-system exec $NODEPOD -c spdk-tgt -- kill 1

          echo "=== waiting for the replica on $TARGET to be marked stale ==="
          DEADLINE=$(( $(date +%s) + 150 ))
          while [ $(date +%s) -lt $DEADLINE ]; do
            ST=$(sync_state | jq -r --arg t "$TARGET" \
              '.replicas[] | select(.node_name == $t) | .sync_state' 2>/dev/null \
              || echo transient-read-error)
            echo "  $(date -u +%T) $TARGET: $ST"
            if [ "$ST" = "stale" ] || [ "$ST" = "standby" ]; then
              echo "OK: replica on $TARGET left in_sync (state=$ST)"
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: replica on $TARGET was never marked stale (detection is a ~60s monitor tick)"
          exit 1
  - name: 04-wait-rebuild
    try:
    - script:
        shell: bash
        content: |
          #!/bin/bash
          set -e
          TARGET=$(kubectl -n $NAMESPACE get configmap rebuild-test-state -o jsonpath='{.data.target}')
          PV=$(kubectl -n $NAMESPACE get configmap rebuild-test-state -o jsonpath='{.data.pv}')
          echo "=== waiting for incremental rebuild of the replica on $TARGET (pv $PV) ==="

          # Expected sequence: stale -> (ReplicaCatchupStarted | ReplicaFullBuildStarted)
          # -> standby -> hot rejoin -> in_sync. End-to-end is dominated by the
          # 60s detection/orchestrator ticks and the 30s epoch cadence; live
          # drills converge in ~2-4 min.
          LAST=""
          DEADLINE=$(( $(date +%s) + 480 ))
          while [ $(date +%s) -lt $DEADLINE ]; do
            ST=$(kubectl get pv $PV -o json 2>/dev/null \
              | jq -r --arg t "$TARGET" \
                '.metadata.annotations["disk.chert.us/replica-sync-state"]
                 | fromjson | .replicas[] | select(.node_name == $t)
                 | .sync_state + (if .hot_rejoin then "+marker" else "" end)' 2>/dev/null \
              || echo transient-read-error)
            if [ "$ST" != "$LAST" ]; then echo "  $(date -u +%T) $TARGET: $ST"; LAST=$ST; fi
            if [ "$ST" = "in_sync" ]; then
              echo "OK: replica on $TARGET is in_sync again"
              echo "=== admission evidence ==="
              kubectl get events --field-selector involvedObject.name=$PV --sort-by=.lastTimestamp \
                | grep -E "ReplicaStale|ReplicaCatchupStarted|ReplicaFullBuildStarted|ReplicaStandby|HotRejoinSucceeded|HotRejoinLocalized|ReplicaAdmitted" || true
              if kubectl get events --field-selector involvedObject.name=$PV \
                  | grep -qE "HotRejoinSucceeded|ReplicaAdmitted"; then
                echo "OK: raid re-admission event present"
                exit 0
              fi
              echo "ERROR: replica is in_sync but no HotRejoinSucceeded/ReplicaAdmitted event was found"
              exit 1
            fi
            sleep 10
          done
          echo "ERROR: replica on $TARGET did not return to in_sync within the deadline"
          kubectl get events --field-selector involvedObject.name=$PV --sort-by=.lastTimestamp | tail -20
          exit 1
  - name: 05-verify-data
    try:
    - script:
        shell: bash
        content: |
          #!/bin/bash
          set -e
          echo "=== verifying workload was undisturbed and data is intact ==="

          RESTARTS=$(kubectl -n $NAMESPACE get pod rebuild-writer \
            -o jsonpath='{.status.containerStatuses[0].restartCount}')
          if [ "$RESTARTS" != "0" ]; then
            echo "ERROR: writer restarted $RESTARTS times — the surviving leg did not carry the raid"
            exit 1
          fi
          echo "OK: writer container never restarted"

          echo "--- bulk checksum ---"
          kubectl -n $NAMESPACE exec rebuild-writer -- md5sum -c /data/checksum

          echo "--- ledger contiguity (no acked-write loss) ---"
          GAPS=$(kubectl -n $NAMESPACE exec rebuild-writer -- \
            awk 'NR>1 && $1 != prev+1 {print "GAP", prev, "->", $1} {prev=$1}' /data/ledger)
          if [ -n "$GAPS" ]; then
            echo "ERROR: ledger has gaps:"
            echo "$GAPS"
            exit 1
          fi
          SEQ1=$(kubectl -n $NAMESPACE exec rebuild-writer -- tail -n 1 /data/ledger | cut -d' ' -f1)
          echo "OK: ledger contiguous through seq $SEQ1"

          echo "--- writer still making progress ---"
          sleep 3
          SEQ2=$(kubectl -n $NAMESPACE exec rebuild-writer -- tail -n 1 /data/ledger | cut -d' ' -f1)
          if [ "$SEQ2" -le "$SEQ1" ]; then
            echo "ERROR: writer stopped appending (seq stuck at $SEQ1)"
            exit 1
          fi
          echo "OK: writer advancing ($SEQ1 -> $SEQ2)"
          echo "PASS: incremental replica rebuild validated"
  - name: 06-cleanup
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: rebuild-writer
    - delete:
        ref:
          apiVersion: v1
          kind: PersistentVolumeClaim
          name: rebuild-pvc
    - delete:
        ref:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          name: flint-rebuild-2r
  - name: 07-env-restore
    try:
    - script:
        shell: bash
        content: |
          #!/bin/bash
          set -e
          NS=flint-system
          DEPLOY=flint-csi-controller
          CONTAINER=$(kubectl -n $NS get deploy $DEPLOY \
            -o jsonpath='{.spec.template.spec.containers[*].name}' \
            | tr ' ' '\n' | grep '^flint' | head -n1)
          if [ -z "$CONTAINER" ]; then
            echo "ERROR: no flint driver container found in deploy/$DEPLOY"
            exit 1
          fi

          MODIFIED=$(kubectl -n $NAMESPACE get configmap rebuild-test-envprev -o jsonpath='{.data.modified}')
          if [ "$MODIFIED" != "true" ]; then
            echo "controller env was not modified by this test; nothing to restore"
            exit 0
          fi

          echo "=== restoring controller env to its pre-test state ==="
          ARGS=""
          for KEY in FLINT_EPOCH_SCHEDULER FLINT_CATCHUP FLINT_HOT_REJOIN FLINT_EPOCH_INTERVAL_SECS; do
            PREV=$(kubectl -n $NAMESPACE get configmap rebuild-test-envprev -o jsonpath="{.data.$KEY}")
            if [ "$PREV" = "ABSENT" ]; then
              ARGS="$ARGS ${KEY}-"
            else
              ARGS="$ARGS ${KEY}=${PREV}"
            fi
          done
          echo "restore: $ARGS"
          # shellcheck disable=SC2086
          kubectl -n $NS set env deploy/$DEPLOY -c $CONTAINER $ARGS
          kubectl -n $NS rollout status deploy/$DEPLOY --timeout=180s
          echo "OK: controller env restored"
