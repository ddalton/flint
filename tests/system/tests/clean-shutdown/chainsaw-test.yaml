# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
# Converted from kuttl 2026-10-02; see tests/system/README.md.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: clean-shutdown
spec:
  steps:
  - name: 00-pvc
    try:
    - apply:
        file: 00-pvc.yaml
    - assert:
        file: 00-assert.yaml
        timeout: 30s
  - name: 01-writer-pod
    try:
    - apply:
        file: 01-writer-pod.yaml
    - assert:
        file: 01-assert.yaml
        timeout: 120s
  - name: 02-delete-writer
    try:
    - delete:
        ref:
          apiVersion: v1
          kind: Pod
          name: writer-pod
    # 02-assert.yaml says "Verify pod is deleted" but asserted phase
    # Succeeded -- true only while kuttl ignored the `$patch: delete`.
    # The intent is absence.
    - error:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: writer-pod
        timeout: 60s
  - name: 03-verify-logs
    try:
    - script:
        shell: bash
        content: |
          #!/bin/bash
          set -e

          echo "=== Verifying Clean Shutdown in SPDK Logs ==="

          # Check all SPDK pods (simpler and more reliable)
          echo "Checking all SPDK node pods for clean shutdown logs..."
          SPDK_PODS=$(kubectl get pods -n flint-system -l app=flint-csi-node -o name)

          if [ -z "$SPDK_PODS" ]; then
            echo "ERROR: No SPDK pods found in flint-system namespace"
            exit 1
          fi

          echo "Found SPDK pods: $SPDK_PODS"

          FOUND_UNLOAD=false

          for POD in $SPDK_PODS; do
            echo "Checking logs for $POD..."

            # Check for clean shutdown indicator in spdk-tgt container
            if kubectl logs -n flint-system $POD -c spdk-tgt --tail=200 | grep -q "BLOBSTORE UNLOAD"; then
              echo "✅ Found BLOBSTORE UNLOAD in $POD"
              FOUND_UNLOAD=true

              # Show the unload section
              echo "=== Blobstore Unload Log Excerpt ==="
              kubectl logs -n flint-system $POD -c spdk-tgt --tail=200 | grep -A 5 "BLOBSTORE UNLOAD" || true
              echo "===================================="
            fi

            # Verify FLUSH support was advertised
            if kubectl logs -n flint-system $POD -c spdk-tgt | grep -q "supports FLUSH.*UBLK_ATTR_VOLATILE_CACHE"; then
              echo "✅ FLUSH support confirmed in $POD"
            fi
          done

          if [ "$FOUND_UNLOAD" = true ]; then
            echo "✅ PASS: Clean shutdown sequence detected"
            exit 0
          else
            echo "⚠️  WARNING: Blobstore unload not found in recent logs"
            echo "This may be expected if logs rotated, continuing..."
            exit 0
          fi
  - name: 04-fast-remount
    try:
    - apply:
        file: 04-fast-remount.yaml
    - assert:
        file: 04-assert.yaml
        timeout: 30s
  - name: 05-verify-no-recovery
    try:
    - script:
        shell: bash
        content: |
          #!/bin/bash
          set -e

          echo "=== Verifying No Recovery Was Triggered ==="

          # Check all SPDK pods (simpler and more reliable)
          echo "Checking all SPDK node pods for recovery status..."
          SPDK_PODS=$(kubectl get pods -n flint-system -l app=flint-csi-node -o name)

          if [ -z "$SPDK_PODS" ]; then
            echo "ERROR: No SPDK pods found in flint-system namespace"
            exit 1
          fi

          echo "Found SPDK pods: $SPDK_PODS"

          FOUND_RECOVERY=false
          FOUND_CLEAN=false

          for POD in $SPDK_PODS; do
            echo "Checking logs for $POD..."

            # Check for recovery in recent logs (last 200 lines should cover the remount) in spdk-tgt container
            if kubectl logs -n flint-system $POD -c spdk-tgt --tail=200 | grep -q "Recovery required"; then
              echo "❌ ERROR: Recovery was triggered in $POD"
              echo "This indicates blobstore was not cleanly unmounted!"
              FOUND_RECOVERY=true

              # Show the problematic section
              echo "=== Recovery Log Excerpt ==="
              kubectl logs -n flint-system $POD -c spdk-tgt --tail=200 | grep -B 5 -A 10 "Recovery required" || true
              echo "============================"
            fi

            # Check for clean blobstore message
            if kubectl logs -n flint-system $POD -c spdk-tgt --tail=200 | grep -q "Clean blobstore, no recovery needed"; then
              echo "✅ Found clean blobstore confirmation in $POD"
              FOUND_CLEAN=true

              # Show clean flag status
              echo "=== Clean Blobstore Log Excerpt ==="
              kubectl logs -n flint-system $POD -c spdk-tgt --tail=200 | grep -B 3 -A 2 "Clean blobstore" || true
              echo "===================================="
            fi
          done

          if [ "$FOUND_RECOVERY" = true ]; then
            echo "❌ FAIL: Recovery was triggered - patches may not be applied correctly"
            exit 1
          fi

          if [ "$FOUND_CLEAN" = true ]; then
            echo "✅ PASS: Clean blobstore confirmed, no recovery needed"
            exit 0
          fi

          echo "⚠️  WARNING: Could not verify clean mount status in recent logs"
          echo "Checking for FLUSH support as fallback verification..."

          # Fallback: verify FLUSH support exists (indicates patches are applied)
          for POD in $SPDK_PODS; do
            if kubectl logs -n flint-system $POD -c spdk-tgt | grep -q "FLUSH patch applied"; then
              echo "✅ FLUSH patch confirmed in $POD - patches are applied"
              echo "Clean mount status may not be logged, but system is configured correctly"
              exit 0
            fi
          done

          echo "⚠️  Could not fully verify clean shutdown behavior"
          echo "Manual verification recommended: check SPDK logs for 'clean flag: 1'"
          exit 0
  - name: 06-rapid-cycle
    try:
    - apply:
        file: 06-rapid-cycle.yaml
    - assert:
        file: 06-assert.yaml
        timeout: 30s
