# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pnfs-krb5
spec:
  description: >-
    pNFS Kerberos, Phase 1 (docs/nfs-kerberos.md, "pNFS"). A pNFS volume of
    the flint-pnfs-krb5 class mounts with sec=krb5i on two nodes and the
    pods share files; the MDS shard holds its own key,
    nfs/flint-pnfs-mds-0.flint-system.svc.cluster.local, in a Secret only
    it mounts, and each node maps the MDS ClusterIP the PV carries to that
    name; a few MiB written under krb5i land on the MDS and not on the data
    servers (layouts withheld from Kerberos callers); a sec=sys pNFS mount
    is refused by the MDS's krb5i floor; a user principal not in the
    allowlist (alice) is refused while the node's machine principal is not.
    Phase 2 (attached nodes only, the chart's default): a node reaches only
    the volumes attached to it, and loses one when it is detached.
  steps:
  - name: volumes-and-pods
    try:
    - apply:
        file: pvcs.yaml
    - apply:
        file: pods.yaml
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: pnfs-a
          status:
            phase: Running
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: pnfs-b
          status:
            phase: Running
    catch:
    - script:
        content: |
          kubectl get volumeattachments -o go-template='{{range .items}}{{.spec.source.persistentVolumeName}} {{.spec.nodeName}} attached={{.status.attached}} name={{with .status.attachmentMetadata}}{{index . "nfs.chert.us/krb5-server-name"}}{{end}}{{"\n"}}{{end}}'
          kubectl -n flint-system get kerberosprincipal,kerberosnodekeytab -A 2>/dev/null || true
          kubectl -n flint-system logs -l app=flint-csi-node -c flint-csi-driver --tail=-1 | grep -aE 'pNFS|krb5|hosts' | tail -30
  - name: kerberos-mounts-share-files
    try:
    - script:
        content: |
          set -eu
          for p in pnfs-a pnfs-b; do
            m=$(kubectl -n "$NAMESPACE" exec "$p" -- grep ' /data ' /proc/mounts)
            echo "$p: $m"
            case "$m" in *sec=krb5i*) ;; *) echo "FAIL: $p is not mounted with sec=krb5i"; exit 1 ;; esac
            # pNFS needs NFSv4.1 or later; the driver asks for 4.2.
            case "$m" in *vers=4.1*|*vers=4.2*) ;; *) echo "FAIL: $p is not an NFSv4.1+ mount"; exit 1 ;; esac
          done
          for i in $(seq 30); do
            a=$(kubectl -n "$NAMESPACE" exec pnfs-b -- cat /data/a 2>/dev/null || true)
            b=$(kubectl -n "$NAMESPACE" exec pnfs-a -- cat /data/b 2>/dev/null || true)
            [ "$a" = from-a ] && [ "$b" = from-b ] && { echo PASS; exit 0; }
            sleep 2
          done
          echo "FAIL: a=$a b=$b"; exit 1
  - name: the-mds-shard-has-a-key-of-its-own
    try:
    - script:
        content: |
          set -eu
          want=flint-pnfs-mds-0.flint-system.svc.cluster.local
          kubectl -n flint-system get kerberosprincipal flint-pnfs-mds-0 \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -qx True
          p=$(kubectl -n flint-system get kerberosprincipal flint-pnfs-mds-0 -o jsonpath='{.spec.principals[0]}')
          [ "$p" = "nfs/$want@FLINT.TEST" ] || { echo "FAIL: principal '$p', want nfs/$want@FLINT.TEST"; exit 1; }
          # The MDS pod mounts its shard's keytab Secret and no other.
          mds=$(kubectl -n flint-system get pod -l app=flint-pnfs-mds -o jsonpath='{.items[0].metadata.name}')
          # Its keytab and no other (the control TLS Secret aside: a CA
          # and certificate, no key of the realm).
          secrets=$(kubectl -n flint-system get pod "$mds" -o jsonpath='{range .spec.volumes[*]}{.secret.secretName}{" "}{end}')
          krb=$(echo $secrets | tr ' ' '\n' | grep -vx flint-pnfs-control-tls | xargs)
          [ "$krb" = flint-pnfs-mds-0-krb5 ] || { echo "FAIL: the MDS mounts Secrets '$secrets'"; exit 1; }
          kubectl -n flint-system get pod "$mds" -o jsonpath='{range .spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}' |
            grep -x 'KRB5_KTNAME=/etc/flint-krb5/krb5.keytab'
          # The keytab holds the shard's principal and nothing else.
          node=$(kubectl -n "$NAMESPACE" get pod pnfs-a -o jsonpath='{.spec.nodeName}')
          kubectl -n flint-system get secret flint-pnfs-mds-0-krb5 -o jsonpath='{.data.krb5\.keytab}' |
            base64 -d | docker exec -i "$node" sh -c 'cat > /tmp/mds.keytab && klist -k /tmp/mds.keytab; rm -f /tmp/mds.keytab' > /tmp/klist.$$
          cat /tmp/klist.$$
          grep -q "nfs/$want@FLINT.TEST" /tmp/klist.$$ || { echo "FAIL: no nfs/$want"; exit 1; }
          if grep '@FLINT.TEST' /tmp/klist.$$ | grep -v "nfs/$want@FLINT.TEST" | grep -q .; then
            echo "FAIL: the MDS keytab holds other principals"; exit 1
          fi
          # The PV carries a ClusterIP of shard 0 (its own Service or the
          # legacy alias), and the publish context names the shard.
          pv=$(kubectl -n "$NAMESPACE" get pvc krb5-pvc -o jsonpath='{.spec.volumeName}')
          ip=$(kubectl get pv "$pv" -o go-template='{{index .spec.csi.volumeAttributes "pnfs.chert.us/mds-ip"}}')
          s0=$(kubectl -n flint-system get svc flint-pnfs-mds-0 -o jsonpath='{.spec.clusterIP}')
          alias=$(kubectl -n flint-system get svc flint-pnfs-mds -o jsonpath='{.spec.clusterIP}')
          echo "PV $pv: mds-ip $ip (flint-pnfs-mds-0 $s0, flint-pnfs-mds $alias)"
          [ "$ip" = "$s0" ] || [ "$ip" = "$alias" ] || { echo "FAIL: mds-ip $ip is not shard 0's"; exit 1; }
          names=$(kubectl get volumeattachments -o go-template='{{range .items}}{{if eq .spec.source.persistentVolumeName "'"$pv"'"}}{{.spec.nodeName}}={{with .status.attachmentMetadata}}{{index . "nfs.chert.us/krb5-server-name"}}{{end}}{{"\n"}}{{end}}{{end}}')
          echo "$names"
          for p in pnfs-a pnfs-b; do
            n=$(kubectl -n "$NAMESPACE" get pod "$p" -o jsonpath='{.spec.nodeName}')
            echo "$names" | grep -qx "$n=$want" || { echo "FAIL: $n's VolumeAttachment does not name $want"; exit 1; }
            # The node maps that IP to that name, so rpc.gssd asks for it.
            docker exec "$n" grep -E "^$ip $want # flint-nfs-krb5$" /etc/hosts ||
              { echo "FAIL: $n has no hosts line '$ip $want'"; docker exec "$n" cat /etc/hosts; exit 1; }
          done
          echo PASS
  - name: krb5i-data-is-striped-on-the-data-servers
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          ds_bytes() { kubectl -n flint-system exec "$1" -c ds -- du -s --block-size=1 /data | cut -f1; }
          dss=$(kubectl -n flint-system get pod -l app=flint-pnfs-ds -o jsonpath='{.items[*].metadata.name}')
          [ "$(echo $dss | wc -w)" = 2 ] || { echo "FAIL: DS pods '$dss'"; exit 1; }
          for d in $dss; do eval "before_$(echo $d | tr - _)=$(ds_bytes $d)"; done
          # Each data server holds its own key, nfs/<pod>.flint-pnfs-ds-headless...
          for d in $dss; do
            want="nfs/$d.flint-pnfs-ds-headless.flint-system.svc.cluster.local@FLINT.TEST"
            kubectl -n flint-system get secret flint-pnfs-ds-krb5 -o jsonpath="{.data.$d\.keytab}" | base64 -d > /tmp/ds.keytab.$$
            node=$(kubectl -n "$NAMESPACE" get pod pnfs-a -o jsonpath='{.spec.nodeName}')
            docker exec -i "$node" sh -c 'cat > /tmp/ds.keytab && klist -k /tmp/ds.keytab; rm -f /tmp/ds.keytab' < /tmp/ds.keytab.$$ > /tmp/dsklist.$$
            rm -f /tmp/ds.keytab.$$
            grep -q "$want" /tmp/dsklist.$$ || { echo "FAIL: $d's keytab lacks $want"; cat /tmp/dsklist.$$; exit 1; }
            if grep '@FLINT.TEST' /tmp/dsklist.$$ | grep -v "$want" | grep -q .; then
              echo "FAIL: $d's keytab holds other principals"; cat /tmp/dsklist.$$; exit 1
            fi
          done
          # 8 MiB, eight 1 MiB stripes, under krb5i.
          kubectl -n "$NAMESPACE" exec pnfs-a -- dd if=/dev/urandom of=/data/big bs=1048576 count=8 conv=fsync
          sum_a=$(kubectl -n "$NAMESPACE" exec pnfs-a -- md5sum /data/big | cut -d' ' -f1)
          sum_b=$(kubectl -n "$NAMESPACE" exec pnfs-b -- md5sum /data/big | cut -d' ' -f1)
          [ "$sum_a" = "$sum_b" ] || { echo "FAIL: pnfs-b reads $sum_b, pnfs-a wrote $sum_a"; exit 1; }
          # The bytes are on both data servers ...
          for d in $dss; do
            b=$(eval echo "\$before_$(echo $d | tr - _)"); a=$(ds_bytes $d)
            echo "$d: /data $b -> $a bytes"
            [ $((a - b)) -ge 2097152 ] || { echo "FAIL: $d grew by $((a - b)) bytes: the data did not stripe there"; exit 1; }
          done
          # ... and the MDS keeps a sparse stub.
          mds=$(kubectl -n flint-system get pod -l app=flint-pnfs-mds -o jsonpath='{.items[0].metadata.name}')
          f=$(kubectl -n flint-system exec "$mds" -c mds -- find /data/exports -type f -name big)
          size=$(kubectl -n flint-system exec "$mds" -c mds -- stat -c %s "$f")
          alloc=$(kubectl -n flint-system exec "$mds" -c mds -- du -s --block-size=1 "$f" | cut -f1)
          echo "MDS $f: size $size, allocated $alloc"
          [ "$size" = 8388608 ] || { echo "FAIL: size $size"; exit 1; }
          [ "$alloc" -lt 1048576 ] || { echo "FAIL: the MDS holds the data ($alloc bytes allocated)"; exit 1; }
          # Under Kerberos, at the data servers: every data call was
          # RPCSEC_GSS, and none came below the krb5i floor (AUTH_SYS, or
          # GSS without integrity), which the floor would have refused.
          for d in $dss; do
            l=$(kubectl -n flint-system logs "$d" -c ds --tail=-1)
            echo "$l" | grep -F 'Security: floor krb5i; Kerberos on' ||
              { echo "FAIL: $d did not start with Kerberos and the krb5i floor"; echo "$l" | grep -F Security; exit 1; }
            n=$(echo "$l" | grep -cF 'RPCSEC_GSS_DATA' || true)
            echo "$d: $n RPCSEC_GSS_DATA calls"
            [ "$n" -gt 0 ] || { echo "FAIL: no Kerberos calls reached $d"; exit 1; }
            if echo "$l" | grep -F 'Refusing sec='; then
              echo "FAIL: a client sent $d calls below the floor"; exit 1
            fi
            # Phase 4: only signed handles, and every one the MDS handed
            # out verified for its node's session.
            echo "$l" | grep -F 'Filehandles: signed handles only' ||
              { echo "FAIL: $d does not enforce signed handles"; echo "$l" | grep -F Filehandles; exit 1; }
            # A refusal is a FAIL unless the handle verified for ANOTHER
            # attached node than the session's: kind's nodes share one
            # kernel, and a kernel without 6b9785dc8b13 ("nfs: don't share
            # pNFS DS connections between net namespaces", e.g. mainline
            # 6.12.0) sends one node's I/O on the DS session another node
            # made. Refusing that handle is Phase 4 working; the client
            # gets a fresh layout or goes through the MDS (E4), and the
            # md5 above shows the data is right either way.
            echo "$l" | grep -F 'DS PUTFH refused' | while IFS= read -r r; do
              own=$(echo "$r" | sed -nE 's/.*, node "([^"]*)", signed for node "[^"]*".*/\1/p')
              by=$(echo "$r" | sed -nE 's/.*, signed for node "([^"]*)".*/\1/p')
              if [ -n "$own" ] && [ -n "$by" ] && [ "$own" != "$by" ]; then
                echo "$d: node $own's session sent a handle signed for $by (a shared kernel's DS connection): refused, as it must be"
              else
                echo "FAIL: $d refused a handle the MDS handed out to this session's node: $r"; exit 1
              fi
            done
          done
          kubectl -n flint-system logs "$mds" -c mds --tail=-1 | grep -F 'layouts for Kerberos callers granted'
          echo PASS
    catch:
    - script:
        content: |
          for d in $(kubectl -n flint-system get pod -l app=flint-pnfs-ds -o jsonpath='{.items[*].metadata.name}'); do
            echo "== $d"; kubectl -n flint-system exec "$d" -c ds -- sh -c 'find /data -type f | head -20; du -s --block-size=1 /data'
            kubectl -n flint-system logs "$d" -c ds --tail=-1 | grep -aE 'Security|GSS|Refusing|refused|❌' | tail -20
          done
          for p in pnfs-a pnfs-b; do
            n=$(kubectl -n "$NAMESPACE" get pod "$p" -o jsonpath='{.spec.nodeName}')
            echo "== $n hosts"; docker exec "$n" grep -E 'flint-(nfs|pnfs-ds)-krb5' /etc/hosts
            docker exec "$n" sh -c 'journalctl -u rpc-gssd --no-pager | tail -15'
          done
          mds=$(kubectl -n flint-system get pod -l app=flint-pnfs-mds -o jsonpath='{.items[0].metadata.name}')
          kubectl -n flint-system logs "$mds" -c mds --tail=-1 | grep -aE 'F68a|Security|withheld|LAYOUT' | tail -20
  - name: sys-refused-by-the-floor
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # The sys volume's pod never runs: its mount is refused.
          for i in $(seq 60); do
            if kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=sys-pod,reason=FailedMount -o name | grep -q .; then
              kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=sys-pod,reason=FailedMount \
                -o jsonpath='{.items[0].message}'; echo
              phase=$(kubectl -n "$NAMESPACE" get pod sys-pod -o jsonpath='{.status.phase}')
              [ "$phase" != Running ] || { echo "FAIL: sys-pod is Running"; exit 1; }
              # By the MDS's floor, not by anything else on the way.
              for j in $(seq 20); do
                if kubectl -n flint-system logs -l app=flint-pnfs-mds -c mds --tail=-1 |
                    grep -F 'Refusing sec=sys call: this export requires at least sec=krb5i'; then
                  echo PASS; exit 0
                fi
                sleep 3
              done
              echo "FAIL: the MDS did not refuse a sec=sys call"; exit 1
            fi
            sleep 3
          done
          echo "FAIL: no FailedMount for sys-pod"; kubectl -n "$NAMESPACE" describe pod sys-pod; exit 1
    finally:
    - script:
        content: |
          # Stop the retries: a sec=sys mount attempt left running shares
          # nothing with the workers, but it fills the MDS log.
          kubectl -n "$NAMESPACE" delete pod sys-pod --ignore-not-found --grace-period=1
  - name: a-user-principal-is-refused
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # alice@FLINT.TEST: a principal of the realm, not a machine's, and
          # not in the allowlist (nfs.kerberos.allowedPrincipals' default).
          cat <<YAML | kubectl apply -f -
          apiVersion: krb5.ddalton.dev/v1alpha1
          kind: KerberosPrincipal
          metadata:
            name: pnfs-krb5-alice
            namespace: flint-system
          spec:
            realmRef: flint
            principals: [alice]
          YAML
          kubectl -n flint-system wait kerberosprincipal/pnfs-krb5-alice --timeout=2m \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True
          node=$(kubectl -n "$NAMESPACE" get pod pnfs-a -o jsonpath='{.spec.nodeName}')
          # Her ticket in uid 1000's ccache on that node, where rpc.gssd
          # looks for it.
          kubectl -n flint-system get secret pnfs-krb5-alice -o jsonpath='{.data.krb5\.keytab}' | base64 -d |
            docker exec -i "$node" sh -c 'cat > /tmp/alice.keytab'
          docker exec "$node" sh -c 'kinit -k -t /tmp/alice.keytab -c /tmp/krb5cc_1000 alice@FLINT.TEST &&
            chown 1000 /tmp/krb5cc_1000 && klist -c /tmp/krb5cc_1000'
          sed "s/NODE/$node/" alice-pod.yaml.tpl | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" wait pod/alice-pod --for=condition=Ready --timeout=2m
          if kubectl -n "$NAMESPACE" exec alice-pod -- ls /data 2>/tmp/alice.err; then
            echo "FAIL: alice reads the volume"; exit 1
          fi
          cat /tmp/alice.err
          # The MDS says why: alice is not on its list.
          for i in $(seq 30); do
            if kubectl -n flint-system logs -l app=flint-pnfs-mds -c mds --tail=-1 | grep -F 'alice@FLINT.TEST is not in FLINT_NFS_GSS_PRINCIPALS'; then
              # root on the same node (the machine principal) still reads it.
              [ "$(kubectl -n "$NAMESPACE" exec pnfs-a -- cat /data/a)" = from-a ]
              echo PASS; exit 0
            fi
            sleep 2
          done
          echo "FAIL: the MDS did not refuse alice by its allowlist"
          kubectl -n flint-system logs -l app=flint-pnfs-mds -c mds --tail=40; exit 1
    finally:
    - script:
        content: |
          # The pod holds krb5-pvc: left, it blocks the PVC's deletion.
          kubectl -n "$NAMESPACE" delete pod alice-pod --ignore-not-found --grace-period=1
          kubectl -n flint-system delete kerberosprincipal pnfs-krb5-alice --ignore-not-found
          node=$(kubectl -n "$NAMESPACE" get pod pnfs-a -o jsonpath='{.spec.nodeName}' 2>/dev/null) &&
            docker exec "$node" rm -f /tmp/alice.keytab /tmp/krb5cc_1000 || true
  - name: a-node-reaches-only-the-volumes-attached-to-it
    try:
    - script:
        timeout: 6m
        content: |
          set -eu
          na=$(kubectl -n "$NAMESPACE" get pod pnfs-a -o jsonpath='{.spec.nodeName}')
          nb=$(kubectl -n "$NAMESPACE" get pod pnfs-b -o jsonpath='{.spec.nodeName}')
          # A second Kerberos volume, used only on pnfs-a's node.
          cat <<YAML | kubectl -n "$NAMESPACE" apply -f -
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: solo-pvc
          spec:
            accessModes: [ReadWriteMany]
            resources:
              requests:
                storage: 1Gi
            storageClassName: flint-pnfs-krb5
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: pnfs-c
          spec:
            terminationGracePeriodSeconds: 1
            nodeSelector:
              kubernetes.io/hostname: $na
            containers:
            - name: c
              image: busybox
              command: [sh, -c, "echo from-c > /data/c && sleep 3600"]
              volumeMounts:
              - name: data
                mountPath: /data
            volumes:
            - name: data
              persistentVolumeClaim:
                claimName: solo-pvc
          YAML
          kubectl -n "$NAMESPACE" wait pod/pnfs-c --for=condition=Ready --timeout=3m
          [ "$(kubectl -n "$NAMESPACE" exec pnfs-c -- cat /data/c)" = from-c ]
          pv=$(kubectl -n "$NAMESPACE" get pvc solo-pvc -o jsonpath='{.spec.volumeName}')
          vol=$(kubectl get pv "$pv" -o go-template='{{index .spec.csi.volumeAttributes "pnfs.chert.us/volume-file"}}')
          ip=$(kubectl get pv "$pv" -o go-template='{{index .spec.csi.volumeAttributes "pnfs.chert.us/mds-ip"}}')
          echo "solo-pvc: PV $pv, volume $vol at $ip, attached to $na only"
          mds_log() { kubectl -n flint-system logs -l app=flint-pnfs-mds -c mds --tail=-1; }
          mds_log | grep -aF 'pNFS volume(s), attached' | tail -2
          # pnfs-b's node mounts the same MDS (krb5-pvc) and holds a
          # session there, but solo-pvc is not attached to it.
          docker exec "$nb" mkdir -p /mnt/rogue
          if docker exec "$nb" timeout 90 mount -t nfs4 -o vers=4.2,sec=krb5i "$ip:/$vol" /mnt/rogue; then
            docker exec "$nb" ls /mnt/rogue || true
            docker exec "$nb" umount -f /mnt/rogue || true
            echo "FAIL: $nb mounted $vol, which is not attached to it"; exit 1
          fi
          refused() { mds_log | grep -aE "(LOOKUP \"$vol\"|PUTFH) refused: volume $vol is not attached to the node of this session"; }
          for i in $(seq 30); do refused && break; sleep 2; done
          refused >/dev/null || { echo "FAIL: the MDS did not refuse $vol to $nb"; mds_log | grep -aE 'refused|attached' | tail -20; exit 1; }
          # Its own volume still works there, and solo-pvc on pnfs-a's node.
          [ "$(kubectl -n "$NAMESPACE" exec pnfs-b -- cat /data/a)" = from-a ]
          [ "$(kubectl -n "$NAMESPACE" exec pnfs-c -- cat /data/c)" = from-c ]
          # Detach: pnfs-a's node loses solo-pvc, and keeps krb5-pvc.
          # In the order Kubernetes does it: kubelet unmounts (NodeUnpublish,
          # NodeUnstage) and drops the volume from the node's volumesInUse;
          # only then does the attach/detach controller delete the
          # VolumeAttachment. On a Ready node nothing times out, so a stuck
          # unstage holds the attachment forever: name the stuck layer.
          kubectl -n "$NAMESPACE" delete pod pnfs-c --grace-period=1
          in_use() { kubectl get node "$na" -o jsonpath='{range .status.volumesInUse[*]}{@}{"\n"}{end}' | grep -q "\^$pv~m"; }
          for i in $(seq 60); do in_use || break; sleep 2; done
          if in_use; then
            echo "FAIL: kubelet on $na still has $pv in use: NodeUnstage did not finish"
            docker exec "$na" sh -c 'journalctl -u kubelet --no-pager | grep -E "UnmountDevice|$pv" | tail -5' || true
            exit 1
          fi
          attached() { kubectl get volumeattachments -o jsonpath='{range .items[*]}{.spec.source.persistentVolumeName}{"\n"}{end}' | grep -qx "$pv"; }
          for i in $(seq 60); do attached || break; sleep 2; done
          if attached; then
            echo "FAIL: $pv left $na's volumesInUse but is still attached"
            kubectl get volumeattachments -o wide | grep "$pv"; exit 1
          fi
          # The node may still MOUNT it: both volumes are directories of
          # one export, so the kernel shares one superblock between them,
          # and solo-pvc's directory is still in that superblock's dentry
          # cache from pnfs-c, which needs no LOOKUP. Reading its data does
          # (OPEN, PUTFH), and that is what the detach must refuse.
          before=$(mds_log | grep -acE "refused: volume $vol is not attached" || true)
          docker exec "$na" mkdir -p /mnt/rogue
          ok=0
          for i in $(seq 15); do
            docker exec "$na" timeout 90 mount -t nfs4 -o vers=4.2,sec=krb5i "$ip:/$vol" /mnt/rogue 2>/dev/null || { ok=1; break; }
            if docker exec "$na" timeout 30 cat /mnt/rogue/c 2>/dev/null; then
              # The watch may not have seen the detach yet: try again.
              docker exec "$na" umount -f /mnt/rogue || true
              sleep 2; continue
            fi
            docker exec "$na" umount -f /mnt/rogue || true
            ok=1; break
          done
          [ "$ok" = 1 ] || { echo "FAIL: $na still reads $vol after the detach"; exit 1; }
          after=$(mds_log | grep -acE "refused: volume $vol is not attached" || true)
          [ "$after" -gt "$before" ] || { echo "FAIL: $na was refused $vol, but not by the MDS's gate"; exit 1; }
          mds_log | grep -aE "refused: volume $vol is not attached" | tail -2
          [ "$(kubectl -n "$NAMESPACE" exec pnfs-a -- cat /data/b)" = from-b ]
          echo PASS
    catch:
    - script:
        content: |
          kubectl get volumeattachments -o jsonpath='{range .items[*]}{.spec.source.persistentVolumeName} {.spec.nodeName} attached={.status.attached}{"\n"}{end}'
          kubectl -n flint-system logs -l app=flint-pnfs-mds -c mds --tail=-1 | grep -aE 'refused|attached|ATTACHED_NODES|Kubernetes API|PersistentVolumes' | tail -30
    finally:
    - script:
        content: |
          for p in pnfs-a pnfs-b; do
            n=$(kubectl -n "$NAMESPACE" get pod "$p" -o jsonpath='{.spec.nodeName}' 2>/dev/null) &&
              docker exec "$n" sh -c 'umount -f /mnt/rogue 2>/dev/null; true' || true
          done
          kubectl -n "$NAMESPACE" delete pod pnfs-c --ignore-not-found --grace-period=1
