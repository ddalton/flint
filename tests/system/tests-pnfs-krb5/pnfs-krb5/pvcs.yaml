# One pNFS volume of the Kerberos class (flint-pnfs-krb5, mountOptions
# sec=krb5i), and one of the plain class (flint-pnfs, sec=sys), which the
# MDS's krb5i floor (pnfs.kerberos.minSec) refuses.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: krb5-pvc
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
  storageClassName: flint-pnfs-krb5
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sys-pvc
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
  storageClassName: flint-pnfs
