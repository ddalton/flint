# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rwx-krb5
spec:
  description: >-
    An RWX volume of the flint-krb5 class mounts with sec=krb5i on two
    nodes (their rpc.gssd with keys from krb5-operator, the server's
    nfs/flint-nfs.flint-system.svc.cluster.local key, the node's hosts
    entry for the server's ClusterIP), and the pods share files; a sec=sys
    mount is refused by the servers' krb5i floor; a user principal with a
    real ticket (alice, uid 1000 on a node) is refused by the servers'
    principal allowlist, while the node's machine principal is not.
  steps:
  - name: volumes-and-pods
    try:
    - apply:
        file: pvcs.yaml
    - apply:
        file: pods.yaml
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: krb5-a
          status:
            phase: Running
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: krb5-b
          status:
            phase: Running
  - name: kerberos-mounts-share-files
    try:
    - script:
        content: |
          set -eu
          for p in krb5-a krb5-b; do
            m=$(kubectl -n "$NAMESPACE" exec "$p" -- grep ' /data ' /proc/mounts)
            echo "$p: $m"
            case "$m" in *sec=krb5i*) ;; *) echo "FAIL: $p is not mounted with sec=krb5i"; exit 1 ;; esac
          done
          for i in $(seq 30); do
            a=$(kubectl -n "$NAMESPACE" exec krb5-b -- cat /data/a 2>/dev/null || true)
            b=$(kubectl -n "$NAMESPACE" exec krb5-a -- cat /data/b 2>/dev/null || true)
            [ "$a" = from-a ] && [ "$b" = from-b ] && { echo PASS; exit 0; }
            sleep 2
          done
          echo "FAIL: a=$a b=$b"; exit 1
  - name: sys-refused-by-the-floor
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # The sys volume's pod never runs: its mount is refused.
          for i in $(seq 60); do
            if kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=sys-pod,reason=FailedMount -o name | grep -q .; then
              kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=sys-pod,reason=FailedMount \
                -o jsonpath='{.items[0].message}'; echo
              phase=$(kubectl -n "$NAMESPACE" get pod sys-pod -o jsonpath='{.status.phase}')
              [ "$phase" != Running ] || { echo "FAIL: sys-pod is Running"; exit 1; }
              echo PASS; exit 0
            fi
            sleep 3
          done
          echo "FAIL: no FailedMount for sys-pod"; kubectl -n "$NAMESPACE" describe pod sys-pod; exit 1
  - name: a-user-principal-is-refused
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # alice@FLINT.TEST: a principal of the realm, not a machine's.
          cat <<YAML | kubectl apply -f -
          apiVersion: krb5.ddalton.dev/v1alpha1
          kind: KerberosPrincipal
          metadata:
            name: rwx-krb5-alice
            namespace: flint-system
          spec:
            realmRef: flint
            principals: [alice]
          YAML
          kubectl -n flint-system wait kerberosprincipal/rwx-krb5-alice --timeout=2m \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True
          node=$(kubectl -n "$NAMESPACE" get pod krb5-a -o jsonpath='{.spec.nodeName}')
          # Her ticket in uid 1000's ccache on that node, where rpc.gssd
          # looks for it.
          kubectl -n flint-system get secret rwx-krb5-alice -o jsonpath='{.data.krb5\.keytab}' | base64 -d |
            docker exec -i "$node" sh -c 'cat > /tmp/alice.keytab'
          docker exec "$node" sh -c 'kinit -k -t /tmp/alice.keytab -c /tmp/krb5cc_1000 alice@FLINT.TEST &&
            chown 1000 /tmp/krb5cc_1000 && klist -c /tmp/krb5cc_1000'
          sed "s/NODE/$node/" alice-pod.yaml.tpl | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" wait pod/alice-pod --for=condition=Ready --timeout=2m
          if kubectl -n "$NAMESPACE" exec alice-pod -- ls /data 2>/tmp/alice.err; then
            echo "FAIL: alice reads the volume"; exit 1
          fi
          cat /tmp/alice.err
          # The server says why: alice is not on its list.
          for i in $(seq 30); do
            if kubectl -n flint-system logs -l app=flint-nfs-server --tail=-1 | grep -F 'alice@FLINT.TEST is not in FLINT_NFS_GSS_PRINCIPALS'; then
              # root on the same node (the machine principal) still reads it.
              [ "$(kubectl -n "$NAMESPACE" exec krb5-a -- cat /data/a)" = from-a ]
              echo PASS; exit 0
            fi
            sleep 2
          done
          echo "FAIL: the server did not refuse alice by its allowlist"
          kubectl -n flint-system logs -l app=flint-nfs-server --tail=40; exit 1
    finally:
    - script:
        content: |
          # The pod holds krb5-pvc: left, it blocks the PVC's deletion.
          kubectl -n "$NAMESPACE" delete pod alice-pod --ignore-not-found --grace-period=1
          kubectl -n flint-system delete kerberosprincipal rwx-krb5-alice --ignore-not-found
          node=$(kubectl -n "$NAMESPACE" get pod krb5-a -o jsonpath='{.spec.nodeName}' 2>/dev/null) &&
            docker exec "$node" rm -f /tmp/alice.keytab /tmp/krb5cc_1000 || true
