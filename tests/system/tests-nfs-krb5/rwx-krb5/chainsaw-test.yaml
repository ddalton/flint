# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/v0.2.15/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rwx-krb5
spec:
  description: >-
    An RWX volume of the flint-krb5 class mounts with sec=krb5i on two
    nodes (their rpc.gssd with keys from krb5-operator, the server's own
    nfs/<pv>.flint-nfs.flint-system.svc.cluster.local key, the node's hosts
    entry for the server's ClusterIP), and the pods share files; the
    volume's server holds that key alone, and the shared key is not in
    it; a sec=sys
    mount is refused by the servers' krb5i floor; a user principal with a
    real ticket (alice, uid 1000 on a node) is refused by the servers'
    principal allowlist, while the node's machine principal is not; bob,
    mapped to 2000:2000, owns what he creates and is denied a file only
    root may read; a node the volume is not attached to, with its own
    valid machine key, is refused; deleting the volume deletes its
    principal.
  steps:
  - name: volumes-and-pods
    try:
    - apply:
        file: pvcs.yaml
    - apply:
        file: pods.yaml
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: krb5-a
          status:
            phase: Running
    - assert:
        resource:
          apiVersion: v1
          kind: Pod
          metadata:
            name: krb5-b
          status:
            phase: Running
    catch:
    # Who the volumes' servers think they serve (nfs::node_authz), and the
    # attachments as the cluster has them.
    - script:
        content: |
          kubectl get volumeattachments -o jsonpath='{range .items[*]}{.spec.source.persistentVolumeName} {.spec.nodeName} attached={.status.attached}{"\n"}{end}'
          kubectl -n flint-system get pods -l app=flint-nfs-server -o jsonpath='{range .items[*]}{.metadata.name} sa={.spec.serviceAccountName}{"\n"}{end}'
          kubectl -n flint-system logs -l app=flint-nfs-server --tail=-1 | grep -aE 'ATTACHED_NODES|serves nodes|Only the nodes|Kubernetes API|VolumeAttachments' | head -20
  - name: kerberos-mounts-share-files
    try:
    - script:
        content: |
          set -eu
          for p in krb5-a krb5-b; do
            m=$(kubectl -n "$NAMESPACE" exec "$p" -- grep ' /data ' /proc/mounts)
            echo "$p: $m"
            case "$m" in *sec=krb5i*) ;; *) echo "FAIL: $p is not mounted with sec=krb5i"; exit 1 ;; esac
          done
          for i in $(seq 30); do
            a=$(kubectl -n "$NAMESPACE" exec krb5-b -- cat /data/a 2>/dev/null || true)
            b=$(kubectl -n "$NAMESPACE" exec krb5-a -- cat /data/b 2>/dev/null || true)
            [ "$a" = from-a ] && [ "$b" = from-b ] && { echo PASS; exit 0; }
            sleep 2
          done
          echo "FAIL: a=$a b=$b"; exit 1
  - name: the-volume-server-has-a-key-of-its-own
    try:
    - script:
        content: |
          set -eu
          pv=$(kubectl -n "$NAMESPACE" get pvc krb5-pvc -o jsonpath='{.spec.volumeName}')
          want="$pv.flint-nfs.flint-system.svc.cluster.local"
          name=$(kubectl -n flint-system get pod "flint-nfs-$pv" -o jsonpath='{.metadata.annotations.chert\.us/krb5-server-name}')
          [ "$name" = "$want" ] || { echo "FAIL: server name '$name', want $want"; exit 1; }
          secrets=$(kubectl -n flint-system get pod "flint-nfs-$pv" -o jsonpath='{range .spec.volumes[*]}{.secret.secretName}{" "}{end}')
          case " $secrets " in *" flint-nfs-krb5-$pv "*) ;; *) echo "FAIL: server mounts '$secrets'"; exit 1 ;; esac
          case " $secrets " in *" flint-nfs-krb5-keytab "*) echo "FAIL: server mounts the shared keytab"; exit 1 ;; esac
          kubectl -n flint-system get kerberosprincipal "flint-nfs-$pv" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' | grep -qx True
          # The keytab holds the volume's principal and nothing else.
          node=$(kubectl -n "$NAMESPACE" get pod krb5-a -o jsonpath='{.spec.nodeName}')
          kubectl -n flint-system get secret "flint-nfs-krb5-$pv" -o jsonpath='{.data.krb5\.keytab}' |
            base64 -d | docker exec -i "$node" sh -c 'cat > /tmp/vol.keytab && klist -k /tmp/vol.keytab; rm -f /tmp/vol.keytab' > /tmp/klist.$$
          cat /tmp/klist.$$
          grep -q "nfs/$want@FLINT.TEST" /tmp/klist.$$ || { echo "FAIL: no nfs/$want"; exit 1; }
          if grep '@FLINT.TEST' /tmp/klist.$$ | grep -v "nfs/$want@FLINT.TEST" | grep -q .; then
            echo "FAIL: the volume's keytab holds other principals"; exit 1
          fi
          # The node maps the server's IP to that name.
          ip=$(kubectl -n flint-system get svc "flint-nfs-$pv" -o jsonpath='{.spec.clusterIP}')
          docker exec "$node" grep -E "^$ip $want # flint-nfs-krb5$" /etc/hosts
          echo PASS
  - name: sys-refused-by-the-floor
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # The sys volume's pod never runs: its mount is refused.
          for i in $(seq 60); do
            if kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=sys-pod,reason=FailedMount -o name | grep -q .; then
              kubectl -n "$NAMESPACE" get events --field-selector involvedObject.name=sys-pod,reason=FailedMount \
                -o jsonpath='{.items[0].message}'; echo
              phase=$(kubectl -n "$NAMESPACE" get pod sys-pod -o jsonpath='{.status.phase}')
              [ "$phase" != Running ] || { echo "FAIL: sys-pod is Running"; exit 1; }
              echo PASS; exit 0
            fi
            sleep 3
          done
          echo "FAIL: no FailedMount for sys-pod"; kubectl -n "$NAMESPACE" describe pod sys-pod; exit 1
  - name: a-user-principal-is-refused
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # alice@FLINT.TEST: a principal of the realm, not a machine's.
          cat <<YAML | kubectl apply -f -
          apiVersion: krb5.ddalton.dev/v1alpha1
          kind: KerberosPrincipal
          metadata:
            name: rwx-krb5-alice
            namespace: flint-system
          spec:
            realmRef: flint
            principals: [alice]
          YAML
          kubectl -n flint-system wait kerberosprincipal/rwx-krb5-alice --timeout=2m \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True
          node=$(kubectl -n "$NAMESPACE" get pod krb5-a -o jsonpath='{.spec.nodeName}')
          # Her ticket in uid 1000's ccache on that node, where rpc.gssd
          # looks for it.
          kubectl -n flint-system get secret rwx-krb5-alice -o jsonpath='{.data.krb5\.keytab}' | base64 -d |
            docker exec -i "$node" sh -c 'cat > /tmp/alice.keytab'
          docker exec "$node" sh -c 'kinit -k -t /tmp/alice.keytab -c /tmp/krb5cc_1000 alice@FLINT.TEST &&
            chown 1000 /tmp/krb5cc_1000 && klist -c /tmp/krb5cc_1000'
          sed "s/NODE/$node/" alice-pod.yaml.tpl | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" wait pod/alice-pod --for=condition=Ready --timeout=2m
          if kubectl -n "$NAMESPACE" exec alice-pod -- ls /data 2>/tmp/alice.err; then
            echo "FAIL: alice reads the volume"; exit 1
          fi
          cat /tmp/alice.err
          # The server says why: alice is not on its list.
          for i in $(seq 30); do
            if kubectl -n flint-system logs -l app=flint-nfs-server --tail=-1 | grep -F 'alice@FLINT.TEST is not in FLINT_NFS_GSS_PRINCIPALS'; then
              # root on the same node (the machine principal) still reads it.
              [ "$(kubectl -n "$NAMESPACE" exec krb5-a -- cat /data/a)" = from-a ]
              echo PASS; exit 0
            fi
            sleep 2
          done
          echo "FAIL: the server did not refuse alice by its allowlist"
          kubectl -n flint-system logs -l app=flint-nfs-server --tail=40; exit 1
    finally:
    - script:
        content: |
          # The pod holds krb5-pvc: left, it blocks the PVC's deletion.
          kubectl -n "$NAMESPACE" delete pod alice-pod --ignore-not-found --grace-period=1
          kubectl -n flint-system delete kerberosprincipal rwx-krb5-alice --ignore-not-found
          node=$(kubectl -n "$NAMESPACE" get pod krb5-a -o jsonpath='{.spec.nodeName}' 2>/dev/null) &&
            docker exec "$node" rm -f /tmp/alice.keytab /tmp/krb5cc_1000 || true
  - name: a-mapped-user-is-who-the-map-says
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # bob@FLINT.TEST is 2000:2000 (nfs.kerberos.idmap in kind-nfs-only.sh).
          cat <<YAML | kubectl apply -f -
          apiVersion: krb5.ddalton.dev/v1alpha1
          kind: KerberosPrincipal
          metadata:
            name: rwx-krb5-bob
            namespace: flint-system
          spec:
            realmRef: flint
            principals: [bob]
          YAML
          kubectl -n flint-system wait kerberosprincipal/rwx-krb5-bob --timeout=2m \
            --for=jsonpath='{.status.conditions[?(@.type=="Ready")].status}'=True
          node=$(kubectl -n "$NAMESPACE" get pod krb5-a -o jsonpath='{.spec.nodeName}')
          kubectl -n flint-system get secret rwx-krb5-bob -o jsonpath='{.data.krb5\.keytab}' | base64 -d |
            docker exec -i "$node" sh -c 'cat > /tmp/bob.keytab'
          docker exec "$node" sh -c 'kinit -k -t /tmp/bob.keytab -c /tmp/krb5cc_2000 bob@FLINT.TEST &&
            chown 2000 /tmp/krb5cc_2000'
          # root (the machine principal): a directory anyone may write, and
          # a file only root may read.
          kubectl -n "$NAMESPACE" exec krb5-a -- sh -c 'mkdir -p /data/shared && chmod 1777 /data/shared &&
            echo secret > /data/secret && chmod 0600 /data/secret'
          sed "s/NODE/$node/; s/alice-pod/bob-pod/; s/runAsUser: 1000/runAsUser: 2000/; s/runAsGroup: 1000/runAsGroup: 2000/" \
            alice-pod.yaml.tpl | kubectl -n "$NAMESPACE" apply -f -
          kubectl -n "$NAMESPACE" wait pod/bob-pod --for=condition=Ready --timeout=2m
          if ! kubectl -n "$NAMESPACE" exec bob-pod -- sh -c 'echo hi > /data/shared/bob'; then
            echo "FAIL: bob cannot create in a 1777 directory; the NFS server's view:"
            kubectl -n flint-system get pods -l app=flint-nfs-server -o jsonpath='{range .items[*].spec.containers[*].env[*]}{.name}={.value}{"\n"}{end}' |
              grep -E 'GSS|ENFORCE|MIN_SEC'
            kubectl -n flint-system logs -l app=flint-nfs-server --tail=-1 | grep -aE 'bob|DENIED|would deny|refused|map to unix' | tail -20
            kubectl -n "$NAMESPACE" exec krb5-a -- ls -la /data /data/shared
            exit 1
          fi
          # Created as bob's mapped identity, as root sees it.
          owner=$(kubectl -n "$NAMESPACE" exec krb5-a -- stat -c %u:%g /data/shared/bob)
          [ "$owner" = 2000:2000 ] || { echo "FAIL: /data/shared/bob is $owner, not 2000:2000"; exit 1; }
          # Permissions now apply to a Kerberos caller.
          if kubectl -n "$NAMESPACE" exec bob-pod -- cat /data/secret 2>/tmp/bob.err; then
            echo "FAIL: bob read root's 0600 file"; exit 1
          fi
          cat /tmp/bob.err
          [ "$(kubectl -n "$NAMESPACE" exec krb5-a -- cat /data/secret)" = secret ]
          echo PASS
    finally:
    - script:
        content: |
          kubectl -n "$NAMESPACE" delete pod bob-pod --ignore-not-found --grace-period=1
          kubectl -n flint-system delete kerberosprincipal rwx-krb5-bob --ignore-not-found
          node=$(kubectl -n "$NAMESPACE" get pod krb5-a -o jsonpath='{.spec.nodeName}' 2>/dev/null) &&
            docker exec "$node" rm -f /tmp/bob.keytab /tmp/krb5cc_2000 || true
  - name: a-node-the-volume-is-not-attached-to-is-refused
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          # The control plane has its own machine key (host/, nfs/) and
          # rpc.gssd, but no pod of this volume, so no VolumeAttachment.
          cp=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{.items[0].metadata.name}')
          pv=$(kubectl -n "$NAMESPACE" get pvc krb5-pvc -o jsonpath='{.spec.volumeName}')
          if kubectl get volumeattachments -o jsonpath='{range .items[*]}{.spec.source.persistentVolumeName} {.spec.nodeName}{"\n"}{end}' | grep -q "^$pv $cp$"; then
            echo "FAIL: the volume is attached to $cp"; exit 1
          fi
          ip=$(kubectl -n flint-system get svc "flint-nfs-$pv" -o jsonpath='{.spec.clusterIP}')
          # What the node plugin would write before a Kerberos mount: the
          # volume's own server name, so the ticket is one the server can
          # read and only the attachments refuse it.
          docker exec "$cp" sh -c "echo '$ip $pv.flint-nfs.flint-system.svc.cluster.local # rogue-test' >> /etc/hosts && mkdir -p /mnt/rogue"
          if docker exec "$cp" timeout 90 mount -t nfs4 -o vers=4.2,sec=krb5i "$ip:/" /mnt/rogue; then
            docker exec "$cp" umount -f /mnt/rogue || true
            echo "FAIL: $cp mounted a volume not attached to it"; exit 1
          fi
          for i in $(seq 30); do
            if kubectl -n flint-system logs -l app=flint-nfs-server --tail=-1 | grep -E "EXCHANGE_ID refused: gss:(host|nfs)/$cp@FLINT.TEST is not a node this volume is attached to"; then
              # The attached nodes still use it.
              [ "$(kubectl -n "$NAMESPACE" exec krb5-b -- cat /data/a)" = from-a ]
              echo PASS; exit 0
            fi
            sleep 2
          done
          echo "FAIL: the server did not refuse $cp by its attachments"
          kubectl -n flint-system logs -l app=flint-nfs-server --tail=-1 | grep -aE 'refused|attached|serves nodes' | tail -20
          exit 1
    finally:
    - script:
        content: |
          cp=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o jsonpath='{.items[0].metadata.name}')
          docker exec "$cp" sh -c "umount -f /mnt/rogue 2>/dev/null; grep -v '# rogue-test' /etc/hosts > /tmp/h && cat /tmp/h > /etc/hosts" || true
  - name: deleting-the-volume-deletes-its-principal
    try:
    - script:
        timeout: 4m
        content: |
          set -eu
          pv=$(kubectl -n "$NAMESPACE" get pvc krb5-pvc -o jsonpath='{.spec.volumeName}')
          kubectl -n "$NAMESPACE" delete pod krb5-a krb5-b --wait=true
          kubectl -n "$NAMESPACE" delete pvc krb5-pvc --wait=true
          kubectl wait pv "$pv" --for=delete --timeout=2m || true
          kubectl -n flint-system wait kerberosprincipal "flint-nfs-$pv" --for=delete --timeout=2m
          echo PASS
