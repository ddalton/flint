# Default values for flint-csi-driver.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

crds:
  # Set to false if you have already installed the snapshot CRDs in your cluster
  # (they are often installed by RKE2, EKS, or other snapshot controllers)
  installSnapshotCRDs: true
  
  # SPDK-specific CRDs are NO LONGER NEEDED in minimal state architecture
  # The CSI driver now queries SPDK directly for real-time data
  installSpdkCRDs: false

images:
  repository: dilipdalton  # Docker Hub registry
  flintCsiDriver:
    name: flint-driver      # CSI Driver binary (supports controller and node modes via CSI_MODE env var)
    tag: "1.29.0"       # 1.29.0: no CSI-driver behaviour changes — driver and MDS share the crate so this image moves in lockstep. The release headline is flint-lite: the front-door contract, cross-cluster advertiseAddress, and four fixes worth knowing if you run the hub (see the flint-pnfs note). PRIOR CONTEXT FOLLOWS. 1.28.0: THE IDLE-LIFECYCLE RELEASE. ⚠ CONTAINS THE FIX FOR A SHIPPED BUG: the csi-driver could NOT START in 1.26.0 or 1.27.0 (rustls 0.23 refused to guess a CryptoProvider once the S3 tier's AWS SDK brought aws-lc-rs alongside ring) — upgrade off those two tags. Also: the NFS server FOLLOWED SYMLINKS out of the export, so a link to the hub's state db or IRSA token was readable through any mount and CREATE truncated the target. New: the FlintShare operator, the hub's /status + HTTP file API, and the idle ladder (suspend on quiet, hibernate on verified flush). Driver and MDS share the crate so both images move in lockstep. PRIOR CONTEXT FOLLOWS. 1.27.0: THE COLD-READ RELEASE (flint-lite S3 tier; multi-arch amd64+arm64). hydrateFetchParallel (default 6) fans a restore out over parallel ranged GETs (~72.5 -> ~10-13 s/GiB); hydrateWarmAfterImport bulk-restores a DR-imported tree smallest-first on its own pool, resumable across restarts; the eviction-marker cycle guard went INSERT-ONLY (restore completions no longer DELAY unrelated reads or livelock long COPYs under hydration bursts — model-certified, formal gate 173). No CSI/pNFS behavior changes; driver and MDS share the crate so both images move in lockstep. PRIOR CONTEXT FOLLOWS. 1.26.0: MULTI-ARCH RESTORED (amd64+arm64 — 1.25.x were amd64-only). No CSI-driver behavior changes; the release headline is flint-lite + the S3 tier (its own chart, flint-lite-chart/), and this image moves in lockstep because driver and MDS share the crate. PRIOR CONTEXT FOLLOWS. 1.25.2: a shrinking ftruncate could destroy the WHOLE file (a block-class truncate freed the extent containing the truncation point, prefix included, silently) — fix if you use layout: pnfs-block. Also: block PVCs are now refused unless single-node + volumeMode: Filesystem, and a composer death no longer leaves volumes undeletable (ControllerPublish/Unpublish/Delete ask siblings). PRIOR CONTEXT FOLLOWS. 1.25.1: a failed `nvme connect` now names the incumbent controller when this node's host NQN is already held under a different hostid — the kernel refuses that pair and nvme-cli reports only "Invalid argument". UPGRADING FROM < 1.25.0: rolling csi-node is NOT enough, drain pre-1.25.0 NVMe-oF connections or every later attach on that node is refused. PRIOR CONTEXT FOLLOWS. THE SILENT-ZEROS AND COLD-OPEN RELEASE. F67: a lost placement binding turned striped reads into silent zeros — wrong data, not an error, so nothing upstream could notice. F69: the ~5s cold-open stall was OUR OPEN reply, not the client — a no-create OPEN left the current filehandle at the parent directory, the client re-OPENed, got EISDIR and waited out a 5s kernel timeout (lima 6.3s -> 0.75s; fleet numbers NOT re-measured). F66: the MDS applies fallback I/O to the stripes instead of refusing it. F68b: a DS must be reachable before it is grantable, so a bound-but-unregistered DS can no longer be handed out in a layout. Plus a READ payload now reaches the socket without being copied three times (71.3% CPU cut, measured), operator mountOptions replace the driver defaults instead of racing them, and pNFS multipath trunking ships per-DS address lists in GETDEVICEINFO — kernel-trunk-proven, but THE MOUNT MUST CARRY nconnect>=2 OR THE KERNEL SILENTLY REFUSES EVERY TRUNK, and its scaling rematch is still pending. FLINT_DS_ODIRECT adds an opt-in O_DIRECT DS read path, DEFAULT OFF and never measured against a real DS — experimental. NOT gate-tested as a bundle: each change was proven on the cluster it was written for, but no single run has exercised them together. PRIOR CONTEXT FOLLOWS. Geometry, mount options and consumer-side I/O bounding, ON TOP of the NFSv4.2 correctness release below. THREE reasons this moved off 1.23.0, and the first one silently voids measurements rather than failing: (1) 1.23.0 IGNORES stripeWidth — the MDS logged `5 DSes` for a volume created with stripeWidth=1, so every per-PVC geometry this chart documents was decoration and any DS-scaling number taken against it is measuring a full-width volume whatever the class said; (2) it mounts `vers=4.1, sec=null` while the chart advertises 4.2 + sec=sys. Both fixes are in e7b8d38, which is NOT an ancestor of v1.23.0 — chart 1.24.0 shipped documentation for behaviour its own pinned image did not have. (3) rc2 adds 560c1d1: the kernel initiator a CONSUMER's filesystem sits on took ctrl_loss_tmo=1800 with fast_io_fail OFF, so a dead target parked umount in D state for 30 minutes with no inverse — `reboot` then wedged too, in ksys_sync on the same superblock. rc1 predates that fix by 46 minutes. Verified live on runay: width-1 reports `1 DSes ["flint-pnfs-ds-0"]` with 100% of egress from that node, and a class carrying rsize/wsize/vers/timeo reaches /proc/mounts intact while the driver's own sec=sys and nconnect=4 survive. The MDS half of geometry is in the same crate, so images.pnfs MUST move in lockstep. The NFSv4.2 correctness release. Two bugs here were reachable from an ordinary user command and neither was visible from reading the code. CLONE opened the destination truncate(true) BEFORE the FICLONE ioctl that decides whether it can clone, so on ext4 (no reflink, and a shipped option) every whole-file `cp --reflink=always` emptied the destination and rebuilt it non-atomically — an ENOSPC there told the client CLONE FAILED with the file already gone. COPY encoded a hardcoded zero wr_writeverf commented "sync copy: unused"; Linux sends COPY and COMMIT in ONE compound and compares the two verifiers, so it read every successful copy as a server reboot and reissued it forever — one 1 MiB copy_file_range() measured at 264,601 COPY RPCs, each performed in full, syscall never returned. Plus: 4.2 opcodes were routed purely by opcode NUMBER with no minor-version gate, making the pNFS mount's minorversion=1 a CLIENT CONVENTION rather than a server property; COPY/CLONE/ALLOCATE/DEALLOCATE/SEEK ignored striped files entirely (guarded now, and the refusal is free — the client caches it per mount); ca_source_server was never decoded so an inter-server copy was silently performed LOCALLY and reported OK; and striped files reported space_used=0, which made `tar --sparse` back up a 24 MiB file as a 10,240-byte archive restoring ZERO non-zero bytes. Verified against a real Linux 6.8 client with server and client both on Linux; pynfs 171/171 PASS and the new 4.2 gate 4/4.           # The maintenance-and-proof release. HEADLINE BEHAVIOUR CHANGE: maintenance.drainRoll defaults ON, so the csi-node DS runs updateStrategy OnDelete and the controller's roller drives rolls node-by-node (fence the node's serving legs out of the raid, delete the pod, advance only at full redundancy judged on raid membership — NOT pod readiness, whose gate TLC refutes). Rolls are PARTIAL BY DESIGN: a node hosting a serving composition is refused and skipped with an operator event (F62 fix B), so helm upgrade can leave consumer-hosting nodes on the old revision until the consumer moves — a loud incomplete roll instead of a silent outage. Plus S2 bounce-free RWX admission (228ms quiesce replaces the bounce), kube-Lease orchestrator election (P1), StorageId/StagedHandle newtypes (P2), bounded dead-target detection (P4: 36s vs 150-177s), and the F55-F63 fix wave (frame-atomic NFS shutdown; the roll's drain/mark, composition-lifetime and refusal-hole bugs; the cutover bounce belt; the expand size livelock). Four TLA+ modules (FlintReplication, FlintClaims, FlintSnapshots, FlintA2Probe) across ~80 TLC configs cover the replica lifecycle, claims, snapshots, expansion, availability envelope, cutover, pod layer and the DS roll — the model found F56 and F59 and refuted two proposed fixes; F61 was found by drill 3.14 on hardware, and fixing it exposed F62. Live-gated on runap+runar (3.14: fence+barrier+lease+F62 refusal on the wire, zero unfenced degrades, consumer through with zero PANIC/EIO/ESTALE; 2.11 all-at-once: no degraded-direct, no acked-tail risk, composition rebuilt in 105s)
  # SPDK Target daemon (runs on each node)
  spdkTarget:
    name: spdk-tgt          # SPDK target daemon (SPDK v26.05)
    tag: "1.6.1"            # SPDK v26.05 + F5 dirty-restart fixes (blob-recovery-batched + lvol-flush-sync) — HARD dependency for ublk mode (every roll is a dirty tgt restart). 1.6.1 rebuilds with --target-arch=corei7: 1.6.0 and every image before it were built with SPDK's default --target-arch=native, so the BUILD MACHINE's CPU became the image's hard minimum. Since builders are throwaway spot instances, flint's hardware requirements were an accident of scheduling and silently unreproducible. On any host older than the builder, DPDK's EAL aborts with `This system does not support "VPCLMULQDQ"` — and because spdk-tgt is an INIT container, the whole flint-csi-node DaemonSet init-crashloops and the node has NO CSI driver at all. Measured on i3en.xlarge (Xeon 8175M, Skylake-SP): 7/7 nodes down. A/B on one Skylake host: 1.6.0 dies on the CPU gate, 1.6.1 clears it.
  # NFS Server for ReadWriteMany (RWX) volumes
  # By default, uses the same image as flintCsiDriver (which includes flint-nfs-server binary)
  # Uncomment to override with a separate NFS server image
  # flintNfsServer:
  #   name: flint-nfs-server
  #   tag: latest
  #   pullPolicy: IfNotPresent
  # Legacy images (no longer used in minimal state architecture)
  # flintCsiController: replaced by flintCsiDriver with CSI_MODE=controller
  # nodeAgent: replaced by flintCsiDriver with CSI_MODE=node

csiSidecars:
  repository: registry.k8s.io/sig-storage
  externalProvisioner:
    name: csi-provisioner
    tag: v3.6.0  # Upgraded from v3.1.0 for better ephemeral volume support
  externalAttacher:
    name: csi-attacher
    tag: v4.4.0  # Upgraded from v3.4.0 for latest features
  externalResizer:
    name: csi-resizer
    tag: v1.9.0  # Upgraded from v1.4.0 for latest features
  externalSnapshotter:
    name: csi-snapshotter
    tag: v6.3.0  # Upgraded from v6.1.0 for latest features
  nodeDriverRegistrar:
    name: csi-node-driver-registrar
    tag: v2.9.0  # Upgraded from v2.5.0 for ephemeral volume fixes
  livenessprobe:
    name: livenessprobe
    tag: v2.11.0  # Upgraded from v2.7.0 for latest features

# Verbosity of the Flint CSI driver logging.
# 5 is the default. 9 is the most verbose.
logLevel: 5

# Allow overriding the controller's pod priority class.
priorityClassName: ""

# CSI Driver configuration
driver:
  name: "flint.csi.storage.io"

  # Ephemeral volume support (CSI inline volumes)
  # When enabled, Pods can declare Flint volumes directly in their spec without creating PVCs
  # Ephemeral volumes are automatically created on Pod start and deleted on Pod termination
  # Requires Kubernetes v1.25+ (or v1.21-v1.24 with CSIInlineVolume feature gate)
  enableEphemeral: true

  # F36c last-writer-set degraded-assembly gate (docs/f36c-assembly-freshness-gate.md).
  # "disabled" restores pre-F36c serve-anything assembly. Tuning knobs are
  # env-only: FLINT_F36C_DEFER_SECS (180), FLINT_F36C_NODE_GONE_SECS (360).
  f36cGate: "enabled"
  
  # CSI Sanity testing support
  # Exposes controller gRPC socket via TCP for csi-sanity test suite
  # Only enable in test/dev environments
  enableSanityTestProxy: false
  sanityProxyPort: 10000
  
  # Topology configuration
  # Set to true for self-managed clusters that allow topology.kubernetes.io/hostname labels
  # Set to false for managed clusters (Rancher, EKS, GKE, AKS) that protect these labels
  useHostnameTopology: false
  
  # Custom Resources Namespace Configuration
  # By default, all Flint custom resources (SpdkDisk, SpdkVolume, SpdkSnapshot) 
  # are created in the same namespace as the CSI driver installation
  # This eliminates cross-namespace access issues and simplifies RBAC
  # 
  # Override this only if you need custom resources in a different namespace
  # Note: Make sure RBAC permissions are configured appropriately if changed
  customResourceNamespace: ""  # Empty means use .Release.Namespace
  
  # Examples:
  # Self-managed clusters (kubeadm, etc.): useHostnameTopology: true
  # Rancher-managed clusters: useHostnameTopology: false
  # EKS/GKE/AKS: useHostnameTopology: false

# Deployment configuration
deployment:
  # Node deployment architecture:
  # "three-container": Separate SPDK target, CSI driver, and node agent containers (recommended)
  #   - spdk-tgt: SPDK target daemon (privileged)
  #   - flint-csi-driver: CSI protocol handler (node mode)
  #   - node-agent: Disk management and HTTP API server
  # "two-container": Legacy mode with SPDK target and combined CSI+disk agent
  #   - spdk-tgt: SPDK target daemon (privileged)
  #   - node-agent: Both CSI protocol and disk management (not recommended)
  # "embedded": Single container with embedded SPDK and CSI (legacy compatibility)
  #   - flint-csi-driver: Single container with SPDK embedded (privileged)
  # "nfs-only": No SPDK sidecar — all volumes served via NFS with emptyDir (Kind/dev clusters)
  #   - flint-csi-driver: CSI protocol handler only (~100MB vs ~3GB per node)
  nodeMode: "three-container"

# Logging configuration
logging:
  level: "info"

# Health check configuration
healthCheck:
  # Port for health server in CSI driver container
  # In three-container mode, the node-agent is integrated into flint-csi-driver, so 9809 is safe
  csiDriverPort: 9809
  # Port for controller health server (runs in separate pod)
  controllerPort: 9809
  # Port for node-agent API server (integrated into flint-csi-driver in three-container mode)
  # Changed from 8081 to 9081 to avoid conflicts with nginx ingress controllers
  nodeAgentPort: 9081

# The legacy spdk-controller-operator Deployment was REMOVED entirely
# (F50, 2026-07-27). Its intended module has been dead code since before
# the audit-L4 default-off (2026-07-04) — but the pod it deployed ran the
# standard driver with CSI_MODE unset, i.e. mode "all": a SECOND full
# controller whose in-process claim registry arbitrated nothing against
# the real controller. When hot-rejoin went default-ON (v1.19.0) that pod
# silently became a live second hot-rejoin orchestrator, and its
# unserialized admission windows were scrubbed mid-flight by the real
# controller's reconciler — F50 (docs/f50-hotrejoin-window-concurrency.md).
# A `spdkOperator.enabled` value set by an older installer (trove's SPDK
# mode does) is now simply ignored. Revival requires a dedicated binary
# and identity-legible mints first — see the audit note in
# docs/plans/identity-unification-phase0-audit.md L4.

# Replication orchestrators (Tier-1/2: epoch scheduler + stale catch-up +
# hot rejoin) on the controller. ON BY DEFAULT: they are a strict no-op
# for single-replica volumes (the epoch scheduler skips replicas<2, and
# catch-up/hot-rejoin only act on replica sync records), while for
# numReplicas >= 2 running without them is actively hazardous (see
# docs/tier2-operator-runbook.md: without epoch history the raid
# reassembly admission is attach-everything, so a leg that ever truly
# diverges would be re-admitted as an equal read source). The shipped
# spdk-tgt includes the raid-skip-rebuild patch hot-rejoin requires.
replication:
  orchestrators:
    enabled: true
    epochIntervalSecs: 300   # test clusters run 30
    # U11 replica re-placement: when a replica's node is permanently gone
    # (Node object deleted, or NotReady for replicaReplaceAfterSecs), the
    # controller re-places that leg on a healthy node with capacity and the
    # catch-up full build restores redundancy — without it a volume that
    # loses a node serves degraded forever. Per-volume opt-out: SC
    # parameter autoRebuild: "false".
    replicaReplaceEnabled: true
    replicaReplaceAfterSecs: 600

# Maintenance drain roll — the csi-node roll landmine fix
# (docs/maintenance-drain-csi-node-roll.md). The csi-node DaemonSet uses
# updateStrategy OnDelete and the controller's maintenance roller drives
# every template change node-by-node — drain the node's serving legs,
# delete the pod, wait for FULL readmission (raid-aware barrier, not
# pod-readiness) — so a plain `helm upgrade` no longer blackholes serving
# legs one node after another.
#
# DEFAULT ON as of 1.22.0. It shipped OFF in 1.21.0 pending a live gate;
# drill 3.14 has since PASSED on runap (4 runs) and again on runar against
# the 1.22.0 bits, proving fence + barrier + lease + the F62 refusal on the
# wire under load: zero unfenced degrades, never fewer than 1 in_sync leg
# at any sample, consumer rode through with zero PANIC/EIO/ESTALE and zero
# restarts. Left OFF, the DaemonSet takes k8s RollingUpdate, whose
# maxUnavailable judges POD readiness while knowing nothing of raid
# membership — the model refutes that gate, and a routine roll can take a
# volume fully down with ZERO real failures.
#
# READ THIS BEFORE UPGRADING: the roll is PARTIAL BY DESIGN. A node that
# hosts a serving composition is REFUSED, not rolled (F62 fix B) — it is
# skipped with an operator-facing event and the campaign converges
# "except for N announced refusals". So `helm upgrade` may legitimately
# leave consumer-hosting nodes on the old revision until you relocate the
# consumer and re-run. That is the trade: a loud incomplete roll instead
# of a silent outage. The LOCAL half (rolling the node a consumer sits on)
# is design-only — A2 is modelled and deferred, see
# docs/f62-local-half-outage-and-blind-barrier.md.
#
# Set enabled: false to restore the 1.21.0 behaviour (unattended rolls,
# landmine live). Tuning knobs are env-only:
# FLINT_MAINT_SUPPRESS_TTL_SECS (900), FLINT_MAINT_TICK_SECS (60).
maintenance:
  drainRoll:
    enabled: true

# Storage class configuration
storageClass:
  create: true
  name: "flint"
  isDefaultClass: false
  reclaimPolicy: "Delete"
  allowVolumeExpansion: true
  parameters:
    numReplicas: "1"  # Single replica (default). "2"/"3" = RAID1 multi-replica HA (r2/r3 chaos-validated 2026-07: node loss serves from survivors; keep replication.orchestrators on)
    autoRebuild: "true"  # "false" opts this SC's volumes out of automatic replica re-placement after permanent node loss (U11); rebuild-on-return (catch-up) is unaffected
    thinProvision: "true"  # Thin provisioning (space allocated on write). Set to "false" for thick (full allocation up front; note: the first snapshot converts the head to thin and pins the full image — see docs/incremental-replica-rebuild.md §5)
    nfsEmptyDir: "false"  # Set to "true" for Kind/dev clusters (bypasses kernel block device requirement)

# VolumeSnapshotClass configuration
snapshotClass:
  enabled: true
  name: csi-snapclass
  deletionPolicy: Delete  # Delete or Retain
  parameters: {}
    # Optional parameters for snapshot operations
    # Currently no parameters needed - snapshots use SPDK defaults

# Dashboard configuration
# The dashboard is fully integrated with the CSI driver and shares:
# - Service account (flint-csi-controller) with RBAC permissions
# - Node selectors, tolerations, and affinity rules
# - Log levels and priority class settings
# - Access to all SPDK CRDs and Kubernetes APIs
dashboard:
  enabled: true
  # Authentication for the dashboard API (enforced by the backend).
  auth:
    # Password for the "admin" user (full access, including destructive disk
    # operations). Empty = generated at install and preserved across upgrades;
    # read it from the spdk-dashboard-auth Secret.
    adminPassword: ""
    # Password for the optional read-only "viewer" user. Empty = viewer login
    # disabled.
    viewerPassword: ""
    # Session token lifetime in seconds (default 12h).
    sessionTtlSecs: 43200
  backend:
    port: 8080
  frontend:
    name: spdk-dashboard-frontend
    tag: "1.9.0"      # timeline brush zoom (focus+context), PVC-name search, System disk bucket, compact overview
    port: 3000
  resources:
    backend:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    frontend:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  # Override global scheduling settings for dashboard (optional)
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Optional ingress configuration for external access
  ingress:
    enabled: false
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: spdk-dashboard.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
      # - secretName: spdk-dashboard-tls
      #   hosts:
      #     - spdk-dashboard.local

# Global scheduling settings (applied to all components including dashboard)
nodeSelector: {}
# Best practice: CSI node drivers should run on ALL nodes, including control-plane
# This matches the behavior of standard CSI drivers (Cinder, EBS, etc.)
tolerations:
  - operator: Exists  # Tolerate all taints, including control-plane/master taints
affinity: {}

# ReadWriteMany (RWX) support via NFS server
# EXPERIMENTAL: This feature is in beta and disabled by default
# When enabled, RWX PVCs will automatically deploy an NFS server pod
# that exports the underlying SPDK volume over NFS
nfs:
  # Enable NFS server support for ReadWriteMany and ReadOnlyMany volumes
  # Set to false to maintain existing RWO-only behavior (zero regression)
  enabled: true
  
  # NFS server port (standard NFS port, do not change unless required)
  port: 2049
  
  # Resource limits for NFS server pods
  # These pods run on nodes with volume replicas for local access.
  # The NFS pod is the entire data path for its volume — undersized
  # limits directly throttle client I/O (a 500m cap measured ~15k
  # tuples/s on pgbench -i before being raised).
  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "2"

  # Per-op DEBUG logging (hex dumps) in the NFS server. Multiplies
  # data-path latency — enable only while debugging protocol issues.
  verbose: false
  
  # Namespace for NFS server pods (defaults to CSI driver namespace)
  namespace: ""  # Empty means use .Release.Namespace
  
  # Labels to apply to NFS server pods (for monitoring/selection)
  podLabels:
    app: flint-nfs-server
  
  # Annotations for NFS server pods
  podAnnotations: {}
  
  # Image pull secrets for NFS server (if registry requires authentication)
  imagePullSecrets: []

# pNFS support (Parallel NFS, RFC 8881) — opt-in.
#
# When enabled, StorageClasses with `parameters.layout: pnfs` are
# provisioned by talking to a Flint pNFS MDS over gRPC; the resulting
# volume is striped across one or more Data Servers (DSes) and
# mounted on the kernel client via NFSv4.1.
#
# Disabled by default. The flint-csi-controller reads
# FLINT_PNFS_MDS_ENDPOINT from the env var injected here; if unset
# (i.e. pnfs.enabled is false), every pNFS code path in the driver
# is dormant and SPDK-only deployments are byte-identical to the
# pre-pNFS build.
#
# The chart can deploy the MDS + DS fleet itself (pnfs.server.enabled,
# the durable-DS plan Phase 1 shape: MDS Deployment on a flint PVC +
# DS StatefulSet with per-pod PVCs and per-pod ClusterIP Services), or
# point at an externally managed MDS via pnfs.mdsEndpoint.
pnfs:
  # When false, the FLINT_PNFS_MDS_ENDPOINT env var is omitted and
  # the driver refuses any layout: pnfs StorageClass with a clear
  # FAILED_PRECONDITION error. This is the safe default.
  enabled: false

  # A StorageClass for pNFS volumes. NOTHING renders one otherwise —
  # the main `storageclass.yaml` template hardcodes the four SPDK
  # parameters and never ranges over `.Values.storageClass.parameters`,
  # so `--set storageClass.parameters.layout=pnfs` renders nothing at
  # all. Before this block, the only pNFS class was a hand-applied
  # manifest under deployments/.
  storageClass:
    create: false
    name: flint-pnfs
    # pNFS PVs are shared namespaces mounted by many pods; Retain
    # avoids deleting a dataset because one claim went away. Flip to
    # Delete for scratch/shuffle classes.
    reclaimPolicy: Retain
    # WaitForFirstConsumer costs nothing here (every node mounts the
    # same MDS) and keeps behaviour uniform with the SPDK class.
    volumeBindingMode: WaitForFirstConsumer
    isDefaultClass: false

    # Per-volume stripe geometry. Both are FIXED AT CREATE: a file's
    # placement is pinned at its first layout grant and never
    # re-striped, so changing these later affects only new volumes.
    # Leave empty for the MDS defaults (pnfs.server.stripeSize, and
    # every active data server).
    #
    #   stripeSize   bytes, power of two, 4 KiB .. 1 GiB. Lower it for
    #                small-file-heavy datasets: at the 8 MiB default a
    #                file under 8 MiB lives entirely on ONE data server
    #                and gets no parallelism at all.
    #   stripeWidth  how many data servers a file is striped across.
    #                Empty = all of them, which maximises per-file
    #                bandwidth AND makes the failure domain the whole
    #                fleet — any one DS loss affects every file. A
    #                smaller width trades peak throughput for blast
    #                radius.
    stripeSize: ""
    stripeWidth: ""

    # Volume-root ownership. Empty dirGid keeps the historical 0777,
    # which is the loosest possible setting and the only one that works
    # when consuming pods run as arbitrary uids. Setting dirGid chgrps
    # the volume root and sets the setgid bit so files created inside
    # inherit the group — that is what makes a pod's `fsGroup` usable.
    # Set both together: a dirMode denying "other" without a dirGid is
    # refused at provision, because no pod would be able to write.
    dirGid: ""
    dirMode: ""

    # Extra mount options. Each one REPLACES the driver's default for the
    # same option — the driver no longer emits both values and hope the
    # kernel takes the last, which is what silently failed before
    # 2026-08-02. So rsize=, wsize=, proto=, port=, sec=, vers= and the
    # rest are all genuinely reachable from here now.
    #
    # `nconnect` is the known exception and is NOT reliably settable per
    # class: it is a property of the client's shared nfs_client, and every
    # pNFS PVC on a node mounts the same MDS ip:port, so the second and
    # later mounts on a node can inherit the first mount's connection
    # count regardless of what this asks for. To change it fleet-wide,
    # change the driver default rather than the class.
    #
    # ALWAYS verify, in the consuming pod:
    #     kubectl exec <pod> -- grep nfs4 /proc/mounts
    # and cross-check what the driver actually asked for:
    #     kubectl -n <ns> logs ds/flint-csi-node -c flint-csi-driver \
    #       | grep 'pNFS\] mount -t nfs4'
    # If those two disagree, the loss is in the kernel, not the driver.
    mountOptions: []

  # ── pnfs-block (RFC 8154/9561 scsi layout) ────────────────────────
  # Block-class volumes: the client kernel (>= 6.11 with
  # CONFIG_PNFS_BLOCK) does RAW NVMe/TCP extent I/O against an
  # spdk-tgt; the MDS allocates extents and stays out of the data
  # path. Single-replica tier — no replication yet (design doc §12);
  # a lost storage node is lost data, and the class guidance is
  # re-hydratable or scratch datasets until the mirror tranche ships.
  blockLayout:
    # Master switch. Injects FLINT_PNFS_BLOCK_LAYOUT=1 into the CSI
    # controller (which otherwise refuses `layout: pnfs-block` classes
    # loudly) AND into the csi-node, which then installs the §4a udev
    # rule on every node (/etc/udev/rules.d, mounted by the chart):
    # udev only creates nvme-uuid.* links against SPDK namespaces, and
    # without the eui link the kernel client silently degrades every
    # I/O to MDS proxying. Requires an MDS with blockExport configured
    # (pnfs.server.mds.blockExport below, or the equivalent on an
    # external MDS) — provisioning fails loudly otherwise.
    enabled: false

    storageClass:
      create: false
      name: flint-pnfs-block
      # Copies of each volume: 1 (a lost storage node is lost data) or
      # 2 (a second copy on another target, kept mirrored, rebuilt
      # after an outage — design §12).
      #
      # EXPERIMENTAL: the composition machine is complete and unit
      # tested end to end, but no cluster has run it yet.
      #
      # Placement is SAME-ZONE by default and refuses rather than
      # silently crossing zones, because a cross-zone copy pays
      # inter-zone egress on every mirrored write and again on every
      # rebuilt byte. Nodes must carry topology.kubernetes.io/zone —
      # an unlabelled node is "unknown", never "the same place".
      replicas: 1
      # Permit the second copy to land outside the composer's zone.
      # Only meaningful with replicas: 2, and it is a bill, not a knob.
      replicaCrossZone: false
      # Retain, so data outlives an accidental claim delete. Flip to
      # Delete for scratch classes.
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
      # Same replace-not-race semantics as the pnfs class above. The
      # kernel floor caveat applies to the NODES, not the mount
      # options: a < 6.11 client mounts fine and silently proxies
      # everything through the MDS.
      mountOptions: []

  # gRPC endpoint of an EXTERNALLY managed MDS. Ignored (and may be
  # left empty) when pnfs.server.enabled is true — the controller then
  # defaults to the in-chart flint-pnfs-mds Service.
  # Forms accepted by the driver:
  #   "flint-pnfs-mds:50051"            — bare host:port (http:// added)
  #   "http://flint-pnfs-mds:50051"     — explicit scheme
  #   "https://mds.example.com:50051"   — TLS (channel honours it,
  #                                        though cluster TLS isn't
  #                                        provisioned by this chart)
  mdsEndpoint: ""

  # ── Control-plane auth ────────────────────────────────────────────
  # Bearer token required on every MDS gRPC (50051) call: DS
  # registration/heartbeats and CSI CreateVolume/DeleteVolume. Without
  # it, ANY pod that can reach 50051 can register itself as a data
  # server and attract stripe writes. Enabled ⇒ the chart creates a
  # Secret with a random token (or uses controlToken.existingSecret)
  # and injects FLINT_PNFS_CONTROL_TOKEN into the MDS, DS fleet, and
  # CSI controller. Default ON whenever the in-chart server is
  # deployed — turning it off prints a loud MDS boot warning.
  controlToken:
    enabled: true
    # Name of an existing Secret with key `token` to use instead of a
    # chart-generated one (e.g. for GitOps-managed secrets).
    existingSecret: ""

  # ── Network isolation (Tier A) ────────────────────────────────────
  # NetworkPolicies for the pNFS ports. NFS mounts originate from the
  # NODE kernel (kubelet NodeStage), so 2049 must admit node-CIDR
  # traffic — set nodeCIDRs to your node network(s). hostNetwork pods
  # share the node identity and are admitted too; combine with the
  # control token (above) for the control plane. Default OFF because a
  # wrong/missing nodeCIDR breaks every pNFS mount; enable it as part
  # of the production checklist (see docs/pnfs-operator-runbook.md,
  # "Trust model").
  networkPolicy:
    enabled: false
    # CIDRs the NFS data ports (2049 on MDS + DSes) accept, e.g.
    # ["172.31.0.0/16"]. REQUIRED when enabled — an empty list renders
    # a policy that blocks all NFS traffic.
    nodeCIDRs: []

  # In-chart pNFS server fleet (durable-DS plan Phase 1).
  server:
    enabled: false

    # MDS + DS ship in one image (both binaries; entrypoint selects).
    image:
      name: flint-pnfs
      tag: "1.29.0"  # 1.29.0: FOUR FIXES IN THE HUB. (1) Two concurrent PUTs to one path through the HTTP file API CORRUPTED the file: the upload temp name was keyed on the pid and one hub serves every request for a share, so both uploads shared a temp, interleaved their bytes, and each renamed it over the target — 201 to both callers. (2) The gRPC control plane (0.0.0.0:50051, DeleteVolume, unauthenticated unless FLINT_PNFS_CONTROL_TOKEN is set) no longer starts in mode: standalone, where it had nothing to serve; pNFS deployments are unchanged. (3) /status now publishes serverId and podName — a changed serverId means the volume came back on a fresh PVC and every client stateid is stale. (4) A boot-only tier knob no longer forces a rollout. PRIOR CONTEXT FOLLOWS. 1.28.0: THE IDLE-LIFECYCLE RELEASE. ⚠ CONTAINS THE FIX FOR A SHIPPED BUG: the csi-driver could NOT START in 1.26.0 or 1.27.0 (rustls 0.23 refused to guess a CryptoProvider once the S3 tier's AWS SDK brought aws-lc-rs alongside ring) — upgrade off those two tags. Also: the NFS server FOLLOWED SYMLINKS out of the export, so a link to the hub's state db or IRSA token was readable through any mount and CREATE truncated the target. New: the FlintShare operator, the hub's /status + HTTP file API, and the idle ladder (suspend on quiet, hibernate on verified flush). Driver and MDS share the crate so both images move in lockstep. PRIOR CONTEXT FOLLOWS. 1.27.0: THE COLD-READ RELEASE (flint-lite S3 tier; multi-arch amd64+arm64). hydrateFetchParallel (default 6) fans a restore out over parallel ranged GETs (~72.5 -> ~10-13 s/GiB); hydrateWarmAfterImport bulk-restores a DR-imported tree smallest-first on its own pool, resumable across restarts; the eviction-marker cycle guard went INSERT-ONLY (restore completions no longer DELAY unrelated reads or livelock long COPYs under hydration bursts — model-certified, formal gate 173). No CSI/pNFS behavior changes; driver and MDS share the crate so both images move in lockstep. PRIOR CONTEXT FOLLOWS. 1.26.0: THE FLINT-LITE + S3-TIER RELEASE, multi-arch (amd64+arm64). mode: standalone (the lite hub — first published tag carrying it); the whole L2 S3 tier (durable capture, epoch fencing, flush/evict/hydrate, DR-from-bucket, NOSPC space model, reporter); the multicluster first-op fixes (sqlite first transaction + git first commit had NEVER worked on any flint mount); 8 campaign bug fixes (6 drill-found + 2 TLA-model-found). Tier is REFUSED outside standalone posture — pNFS deployments get the fixes, not the tier. PRIOR CONTEXT FOLLOWS. 1.25.2: DATA LOSS FIX — a shrinking ftruncate on a block-class file freed the extent it was truncating INTO, taking the kept prefix with it; merged extents make one row the normal shape, so truncating a sequential file to any non-zero size dropped ALL of it. Reclaim now frees the INTERSECTION and rounds the cut up to a block boundary. PRIOR CONTEXT FOLLOWS. 1.25.1: a SURVIVING MDS shard can answer a re-attach for a volume it never created (the class gate read this shard's own geometry cache; it now falls through to the composition witness, where a seat is proof of class, and fails CLOSED if the witness is unreadable). Cluster-proven: composer node killed, sibling answered in 39s, client moved at +119s. `replicas: 2` is still durability, NOT failover. PRIOR CONTEXT FOLLOWS. rc6: F69 cold-open stall fix (every fresh mount's first open of a file paid a hardcoded 5s client sleep because OPEN left CFH at the parent dir), GETDEVICEINFO multipath (dataServers.multipathServices), LOCK4denied wire encoding, DS clientid confirmation (trunk probes got fresh clientids). rc3-rc5 = F68b gate + F68a observability. amd64-only like rc3-rc5. MUST move in lockstep with images.flintCsiDriver. Per-PVC stripe geometry is half CSI (the class parameters and mount options) and half MDS (the layout width actually handed out at LAYOUTGET), and the MDS half lives in THIS image. Pinning this at 1.23.0 next to a fixed driver leaves stripeWidth ignored exactly as before, and the failure is silent — you get a full-width volume that reports success. The pNFS truncate-correctness release. The truncate_dirty gate exists to hide the window where a truncate has hit the MDS stub but the DSes still hold bytes past the new EOF — TLC found it did not, and closing F65 took nine further defects, every one invisible because the server's own logs scored a refused recall as an ack. Also carries the NFSv4.2 wave (see the driver image). WAS PINNED AT 1.15.0 THROUGH v1.22.0: that pin would have shipped this release's headline pNFS fixes in the changelog and NOT in the deployed image.

    # FILE-layout stripe unit in bytes. Pinned PER FILE at first
    # LAYOUTGET (Phase 0): changing this affects only files created
    # after the change. 8 MiB default; 1-4 MiB suits small-file-heavy
    # datasets.
    stripeSize: 8388608

    # RUST_LOG / config log level for MDS + DS pods.
    logLevel: info

    mds:
      # MDS shard count (mds-sharding-plan.md). Each shard is an
      # independent single-replica MDS owning a disjoint set of
      # volumes, pinned at CreateVolume. 1 = the classic single MDS
      # (renders identically to pre-sharding charts; shard 0 keeps all
      # legacy object names, so upgrades adopt in place). Scale DOWN
      # only if the removed shards own zero volumes. count > 1 needs
      # images >= 1.13.0 (CSI shard routing + DS fan-out registration).
      count: 1
      # Seconds without a DS heartbeat before the MDS marks it offline
      # and recalls its layouts. DS heartbeatInterval is 10s; keep this
      # >= 2 missed beats + margin.
      heartbeatTimeout: 30
      # PVC backing /data (export tree + sqlite state.db). Defaults to
      # the chart's own StorageClass — a replicated flint volume makes
      # MDS state survive node loss.
      storage:
        storageClassName: ""   # "" → storageClass.name
        size: 10Gi
      resources: {}

      # ── Block-layout export surface (scsi-class volumes) ──────────
      # The MDS drives a COLOCATED spdk-tgt over its unix RPC socket:
      # per-volume lvols, subsystems, namespaces (NGUID-pinned, with
      # reservation PTPL files), listeners, and host allow-lists.
      # Phase-1 shape: ONE tgt per MDS shard, and lvols are NODE-LOCAL
      # — so when this is enabled the MDS pod MUST be pinned
      # (nodeSelector below) to the node whose csi-node spdk-tgt and
      # lvstore back the block volumes. An unpinned MDS that
      # reschedules elsewhere finds no socket and, worse, a fresh
      # lvstore under committed extents is refused by design (F67).
      blockExport:
        enabled: false
        # The colocated tgt's RPC socket, via the /var/tmp hostPath
        # the chart mounts into the MDS pod when this is enabled.
        spdkSocket: /var/tmp/spdk.sock
        # lvolstore backing per-volume lvols. REQUIRED — must be an
        # lvstore that exists on the pinned node's tgt.
        lvstore: ""
        # Address kernel initiators dial for nvme-tcp — the PINNED
        # NODE's IP (the tgt listens via hostNetwork). REQUIRED.
        traddr: ""
        trsvcid: 4420
        # Directory ON THE TGT NODE for per-namespace reservation PTPL
        # files. Mandatory-by-kernel (the client's pr_register sets
        # CPTPL unconditionally; SPDK refuses without a ptpl_file) and
        # it must SURVIVE tgt restarts — the chart mounts this
        # hostPath into the spdk-tgt container. Deliberately NOT under
        # /var/tmp: systemd-tmpfiles ages that dir out, and an aged
        # ptpl file is a silently weakened fence.
        ptplDir: /var/lib/flint-pnfs-ptpl
        # Pin the MDS to the tgt/lvstore node, e.g.
        #   kubernetes.io/hostname: ip-172-31-1-23
        nodeSelector: {}
        # PER-SHARD OVERRIDES, and `replicas: 2` block volumes are not
        # installable without them.
        #
        # lvols are NODE-LOCAL, so every block-export shard is pinned to
        # its own tgt's node and backed by THAT node's lvstore — and
        # lvstore names are per node (the disk-init mints
        # `lvs_<node>_<pci>`). The three values above are single-valued,
        # so on their own they can only ever describe ONE shard. A
        # two-copy volume needs two, on two nodes, with two different
        # lvstores; before this list existed the chart could not express
        # that at all, and the only way to run it was hand-written MDS
        # config outside the chart.
        #
        # Entry i configures shard i. Each field falls back to the
        # single-valued setting above when the entry omits it, so a
        # count:1 install can ignore this list entirely and renders
        # exactly as it did before it existed.
        #
        #   shards:
        #     - lvstore: lvs_node-a_0000-00-1f-0
        #       traddr: "172.31.31.8"
        #       nodeSelector: {kubernetes.io/hostname: node-a}
        #     - lvstore: lvs_node-b_0000-00-1f-0
        #       traddr: "172.31.25.192"
        #       nodeSelector: {kubernetes.io/hostname: node-b}
        #
        # The MDS count must cover them: entries beyond
        # `pnfs.server.mds.count` are refused rather than ignored,
        # because a silently-undeployed shard is a volume whose second
        # copy has nowhere to live.
        shards: []
        # THE COMPOSITION WITNESS — required for `replicas: 2` block
        # volumes, and inert for single-copy ones.
        #
        # A two-copy volume lives on two targets driven by two MDS
        # shards, and those shards share nothing: separate sqlite on
        # separate PVCs. So a failover has no arbiter — every fact the
        # survivor's election reads (its composer's coordinates, its own
        # leg's in-sync mark) is written in the database that dies with
        # the composer. Two records cannot arbitrate; they can only
        # disagree.
        #
        # Enabling this puts the arbitration facts — the seat
        # [epoch, composer], the leg sync marks, the serving lease and
        # the allow-list identities — in ONE ConfigMap per volume in
        # this release's namespace, advanced by resourceVersion
        # compare-and-swap. That is the same arbiter the file tier
        # already trusts for its replica record.
        #
        # WHAT IT COSTS: those acts become API calls, so an API-server
        # outage longer than the serving lease suspends REPLICATED
        # volumes — their writes stall until it returns, and nothing
        # corrupts. Volumes with replicas: 1 never touch the witness.
        # What does NOT become an API call is fence ENFORCEMENT: the
        # reservation preempt, the delivered mark and the extent rows
        # stay local, so a client can still be fenced with the control
        # plane unreachable.
        #
        # Leaving it disabled with replicas: 2 is a volume that mirrors
        # and rebuilds but CANNOT fail over.
        witness:
          enabled: false
          # Namespace for the ConfigMaps. Empty → this release's
          # namespace, which is what the RBAC below grants.
          namespace: ""

    dataServers:
      # DS fleet width. Scaling UP is safe (new files stripe wider;
      # existing files keep their pinned placement). Scaling DOWN is
      # NOT supported until the drain milestone — don't.
      count: 2
      heartbeatInterval: 10
      # PVC per DS (StatefulSet volumeClaimTemplate). On the flint
      # StorageClass with numReplicas >= 2 this is the durable-DS
      # story: replica failures rebuild underneath the DS, and a
      # rescheduled DS pod reattaches its data instead of losing it.
      storage:
        storageClassName: ""   # "" → storageClass.name
        size: 100Gi
      # Prefer spreading DS pods across nodes (soft anti-affinity) so
      # one node loss degrades at most one DS.
      spreadAcrossNodes: true
      # EXTRA per-pod ClusterIP Services per DS (multipath trunking).
      # Each extra Service is one more netaddr4 in that DS's
      # GETDEVICEINFO multipath_list4, and the Linux client opens one
      # additional trunked transport per extra address (kernel cap: 16
      # transports per DS total, including nconnect's). Lifts the
      # per-connection sunrpc receive ceiling (~700-900 MiB/s/conn)
      # for a SINGLE client without any client-side mount changes —
      # except one: the mount must use nconnect >= 2, or the kernel
      # caps the DS client at one transport and silently refuses every
      # trunk candidate (nfs4_set_ds_client, v6.1-v6.8).
      # 0 = no extra Services (primary per-pod Service only).
      multipathServices: 0
      resources: {}

# Block device configuration
blockDevice:
  # Backend type: "nvmeof" (chart default — kernel NVMe-oF loopback; supports
  # online volume expansion) or "ublk" (high performance; NO online expansion —
  # the kernel ublk device cannot grow below kernel 6.16, and the driver
  # refuses the expand rather than half-applying it). NOTE: the driver
  # binary's built-in default when this env is absent is "ublk" — the chart
  # always sets it explicitly.
  backend: "nvmeof"

  # Device discovery mode
  # Controls which block devices are discovered and made available for storage
  # Options:
  #   "nvme"  - Only discover NVMe devices (default, existing behavior)
  #   "all"   - Discover all block devices (NVMe + SCSI/SATA)
  #   "scsi"  - Only discover SCSI/SATA devices (for testing)
  discoveryMode: "nvme"

  # ublk performance tuning (only applies when backend=ublk)
  #
  # READ THIS BEFORE TUNING EITHER KNOB. Neither one adds a CPU to the
  # SPDK side, and the comment that used to sit here claimed otherwise
  # ("higher values enable better parallelism across multiple cores").
  # That was wrong, and wrong in the expensive direction: it sends you to
  # this knob for a ceiling that lives somewhere else entirely.
  #
  # spdk_tgt is started with no `-m`, so it takes SPDK's default reactor
  # mask of 0x1 — ONE core (lib/event/app.c: SPDK_APP_DPDK_DEFAULT_CORE_MASK).
  # The node agent then calls ublk_create_target with empty params, and a
  # NULL cpumask there means "the app's cpuset" (lib/ublk/ublk.c
  # ublk_parse_core_mask), and ublk creates ONE POLL GROUP PER CORE IN THAT
  # MASK. So however many queues you ask for below, a single poller thread
  # on a single core drains all of them.
  #
  # What numQueues actually buys is real, just not what the old comment
  # said: it is ublk's nr_hw_queues, so it is KERNEL-side submission
  # parallelism — independent submission paths, less per-queue lock
  # contention when many CPUs issue I/O at once. It is not SPDK-side
  # polling parallelism.
  #
  # The knob for THAT is the reactor mask, and it is deliberately not
  # exposed here because it is not free: an SPDK poller spins its core at
  # 100% by design, whether or not there is I/O. Every reactor you add is
  # a core permanently consumed on EVERY node running the csi-node
  # DaemonSet — on an 8-vCPU data server that is 12.5% of the machine per
  # core, always. Adding one is a fleet-wide capacity decision, and it
  # should be made against a measurement of the block layer (fio
  # --direct=1 straight at the ublk device, no NFS in the path), not
  # against this file.
  #
  # NOTE the read path usually does not reach any of this. The pNFS data
  # server serves bytes with buffered pread(2) and no O_DIRECT, so a read
  # that hits the page cache never touches ublk, SPDK or the NVMe device.
  # These settings bound writes and cache-MISS reads.
  ublk:
    # ublk nr_hw_queues (kernel-side submission paths, NOT SPDK cores).
    # Clamped to the host CPU count by the node agent: the kernel EINVALs
    # ADD_DEV when nr_hw_queues exceeds it (found live on runv — chart
    # said 8, the node had 4 vCPUs). Each queue also costs the single
    # poller another ring to service, so more is not automatically better.
    numQueues: 8

    # Outstanding I/Os per queue. SPDK's own ceiling is 1024
    # (UBLK_DEV_MAX_QUEUE_DEPTH); depth x numQueues is the total the one
    # poller can have in flight.
    queueDepth: 512

# SPDK Target runtime configuration
spdkTarget:
  # Extra arguments passed to spdk_tgt (requires "$@" in entrypoint)
  # For Kind/dev clusters, use kindMode.enabled=true instead of manual extraArgs
  #
  # THIS BEING EMPTY IS WHY THE WHOLE BLOCK DATA PLANE IS ONE CORE. With
  # no `-m`/`-l`, spdk_tgt takes SPDK's default reactor mask 0x1, and that
  # single core polls everything: the NVMe queues, the NVMe-oF TCP
  # transport for replica legs, and every ublk queue on the node (see
  # blockDevice.ublk above for why numQueues does not change this).
  #
  # `-m 0x3` would give two reactors. Do not add it casually: an SPDK
  # poller spins its core at 100% whether or not I/O is arriving, this
  # DaemonSet runs on every node, and the cost is therefore a permanently
  # consumed core per reactor per node. Whether one core is even the
  # binding constraint is UNMEASURED — on the read path it usually is not
  # (buffered pread, page-cache hits never reach SPDK), and on writes the
  # NIC may bind first. Measure the block layer directly before spending
  # a core on every machine you own.
  extraArgs: []

  # Hugepages configuration
  #
  # ONE SWITCH: `enabled` now drives BOTH the kubelet resource request and
  # spdk_tgt's --no-huge flag (helper "flint-csi-driver-chart.spdkTargetArgs").
  # It used to drive only the request, so setting it false took the hugepages
  # away without telling SPDK and EAL init failed at startup. Do NOT put
  # --no-huge in extraArgs — the chart fails the render if you do.
  #
  # Whether to keep them at all: hugepages exist so DPDK can hand STABLE
  # PHYSICAL addresses to a device doing its own DMA. flint's data paths never
  # need one — spdk_vtophys is called zero times in bdev_uring.c,
  # lib/nvmf/tcp.c, lib/ublk/* and lib/lvol/*, because the kernel does the DMA.
  # The only path that needs them back is the local-PCIe userspace NVMe driver
  # (bdev_nvme_attach_controller), which has never attached on any cluster:
  # every run logs "No userspace driver available" and falls back to
  # bdev_uring. So on an io_uring cluster the 8Gi reservation below buys
  # nothing and can be reclaimed.
  hugepages:
    # false ⇒ drop the reservation AND pass --no-huge -s <noHugeMemoryMB>
    enabled: true
    # Hugepage size: "2Mi" or "1Gi"
    size: "2Mi"
    # Total hugepage memory to request
    amount: "8Gi"
    # SPDK heap size under --no-huge. Only read when enabled=false.
    #
    # --no-huge REQUIRES -s (SPDK lib/env_dpdk/init.c) and forces --legacy-mem,
    # so this is a HARD CEILING the heap cannot grow past at runtime.
    #
    # It comes out of `memory.limit` below, NOT out of a separate kubelet
    # resource the way hugepages do — so memory.limit must stay comfortably
    # above this number or spdk_tgt gets OOM-killed under load.
    noHugeMemoryMB: 1024

  # Memory request/limit (separate from hugepages — but NOT separate from
  # hugepages.noHugeMemoryMB, which is drawn from this limit. See above.)
  memory:
    request: "1Gi"
    limit: "2Gi"

  # Kind/dev cluster mode: uses --wait-for-rpc to minimize memory pools
  # and optionally creates a virtual disk for CSI capacity.
  # Reduces SPDK memory from ~1.4GB to ~26MB by minimizing ioBuf and iSCSI pools.
  kindMode:
    enabled: false
    # Override SPDK image for Kind (uses spdk-tgt-kind with wait-for-rpc entrypoint)
    image:
      name: spdk-tgt-kind
      tag: latest
    # SPDK DPDK EAL memory allocation in MB (passed as -s flag)
    # Must be large enough for: iobuf pools (~170MB) + virtual disk + subsystem overhead
    spdkMemoryMB: 2048
    # Virtual disk: malloc bdev + LVS for CSI capacity (allocated from SPDK memory)
    # Size must fit within spdkMemoryMB minus ~300MB overhead for pools/subsystems
    virtualDisk:
      sizeMB: 0          # e.g. 1536 for 1.5GB. 0 = disabled
      path: "/var/tmp/spdk-virtual.img"
      lvsName: "lvs_kind"
    # Container memory limits (must exceed spdkMemoryMB + ~512MB process overhead)
    memory:
      request: "2048Mi"
      limit: "2560Mi"

# Node resources configuration (e.g., CPU core masks for SPDK target)
nodeResources:
  spdkTarget:
    # CPU core mask for SPDK target (hex format, e.g., "0x2" for core 1)
    cpuCore: ""

# Reserved devices configuration
# Devices listed here will be excluded from Flint CSI discovery and management
# These devices can be used for direct SPDK access via device plugins
reservedDevices:
  # List of PCI addresses to reserve (one per line)
  # Example:
  # list: |
  #   0000:02:00.0
  #   0000:03:00.0
  list: ""

  # Optional annotations for reserved devices (for UI display)
  # Format: PCI_ADDRESS: description
  # Example:
  # annotations: |
  #   0000:02:00.0: High-performance device for database workloads
  #   0000:03:00.0: Reserved for ML training
  annotations: ""

# ── Flint-lite: MOVED to its own chart ────────────────────────────────
# The standalone hub now ships as the `flint-lite` chart (repo dir
# flint-lite-chart/ — four objects, no CSI stack, no CRDs; see
# docs/flint-lite.md). Setting lite.enabled here refuses to render.
lite:
  enabled: false

# Pod priority (campaign finding F2 — see docs/attach-detach-campaign-2026-07.md):
# the csi-node pod hosts spdk-tgt; a kubelet eviction (e.g. DiskPressure) kills
# the storage target under every mounted flint PVC on the node. node pods must
# be system-node-critical so kubelet never chooses them for eviction.
node:
  priorityClassName: system-node-critical
controller:
  priorityClassName: system-cluster-critical
