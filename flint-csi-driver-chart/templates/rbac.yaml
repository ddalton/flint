# This YAML file defines all the RBAC resources for the Flint CSI driver.

# Service account for the controller components
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flint-csi-controller
  namespace: {{ .Release.Namespace }}

---

# ClusterRole for the controller components
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flint-csi-controller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Pod management permissions (required for NFS server pods in RWX volumes)
  # Only used when nfs.enabled=true in Helm values
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Service management permissions (required for NFS server services in RWX/ROX volumes)
  # Only used when nfs.enabled=true in Helm values
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  # Snapshot permissions (required for CSI snapshot support)
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    # delete: the dashboard backend (same ServiceAccount) removes USER
    # snapshots through their VolumeSnapshot CR — the only path that keeps
    # Kubernetes and SPDK in agreement (snapshot timeline delete action).
    verbs: ["get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  # Maintenance roller (docs/maintenance-drain-csi-node-roll.md): reads
  # the csi-node DaemonSet's updateStrategy and its ControllerRevisions
  # to tell which pods still run the old template (pod deletion itself is
  # covered by the pods rule above). Read-only on purpose.
  - apiGroups: ["apps"]
    resources: ["daemonsets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  # Removed SPDK CRD permissions - no longer needed in minimal state architecture
  # The CSI driver now queries SPDK directly via node agent HTTP APIs

---

# ClusterRoleBinding for the controller components
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flint-csi-controller
subjects:
  - kind: ServiceAccount
    name: flint-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: flint-csi-controller
  apiGroup: rbac.authorization.k8s.io

---

# Service account for the node components
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flint-csi-node
  namespace: {{ .Release.Namespace }}

---
# ClusterRole for the node components
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flint-csi-node
rules:
  - apiGroups: [""]
    resources: ["configmaps", "nodes", "pods", "events"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    # "update" kept alongside "patch" as a safety net for any remaining
    # replace-style writes (block-device info, replica-health, PV labels)
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    # Read-only: reconcile derives the fencing host list from the
    # VolumeAttachment (which node currently consumes a volume)
    verbs: ["get", "list"]
  # Removed SPDK CRD permissions for node components - no longer needed
  # Node agents now use direct SPDK queries via Unix sockets
---

# ClusterRoleBinding for the node components
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flint-csi-node
subjects:
  - kind: ServiceAccount
    name: flint-csi-node
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: flint-csi-node
  apiGroup: rbac.authorization.k8s.io

{{- if and (.Values.pnfs.server).enabled ((((.Values.pnfs.server).mds).blockExport).witness).enabled }}
---
# ── THE COMPOSITION WITNESS ──────────────────────────────────────────
#
# A two-copy block volume's failover has to be decided by something both
# of its targets can reach independently of each other's health. MDS
# shards share nothing, so that cannot be either shard's own sqlite; it
# is one ConfigMap per volume, here, advanced by resourceVersion
# compare-and-swap.
#
# NAMESPACED on purpose. The witness holds arbitration facts for this
# release's volumes and nothing else, so it needs no cluster-scoped
# reach — and a Role that cannot leave the namespace cannot become an
# accidental cluster-wide credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flint-pnfs-mds
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flint-pnfs-mds-witness
  namespace: {{ .Release.Namespace }}
rules:
  # get/list: read the record and enumerate seats, leases and fences.
  # create/update/patch: the CAS itself — patch carries the
  # resourceVersion the API server refuses the write against.
  # delete: DeleteVolume sweeps a volume's arbitration record.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flint-pnfs-mds-witness
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flint-pnfs-mds-witness
subjects:
  - kind: ServiceAccount
    name: flint-pnfs-mds
    namespace: {{ .Release.Namespace }}
{{- end }}
