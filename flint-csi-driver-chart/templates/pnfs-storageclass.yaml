{{- /*
StorageClass for pNFS volumes.

Separate from `storageclass.yaml` on purpose: that template renders the
SPDK class and hardcodes its four parameters, so there was previously NO
way to get a pNFS class out of the chart — `--set
storageClass.parameters.layout=pnfs` renders nothing, and the only pNFS
class shipped was a hand-applied manifest under deployments/.

`allowVolumeExpansion` is true: expansion on a directory volume is a
metadata-only acknowledgement (the MDS stores no per-volume size —
capacity is pool-side at the data servers), so the resize completes
rather than wedging the PVC in `Resizing`. It does NOT reserve capacity.

Snapshots and clones are refused by the driver for pNFS volumes, so do
not pair this class with a VolumeSnapshotClass.
*/}}
{{- if and .Values.pnfs.enabled .Values.pnfs.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.pnfs.storageClass.name }}
  {{- if .Values.pnfs.storageClass.isDefaultClass }}
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  {{- end }}
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pnfs
provisioner: {{ .Values.driver.name }}
reclaimPolicy: {{ .Values.pnfs.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.pnfs.storageClass.volumeBindingMode }}
allowVolumeExpansion: true
parameters:
  layout: pnfs
  {{- with .Values.pnfs.storageClass.stripeSize }}
  pnfs.flint.io/stripeSize: {{ . | quote }}
  {{- end }}
  {{- with .Values.pnfs.storageClass.stripeWidth }}
  pnfs.flint.io/stripeWidth: {{ . | quote }}
  {{- end }}
  {{- with .Values.pnfs.storageClass.dirGid }}
  pnfs.flint.io/dirGid: {{ . | quote }}
  {{- end }}
  {{- with .Values.pnfs.storageClass.dirMode }}
  pnfs.flint.io/dirMode: {{ . | quote }}
  {{- end }}
{{- with .Values.pnfs.storageClass.mountOptions }}
mountOptions:
{{ toYaml . | indent 2 }}
{{- end }}
{{- end }}
{{- /*
pnfs-block (scsi layout) class. Distinct from the files class above:
no stripe geometry (extents, not stripes — the parameters are refused
at provision). Expansion of block volumes grows the recorded size; the
lvol is thin, so it does not reserve capacity. Requires
pnfs.blockLayout.enabled (the controller gate) and an MDS with
blockExport configured — a class without them fails provision loudly,
never silently downgrades to the files layout.

replicas defaults to 1: a lost storage node is lost data. Setting it
to 2 places a second copy on ANOTHER target and keeps it mirrored
(design §12) — and placement defaults to the composer's own zone,
because a cross-zone copy pays inter-zone egress on every mirrored
write and again on every rebuilt byte. Cross-zone must be asked for
by name (replicaCrossZone), and a fleet with no same-zone peer refuses
the provision rather than spending the money quietly.

NOT YET PROVEN ON HARDWARE: the composition machine is complete and
unit-tested end to end, but no cluster has run it. Treat replicas: 2
as experimental until a rig has.
*/}}
{{- if and .Values.pnfs.enabled (.Values.pnfs.blockLayout).enabled .Values.pnfs.blockLayout.storageClass.create }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.pnfs.blockLayout.storageClass.name }}
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pnfs-block
provisioner: {{ .Values.driver.name }}
reclaimPolicy: {{ .Values.pnfs.blockLayout.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.pnfs.blockLayout.storageClass.volumeBindingMode }}
allowVolumeExpansion: true
parameters:
  layout: pnfs-block
{{- with .Values.pnfs.blockLayout.storageClass.replicas }}
  pnfs.flint.io/replicas: {{ . | quote }}
{{- end }}
{{- if (.Values.pnfs.blockLayout.storageClass).replicaCrossZone }}
  pnfs.flint.io/replicaCrossZone: "true"
{{- end }}
{{- with .Values.pnfs.blockLayout.storageClass.mountOptions }}
mountOptions:
{{ toYaml . | indent 2 }}
{{- end }}
{{- end }}
