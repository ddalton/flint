{{- /*
pNFS Metadata Server(s) — deployed when pnfs.enabled AND pnfs.server.enabled.

Shape (mds-sharding-plan.md Phase 0; durable-DS Phase 1 lineage):
- N INDEPENDENT single-replica Deployments (pnfs.server.mds.count,
  default 1), each with strategy Recreate: every shard's sqlite
  state.db is single-writer, and the RWO PVC attach is the fence — two
  pods of the SAME shard must never run concurrently. Shards share
  nothing with each other.
- Ranged Deployments, NOT a StatefulSet: volumeClaimTemplates would
  rename shard 0's PVC and force a data migration on upgrade. Here
  shard 0 keeps the exact pre-sharding names (Deployment/Service
  `flint-pnfs-mds`, PVC `flint-pnfs-mds-data`), so upgrading a
  count:1 install adopts everything in place — and count:1 renders
  semantically identical to the pre-sharding chart.
- Per-shard stable ClusterIP Services `flint-pnfs-mds-<i>` (all
  shards, 0 included, for uniform enumeration by the CSI controller).
  The legacy `flint-pnfs-mds` Service remains as an alias for shard 0:
  pre-sharding PVs have its ClusterIP stamped in their volume context,
  and the DS config points at it until Phase 2 fan-out.
- ONE CONFIGMAP PER SHARD (`flint-pnfs-mds-config`, then -<i>). It was
  one shared map while shard config was identical, but blockExport is
  per NODE — lvols are node-local and lvstore names are minted per node
  — so a shared map could only ever describe one block-export shard,
  and `replicas: 2` volumes were therefore not installable at all.
  Shard 0 keeps the legacy ConfigMap name, so count:1 is unchanged.
  FLINT_MDS_SHARD_ID still differs per Deployment (folded into file_id
  allocation from Phase 2 so stripe-file namespaces are disjoint).
- dataServers is deliberately EMPTY: DS pods register dynamically over
  gRPC. Until Phase 2 (DS fan-out) lands in the images, only shard 0
  receives DS registrations — set count > 1 only with images that
  ship the fan-out.
- Volumes are pinned to their shard at CreateVolume and never move;
  scale count DOWN only if the removed shards own zero volumes.
*/}}
{{- if and .Values.pnfs.enabled .Values.pnfs.server.enabled }}
{{- $count := int (.Values.pnfs.server.mds.count | default 1) }}
{{- $be := .Values.pnfs.server.mds.blockExport }}
{{- $beShards := ($be.shards | default list) }}
{{- /* A shard entry that no Deployment will ever read is a volume whose
second copy has nowhere to live — refuse rather than silently drop it. */}}
{{- if gt (len $beShards) $count }}
{{- fail (printf "pnfs.server.mds.blockExport.shards has %d entries but pnfs.server.mds.count is %d — raise the count or remove the extra entries; a shard that is never deployed cannot host a second copy" (len $beShards) $count) }}
{{- end }}
{{- range $i := until $count }}
{{- /* THE CONFIGMAP IS PER SHARD, and it has to be: blockExport pins
each shard to its own tgt node, and lvstore names are node-local
(`lvs_<node>_<pci>`), so one shared config can only ever describe one
shard. Shard 0 keeps the pre-sharding name, so a count:1 install — with
or without blockExport — renders exactly as it did before. */}}
{{- $cmName := ternary "flint-pnfs-mds-config" (printf "flint-pnfs-mds-config-%d" $i) (eq $i 0) }}
{{- /* `index` ERRORS on an out-of-range slice rather than yielding nil,
so an absent entry has to be tested for, not defaulted. */}}
{{- $shard := dict }}
{{- if lt $i (len $beShards) }}{{- $shard = (index $beShards $i) }}{{- end }}
{{- $lvstore := ($shard.lvstore | default $be.lvstore) }}
{{- $traddr := ($shard.traddr | default $be.traddr) }}
{{- $trsvcid := ($shard.trsvcid | default $be.trsvcid) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "flint-csi-driver-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pnfs-mds
    chert.us/mds-shard: {{ $i | quote }}
data:
  mds.yaml: |
    apiVersion: chert.us/v1alpha1
    kind: PnfsConfig
    mode: mds
    mds:
      bind:
        address: "0.0.0.0"
        port: 2049
      layout:
        type: file
        stripeSize: {{ int64 $.Values.pnfs.server.stripeSize }}
        policy: stripe
      dataServers: []
      # F68b: NACK a DS registration until its per-pod Service actually
      # routes (the MDS dials the same ClusterIP endpoint clients get
      # from GETDEVICEINFO). Without this, a device turns grantable
      # seconds before its Service has a Ready endpoint; a client that
      # connects in that window blacklists the deviceid for 120s and
      # silently proxies ALL I/O via the MDS (F68).
      verifyDsReachability: true
      state:
        backend: sqlite
        config:
          path: /data/state/state.db
      {{- if $be.enabled }}
      # pnfs-block export surface: the MDS drives the COLOCATED
      # csi-node spdk-tgt (socket via the shared hostPath) — one tgt
      # per shard, pinned to its node. lvols are node-local, so THIS
      # shard's lvstore and listener are this shard's own.
      blockExport:
        spdkSocket: {{ $be.spdkSocket }}
        lvstore: {{ required (printf "shard %d has no lvstore: set pnfs.server.mds.blockExport.shards[%d].lvstore (lvstores are per node, e.g. lvs_<node>_<pci>) or the single-valued blockExport.lvstore" $i $i) $lvstore }}
        traddr: {{ required (printf "shard %d has no traddr: set pnfs.server.mds.blockExport.shards[%d].traddr to THAT node's IP, or the single-valued blockExport.traddr" $i $i) $traddr | quote }}
        trsvcid: {{ $trsvcid }}
        ptplDir: {{ $be.ptplDir }}
      {{- end }}
      failover:
        heartbeatTimeout: {{ $.Values.pnfs.server.mds.heartbeatTimeout }}
        policy: recall_affected
        gracePeriod: 60
    exports:
      - path: /data/exports
        fsid: 1
        options: [rw, sync, no_subtree_check]
        access:
          - network: 0.0.0.0/0
            permissions: rw
    logging:
      level: {{ $.Values.pnfs.server.logLevel | default "info" }}
      format: text
{{- end }}
---
{{- /* Legacy alias Service — shard 0. Pre-sharding PVs carry this
Service's ClusterIP in pnfs.chert.us/mds-ip, and the DS config points
here until Phase 2; it must survive sharding untouched. */}}
apiVersion: v1
kind: Service
metadata:
  name: flint-pnfs-mds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pnfs-mds
spec:
  selector:
    app: flint-pnfs-mds
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
{{- range $i := until $count }}
{{- /* Shard 0 keeps every pre-sharding object name; shards >= 1 get
-<i> suffixed names. Pod label app: <deployment-name> throughout —
Deployment selectors are immutable, and shard 0's must stay exactly
`app: flint-pnfs-mds` for in-place upgrade. */}}
{{- $name := ternary "flint-pnfs-mds" (printf "flint-pnfs-mds-%d" $i) (eq $i 0) }}
{{- $pvc := ternary "flint-pnfs-mds-data" (printf "flint-pnfs-mds-data-%d" $i) (eq $i 0) }}
{{- $cmName := ternary "flint-pnfs-mds-config" (printf "flint-pnfs-mds-config-%d" $i) (eq $i 0) }}
{{- /* `index` ERRORS on an out-of-range slice rather than yielding nil,
so an absent entry has to be tested for, not defaulted. */}}
{{- $shard := dict }}
{{- if lt $i (len $beShards) }}{{- $shard = (index $beShards $i) }}{{- end }}
{{- /* This shard's node pin: its own if given, else the single-valued
one. A shard pinned to the wrong node finds no tgt socket, and a fresh
lvstore under committed extents is refused outright (F67). */}}
{{- $nodeSel := ($shard.nodeSelector | default $be.nodeSelector) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $pvc }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "flint-csi-driver-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pnfs-mds
    chert.us/mds-shard: {{ $i | quote }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ $.Values.pnfs.server.mds.storage.storageClassName | default $.Values.storageClass.name }}
  resources:
    requests:
      storage: {{ $.Values.pnfs.server.mds.storage.size }}
---
{{- /* Uniform per-shard Service (0..N-1) — the CSI controller
enumerates these for shard assignment and stamps this Service's
ClusterIP into new PVs' volume context. */}}
apiVersion: v1
kind: Service
metadata:
  name: flint-pnfs-mds-{{ $i }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "flint-csi-driver-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pnfs-mds
    chert.us/mds-shard: {{ $i | quote }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "flint-csi-driver-chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: pnfs-mds
    chert.us/mds-shard: {{ $i | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        # Shard-agnostic role label — the NetworkPolicies select on
        # this (per-shard `app` values can't be enumerated there).
        chert.us/role: pnfs-mds
        chert.us/mds-shard: {{ $i | quote }}
        {{- include "flint-csi-driver-chart.selectorLabels" $ | nindent 8 }}
    spec:
      {{- /* Spread MDS shards across nodes: a node loss should take down
      at most one shard, and co-locating shards negates the per-shard
      cross-node parallelism that sharding exists to provide. Soft
      (preferred) so scheduling never wedges when schedulable nodes <
      shard count (e.g. a single-node test cluster). */}}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    chert.us/role: pnfs-mds
                topologyKey: kubernetes.io/hostname
      {{- with $.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if ((($.Values.pnfs.server.mds.blockExport).witness).enabled) }}
      # The composition witness reads and CAS's ConfigMaps in this
      # namespace; without this ServiceAccount the MDS falls back to its
      # own record and says so at startup, and replicated volumes cannot
      # fail over.
      serviceAccountName: flint-pnfs-mds
      {{- end }}
      {{- if $be.enabled }}
      {{- with $nodeSel }}
      # blockExport: pin to THIS shard's tgt/lvstore node — lvols are
      # node-local, and a rescheduled MDS elsewhere finds no socket
      # (and a fresh lvstore under committed extents is refused, F67).
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: mds
          image: "{{ $.Values.images.repository }}/{{ $.Values.pnfs.server.image.name }}:{{ required "pnfs.server.image.tag is required when pnfs.server.enabled" $.Values.pnfs.server.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/flint-pnfs-mds"]
          args: ["--config", "/etc/flint/mds.yaml"]
          env:
            - name: PNFS_MODE
              value: "mds"
            - name: FLINT_MDS_SHARD_ID
              value: {{ $i | quote }}
            {{- if ((($.Values.pnfs.server.mds.blockExport).witness).enabled) }}
            # THE ARBITER for replicated block volumes. Set = the seat,
            # the leg marks, the serving lease and the allow-list live
            # in rv-CAS'd ConfigMaps here; unset = this shard's own
            # record, which is correct for single-copy volumes and
            # cannot arbitrate a two-copy one.
            - name: FLINT_PNFS_WITNESS_NAMESPACE
              value: {{ ($.Values.pnfs.server.mds.blockExport.witness.namespace | default $.Release.Namespace) | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ $.Values.pnfs.server.logLevel | default "info" | quote }}
            # The node this MDS runs on — and therefore, when blockExport
            # is enabled, the node whose csi-node spdk-tgt serves the
            # export (the socket is a shared hostPath, so the two are
            # colocated by construction). BlockExportStatus reports it so
            # the maintenance roller can refuse to roll a target with
            # live NVMe-oF initiators on it. Harmless when blockExport is
            # off; the roller falls back to matching the listener address
            # against Node addresses if this is ever absent.
            - name: FLINT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if $.Values.pnfs.controlToken.enabled }}
            # Required Bearer token on every MdsControl gRPC — see
            # templates/pnfs-security.yaml.
            - name: FLINT_PNFS_CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.pnfs.controlToken.existingSecret | default "flint-pnfs-control-token" }}
                  key: token
            {{- end }}
          ports:
            - containerPort: 2049
              name: nfs
            - containerPort: 50051
              name: grpc
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/flint
            - name: data
              mountPath: /data
            {{- if ($.Values.pnfs.server.mds.blockExport).enabled }}
            # The colocated tgt's RPC socket: the csi-node DaemonSet
            # mounts the same hostPath at /var/tmp when
            # pnfs.blockLayout is enabled, so blockExport.spdkSocket
            # (/var/tmp/spdk.sock) resolves in both pods.
            - name: spdk-socket
              mountPath: /var/tmp
            {{- end }}
          {{- with $.Values.pnfs.server.mds.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $cmName }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $pvc }}
        {{- if ($.Values.pnfs.server.mds.blockExport).enabled }}
        - name: spdk-socket
          hostPath:
            path: /var/lib/flint-spdk
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
{{- end }}
