{{- if not .Values.lite.enabled }}{{- /* suppressed by the flint-lite profile — see templates/lite.yaml */}}
{{- if and .Values.nfs.enabled .Values.nfs.kerberos.enabled }}
{{- $k := .Values.nfs.kerberos }}
{{- $realmRef := required "nfs.kerberos.realmRef: the KerberosRealm (krb5-operator)" $k.realmRef }}
{{- $realm := required "nfs.kerberos.realm: the realm (EXAMPLE.COM)" $k.realm }}
{{- $realmNs := $k.realmNamespace | default .Release.Namespace }}
{{- if not (has $k.storageClass.sec (list "krb5" "krb5i" "krb5p")) }}
{{- fail "nfs.kerberos.storageClass.sec: krb5, krb5i or krb5p" }}
{{- end }}
{{- if and $k.attachedNodesOnly (not $k.minSec) }}
{{- fail "nfs.kerberos.minSec is empty but attachedNodesOnly is on: a sec=sys mount has no node identity, so every one would be refused. Keep minSec (krb5i), or set attachedNodesOnly=false as well" }}
{{- end }}
{{- if and $k.requireMachCred (not $k.minSec) }}
{{- fail "nfs.kerberos.minSec is empty but requireMachCred is on: a sec=sys mount cannot ask for SP4_MACH_CRED, so every one would be refused. Keep minSec (krb5i), or set requireMachCred=false as well" }}
{{- end }}
# Kerberos for RWX NFS volumes (values nfs.kerberos). The NFS servers'
# principal: every server pod mounts this keytab.
apiVersion: krb5.ddalton.dev/v1alpha1
kind: KerberosPrincipal
metadata:
  name: flint-nfs-server
  namespace: {{ include "flint-csi-driver-chart.nfsNamespace" . }}
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
spec:
  realmRef: {{ $realmRef }}
  realmNamespace: {{ $realmNs }}
  principals:
  - nfs/{{ include "flint-csi-driver-chart.nfsKrb5ServerName" . }}@{{ $realm }}
  secretName: {{ include "flint-csi-driver-chart.nfsKrb5KeytabSecret" . }}
  deletionPolicy: {{ $k.deletionPolicy }}
{{- if $k.nodeKeytab.create }}
---
# The nodes' machine credentials for rpc.gssd (host/ and nfs/<node>), in
# their /etc/krb5.keytab, with the realm's krb5.conf.
apiVersion: krb5.ddalton.dev/v1alpha1
kind: KerberosNodeKeytab
metadata:
  name: {{ include "flint-csi-driver-chart.fullname" . | trunc 30 | trimSuffix "-" }}-nfs-clients
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
spec:
  realmRef: {{ $realmRef }}
  realmNamespace: {{ $realmNs }}
  services: [host, nfs]
  {{- with $k.nodeKeytab.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $k.nodeKeytab.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $k.nodeKeytab.domain }}
  domain: {{ . }}
  {{- end }}
  keytabPath: {{ $k.nodeKeytab.keytabPath }}
  {{- with $k.nodeKeytab.krb5ConfPath }}
  krb5ConfPath: {{ . }}
  {{- end }}
  deletionPolicy: {{ $k.deletionPolicy }}
{{- end }}
{{- if $k.attachedNodesOnly }}
---
# Attached-nodes-only NFS servers (nfs.kerberos.attachedNodesOnly) read
# which nodes their volume is attached to, and those nodes' hostnames.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flint-nfs-server
  namespace: {{ include "flint-csi-driver-chart.nfsNamespace" . }}
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flint-csi-driver-chart.fullname" . }}-nfs-server
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
rules:
- apiGroups: [storage.k8s.io]
  resources: [volumeattachments]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "flint-csi-driver-chart.fullname" . }}-nfs-server
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "flint-csi-driver-chart.fullname" . }}-nfs-server
subjects:
- kind: ServiceAccount
  name: flint-nfs-server
  namespace: {{ include "flint-csi-driver-chart.nfsNamespace" . }}
{{- end }}
{{- if $k.storageClass.create }}
---
# RWX volumes mounted with Kerberos.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ $k.storageClass.name }}
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
provisioner: {{ .Values.driver.name }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
volumeBindingMode: WaitForFirstConsumer
mountOptions:
- sec={{ $k.storageClass.sec }}
parameters:
  numReplicas: "{{ .Values.storageClass.parameters.numReplicas }}"
  autoRebuild: "{{ .Values.storageClass.parameters.autoRebuild }}"
  thinProvision: "{{ .Values.storageClass.parameters.thinProvision }}"
  nfsEmptyDir: "{{ .Values.storageClass.parameters.nfsEmptyDir | default "false" }}"
{{- end }}
{{- end }}
{{- end }}{{- /* end lite-profile guard */}}
