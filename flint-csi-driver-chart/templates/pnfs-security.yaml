{{- /*
pNFS trust boundary (production checklist — see
docs/pnfs-operator-runbook.md, "Trust model"):

1. Control-plane token: a Bearer token every MDS gRPC (50051) caller
   must present. Stops arbitrary pods from registering as data servers
   (attracting stripe writes) or calling CreateVolume/DeleteVolume.
   The Secret is generated once and reused on upgrades (lookup), or
   supplied via pnfs.controlToken.existingSecret.

2. NetworkPolicies: NFS data (2049) admits only node-CIDR traffic —
   mounts originate from the NODE kernel via kubelet NodeStage, never
   from pod IPs — and the control port (50051) admits only the DS
   fleet and the CSI controller.
*/}}
{{- if and .Values.pnfs.enabled .Values.pnfs.controlToken.enabled (not .Values.pnfs.controlToken.existingSecret) }}
{{- $secretName := "flint-pnfs-control-token" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: flint-pnfs
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "token") }}
  # Reuse the installed token — regenerating on every upgrade would
  # briefly desync MDS and DS pods mid-roll.
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
{{- if and (include "flint-csi-driver-chart.pnfsDsAuth" .) (not .Values.pnfs.dsAuth.existingSecret) }}
{{- $secretName := "flint-pnfs-fh-key" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
---
# The data server filehandle signing key (pnfs.dsAuth, Phase 4). Generated
# once and reused on upgrades: a new key would invalidate every layout the
# clients hold (they recover with fresh layouts, E4, but all at once).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: flint-pnfs
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "current") }}
  current: {{ index $existing.data "current" }}
  {{- if index $existing.data "previous" }}
  previous: {{ index $existing.data "previous" }}
  {{- end }}
  {{- else }}
  current: {{ printf "1:%s" (sha256sum (randAlphaNum 64)) | b64enc }}
  {{- end }}
{{- end }}
{{- if and (include "flint-csi-driver-chart.pnfsControlTls" .) (not .Values.pnfs.controlTls.existingSecret) }}
{{- $secretName := "flint-pnfs-control-tls" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
---
# TLS on the pNFS control path (pnfs.controlTls, Phase 5): a CA and one
# certificate for flint-pnfs-control. Generated once, kept on upgrades: a
# new CA mid-roll would split the fleet into two that cannot talk.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: flint-pnfs
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "tls.crt") }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  {{- else }}
  {{- $ca := genCA "flint-pnfs-control-ca" 3650 }}
  {{- $cert := genSignedCert "flint-pnfs-control" nil (list "flint-pnfs-control") 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
{{- end }}
{{- if and .Values.pnfs.server.enabled (include "flint-csi-driver-chart.pnfsDsServiceAccount" .) }}
---
# The data servers' identity (pnfs.controlAuth, pnfs.kerberos's gate).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flint-pnfs-ds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: pnfs-ds
{{- end }}
{{- if include "flint-csi-driver-chart.pnfsControlAuth" . }}
---
# Per-pod identities on the control path (pnfs.controlAuth, Phase 5b): the
# MDS and the data servers review their callers' tokens.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flint-csi-driver-chart.fullname" . }}-pnfs-tokenreview
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "flint-csi-driver-chart.fullname" . }}-pnfs-tokenreview
  labels:
    {{- include "flint-csi-driver-chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "flint-csi-driver-chart.fullname" . }}-pnfs-tokenreview
subjects:
- kind: ServiceAccount
  name: flint-pnfs-mds
  namespace: {{ .Release.Namespace }}
- kind: ServiceAccount
  name: flint-pnfs-ds
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.pnfs.server.enabled .Values.pnfs.networkPolicy.enabled }}
---
# NFS data ports: MDS + DS 2049 from node CIDRs only. Kernel NFS
# clients connect FROM node IPs (kubelet does the mount), so pod-level
# selectors cannot express the legitimate client set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flint-pnfs-nfs-data
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    # Role labels, not per-shard `app` values: MDS shards are
    # app: flint-pnfs-mds-<i> (mds-sharding-plan.md Phase 0) and must
    # all sit behind this policy.
    matchExpressions:
      - key: chert.us/role
        operator: In
        values: ["pnfs-mds", "pnfs-ds"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- if .Values.pnfs.networkPolicy.nodeCIDRs }}
        {{- range .Values.pnfs.networkPolicy.nodeCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        # nodeCIDRs is empty: this admits NOTHING on 2049. Deliberate —
        # a silently-open fallback would defeat the policy; set
        # pnfs.networkPolicy.nodeCIDRs.
        []
        {{- end }}
      ports:
        - protocol: TCP
          port: 2049
---
# Control plane: MDS 50051 from the DS fleet (registration/heartbeats)
# and the CSI controller (CreateVolume/DeleteVolume). Defense in depth
# with the bearer token above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flint-pnfs-control
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      chert.us/role: pnfs-mds
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              chert.us/role: pnfs-ds
        - podSelector:
            matchLabels:
              app: flint-csi-controller
      ports:
        - protocol: TCP
          port: 50051
---
# Reverse control direction: DS 9091 (DsControl — synchronous stripe
# truncation) from the MDS only. Same bearer token as 50051.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flint-pnfs-ds-control
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      chert.us/role: pnfs-ds
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              chert.us/role: pnfs-mds
      ports:
        - protocol: TCP
          port: 9091
{{- end }}
